name: Catering UI acceptance
on:
  pull_request:
    paths:
      - 'public/hub/owner/catering*'
      - 'public/hub/owner/assets/catering-service.js'
      - 'public/hub/owner/assets/catering-balance.js'
      - 'public/client/**'
      - 'functions/q/**'
      - 'functions/_lib/catering_quote_email.js'
      - 'public/assets/js/catering-payment-return.js'
      - 'public/assets/js/catering-feedback.js'
      - 'public/catering-feedback.html'
      - 'public/hub/owner/assets/catering-experience.js'
      - 'scripts/verify-catering-payment-return.mjs'
      - 'scripts/verify-catering-experience.cjs'
      - 'public/assets/js/client-catering.js'
      - 'public/assets/css/client-catering.css'
      - 'scripts/verify-catering-balance-ui.cjs'
      - 'scripts/verify-catering-client-account.cjs'
      - 'scripts/verify-catering-ui.cjs'
      - 'scripts/verify-catering-workspace.cjs'
      - '.github/workflows/catering-ui.yml'
jobs:
  catering-browser:
    name: Catering desktop and mobile workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 24}
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-catering-ui.cjs
      - run: node scripts/verify-catering-workspace.cjs
      - run: node scripts/verify-catering-balance-ui.cjs
      - run: node scripts/verify-catering-client-account.cjs
      - run: node scripts/verify-catering-payment-return.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catering-ui-synthetic-evidence
          path: |
            /tmp/catering-ui-evidence
            /tmp/catering-balance-ui-evidence
