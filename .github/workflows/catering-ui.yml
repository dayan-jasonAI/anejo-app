name: Catering UI acceptance
on:
  pull_request:
    paths:
      - 'public/hub/kitchen/**'
      - 'public/hub/driver/catering.html'
      - 'public/hub/owner/recipes.html'
      - 'functions/_lib/catering*'
      - 'functions/_lib/recipe_authority.js'
      - 'functions/api/hub/kitchen/**'
      - 'scripts/verify-event-*.cjs'
      - 'scripts/verify-commissary-ui.cjs'
      - 'scripts/verify-cajita-label-preview-ui.cjs'
      - 'functions/api/cajita-label-preview.js'
      - 'src/cajita/builder.js'
      - 'public/cajita-builder.html'
      - 'public/assets/js/cajita-builder.js'
      - 'public/assets/css/cajita-builder.css'
      - 'scripts/verify-kitchen-catering-board-ui.cjs'
      - 'scripts/verify-recipe-authority-ui.cjs'
      - 'public/hub/owner/catering*'
      - 'public/hub/owner/assets/catering-service.js'
      - 'public/hub/owner/assets/catering-balance.js'
      - 'public/client/**'
      - 'functions/q/**'
      - 'functions/_lib/catering_quote_email.js'
      - 'public/assets/js/catering-payment-return.js'
      - 'public/assets/js/catering-feedback.js'
      - 'public/catering-feedback.html'
      - 'public/hub/owner/assets/catering-lifecycle.js'
      - 'scripts/verify-catering-payment-return.mjs'
      - 'scripts/verify-catering-experience-ui.cjs'
      - 'public/hub/owner/assets/catering-lifecycle.css'
      - 'public/assets/css/catering-feedback.css'
      - 'public/assets/js/client-catering.js'
      - 'public/assets/css/client-catering.css'
      - 'scripts/verify-catering-balance-ui.cjs'
      - 'scripts/verify-catering-client-account.cjs'
      - 'scripts/verify-catering-ui.cjs'
      - 'scripts/verify-catering-workspace.cjs'
      - '.github/workflows/catering-ui.yml'
jobs:
  catering-browser:
    name: Catering desktop and mobile workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 24}
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-catering-ui.cjs
      - run: node scripts/verify-catering-workspace.cjs
      - run: node scripts/verify-catering-balance-ui.cjs
      - run: node scripts/verify-catering-client-account.cjs
      - run: node scripts/verify-catering-payment-return.mjs
      - run: node scripts/verify-catering-experience-ui.cjs
      - run: node scripts/verify-event-operations-ui.cjs
      - run: node scripts/verify-event-services-ui.cjs
      - run: node scripts/verify-event-bands-ui.cjs
      - run: node scripts/verify-commissary-ui.cjs
      - run: node scripts/verify-cajita-label-preview-ui.cjs
      - run: node scripts/verify-kitchen-catering-board-ui.cjs
      - run: node scripts/verify-recipe-authority-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catering-ui-synthetic-evidence
          path: |
            /tmp/catering-ui-evidence
            /tmp/catering-balance-ui-evidence
            /tmp/event-operations-ui-evidence
            /tmp/event-services-ui-evidence
            /tmp/event-bands-ui-evidence
            /tmp/commissary-ui-evidence
            /tmp/cajita-label-preview-ui-evidence
            /tmp/kitchen-catering-board-ui-evidence
            /tmp/recipe-authority-ui-evidence
