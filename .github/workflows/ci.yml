name: CI — auth tests + lint
# Actions pinned to v5 (2026-07-28): v4 targets the Node 20 runtime, which GitHub has deprecated
# and now force-runs on Node 24 with a warning on every run. v5 is the first major of both actions
# built for node24, so this removes the warning rather than deferring it.
#
# Deliberately v5 and not the current v7: setup-node v5 and v6 both changed automatic caching
# behaviour, and checkout v7 blocks fork checkouts for pull_request_target/workflow_run. None of
# those affect this workflow (caching is declared explicitly, and triggers are push/pull_request),
# but v5 is the smallest change that fixes the deprecation — the rest can wait for a reason.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  functions:
    name: Añejo Functions — test/auth + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # BUILD THE WORKER. lint and tests both pass on an unresolvable import — `node --check` only
      # checks syntax, and the tests read route files as text. The first thing that actually
      # resolves the module graph is the Pages build, which until now only ran on Cloudflare's
      # side AFTER the push. A one-character-too-many `../` therefore sailed through a green CI
      # and failed the deploy, leaving production silently on the previous commit.
      - name: Build Pages Functions (catches unresolvable imports)
        run: npx wrangler pages functions build --outfile=/tmp/functions-build-check.js
  hub-app:
    name: hub-app (React) — lint + test/auth + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub-app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: hub-app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
