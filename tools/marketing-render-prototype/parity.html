<!doctype html><html lang="en"><meta charset="utf-8"><title>Añejo local editorial comparison</title>
<style>@font-face{font-family:'Cormorant Garamond';src:url('assets/AnejoEditorialSerif-SemiBold.ttf');font-weight:600}@font-face{font-family:'Josefin Sans';src:url('assets/AnejoEditorialSans-Medium.ttf');font-weight:500}body{background:#ece8db;color:#0a180c;font:16px sans-serif;margin:24px}h1{font-family:'Cormorant Garamond';font-size:34px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1400px}img{width:100%;height:auto}pre{white-space:pre-wrap;font-size:12px}article{min-width:0}header{max-width:1000px}</style>
<header><h1>Añejo editorial rendering comparison</h1><p>Local visual acceptance only. Canvas and experimental Worker rendering are shown side by side with the same source, wording, profile and pinned fonts. Neither image establishes publication approval, color conversion or deployed resource readiness.</p></header><div id="results">Rendering…</div>
<script src="../../public/hub/owner/assets/marketing-editorial-plan.js"></script><script src="../../public/hub/owner/assets/marketing-branding.js"></script>
<script>
(async()=>{const root=document.querySelector('#results');root.textContent='';for(const [templateId,title] of [['reposado-wide','Catering, beautifully.'],['reposado-cajita','Your Cajita.']]){const heading=document.createElement('h2');heading.textContent=templateId;root.append(heading);let layout;const canvas=await AnejoBranding.compose('assets/source.jpg',{preset:templateId,text:title,kicker:'AÑEJO CATERING',onLayout:v=>layout=v});const section=document.createElement('section');for(const [name,url] of [['Browser Canvas',canvas],['Experimental Worker','output/parity-'+templateId+'.jpg']]){const article=document.createElement('article'),label=document.createElement('h3'),image=document.createElement('img');label.textContent=name;image.src=url;image.alt=name+' '+title;article.append(label,image);section.append(article);}const download=document.createElement('a');download.href=canvas;download.download='canvas-'+templateId+'.jpg';download.textContent='Download Canvas '+templateId;root.append(download);const receiptDownload=document.createElement('a');receiptDownload.href=URL.createObjectURL(new Blob([JSON.stringify(layout,null,2)],{type:'application/json'}));receiptDownload.download='canvas-'+templateId+'-receipt.json';receiptDownload.textContent='Download receipt '+templateId;root.append(receiptDownload);const receipt=document.createElement('pre');receipt.textContent=JSON.stringify({templateId,canvasDeclaration:layout},null,2);root.append(section,receipt);}document.body.dataset.ready='true';})().catch(error=>{document.querySelector('#results').textContent='Comparison failed: '+error.message;document.body.dataset.ready='failed';});
</script></html>
