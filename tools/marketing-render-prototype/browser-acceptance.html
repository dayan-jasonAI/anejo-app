<!doctype html><meta charset="utf-8"><title>Añejo photo acceptance</title><button id="run">Run acceptance</button><pre id="results">Not run</pre><script src="marketing-image-orientation.js"></script><script src="marketing-photo-normalize.js"></script><script>
const colors=[[230,30,20],[20,220,40],[30,40,230],[210,210,20]],order=[[0,1,2,3],[1,0,3,2],[3,2,1,0],[2,3,0,1],[0,2,1,3],[2,0,3,1],[3,1,2,0],[1,3,0,2]];
function assert(ok,msg){if(!ok)throw Error(msg)}
run.onclick=async()=>{run.disabled=true;const report={userAgent:navigator.userAgent,cases:[],failures:[]};for(const c of await(await fetch('cases.json')).json()){try{const source=new Uint8Array(await(await fetch(c.name)).arrayBuffer()),copy=source.slice(),out=await AnejoPhotoNormalize.normalize(source),r=out.receipt;assert(source.every((v,i)=>v===copy[i]),'source mutated');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',copy)),v=>v.toString(16).padStart(2,'0')).join('');assert(digest===r.original_sha256,'wrong hash');const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=out.dataUrl});let W=img.naturalWidth,H=img.naturalHeight;assert(W===(c.large?1500:c.orientation>=5?20:40)&&H===(c.large?2000:c.orientation>=5?40:20),'dimensions');const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d',{colorSpace:'srgb'});ctx.drawImage(img,0,0);let maxError=0;const samples=[];for(let k=0;k<4;k++){const p=ctx.getImageData(Math.floor(W*(k%2?.75:.25)),Math.floor(H*(k>=2?.75:.25)),1,1).data;samples.push([...p]);if(!c.large){for(let ch=0;ch<3;ch++)maxError=Math.max(maxError,Math.abs(p[ch]-(c.reference||colors)[order[c.orientation-1][k]][ch]));assert(maxError<=4,'pixel error '+maxError);}if(c.alpha)assert(p[3]===(k%2?255:120),'alpha');}report.cases.push({name:c.name,pass:true,maxError,samples,receipt:r});}catch(e){report.failures.push({name:c.name,error:String(e)});}results.textContent=JSON.stringify(report,null,2);}report.complete=true;results.textContent=JSON.stringify(report,null,2);};
</script>
