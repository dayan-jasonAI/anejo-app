<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Añejo carousel production</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>body{background:#eee9df;font:16px system-ui;color:#193b2d;padding:24px}button{padding:15px;background:#193b2d;color:white;border:0;cursor:pointer}canvas{width:270px;height:337.5px;margin:8px;vertical-align:top}#status{padding:15px}</style><h1>Añejo · Revised carousel exports</h1><p>Existing website imagery. No image generation or food reconstruction.</p><button id="export">Render and save all 26 slides</button><p id="status" role="status">Ready.</p><div id="out"></div><script>
const W=1080,H=1350,GREEN='#193b2d',CREAM='#f5f0e6',GOLD='#c6a85b';
const imageCache=new Map();
async function image(src){if(!imageCache.has(src))imageCache.set(src,new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Could not load '+src));i.src=src;}));return imageCache.get(src);}
function lines(c,text,x,y,width,size=32,leading=42,color=GREEN,font='Josefin Sans',weight=400){c.fillStyle=color;c.font=`${weight} ${size}px "${font}"`;let yy=y;for(let para of text.split('\n')){let line='';for(let word of para.split(' ')){let next=line?line+' '+word:word;if(c.measureText(next).width>width&&line){c.fillText(line,x,yy);yy+=leading;line=word;}else line=next;}c.fillText(line,x,yy);yy+=leading;}return yy;}
function contain(c,img,x,y,w,h,bg=CREAM){c.fillStyle=bg;c.fillRect(x,y,w,h);let s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
async function render(s,index,total,post){let cv=document.createElement('canvas');cv.width=W;cv.height=H;let c=cv.getContext('2d');c.fillStyle=CREAM;c.fillRect(0,0,W,H);c.fillStyle=GREEN;c.fillRect(0,0,W,20);c.fillStyle=GOLD;c.fillRect(54,76,68,3);lines(c,'AÑEJO',144,90,600,31,35,GREEN,'Josefin Sans',700);lines(c,s.eyebrow,54,145,980,21,30,GREEN,'Josefin Sans',600);
if(s.kind==='collage'){lines(c,s.title,54,215,970,64,60,GREEN,'Cormorant Garamond',600);const gap=14,cw=(972-gap*2)/3,ch=246,start=335;for(let i=0;i<s.tiles.length;i++){let x=54+(i%3)*(cw+gap),y=start+Math.floor(i/3)*(ch+gap);let im=await image(s.tiles[i].src);contain(c,im,x,y,cw,ch-38,'#e9e3d7');lines(c,s.tiles[i].label,x+4,y+ch-7,cw-8,23,28,GREEN,'Josefin Sans',600);}lines(c,s.detail,54,1167,970,30,38);}
else if(s.kind==='details'){lines(c,s.title,54,230,975,78,76,GREEN,'Cormorant Garamond',600);let y=s.title.includes('\n')?420:365;for(let row of s.rows){c.fillStyle=GOLD;c.fillRect(54,y-23,970,2);y=lines(c,row[0],54,y+20,950,25,32,GREEN,'Josefin Sans',700);y=lines(c,row[1],54,y+21,955,34,45)+55;}lines(c,s.detail,54,1170,970,30,39);}
else {lines(c,s.title,54,225,975,76,73,GREEN,'Cormorant Garamond',600);let top=s.title.includes('\n')?335:275;let im=await image(s.src);contain(c,im,54,top,972,1035-top,'#e9e3d7');lines(c,s.detail,54,1094,970,32,42);if(post==='personal')lines(c,'Design inspiration · Final menu and details confirmed by quote',54,1220,970,21,26);}
c.fillStyle=GREEN;c.fillRect(0,1260,W,90);lines(c,'ANEJOCATERINGCO.COM',54,1313,800,22,28,CREAM,'Josefin Sans',600);c.textAlign='right';lines(c,String(index+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'),1026,1313,190,24,28,CREAM);c.textAlign='left';return cv;}
document.querySelector('#export').onclick=async function(){let b=this;b.disabled=true;let status=document.querySelector('#status');try{await document.fonts.load('600 76px "Cormorant Garamond"');await document.fonts.load('400 34px "Josefin Sans"');await document.fonts.load('700 25px "Josefin Sans"');let data=await(await fetch('manifest.json')).json();for(let p of data.posts){for(let i=0;i<p.slides.length;i++){let s=p.slides[i];status.textContent='Rendering '+s.file;let cv=await render(s,i,p.slides.length,p.id);document.querySelector('#out').append(cv);let r=await fetch('/save-slide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:s.file,data:cv.toDataURL('image/jpeg',0.95)})});if(!r.ok)throw Error('Export failed: '+s.file);}}status.textContent='26 JPEG slides saved. Ready for review.';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};
</script></html>
