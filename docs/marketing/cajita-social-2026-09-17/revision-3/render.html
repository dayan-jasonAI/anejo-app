function wrap(c,t,x,y,w,px,leading,font='Josefin Sans',color=P){c.fillStyle=color;c.font=`400 ${px}px "${font}"`;for(let para of t.split('\n')){let line='';for(let word of para.split(' ')){let n=line?line+' '+word:word;if(c.measureText(n).width>w&&line){c.fillText(line,x,y);y+=leading;line=word;}else line=n;}c.fillText(line,x,y);y+=leading;}return y;}
