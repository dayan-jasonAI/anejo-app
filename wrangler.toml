name = "anejo-app"
compatibility_date = "2026-05-01"
pages_build_output_dir = "public"

# Secrets/vars are set in the Cloudflare Pages dashboard (NOT here):
#   ANTHROPIC_API_KEY   (Secret, encrypted)   <- AI calculator
#   RESEND_API_KEY      (Secret, encrypted)   <- transactional email (magic links, receipts)
#   EMAIL_FROM          (Var)                 <- e.g. "Añejo <noreply@anejocateringco.com>"
#   APP_BASE_URL        (Var)                 <- e.g. "https://anejocateringco.com"
#   SQUARE_ACCESS_TOKEN (Secret, encrypted)   <- storefront + subscriptions
#   SQUARE_LOCATION_ID  (Var)
#   SQUARE_WEBHOOK_KEY  (Secret, encrypted)   <- verify Square webhooks
#   SQUARE_ENV          (Var)                 <- "sandbox" | "production" (the go-live flip)
#   IG_ACCESS_TOKEN     (Secret, encrypted)   <- Instagram publishing/DMs/insights (functions/_lib/instagram.js)
#   IG_USER_ID          (Var)                 <- only required on the Facebook Login host (graph.facebook.com);
#                                                 the Instagram Login host (graph.instagram.com) resolves it via /me
#   IG_API_HOST         (Var, optional)       <- "instagram" | "facebook" | a full https URL — skips the
#                                                 auto-probe between the two Instagram APIs (see instagram.js)
#   OPENAI_API_KEY      (Secret, encrypted)   <- plate-image engine, 1st choice (functions/_lib/plate_image.js)
#   GEMINI_API_KEY      (Secret, encrypted)   <- plate-image engine, 2nd choice (falls back from OpenAI)
#                                                 Neither is required: absent = that provider is skipped and the
#                                                 chain falls through to the next (Workers AI/Leonardo is last).
#   IMAGE_PROVIDER_ORDER    (Var, optional)   <- e.g. "gemini,openai,workers_ai" — env-level default order,
#                                                 overridden live by the owner via KV (cfg:image_providers,
#                                                 /api/hub/owner/image-provider-config)
#   IMAGE_PROVIDER_DISABLED (Var, optional)   <- e.g. "openai" — env-level default disable-list, same override rule
# A new/changed Secret or Var here is INERT until the next deploy — Pages bakes bindings into each
# deployment, so redeploy after changing one. See docs/INSTAGRAM_TOKEN_SWAP.md before touching IG_*.

# --- D1 + KV bindings ---
# Create these once (see PROVISIONING.md), then paste the IDs below OR set the
# same bindings in the Pages dashboard → Settings → Functions → Bindings.

[[d1_databases]]
binding = "DB"
database_name = "anejo"
database_id = "d5ca11c7-7b44-4560-919d-b6210753d182"

[[kv_namespaces]]
binding = "SESSIONS"
id = "afbedd5c3613449b931b27ee0353a4b0"

# Workers AI — Whisper voice transcription for Creative Studio (code feature-detects env.AI).
[ai]
binding = "AI"

# --- R2 media bucket (proof-of-delivery photos, Creative Studio media) ---
# Enabled 2026-06-11 (bucket created via `wrangler r2 bucket create anejo-media`).
# Media code feature-detects env.MEDIA, so removing this block safely reverts to inline storage.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "anejo-media"

# Knowledge base for Creative Studio: manuals, SOPs, DBPR documents. Chunk embeddings live here
# so the AI retrieves the passages relevant to a question instead of having a few pages of every
# document stuffed into its prompt and the rest silently dropped.
[[vectorize]]
binding = "VECTORIZE"
index_name = "anejo-knowledge"
