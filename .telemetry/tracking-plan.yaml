# Añejo — Tracking Plan v2
#
# WHAT CHANGED FROM v1, AND WHY IT MATTERS
# v1 (2026-06-06) declared "Greenfield: no current tracking" and named PostHog as the destination.
# Both were false by the time anyone read them again. All 46 v1 events were built, 57 MORE shipped
# undocumented, and PostHog was never bound in production — verified 2026-08-04 by reading the
# Cloudflare Pages config: 34 env vars, no POSTHOG_KEY. Every event has always gone to D1.
#
# The dual-write in functions/_lib/track.js is the only reason this data exists: it writes
# activity_log FIRST and treats PostHog as optional. Built exactly as v1 specified, Añejo would
# have zero telemetry today. v2 documents what is real.
#
# READ BEFORE EDITING: _AI_COLLABORATION_COMMAND_CENTER/TELEMETRY_ESTATE.md (the cross-surface
# registry). It is authoritative over this file. Do not re-propose PostHog or session replay.

meta:
  product: "Añejo"
  version: 2
  created: 2026-06-06
  updated: 2026-08-04
  owner: "Dayan (owner) / Añejo ops"
  estate_registry: "_AI_COLLABORATION_COMMAND_CENTER/TELEMETRY_ESTATE.md — read it BEFORE changing this file"
  audit: ".telemetry/delta-2026-08-03-audit.md — the reconciliation this version is built on"
  changelog:
    - >-
      v2 (2026-08-04): destination corrected from posthog to first-party D1 (proven: PostHog never
      bound). 57 undocumented events added. entities.user traits, groups traits and snapshot_sync
      DELETED as dead vendor scaffolding. Marketing site added as a second surface. Tiered retention
      and a client-event allowlist added. Naming/group semantics clarified. No event was removed.
  naming_convention: "object.action snake_case"
  pii_policy: none
  pii_policy_detail: >-
    No PII in event properties, on any surface — no names, emails, phones, addresses or answer text.
    The code already follows this: it sends has_email, email_changed, has_address, has_receipt as
    BOOLEANS, never values. Identity is always a staff/user id (ctx.distinct_id, sess.uid, staff.id),
    NEVER an email. This is the standing DMD law that PII never leaves the Mac, and the estate rule
    "Identify by user_id only. Never by email."
  internal_user_policy: >-
    Track all human staff; automation is tagged actor_type=system. EXCLUDE actor_type='system' from
    every adoption metric. Enforced at the read side by /api/hub/owner/adoption.

# ---------------------------------------------------------------------------------------------
# SURFACES — Añejo is TWO surfaces sharing one repo. Conflating them is what hid the GA4 property
# from the estate registry for two months.
# ---------------------------------------------------------------------------------------------
surfaces:
  - name: hub
    what: "The internal ops app at /hub/* — owner, kitchen, driver, trainer, client, vendor roles."
    destination: d1_activity_log
    id: "table: activity_log (D1 binding DB)"
    module: "functions/_lib/track.js → capture() / captureSystem()"
    client_rail: "Hub.track(name, props) → POST /api/hub/track (identity resolved server-side, never trusted from the body)"
    events: "every event in the events: block below (103 live)"
    posthog: >-
      Optional, dead, and staying that way. track.js POSTs only if POSTHOG_KEY is bound; it is not,
      and per estate decision 4 it is not required anywhere. The $groups payload built after that
      early return is unreachable code.
  - name: marketing_site
    what: "The public site — 53 pages under public/ (menu, calculator, meal-prep SEO pages, EN/ES)."
    destination: ga4
    id: "G-FXFE29V2PL — Añejo's OWN property. Never share a property across DRH / Aether / Añejo."
    module: "public/assets/js/consent.js"
    consent: >-
      OPT-IN gated. GA4 does not load until the visitor clicks Accept; 'declined' never loads it.
      This means GA4 undercounts by design and is NOT the site's traffic source of truth.
    second_destination: first_party_page_views
    second_destination_detail: >-
      table: page_views (migration 0033) — first-party, cookieless, no IP, no user-agent. Ungated,
      so it sees every visitor. THIS is the traffic source of truth; it backs /hub/owner/traffic.html.
    zero_overlap: "No /hub/* page loads consent.js. No marketing page emits a capture() event. Verified 2026-08-04."
    cloudflare_web_analytics: "NOT present on this surface — checked 2026-08-04 (no cloudflareinsights beacon, no /cdn-cgi/rum)."

# ---------------------------------------------------------------------------------------------
# READER — the estate rule: name the surface that reads this and the person who reads it, or the
# table becomes the fifth "engine with no screen".
# ---------------------------------------------------------------------------------------------
reader:
  - question: "Is my team actually using the HUB, and are they filing EOD reports?"
    surface: "/hub/owner/adoption.html"
    who: "Dayan (owner)"
    source: "activity_log WHERE actor_type='human'"
  - question: "What just happened in my business?"
    surface: "/hub/owner/ (activity feed)"
    who: "Dayan (owner)"
    source: "GET /api/hub/owner/activity"
  - question: "How much traffic does the public site get, and from where?"
    surface: "/hub/owner/traffic.html"
    who: "Dayan (owner)"
    source: "page_views (first-party), NOT GA4"

# ---------------------------------------------------------------------------------------------
# GROUPS — exactly TWO types. v1 declared two but then used five values for group_level
# (business, team, kitchen, delivery, vendors). kitchen/delivery/vendors are TEAM NAMES, not group
# types. The code was always right: track.js emits business + team_<name> and nothing else.
# ---------------------------------------------------------------------------------------------
groups:
  - type: business
    id: "biz_anejo"
    note: "Constant. Añejo is single-tenant — this exists for shape, not for slicing."
  - type: team
    id_format: "team_*"
    parent_type: business
    values: [kitchen, delivery, training, front_office, vendors]
    note: "Stored as the 'team' COLUMN on activity_log. Slicing by team is a GROUP BY, not a group object."
group_level_semantics: >-
  In the events: block, group_level: business means the event is business-scoped. ANY OTHER VALUE
  (team, kitchen, delivery, vendors) means team-scoped, and the value is the team name. There are
  only two group types. Left as authored rather than mass-edited, so the v1 entries stay verbatim.

# ---------------------------------------------------------------------------------------------
# RETENTION — tiered. Ruled by Dayan 2026-08-04.
# Size is NOT the driver: production holds ~4,400 activity rows over 57 days (~78/day) in a 6.3 MB
# database against a 10 GB limit. This is about hygiene and never destroying a financial record.
# ---------------------------------------------------------------------------------------------
retention:
  policy: tiered
  never_prune:
    reason: "Money, food safety and contractual records. These are the durable trail — Square and DBPR may need them."
    events: [order.refunded, order.canceled, expense.submitted, expense.reviewed, temp_log.recorded,
             delivery.completed, delivery.failed, qbo.invoice_pushed, contract.account_created,
             contract.site_added, contract.billing_contact_set, ticket.created, ticket.resolved]
  prune_after_days: 180
  prune_only:
    reason: "High-volume navigation noise with no evidentiary value."
    events: [dashboard.viewed, doc.viewed, order_summary.viewed, customer.viewed, track.rejected]
  everything_else: "KEPT. The default is to retain — pruning is opt-in per event name, never a blanket sweep."
  job: "POST /api/hub/admin/retention-tick (X-Cron-Key), weekly. Reports counts; deletes only the prune_only list."

# ---------------------------------------------------------------------------------------------
# CLIENT EVENT ALLOWLIST — /api/hub/track accepted ANY string until v2. Unknown names are now
# rejected 400 AND recorded as track.rejected, so a name I failed to allowlist shows up loudly
# instead of dying silently.
# ---------------------------------------------------------------------------------------------
client_allowlist:
  enforced_at: "functions/api/hub/track.js"
  source_of_truth: "functions/_lib/track-allowlist.js — generated from THIS file, not hand-maintained"
  on_unknown: "HTTP 400 + capture('track.rejected', { attempted, reason })"
  currently_allowed: [dashboard.viewed, app.installed, customer.viewed, customer.login_link_sent, lead.converted]

# ---------------------------------------------------------------------------------------------
# DELETED IN v2 — recorded so nobody rebuilds them.
# ---------------------------------------------------------------------------------------------
removed_in_v2:
  - what: "entities.user (15 person traits: email, name, role, eod_compliance_rate_30d, …)"
    why: >-
      PostHog person traits with no PostHog. There is no person object to attach them to. Every one
      of these already lives on the staff table — join to it rather than mirroring it into a vendor.
  - what: "groups.traits (business: 6, team: 3) and all $groupidentify intent"
    why: >-
      Never emitted. The $groups payload is unreachable code behind the dead PostHog branch. Añejo
      is single-tenant; business is a constant and team is a column.
  - what: "snapshot_sync (hourly sync of 6 rollup traits)"
    why: >-
      Its only purpose was pushing traits to a vendor. The same six numbers are live SQL against D1
      whenever a screen asks for them — which is exactly what /hub/owner/adoption now does. Building
      an hourly sync to a dead endpoint is the estate's "engine with no screen" pattern.

