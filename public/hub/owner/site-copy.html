<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Site copy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .form-row { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .form-row label { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--green); opacity:.8; }
  .form-row input, .form-row textarea, .form-row select {
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  .form-row textarea { min-height:70px; resize:vertical; line-height:1.5; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px){ .two { grid-template-columns:1fr; } }
  .hint { font-size:12px; color:var(--green); opacity:.72; line-height:1.5; margin:2px 0 0; }
  .live { border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.5; }
  .live.on  { background:#e7f0ea; border:1px solid #2c6b3f; color:#1b4d2b; }
  .live.off { background:#f6f5f1; border:1px solid var(--line); color:var(--green); }
  .prev { border-radius:10px; padding:11px 14px; margin:8px 0 0; text-align:center; font-size:14px; }
  .entry { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .entry.showing { border-left-color:#2c6b3f; background:#f4faf6; }
  .entry.scheduled { border-left-color:#C6A85B; }
  .entry.waiting { border-left-color:#8c8f8a; }
  .entry.ended, .entry.off { opacity:.62; }
  .entry-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .entry-body { font-size:14px; line-height:1.5; color:var(--ink); }
  .entry-when { font-size:12px; color:var(--green); opacity:.75; margin-top:5px; }
  .tag { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:20px; padding:3px 9px; white-space:nowrap; }
  .tag.showing { background:#2c6b3f; color:#fff; }
  .tag.scheduled { background:#efe7cf; color:#8a7a2e; }
  .tag.waiting { background:#e6e6e3; color:#4a4d49; }
  .tag.ended { background:#e6e6e3; color:#6b6e6a; }
  .tag.off { background:#f0efec; color:#8a8d88; }
  .entry-acts { display:flex; gap:8px; margin-top:10px; }
  .entry-acts button { flex:1; padding:8px 10px; font-size:13px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); }
  .entry-acts button.del { color:#8a2b22; border-color:#e3c9c5; }
  .editing { border:1px solid var(--green); border-radius:10px; padding:14px; margin-bottom:12px; background:#fbfaf7; }
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · SITE COPY</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }
  var esc = Hub.esc;
  var TONES = [['info','Neutral (dark green)'],['good','Good news (green)'],['urgent','Urgent (red)']];
  var PLACEMENTS = [['bar','Bar across the top of every page'],['modal','Pop-up in the middle (shown once)']];

  // datetime-local <-> epoch ms. Empty means "no bound", which is the common case.
  function toLocal(ms) {
    if (!ms) return '';
    var d = new Date(Number(ms)), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fromLocal(v) { var t = Date.parse(v); return Number.isFinite(t) ? t : null; }

  var SLOTS = [];
  var LEGAL = [];
  var editing = null;   // { slot, id|null } — which entry the form is currently bound to

  function when(e) {
    if (!e.starts_at && !e.ends_at) return 'No dates — on until you switch it off.';
    var f = function (ms) { return new Date(Number(ms)).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
    if (e.starts_at && e.ends_at) return f(e.starts_at) + ' → ' + f(e.ends_at);
    return e.starts_at ? 'From ' + f(e.starts_at) : 'Until ' + f(e.ends_at);
  }
  var STATE_WORD = {
    showing: 'On the site now', scheduled: 'Scheduled', waiting: 'Queued behind another',
    ended: 'Finished', off: 'Off',
  };

  function entryCard(s, e) {
    var toneBg = e.tone === 'urgent' ? '#8a2b22' : e.tone === 'good' ? '#2c6b3f' : '#1A3D2E';
    return '<div class="entry ' + e.state + '">' +
      '<div class="entry-head"><span class="tag ' + e.state + '">' + STATE_WORD[e.state] + '</span>' +
        '<span class="row-sub" style="font-size:11.5px">' + (e.placement === 'modal' ? '◧ Pop-up' : '▭ Top bar') + '</span></div>' +
      '<div class="prev" style="margin:0;background:' + toneBg + ';color:#F5F2EC">' + esc(e.body_en || '(empty)') +
        (e.link_url ? ' <b style="color:#C6A85B;text-decoration:underline">' + esc(e.link_label || 'Learn more') + '</b>' : '') + '</div>' +
      '<div class="entry-when">' + esc(when(e)) + '</div>' +
      '<div class="entry-acts">' +
        '<button data-edit="' + esc(e.id) + '" data-slot="' + esc(s.slot) + '">Edit</button>' +
        '<button class="del" data-del="' + esc(e.id) + '" data-slot="' + esc(s.slot) + '">Delete</button>' +
      '</div></div>';
  }

  function form(s, e) {
    e = e || { body_en: '', body_es: '', link_url: '', link_label: '', tone: 'info', active: true, starts_at: null, ends_at: null };
    return '<div class="editing">' +
      '<div class="form-row"><label>' + (e.id ? 'Edit message' : 'New message') + ' (English)</label>' +
        '<textarea id="en" maxlength="' + s.max + '">' + esc(e.body_en) + '</textarea>' +
        '<p class="hint">Keep it to one line — it sits across the top of every public page.</p></div>' +

      '<div class="form-row"><label>Message (Spanish, optional)</label>' +
        '<textarea id="es" maxlength="' + s.max + '">' + esc(e.body_es) + '</textarea>' +
        '<p class="hint">Leave blank and the site translates the English automatically. Write it here when the wording matters.</p></div>' +

      '<div class="two">' +
        '<div class="form-row"><label>Link (optional)</label><input id="url" value="' + esc(e.link_url) + '" placeholder="/order"></div>' +
        '<div class="form-row"><label>Link text</label><input id="ltext" value="' + esc(e.link_label) + '" placeholder="Order now"></div>' +
      '</div>' +

      '<div class="two">' +
        '<div class="form-row"><label>Style</label><select id="tone">' +
          TONES.map(function (t) { return '<option value="' + t[0] + '"' + (t[0] === e.tone ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-row"><label>Show it</label>' +
          '<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px">' +
          '<input type="checkbox" id="on" ' + (e.active ? 'checked' : '') + ' style="width:auto"> Switched on</label></div>' +
      '</div>' +

      // Bar vs pop-up. Same message, same window, same queue — only how it presents differs.
      '<div class="form-row"><label>How it appears</label><select id="place">' +
        PLACEMENTS.map(function (p) { return '<option value="' + p[0] + '"' + (p[0] === (e.placement || 'bar') ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') +
      '</select>' +
      '<p class="hint">A <b>bar</b> sits across the top of every page and stays until they close it — right for a standing line. A <b>pop-up</b> opens in the middle of the screen and is shown <b>once per person</b> — right for something that has to actually be read, like a closure. Edit the message and it counts as new, so it shows again.</p></div>' +

      '<div class="two">' +
        '<div class="form-row"><label>Start (optional)</label><input id="from" type="datetime-local" value="' + toLocal(e.starts_at) + '"></div>' +
        '<div class="form-row"><label>End (optional)</label><input id="to" type="datetime-local" value="' + toLocal(e.ends_at) + '"></div>' +
      '</div>' +
      '<p class="hint">Give it dates and write it now — it appears and retires on its own. An end time is what stops a promo bar living on past the promo.</p>' +

      '<button class="btn primary block" id="save" style="margin-top:12px">' + (e.id ? 'Save changes' : 'Add to the queue') + '</button>' +
      (e.id ? '<button class="btn ghost block" id="cancel" style="margin-top:8px">Cancel</button>' : '') +
      '</div>';
  }

  function render() {
    var root = document.getElementById('owner-root'); root.className = '';
    root.innerHTML = SLOTS.map(function (s) {
      var open = editing && editing.slot === s.slot ? editing : null;
      var current = open && open.id ? s.entries.filter(function (x) { return x.id === open.id; })[0] : null;
      // A queue changes the headline question from "is it on?" to "is anything showing, and what
      // is lined up behind it?" — a slot can be full of messages and still be blank today.
      var upcoming = s.entries.filter(function (e) { return e.state === 'scheduled'; }).length;
      return '<div class="hub-section"><h2>' + esc(s.label) + '</h2>' +
        '<p class="hint" style="margin-bottom:10px">' + esc(s.where) + '</p>' +

        '<div class="live ' + (s.live_now ? 'on' : 'off') + '">' +
          (s.live_now ? '🟢 <b>Showing on the site right now.</b>' :
            '⚪ <b>Nothing showing.</b> ' + (s.entries.length ? 'Nothing in the queue covers today.' : 'Write one below.')) +
          (upcoming ? ' <span style="opacity:.8">' + upcoming + ' scheduled for later.</span>' : '') +
        '</div>' +

        (open || !s.entries.length ? form(s, current) :
          '<button class="btn primary block" id="add_' + esc(s.slot) + '" data-add="' + esc(s.slot) + '" style="margin-bottom:12px">+ Write another message</button>') +

        (s.entries.length ? s.entries.map(function (e) { return entryCard(s, e); }).join('')
          : '<p class="hint">Nothing written yet.</p>') +
        '</div>';
    }).join('') + legalSection(LEGAL);
    wire();
    wireLegal();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
      b.addEventListener('click', function () { editing = { slot: b.getAttribute('data-add'), id: null }; render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () { editing = { slot: b.getAttribute('data-slot'), id: b.getAttribute('data-edit') }; render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this message? This cannot be undone.')) return;
        Hub.api('/api/hub/owner/site-copy', { method: 'POST', body: { op: 'delete', slot: b.getAttribute('data-slot'), id: b.getAttribute('data-del') } })
          .then(function (r) {
            if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not delete'); return; }
            Hub.toast(r.live_now ? 'Deleted — another message is showing now' : 'Deleted — nothing showing');
            editing = null; load();
          });
      });
    });
    var cancel = document.getElementById('cancel');
    if (cancel) cancel.addEventListener('click', function () { editing = null; render(); });

    var save = document.getElementById('save');
    if (!save) return;
    save.addEventListener('click', function () {
      var slot = (editing && editing.slot) || SLOTS[0].slot;
      var btn = this, label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Saving…';
      var body = {
        slot: slot,
        body_en: document.getElementById('en').value,
        body_es: document.getElementById('es').value,
        link_url: document.getElementById('url').value,
        link_label: document.getElementById('ltext').value,
        tone: document.getElementById('tone').value,
        placement: (document.getElementById('place') || {}).value || 'bar',
        active: document.getElementById('on').checked,
        starts_at: fromLocal(document.getElementById('from').value),
        ends_at: fromLocal(document.getElementById('to').value)
      };
      if (editing && editing.id) body.id = editing.id;
      Hub.api('/api/hub/owner/site-copy', { method: 'POST', body: body }).then(function (r) {
        btn.disabled = false; btn.textContent = label;
        if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not save'); return; }
        // Report the RESULT, not the submission. With a queue there is a third answer beyond
        // saved/scheduled: on, in-window, and STILL not showing because another entry outranks it.
        Hub.toast(r.this_one_live ? 'Saved — this is the one on the site now'
          : r.state === 'scheduled' ? 'Saved — it will appear inside its window'
          : r.state === 'waiting' ? 'Saved — another message is showing until its window ends'
          : r.state === 'ended' ? 'Saved — its window has already passed, so it will not show'
          : 'Saved — switched off');
        editing = null; load();
      });
    });
  }

  // ---------- legal pages ----------
  // Terms / Privacy / Refund. These are the pages the owner is legally obliged to keep current and
  // the only way to change one was a developer and a deploy. Published text overrides the shipped
  // page at the edge, so the page stays server-rendered and crawlable either way.
  function legalSection(docs) {
    return '<div class="hub-section"><h2>Legal pages</h2>' +
      '<p class="hint" style="margin-bottom:10px">Terms, Privacy and Refund. Leave one empty to keep the version that ships with the site — clearing your text restores it rather than publishing a blank page.</p>' +
      docs.map(function (l) {
        return '<div class="entry ' + (l.published ? 'showing' : 'off') + '">' +
          '<div class="entry-head">' +
            '<b>' + esc(l.label) + '</b>' +
            '<span class="tag ' + (l.published ? 'showing' : 'off') + '">' + (l.published ? 'Your version is live' : 'Shipped version') + '</span>' +
          '</div>' +
          '<div class="entry-when"><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.url) + '</a>' +
            (l.updated_at ? ' · edited ' + new Date(Number(l.updated_at)).toLocaleDateString() : '') + '</div>' +
          '<div class="form-row" style="margin-top:8px"><label>Page body (HTML)</label>' +
            '<textarea id="lg_' + esc(l.slug) + '" style="min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px">' + esc(l.body) + '</textarea>' +
            '<p class="hint">Headings, paragraphs and lists — &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;. The page title, table of contents and legal schema stay as they are; this replaces the document body.</p></div>' +
          '<div class="entry-acts">' +
            '<button data-legal="' + esc(l.slug) + '">Publish</button>' +
            (l.published ? '<button class="del" data-legalclear="' + esc(l.slug) + '">Restore shipped version</button>' : '') +
          '</div></div>';
      }).join('') + '</div>';
  }
  function wireLegal() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-legal]'), function (b) {
      b.addEventListener('click', function () {
        var slug = b.getAttribute('data-legal');
        b.disabled = true;
        Hub.api('/api/hub/owner/site-copy', { method: 'POST', body: { op: 'save_legal', doc: slug, body: (document.getElementById('lg_' + slug) || {}).value || '' } })
          .then(function (r) {
            b.disabled = false;
            if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not save'); return; }
            Hub.toast(r.published ? 'Published — ' + r.url + ' now shows your text' : 'Cleared — the shipped page is back');
            load();
          });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-legalclear]'), function (b) {
      b.addEventListener('click', function () {
        var slug = b.getAttribute('data-legalclear');
        if (!window.confirm('Restore the shipped ' + slug + ' page? Your edited text will be removed.')) return;
        Hub.api('/api/hub/owner/site-copy', { method: 'POST', body: { op: 'save_legal', doc: slug, body: '' } })
          .then(function (r) {
            if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not clear'); return; }
            Hub.toast('The shipped page is back'); load();
          });
      });
    });
  }

  function load() {
    Owner.get('/api/hub/owner/site-copy').then(function (d) {
      if (!d || !d.ok) { document.getElementById('owner-root').innerHTML = '<div class="hub-empty">Could not load.</div>'; return; }
      SLOTS = d.slots; LEGAL = d.legal || []; render();
    });
  }
  load();
})();
</script>
</body>
</html>
