<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Leads</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .lead-chips { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .lead-chips button { flex:1; min-width:96px; border:1px solid var(--line); background:#fff; color:var(--green);
    border-radius:10px; padding:9px 8px; font:inherit; font-size:13px; cursor:pointer; }
  .lead-chips button.sel { border-color:var(--gold,#C6A85B); box-shadow:0 0 0 1px var(--gold,#C6A85B); background:#fff8e9; }
  .lead-chips button .badge { margin-left:4px; }
  .lead-right { text-align:right; font-size:12px; color:var(--green); white-space:nowrap; }
  .profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:13px; }
  .profile-grid .k { color:var(--green); opacity:.75; }
  .lead-msg { white-space:pre-wrap; font-size:13px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .detail-actions { display:flex; gap:8px; margin-top:12px; }
  .detail-actions .btn { flex:1; }
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · LEADS</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading inquiries…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }

  var esc = Hub.esc, $ = Hub.$;
  var curKind = '';          // '' = all
  var curChannel = '';       // '' = all, 'instagram' = IG-sourced only
  var searchT = 0;

  function refresh() { if (window.AnejoI18n) window.AnejoI18n.refresh(); }

  function kindBadge(kind) {
    if (kind === 'wholesale') return '<span class="badge" data-i18n>wholesale</span>';
    if (kind === 'launch') return '<span class="badge" style="background:#fff8e9;border-color:var(--gold,#C6A85B);color:#8B6B3E" data-i18n>launch list</span>';
    if (kind === 'sms') return '<span class="badge" data-i18n>SMS opt-in</span>';
    return '<span class="badge ok" data-i18n>tasting</span>';
  }

  // Instagram-sourced leads (0078) — a distinct pink/purple badge so they read as unmistakably
  // different from the web-form kinds above, at a glance in the list. INTENT_LABEL mirrors
  // functions/_lib/social_leads.js's INTENT_LABEL — kept as a small literal copy since the HUB is
  // static HTML/JS with no shared module loader for _lib code.
  var IG_INTENT_LABEL = {
    catering: 'catering/event', bulk_corporate: 'bulk/corporate', wholesale_partnership: 'wholesale/partner', subscription: 'subscription'
  };
  function igBadge(l) {
    if (l.channel !== 'instagram') return '';
    var label = IG_INTENT_LABEL[l.ig_intent] || 'Instagram';
    var conf = l.ig_confidence === 'high'
      ? '<span class="badge" style="background:#fdecea;border-color:#e0837a;color:#9a2f22">high confidence</span>'
      : '<span class="badge" style="background:#f2f2f2;border-color:var(--line);color:var(--green);opacity:.75">unconfirmed</span>';
    return ' <span class="badge" style="background:#f3ecfb;border-color:#b98ee0;color:#5a2d84">📷 ' + esc(label) + '</span> ' + conf;
  }

  // ---------- skeleton ----------
  function render() {
    var root = document.getElementById('owner-root'); root.className = '';
    root.innerHTML =
      '<div id="list-view">' +
        '<div class="hub-section"><h2 data-i18n>Website inquiries</h2>' +
          '<div class="lead-chips" id="chips"></div>' +
          '<div class="card"><input id="q" type="search" placeholder="Search name, email, or company…" autocomplete="off"></div>' +
          '<div id="llist" class="list"><div class="hub-loading">…</div></div>' +
        '</div>' +
      '</div>' +
      '<div id="detail-view" style="display:none"></div>';

    var qEl = $('#q');
    qEl.addEventListener('input', function () {
      clearTimeout(searchT);
      searchT = setTimeout(function () { loadList(); }, 300);
    });
    window.addEventListener('hashchange', route);
    route();
    loadList();
    refresh();
  }

  function renderChips(counts) {
    var c = counts || { tasting: 0, wholesale: 0, launch: 0, sms: 0, instagram: 0, total: 0 };
    var defs = [
      { k: '', ch: '', label: 'All', n: c.total },
      { k: '', ch: 'instagram', label: '📷 Instagram', n: c.instagram },
      { k: 'launch', ch: '', label: 'Launch list', n: c.launch },
      { k: 'tasting', ch: '', label: 'Tasting', n: c.tasting },
      { k: 'wholesale', ch: '', label: 'Wholesale', n: c.wholesale },
      { k: 'sms', ch: '', label: 'SMS', n: c.sms }
    ];
    $('#chips').innerHTML = defs.map(function (d) {
      var sel = (d.ch ? d.ch === curChannel : (d.k === curKind && !curChannel));
      return '<button data-k="' + d.k + '" data-ch="' + d.ch + '" class="' + (sel ? 'sel' : '') + '">' +
        '<span data-i18n>' + d.label + '</span> <span class="badge">' + (d.n || 0) + '</span></button>';
    }).join('');
    $('#chips').querySelectorAll('[data-k]').forEach(function (b) {
      b.addEventListener('click', function () {
        curKind = b.getAttribute('data-k') || '';
        curChannel = b.getAttribute('data-ch') || '';
        loadList();
      });
    });
    refresh();
  }

  // ---------- list ----------
  function loadList() {
    var q = $('#q') ? $('#q').value.trim() : '';
    var params = [];
    if (curKind) params.push('kind=' + encodeURIComponent(curKind));
    if (curChannel) params.push('channel=' + encodeURIComponent(curChannel));
    if (q) params.push('q=' + encodeURIComponent(q));
    Owner.get('/api/hub/owner/leads' + (params.length ? '?' + params.join('&') : '')).then(function (d) {
      if (!d || !d.ok) return;
      renderChips(d.counts);
      var el = $('#llist');
      if (!el) return;
      if (!d.items || !d.items.length) {
        el.innerHTML = '<div class="card"><p class="row-sub" data-i18n>No inquiries yet.</p></div>';
        refresh();
        return;
      }
      el.innerHTML = d.items.map(function (l) {
        var isIg = l.channel === 'instagram';
        var badges = kindBadge(l.kind) + igBadge(l);
        if (l.converted) badges += ' <span class="badge ok" data-i18n>in CRM</span>';
        if (l.sms_consent) badges += ' <span class="badge ok">SMS ✓</span>';
        var title = l.name || (isIg ? ('@' + (l.ig_username || 'instagram')) : l.email) || '—';
        // For an Instagram lead there is no company/email/phone yet — what they actually SAID is
        // the whole point (the bug this closes: that message used to vanish into `messages` with
        // nothing pointing back at it), so it takes the subtitle's place instead of "no contact info".
        var sub = isIg
          ? (l.trigger_message ? '"' + esc(l.trigger_message.slice(0, 90)) + (l.trigger_message.length > 90 ? '…' : '') + '"' : '')
          : [l.company, l.email, l.phone].filter(Boolean).map(esc).join(' · ');
        return '<div class="row" data-id="' + esc(l.id) + '" style="cursor:pointer">' +
          '<div class="row-main"><div class="row-title">' + esc(title) + ' ' + badges + '</div>' +
          '<div class="row-sub">' + (sub || '<span data-i18n>no contact info</span>') + '</div></div>' +
          '<div class="lead-right">' + Owner.timeAgo(l.created_at) + '</div></div>';
      }).join('');
      el.querySelectorAll('[data-id]').forEach(function (r) {
        r.addEventListener('click', function () { window.location.hash = '#l=' + encodeURIComponent(r.getAttribute('data-id')); });
      });
      window._leads = d.items;
      refresh();
    });
  }

  // ---------- detail (hash #l=<id>) ----------
  function route() {
    var m = (window.location.hash || '').match(/^#l=(.+)$/);
    if (m) showDetail(decodeURIComponent(m[1]));
    else { $('#detail-view').style.display = 'none'; $('#list-view').style.display = ''; }
  }

  function findLead(id) {
    return (window._leads || []).filter(function (l) { return l.id === id; })[0] || null;
  }

  function showDetail(id) {
    var dv = $('#detail-view');
    $('#list-view').style.display = 'none';
    dv.style.display = '';
    var l = findLead(id);
    if (!l) { dv.innerHTML = backBtn() + '<div class="card accent"><p data-i18n>Inquiry not found. Go back and reopen.</p></div>'; bindBack(); refresh(); return; }

    var isIg = l.channel === 'instagram';
    var rows = [];
    rows.push(['Type', kindBadge(l.kind) + igBadge(l)]);
    if (isIg) {
      // Instagram context FIRST for an IG lead — who, and how sure the classifier is — since that
      // is what makes this row different from every other inquiry above it in the list.
      rows.push(['Instagram', l.ig_username
        ? '<a href="https://instagram.com/' + encodeURIComponent(l.ig_username) + '" target="_blank" rel="noopener">@' + esc(l.ig_username) + ' ↗</a>'
        : '<span data-i18n>Unknown handle</span>']);
      rows.push(['Detected as', esc((IG_INTENT_LABEL[l.ig_intent] || l.ig_intent || '—')) +
        (l.ig_confidence === 'high' ? ' — <strong data-i18n>high confidence</strong>' : ' — <span data-i18n>unconfirmed, worth a human read</span>')]);
    }
    if (l.company) rows.push(['Company', esc(l.company)]);
    rows.push(['Email', esc(l.email || '—')]);
    rows.push(['Phone', esc(l.phone || '—')]);
    if (l.interest) rows.push(['Interest', esc(l.interest)]);
    rows.push(['SMS consent', l.sms_consent ? '<span class="badge ok">SMS ✓</span>' : '<span data-i18n>No</span>']);
    // Attribution (0044). Without this the src/utm_* captured at signup are write-only and the
    // owner can never tell which creator link or campaign actually produced a lead.
    if (l.src) rows.push(['Source code', '<span style="font-family:ui-monospace,Menlo,monospace;font-weight:700">' + esc(l.src) + '</span>']);
    if (l.utm_source || l.utm_medium) rows.push(['Channel', esc([l.utm_source, l.utm_medium].filter(Boolean).join(' · '))]);
    if (l.utm_campaign) rows.push(['Campaign', esc(l.utm_campaign)]);
    if (l.referrer) rows.push(['Came from', esc(String(l.referrer).slice(0, 80))]);
    rows.push(['Received', esc(Owner.timeAgo(l.created_at))]);
    var grid = rows.map(function (r) { return '<div class="k" data-i18n>' + r[0] + '</div><div>' + r[1] + '</div>'; }).join('');
    // For an Instagram lead, `message` (the web form's free-text field) is always empty — what the
    // customer actually said is trigger_message, shown the same way so it reads the same as any
    // other inquiry's notes rather than looking like a second, unexplained field.
    var msgText = isIg ? l.trigger_message : l.message;
    var msg = msgText ? '<div class="lead-msg">' + esc(msgText) + '</div>' : '';
    var openThread = isIg ? '<p style="margin-top:10px"><a href="/hub/owner/marketing.html" data-i18n>View the Instagram conversation in the inbox →</a></p>' : '';

    var mailto = l.email ? 'mailto:' + encodeURIComponent(l.email) +
      '?subject=' + encodeURIComponent('Añejo Catering Co. — your ' + l.kind + ' inquiry') : '';
    // Converting needs a name+email (functions/api/hub/owner/leads.js POST convert) — an
    // Instagram lead usually has neither yet, so offering the button would just produce a
    // confusing "no valid email" error. Point the owner at getting contact info first instead.
    var convertBtn = l.converted
      ? '<a class="btn ghost" href="/hub/owner/customers.html#c=' + encodeURIComponent((l.email || '').toLowerCase()) + '" data-i18n>View in CRM →</a>'
      : (l.email
        ? '<button class="btn gold" id="convert-btn" type="button" data-i18n>+ Add to CRM</button>'
        : (isIg ? '<span class="row-sub" data-i18n>Get their email on Instagram, then add to CRM</span>' : ''));

    dv.innerHTML =
      backBtn() +
      '<div class="hub-section"><h2>' + esc(l.name || (isIg ? '@' + (l.ig_username || 'Instagram') : l.email) || 'Inquiry') + '</h2>' +
      '<div class="card"><div class="profile-grid">' + grid + '</div>' + msg + openThread + '</div>' +
      '<div class="detail-actions">' +
        (mailto ? '<a class="btn ghost" href="' + mailto + '" data-i18n>✉️ Email</a>' : '') +
        convertBtn +
      '</div></div>';

    bindBack();
    var cb = $('#convert-btn');
    if (cb) cb.addEventListener('click', function () {
      cb.disabled = true;
      Hub.api('/api/hub/owner/leads', { method: 'POST', body: { action: 'convert', id: l.id } }).then(function (r) {
        cb.disabled = false;
        if (r && r.ok) {
          Hub.toast(r.already ? 'Already in CRM' : 'Added to CRM');
          Hub.track('lead.converted', { kind: l.kind, already: !!r.already, platform: 'pwa' });
          window.location.href = '/hub/owner/customers.html#c=' + encodeURIComponent((l.email || '').toLowerCase());
        } else {
          Hub.toast(r && r.error ? r.error : 'Could not add to CRM.');
        }
      });
    });
    refresh();
  }

  function backBtn() { return '<button class="btn ghost block" id="back-btn" type="button" data-i18n>← Back to inquiries</button>'; }
  function bindBack() { var b = $('#back-btn'); if (b) b.addEventListener('click', function () { window.location.hash = ''; }); }

  Owner.init('leads', render);
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
