<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Añejo · Invoice</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<style>
  :root{--green:#1A3D2E;--gold:#C6A85B;--gold-700:#8a7a2e;--cream:#F5F2EC;--ink:#21302a;--muted:#6f7b74;--line:#e3ddcf}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#e9e4d8;color:var(--ink)}
  .toolbar{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .toolbar a{color:var(--green);text-decoration:none;font-weight:700;font-size:13px}
  .print{background:var(--gold);color:var(--green);border:0;border-radius:20px;padding:8px 18px;font-weight:800;cursor:pointer}
  .inv{max-width:760px;margin:0 auto 40px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:36px 40px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--green);padding-bottom:16px}
  .top .brand{font-family:Georgia,serif;letter-spacing:5px;color:var(--green);font-size:24px;font-weight:600}
  .top .brand small{display:block;font-family:inherit;letter-spacing:.5px;font-size:11px;color:var(--muted);margin-top:4px}
  .top .it{text-align:right}.top .it h1{font-size:26px;color:var(--gold-700);letter-spacing:1px}.top .it .num{font-size:14px;font-weight:700;color:var(--green);margin-top:4px}
  .parties{display:flex;justify-content:space-between;margin:20px 0;font-size:13.5px}
  .parties .lab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .parties b{color:var(--green)}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--green);color:var(--cream);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .sitehd td{background:var(--cream);font-weight:700;color:var(--green)}
  .day td{color:var(--muted);font-size:12.5px}
  .fee td{color:var(--muted);font-size:12.5px;font-style:italic}
  .sitesub td{font-weight:700;color:var(--green);border-top:1px solid var(--line)}
  .totals{margin-top:16px;margin-left:auto;width:280px}
  .totals .r{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
  .totals .r.grand{border-top:2px solid var(--green);margin-top:6px;padding-top:10px;font-size:18px;font-weight:800;color:var(--green)}
  .foot{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted);line-height:1.6}
  .state{max-width:760px;margin:40px auto;text-align:center;color:var(--muted)}
  .acts{max-width:760px;margin:0 auto 40px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 22px}
  .acts h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:10px}
  .acts .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .acts input{flex:1;min-width:180px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px}
  .acts button{border:0;border-radius:20px;padding:9px 18px;font-weight:800;cursor:pointer;font:inherit;font-size:13.5px}
  .acts button.pay{background:var(--green);color:#fff}
  .acts button.send{background:var(--gold);color:var(--green)}
  .acts button[disabled]{opacity:.5;cursor:default}
  .acts .hint{font-size:12px;color:var(--muted);line-height:1.55}
  .acts .done{font-size:13.5px;color:var(--green);font-weight:700}
  @media print{ body{background:#fff} .toolbar,.acts{display:none} .inv{box-shadow:none;border:none;margin:0;max-width:none} @page{margin:16mm} }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/hub/owner/contracts.html">↩︎ Contracts</a>
  <button class="print" onclick="window.print()">🖨 Print / Save PDF</button>
</div>
<div id="root" class="state">Loading invoice…</div>
<div id="acts"></div>
<script src="/hub/assets/hub.js"></script>
<script>
(function(){
  var id=(new URLSearchParams(location.search)).get('id')||'';
  var money=Hub.money, esc=Hub.esc;
  function fmtDate(s){ return s||''; }
  function fmtWhen(ms){ return ms ? new Date(ms).toLocaleString() : ''; }

  // Send / mark-paid. Without these an invoice sits at 'open' forever — the printable page was
  // the end of the road. Both are owner-only server-side; this is just the trigger.
  function actions(inv, a){
    var el=document.getElementById('acts');
    if(!el) return;
    var paid=inv.status==='paid', voided=inv.status==='void';
    // paid_at / sent_at / sent_to arrive with migrations/0046 — absent until it's applied, so
    // fall back to the status word rather than showing a blank "paid on ".
    var paidLine = paid ? ('✅ Paid'+(inv.paid_at?' · '+esc(fmtWhen(inv.paid_at)):'')+(inv.paid_by?' · marked by '+esc(inv.paid_by):'')+(inv.paid_ref?' · ref '+esc(inv.paid_ref):'')) : '';
    var sentLine = inv.sent_at ? ('✉️ Emailed to '+esc(inv.sent_to||'')+' · '+esc(fmtWhen(inv.sent_at))) : (inv.status==='sent' ? '✉️ Emailed' : '');
    el.className='acts';
    el.innerHTML =
      '<h2>Invoice actions</h2>' +
      (sentLine?'<div class="done" style="margin-bottom:8px">'+sentLine+'</div>':'') +
      (paidLine?'<div class="done" style="margin-bottom:8px">'+paidLine+'</div>':'') +
      (voided?'<div class="hint">This invoice is void.</div>':
        '<div class="line"><input id="to" type="email" value="'+esc(a.billing_email||'')+'" placeholder="Billing email">' +
        '<button class="send" id="btn-send">✉️ '+(inv.sent_at||inv.status==='sent'?'Re-send':'Send')+' to client</button></div>' +
        (paid?'':'<div class="line"><input id="ref" placeholder="Payment reference (check #, ACH, Square…)">' +
          '<button class="pay" id="btn-pay">✓ Mark paid</button></div>') +
        // Only offered once QuickBooks is actually connected — a button that always fails is
        // worse than no button. Already-booked invoices say so instead of inviting a second post,
        // which in a client's books reads as being billed twice.
        (inv.qbo_invoice_id
          ? '<div class="done" style="margin-top:8px">📗 In QuickBooks (invoice ' + esc(inv.qbo_invoice_id) + ')</div>'
          : '<div class="line" id="qbo-line" style="display:none"><button class="send" id="btn-qbo">📗 Send to QuickBooks</button></div>') +
        '<div class="hint">Send emails this invoice to the billing contact and moves it to <b>sent</b>. Mark paid closes it — it stops counting as outstanding.</div>');

    var bs=document.getElementById('btn-send');
    if(bs) bs.addEventListener('click', function(){
      var to=(document.getElementById('to')||{}).value||'';
      if(!window.confirm('Email invoice '+(inv.number||inv.id)+' to '+to+'?')) return;
      bs.disabled=true;
      Hub.api('/api/hub/owner/contracts',{method:'POST',body:{op:'send_invoice',account_id:inv.account_id,invoice_id:inv.id,to:to,link:location.href}})
        .then(function(r){ bs.disabled=false;
          if(r&&r.ok){ Hub.toast('Invoice emailed'); load(); } else Hub.toast((r&&r.error)||'Could not send'); });
    });
    // Reveal the QuickBooks button only when there is a live connection behind it.
    var qline=document.getElementById('qbo-line');
    if(qline) Hub.api('/api/hub/owner/qbo').then(function(q){
      if(!q||!q.ok||!q.connected) return;
      qline.style.display='';
      var bq=document.getElementById('btn-qbo');
      bq.addEventListener('click', function(){
        if(!window.confirm('Send invoice '+(inv.number||inv.id)+' to QuickBooks?')) return;
        bq.disabled=true;
        Hub.api('/api/hub/owner/qbo',{method:'POST',body:{op:'push_invoice',invoice_id:inv.id}})
          .then(function(r){ bq.disabled=false;
            if(r&&r.ok){ Hub.toast(r.already?'It was already in QuickBooks':'Sent to QuickBooks'); load(); }
            else Hub.toast((r&&r.error)||'Could not send to QuickBooks'); });
      });
    });

    var bp=document.getElementById('btn-pay');
    if(bp) bp.addEventListener('click', function(){
      if(!window.confirm('Mark invoice '+(inv.number||inv.id)+' as PAID? It stops showing as outstanding.')) return;
      bp.disabled=true;
      Hub.api('/api/hub/owner/contracts',{method:'POST',body:{op:'mark_paid',account_id:inv.account_id,invoice_id:inv.id,paid_ref:(document.getElementById('ref')||{}).value||''}})
        .then(function(r){ bp.disabled=false;
          if(r&&r.ok){ Hub.toast(r.degraded?'Marked paid (details unavailable — migration pending)':'Marked paid'); load(); }
          else Hub.toast((r&&r.error)||'Could not mark paid'); });
    });
  }

  function load(){
  Hub.api('/api/hub/owner/contracts?invoice='+encodeURIComponent(id)).then(function(d){
    var root=document.getElementById('root');
    if(d && d._status===401){ location.href='/login'; return; }
    if(!d || !d.ok){ root.innerHTML='Invoice not found.'; return; }
    var inv=d.invoice, a=d.account, li=inv.line_items||{sites:[]};
    // Each site's delivery and rush fees used to be folded silently into one bold subtotal row —
    // the invoice never showed the per-site delivery figure, only ONE combined "Delivery" total
    // for the whole account in the summary below. That is exactly the gap that made a correctly
    // configured $20/site/day fee look, on paper, like "$20 combined" — nothing to do with the
    // billed amount (it was always per-site), only with what the invoice made visible. Breaking
    // delivery out per site, with the day-count × rate spelled out, closes that reading gap for
    // good — for the owner checking the numbers and for the client receiving the bill.
    var rows=(li.sites||[]).map(function(s){
      var hd='<tr class="sitehd"><td colspan="4">'+esc(s.name)+'</td></tr>';
      var days=(s.days||[]).map(function(x){ return '<tr class="day"><td>'+fmtDate(x.date)+(x.rush?' · RUSH':'')+'</td><td>'+x.count+'</td><td>'+money(x.price_cents)+'</td><td>'+money(x.total_cents)+'</td></tr>'; }).join('');
      var nDays=(s.days||[]).length;
      var delivRate=nDays?Math.round(s.delivery_cents/nDays):0;
      var deliv=s.delivery_cents?('<tr class="fee"><td>'+esc(s.name)+' — delivery ('+nDays+' day'+(nDays===1?'':'s')+' × '+money(delivRate)+' each)</td><td></td><td></td><td>'+money(s.delivery_cents)+'</td></tr>'):'';
      var rush=s.rush_cents?('<tr class="fee"><td>'+esc(s.name)+' — rush fees</td><td></td><td></td><td>'+money(s.rush_cents)+'</td></tr>'):'';
      var sub='<tr class="sitesub"><td>'+esc(s.name)+' subtotal — '+s.lunches+' lunches</td><td></td><td></td><td>'+money(s.subtotal_cents+s.delivery_cents+s.rush_cents)+'</td></tr>';
      return hd+days+deliv+rush+sub;
    }).join('');
    root.className=''; root.innerHTML=
      '<div class="inv">'+
        '<div class="top"><div class="brand">AÑEJO<small>Añejo Catering Co. LLC · anejocateringco.com</small></div>'+
          '<div class="it"><h1>INVOICE</h1><div class="num">'+esc(inv.number||'')+'</div><div class="num" style="font-weight:400;color:var(--muted)">'+esc(inv.period_from||'')+' – '+esc(inv.period_to||'')+'</div></div></div>'+
        '<div class="parties"><div><div class="lab">Bill to</div><b>'+esc(a.name||'')+'</b>'+(a.billing_contact?'<br>'+esc(a.billing_contact):'')+(a.billing_email?'<br>'+esc(a.billing_email):'')+'</div>'+
          '<div style="text-align:right"><div class="lab">Status</div><b>'+esc((inv.status||'open').toUpperCase())+'</b></div></div>'+
        '<table><thead><tr><th>Date / item</th><th>Lunches</th><th>Price</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+
        '<div class="totals">'+
          '<div class="r"><span>Lunches ('+inv.lunches+')</span><span>'+money(inv.subtotal_cents)+'</span></div>'+
          '<div class="r"><span>Delivery</span><span>'+money(inv.delivery_cents)+'</span></div>'+
          (inv.rush_cents?'<div class="r"><span>Rush fees</span><span>'+money(inv.rush_cents)+'</span></div>':'')+
          '<div class="r grand"><span>Total due</span><span>'+money(inv.total_cents)+'</span></div>'+
        '</div>'+
        '<div class="foot">Thank you for your business. Please remit to Añejo Catering Co. LLC. Questions about this invoice? Reply to the email it was sent with.</div>'+
      '</div>';
    actions(inv, a||{});
  }).catch(function(){ document.getElementById('root').innerHTML='Could not load.'; });
  }
  load();
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
