<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Contract Accounts</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .site-card{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px;margin:10px 0;background:#fff}
  .site-card .nm{font-weight:700;color:var(--green);font-size:16px}
  .site-card .ad{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
  .linkrow{display:flex;gap:6px;margin:8px 0}
  .linkrow input{flex:1;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink)}
  .linkrow button{border:0;background:var(--green);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer}
  .terms{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .pill{font-size:11px;font-weight:700;background:#eee;color:#555;border-radius:20px;padding:3px 9px}
  .pill.gold{background:#efe7cf;color:var(--gold-700,#8a7a2e)}
  .led{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .led th,.led td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  .led th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .led td.r,.led th.r{text-align:right}
  .acct-total{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700;color:var(--green)}
  .contact{margin-top:10px}
  .contact label{font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:4px}
  .aud{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .aud summary{cursor:pointer;font-weight:700;color:var(--green);font-size:13px;padding:9px 12px}
  .aud[open] summary{border-bottom:1px solid var(--line)}
  /* Roster rows inside "Who can order". Wraps rather than truncating — you have to be able to
     tell two colleagues apart before removing one. */
  .strow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .strow button{border:1px solid var(--line);background:#fff;border-radius:7px;font:inherit;font-size:11.5px;font-weight:700;color:var(--green);padding:4px 10px;cursor:pointer;white-space:nowrap}
  .aud .linkrow{padding:0 12px 4px}
  .invitebox{display:flex;align-items:center;gap:8px;padding:2px 12px;font-size:12.5px;color:var(--ink);cursor:pointer}
  .invitebox input{width:16px;height:16px;flex:0 0 auto}
  .dev,.evrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .dev:last-child,.evrow:last-child{border-bottom:0}
  .dev.rev{opacity:.5}
  .rvk{border:0;background:var(--crit,#b3402f);color:#fff;border-radius:7px;padding:5px 10px;font-weight:700;font-size:12px;cursor:pointer}
  .evrow b{text-transform:capitalize}
  .terms-edit{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .terms-edit summary{cursor:pointer;font-weight:700;color:var(--green);font-size:13px;padding:9px 12px}
  .terms-edit[open] summary{border-bottom:1px solid var(--line)}
  .terms-edit .body{padding:12px}
  .terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .terms-grid label{font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px}
  .terms-grid input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
  .terms-note{margin-top:8px}
  .terms-note input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
  .terms-grid select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff}
  .terms-head{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:14px 0 6px}
  .terms-head:first-child{margin-top:0}
  .daypick{display:flex;gap:5px;flex-wrap:wrap}
  .daychip{position:relative;cursor:pointer;user-select:none}
  .daychip input{position:absolute;opacity:0;width:0;height:0}
  .daychip span{display:block;min-width:42px;text-align:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);background:#fff}
  /* :checked alone — a static .on class would keep a chip green after the owner unchecked it. */
  .daychip input:checked+span{background:var(--green);border-color:var(--green);color:#fff}
  .daychip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
  .livetoggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink);cursor:pointer}
  .livetoggle input{width:18px;height:18px;flex:0 0 auto}
  /* Weekly menu editor: one row per delivery day, stacking on a phone. */
  .menurow{display:grid;grid-template-columns:44px 1.4fr 1.2fr 1.4fr 90px;gap:6px;align-items:center;margin:5px 0}
  .menurow input,.menuctl input,.menuctl select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff}
  .menurow .mday{font-size:12px;font-weight:700;color:var(--green)}
  .menuctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .menuctl label{font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px}
  .pill.now{background:var(--green);color:#fff}
  .menuprev{overflow-x:auto;margin-top:6px}
  .menuprev table{width:100%;border-collapse:collapse;font-size:12.5px}
  .menuprev th,.menuprev td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .menuprev th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  @media (max-width:640px){.menurow{grid-template-columns:44px 1fr 1fr}.menurow .mday{grid-row:span 2}}
  .site-card.paused{opacity:.72;border-left-color:var(--muted)}
  .pill.paused{background:#f2dcd8;color:#8f3b2c}
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · CONTRACTS</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p>Loading contract accounts…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }
  var esc = Hub.esc, money = Hub.money;
  var origin = location.origin;
  var SITES = {};   // site_id → the stored row, so edits can be sent as a diff

  function copyLink(btn, url) {
    try { navigator.clipboard.writeText(url).then(function(){ btn.textContent='Copied ✓'; setTimeout(function(){ btn.textContent='Copy'; },1500); }); }
    catch(e){ btn.textContent='—'; }
  }
  window.__copy = copyLink;

  // Cents → the dollars string the money inputs want ('' when the column is empty).
  function dollars(cents) { return (cents === null || cents === undefined || cents === '') ? '' : (Number(cents) / 100).toFixed(2); }

  var DOW = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
  function daysOf(csv) {
    var out = {};
    String(csv || '').split(',').forEach(function (d) { var k = d.trim().toLowerCase(); if (k) out[k] = true; });
    return out;
  }
  function dayPicker(idp, csv) {
    var on = daysOf(csv);
    return '<div class="daypick">' + DOW.map(function (d) {
      return '<label class="daychip' + (on[d[0]] ? ' on' : '') + '">' +
        '<input type="checkbox" id="' + idp + '_' + d[0] + '" value="' + d[0] + '"' + (on[d[0]] ? ' checked' : '') + '>' +
        '<span>' + d[1] + '</span></label>';
    }).join('') + '</div>';
  }
  function pickedDays(idp) {
    return DOW.filter(function (d) { var el = document.getElementById(idp + '_' + d[0]); return el && el.checked; })
      .map(function (d) { return d[0]; }).join(',');
  }

  // Renegotiating / re-configuring a LIVE location. Activation is the one-time status flip; this is
  // everything after it. Every column the card displays above is editable here — the days and the
  // delivery window used to render as read-only pills, so changing a clinic's schedule or fixing a
  // street address meant a SQL console. Only fields that actually CHANGED are sent, so the audit
  // row is a real diff rather than a re-statement of the whole row.
  function editTermsForm(s, aid) {
    var i = function (k, label, val, ph) {
      return '<div><label>' + label + '</label><input id="' + k + '_' + s.id + '" type="number" step="0.01" min="0" value="' + esc(val) + '" placeholder="' + ph + '"></div>';
    };
    var txt = function (k, label, val, ph) {
      return '<div><label>' + label + '</label><input id="' + k + '_' + s.id + '" type="text" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"></div>';
    };
    return '<details class="terms-edit"><summary>✏️ Edit terms — ' + esc(s.name) + '</summary><div class="body">' +
      '<div class="terms-head">Pricing</div>' +
      '<div class="terms-grid">' +
        i('ep', '$ / lunch', dollars(s.price_per_lunch_cents), '6.00') +
        i('ef', '$ delivery', dollars(s.delivery_fee_cents), '25.00') +
        i('er', '$ rush fee', dollars(s.rush_fee_cents), '15.00') +
        '<div><label>Cut-off (ET)</label><input id="ec_' + s.id + '" type="time" value="' + esc(s.cutoff_time || '09:00') + '"></div>' +
      '</div>' +

      '<div class="terms-head">Schedule</div>' +
      '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Delivery days</label>' +
        dayPicker('ed_' + s.id, s.delivery_days) + '</div>' +
      '<div class="terms-grid" style="margin-top:8px">' +
        txt('ew', 'Delivery time (shown to the office)', s.window_label, '11:30–12:30') +
        '<div><label>Kitchen window</label><select id="ek_' + s.id + '">' +
          '<option value="lunch"' + (s.delivery_window === 'dinner' ? '' : ' selected') + '>Lunch</option>' +
          '<option value="dinner"' + (s.delivery_window === 'dinner' ? ' selected' : '') + '>Dinner</option>' +
        '</select></div>' +
      '</div>' +

      '<div class="terms-head">Location</div>' +
      '<div class="terms-grid">' +
        txt('enm', 'Location name', s.name, 'Delray Beach') +
        txt('est', 'Street', s.street, '2226 W Atlantic Ave') +
        txt('eun', 'Unit / suite', s.unit, 'Suite 200') +
        txt('eci', 'City', s.city, 'Delray Beach') +
        txt('ess', 'State', s.state, 'FL') +
        txt('ezp', 'ZIP', s.zip, '33445') +
      '</div>' +

      '<div class="terms-head">Holiday &amp; operations contact</div>' +
      '<div class="terms-grid">' +
        '<div><label>Ops emails, who decides if this location is open</label><input id="eoe_' + s.id + '" type="email" multiple value="' + esc(s.ops_email || '') + '" placeholder="accounting@theirclinic.com, owner@theirclinic.com"></div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:4px">Separate several with commas. Everyone listed is on the same holiday email, so whoever sees it first can answer. Left blank, it goes to the billing inbox.</div>' +
      '<label class="livetoggle"><input type="checkbox" id="eac_' + s.id + '"' + (Number(s.active) === 0 ? '' : ' checked') + '>' +
        '<span>Accepting head counts — unchecking pauses this location\'s intake link</span></label>' +

      '<div class="terms-note"><input id="en_' + s.id + '" placeholder="Note (optional) — e.g. renegotiated on the 7/25 call"></div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:6px">New terms apply to the <b>next</b> head count. Days already submitted keep the price they were quoted.</div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__editTerms(\'' + aid + '\',\'' + s.id + '\')">Save changes</button>' +
      '</div></details>';
  }
  window.__editTerms = function (aid, sid) {
    var site = SITES[sid] || {};
    var v = function (p) { var el = document.getElementById(p + '_' + sid); return el ? String(el.value).trim() : ''; };
    var body = { op: 'edit_terms', account_id: aid, site_id: sid };
    var cents = function (raw) { return Math.round(parseFloat(raw) * 100); };
    var touched = 0;

    // Money + cut-off keep the original contract: blank means "leave this alone".
    if (v('ep') !== '' && cents(v('ep')) !== Number(site.price_per_lunch_cents)) { body.price_per_lunch_cents = cents(v('ep')); touched++; }
    if (v('ef') !== '' && cents(v('ef')) !== Number(site.delivery_fee_cents)) { body.delivery_fee_cents = cents(v('ef')); touched++; }
    if (v('er') !== '' && cents(v('er')) !== Number(site.rush_fee_cents)) { body.rush_fee_cents = cents(v('er')); touched++; }
    if (v('ec') !== '' && v('ec') !== String(site.cutoff_time || '')) { body.cutoff_time = v('ec'); touched++; }

    // Identity/schedule are diffed against what is stored, so an untouched field is never resent.
    var pairs = [['enm', 'name'], ['est', 'street'], ['eun', 'unit'], ['eci', 'city'], ['ess', 'state'], ['ezp', 'zip'], ['ew', 'window_label'], ['eoe', 'ops_email']];
    pairs.forEach(function (p) {
      var cur = v(p[0]), was = site[p[1]] == null ? '' : String(site[p[1]]);
      if (cur !== was) { body[p[1]] = cur; touched++; }
    });

    var days = pickedDays('ed_' + sid);
    if (days !== String(site.delivery_days || '')) { body.delivery_days = days; touched++; }
    if (!days) { Hub.toast('Pick at least one delivery day.'); return; }

    var kw = (document.getElementById('ek_' + sid) || {}).value || 'lunch';
    if (kw !== (site.delivery_window || 'lunch')) { body.delivery_window = kw; touched++; }

    var act = (document.getElementById('eac_' + sid) || {}).checked ? 1 : 0;
    if (act !== (Number(site.active) === 0 ? 0 : 1)) { body.active = act; touched++; }

    if (v('en') !== '') body.note = v('en');
    if (!touched) { Hub.toast('Nothing changed yet.'); return; }
    if (body.price_per_lunch_cents !== undefined && !(body.price_per_lunch_cents > 0)) { Hub.toast('Price per lunch must be more than $0.'); return; }
    // Pausing a location stops its intake link working — worth a beat before it happens.
    if (body.active === 0 && !window.confirm('Pause ' + (site.name || 'this location') + '? Their head-count link will stop accepting counts until you switch it back on.')) return;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: body }).then(function (r) {
      if (r && r.ok) { Hub.toast(r.degraded ? 'Saved (history unavailable — migration pending)' : 'Saved'); render(); }
      else Hub.toast((r && r.error) || 'Could not save the changes');
    });
  };

  // Add a location to an account that already exists. Terms are inherited from a sibling site
  // server-side, so a second clinic never silently opens at $0/lunch.
  function addSiteForm(aid) {
    var f = function (k, label, ph) {
      return '<div><label>' + label + '</label><input id="' + k + '_' + aid + '" type="text" placeholder="' + esc(ph) + '"></div>';
    };
    return '<details class="terms-edit"><summary>➕ Add a location</summary><div class="body">' +
      '<div class="terms-grid">' +
        f('nsn', 'Location name', 'Boca Raton') + f('nst', 'Street', '1200 N Federal Hwy') +
        f('nun', 'Unit / suite', 'Suite 300') + f('nci', 'City', 'Boca Raton') +
        f('nss', 'State', 'FL') + f('nzp', 'ZIP', '33432') +
      '</div>' +
      '<div style="margin-top:8px"><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Delivery days</label>' +
        dayPicker('nd_' + aid, 'mon,tue,wed') + '</div>' +
      '<div class="terms-grid" style="margin-top:8px">' +
        f('ncn', 'Office contact (optional)', 'Marina Valdes') + f('ncp', 'Contact mobile (optional)', '561-555-0142') +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:8px">Pricing, cut-off and delivery time are copied from this account\'s existing location — adjust them after with Edit terms.</div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__addSite(\'' + aid + '\')">Add location &amp; mint its link</button>' +
      '</div></details>';
  }
  window.__addSite = function (aid) {
    var v = function (p) { var el = document.getElementById(p + '_' + aid); return el ? String(el.value).trim() : ''; };
    if (!v('nsn')) { Hub.toast('Give the location a name.'); return; }
    if (!v('nst') || !v('nci')) { Hub.toast('A location needs a street and a city.'); return; }
    var days = pickedDays('nd_' + aid);
    if (!days) { Hub.toast('Pick at least one delivery day.'); return; }
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: {
      op: 'add_site', account_id: aid, name: v('nsn'), street: v('nst'), unit: v('nun'),
      city: v('nci'), state: v('nss') || 'FL', zip: v('nzp'), delivery_days: days,
      contact_name: v('ncn'), contact_phone: v('ncp'),
    } }).then(function (r) {
      if (r && r.ok) { Hub.toast(r.name + ' added — copy its link below'); render(); }
      else Hub.toast((r && r.error) || 'Could not add the location');
    });
  };

  // Onboard a business the owner signed off-line. Before this, the ONLY way an account could exist
  // was the public /business signup form — a client closed on the phone had nowhere to be entered.
  function newAccountForm() {
    var f = function (k, label, ph, type) {
      return '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">' + label + '</label>' +
        '<input id="' + k + '" type="' + (type || 'text') + '" placeholder="' + esc(ph) + '" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px"></div>';
    };
    return '<div class="hub-section"><details class="terms-edit" id="newacct"><summary>🏢 Onboard a new account</summary><div class="body">' +
      '<div class="terms-head">Business</div>' +
      '<div class="terms-grid">' +
        f('na_co', 'Company name', 'Coastal Family Medicine') +
        f('na_em', 'Billing email', 'ap@coastalfam.com', 'email') +
        f('na_bc', 'Billing contact (optional)', 'Roxana') +
        '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Billing model</label>' +
          '<select id="na_bm" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px">' +
          '<option value="biweekly">Biweekly invoice</option><option value="monthly">Monthly invoice</option>' +
          '<option value="weekly_autopay">Weekly autopay</option><option value="same_day">Same day</option></select></div>' +
      '</div>' +
      '<div class="terms-head">First delivery location</div>' +
      '<div class="terms-grid">' +
        f('na_sn', 'Location name', 'Jupiter') + f('na_st', 'Street', '400 Maplewood Dr') +
        f('na_un', 'Unit / suite', 'Suite 12') + f('na_ci', 'City', 'Jupiter') +
        f('na_ss', 'State', 'FL') + f('na_zp', 'ZIP', '33458') +
      '</div>' +
      '<div style="margin-top:8px"><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Delivery days</label>' +
        dayPicker('na_d', 'mon,tue,wed') + '</div>' +
      '<div class="terms-grid" style="margin-top:8px">' +
        f('na_cn', 'Office contact (optional)', 'Marina Valdes') + f('na_cp', 'Contact mobile (optional)', '561-555-0142') +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:8px">Lands as <b>pending</b> with no price set. You set the negotiated terms and press Activate — that is what turns their ordering link on.</div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__createAccount()">Create account</button>' +
      '</div></details></div>';
  }
  window.__createAccount = function () {
    var v = function (k) { var el = document.getElementById(k); return el ? String(el.value).trim() : ''; };
    if (!v('na_co')) { Hub.toast('Enter the company name.'); return; }
    if (!v('na_em')) { Hub.toast('Enter a billing email — invoices have nowhere to go without one.'); return; }
    if (!v('na_sn') || !v('na_st') || !v('na_ci')) { Hub.toast('The first location needs a name, street and city.'); return; }
    var days = pickedDays('na_d');
    if (!days) { Hub.toast('Pick at least one delivery day.'); return; }
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: {
      op: 'create_account', company: v('na_co'), billing_email: v('na_em'),
      billing_contact: v('na_bc'), billing_model: v('na_bm') || 'biweekly',
      sites: [{ name: v('na_sn'), street: v('na_st'), unit: v('na_un'), city: v('na_ci'),
        state: v('na_ss') || 'FL', zip: v('na_zp'), delivery_days: days,
        contact_name: v('na_cn'), contact_phone: v('na_cp') }],
    } }).then(function (r) {
      if (r && r.ok) { Hub.toast(v('na_co') + ' created — set terms, then Activate'); render(); }
      else Hub.toast((r && r.error) || 'Could not create the account');
    });
  };

  function siteCard(s, recent, aid, pending) {
    var url = origin + '/lunch-count?t=' + (s.intake_token || '');
    var mine = (recent || []).filter(function (r) { return r.site_id === s.id; });
    var rows = mine.slice(0, 10).map(function (r) {
      return '<tr><td>' + esc(r.service_date) + '</td><td class="r">' + r.headcount + '</td><td class="r">' + money(r.total_cents) +
        (r.is_rush ? ' <span class="pill gold">rush</span>' : '') + '</td><td class="r">' + (r.invoiced ? '✓' : '—') + '</td></tr>';
    }).join('') || '<tr><td colspan="4" style="color:var(--muted)">No counts yet.</td></tr>';
    var paused = Number(s.active) === 0;
    return '<div class="site-card' + (paused ? ' paused' : '') + '"><div class="nm">' + esc(s.name) +
      (paused ? ' <span class="pill paused">paused</span>' : '') + '</div>' +
      '<div class="ad">' + esc([s.street, s.unit, s.city, s.state, s.zip].filter(Boolean).join(', ')) + '</div>' +
      '<div class="terms">' +
        '<span class="pill">' + money(s.price_per_lunch_cents) + '/lunch</span>' +
        '<span class="pill">' + money(s.delivery_fee_cents) + ' delivery</span>' +
        '<span class="pill">cut-off ' + esc(s.cutoff_time) + '</span>' +
        '<span class="pill gold">' + esc(s.window_label || '') + '</span>' +
        '<span class="pill">' + esc((s.delivery_days || '').toUpperCase().replace(/,/g, ' ')) + '</span>' +
      '</div>' +
      '<div class="linkrow"><input readonly value="' + esc(url) + '"><button onclick="__copy(this,\'' + esc(url) + '\')">Copy</button></div>' +
      '<div style="font-size:11px;color:var(--muted)">↑ Give this link to the ' + esc(s.name) + ' contact — they open it each morning to send the head count.</div>' +
      '<div class="contact"><label>Office contact — receives the verification code &amp; SMS receipts' +
        (s.contact_phone ? '' : ' <span style="color:var(--crit,#b3402f)">(none yet — first submitter will enroll one)</span>') + '</label>' +
        '<div class="linkrow"><input id="cn_' + s.id + '" placeholder="Contact name" value="' + esc(s.contact_name || '') + '" style="flex:1">' +
        '<input id="cp_' + s.id + '" placeholder="Mobile e.g. 561-555-0142" value="' + esc(s.contact_phone || '') + '" style="flex:1.3">' +
        '<button onclick="__setContact(\'' + aid + '\',\'' + s.id + '\')">Save</button></div></div>' +
      staffBlock(s, aid) +
      (pending ? '' : overrideBlock(s, aid)) +
      (pending ? '' : editTermsForm(s, aid)) +
      '<table class="led"><tr><th>Date</th><th class="r">Lunches</th><th class="r">Total</th><th class="r">Inv.</th></tr>' + rows + '</table></div>';
  }

  // WHO MAY ORDER FOR THIS SITE.
  //
  // The office contact box above is the site's MAIN contact — one person, one number. Until
  // migrations/0077 that number was the only place a verification code could ever go, so when the
  // Pompano contact was out on 2026-08-03 the covering staffer typed her own name and her own
  // mobile and the code still went to the absent contact's phone. Nobody could order; the day
  // went unrecorded. This list is the fix: anyone on it gets their own code, and the main contact
  // stays copied on every receipt.
  //
  // Someone who had to cover before being added shows as PENDING — they ordered, verified by a
  // code to their own phone, and are recorded by name; placing one order does not authorize them.
  function staffBlock(s, aid) {
    var staff = s.staff || [];
    var rows = staff.map(function (p) {
      var tag = p.is_primary ? '<span class="pill gold">main</span>'
              : (p.active ? '' : '<span class="pill" style="background:#f7e3de;color:#7a2418">pending</span>');
      var btn = p.is_primary ? ''
              : (p.active
                  ? '<button onclick="__staff(\'' + aid + '\',\'' + s.id + '\',\'' + esc(p.id) + '\',false)">Remove</button>'
                  : '<button onclick="__staff(\'' + aid + '\',\'' + s.id + '\',\'' + esc(p.id) + '\',true)">Allow</button>');
      return '<div class="strow"><span>' + esc(p.name) + ' <span style="color:var(--muted)">' + esc(p.phone_hint || '') + '</span> ' + tag + '</span>' + btn + '</div>';
    }).join('') || '<div style="font-size:12px;color:var(--muted);padding:6px 0">Only the main contact above can order — add a backup so a sick day never blocks the count.</div>';
    return '<details class="aud" id="staffbox_' + s.id + '"><summary>👥 Who can order (' + staff.filter(function (p) { return p.active; }).length + ')</summary>' +
      '<div id="staffrows_' + s.id + '">' + rows + '</div>' +
      '<div class="linkrow" style="margin-top:8px"><input id="sn_' + s.id + '" placeholder="Name" style="flex:1">' +
      '<input id="sp_' + s.id + '" placeholder="Mobile e.g. 561-555-0142" style="flex:1.3">' +
      '<button onclick="__addStaff(\'' + aid + '\',\'' + s.id + '\')">Add</button></div>' +
      // Ticked by default, because a person added WITHOUT the link is authorized and has no way
      // in — that was the first version's gap. But it stays a tick, not an automatic send: the
      // box is the per-send tap for a text going to a client's employee, and it comes off for
      // someone you would rather tell yourself.
      '<label class="invitebox"><input type="checkbox" id="si_' + s.id + '" checked>' +
      '<span>Text them the ordering link now</span></label>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:5px">Each person gets their own 6-digit code by text when they order. The main contact is copied on every receipt.</div>' +
      '</details>';
  }

  // Redraw JUST this site's roster from the list the API returns, instead of reloading the page.
  //
  // The first version called load() on success, which rebuilt every account card and collapsed
  // the <details> the owner was working inside — so a successful add looked exactly like a
  // failure: a toast, and the list you were staring at gone. It also cleared nothing, so adding a
  // SECOND person meant retyping over the first one's details. Patching in place keeps the panel
  // open, empties the inputs, and shows the new person immediately.
  function redrawStaff(aid, sid, staff) {
    var site = SITES[sid];                        // the page's own cache of each site row
    if (site) site.staff = staff;                 // keep it honest for the next full render
    var box = document.getElementById('staffrows_' + sid);
    var details = document.getElementById('staffbox_' + sid);
    if (!box || !site) { render(); return; }      // page shape changed under us — fall back
    var tmp = document.createElement('div');
    tmp.innerHTML = staffBlock(site, aid);
    var fresh = tmp.querySelector('#staffrows_' + sid);
    box.innerHTML = fresh ? fresh.innerHTML : '';
    var sum = details && details.querySelector('summary');
    if (sum) sum.textContent = '👥 Who can order (' + staff.filter(function (p) { return p.active; }).length + ')';
    var n = document.getElementById('sn_' + sid); if (n) { n.value = ''; n.focus(); }
    var p = document.getElementById('sp_' + sid); if (p) p.value = '';
  }

  window.__addStaff = function (aid, sid) {
    var name = ((document.getElementById('sn_' + sid) || {}).value || '').trim();
    var phone = ((document.getElementById('sp_' + sid) || {}).value || '').trim();
    if (!name || !phone) { Hub.toast('Name and mobile are both needed.'); return; }
    var invEl = document.getElementById('si_' + sid);
    var invite = !invEl || invEl.checked;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'add_staff', site_id: sid, name: name, phone: phone, invite: invite } })
      .then(function (r) {
        if (r && r.ok) {
          // Says what actually happened to the text, not what was requested — a silent SMS
          // failure would otherwise read as "they've been sent the link" when they have not.
          var msg = invite
            ? (r.invited && r.invited.sent ? name + ' can order now — link texted to ' + r.invited.to_hint
                                           : name + ' can order now, but the text did not go through — send them the link above.')
            : name + ' can order now — send them the link above.';
          Hub.toast(msg);
          redrawStaff(aid, sid, r.staff || []);
        } else Hub.toast((r && r.error) || 'Could not add.');
      });
  };
  window.__staff = function (aid, sid, staffId, active) {
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'set_staff_active', site_id: sid, staff_id: staffId, active: active } })
      .then(function (r) {
        if (r && r.ok) { Hub.toast(active ? 'Allowed — they can order now.' : 'Removed — they can no longer order.'); redrawStaff(aid, sid, r.staff || []); }
        else Hub.toast((r && r.error) || 'Could not update.');
      });
  };

  // RECORD A COUNT YOURSELF — the control that did not exist on 2026-08-03, when Pompano's count
  // arrived as a text message and there was no way to enter it, so the day went unbilled.
  //
  // Sends NO text to the client. This is you correcting your own books, not the office confirming
  // an order — and a "✅ Order confirmed" receipt for something they never submitted would be a
  // confirmation of a thing that did not happen. The reason is required and lands on the
  // append-only audit trail as an 'owner_override' row, so six weeks later the invoice can be
  // explained.
  function overrideBlock(s, aid) {
    return '<details class="aud"><summary>✍️ Record a count yourself</summary>' +
      '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">For a count phoned or texted in, or a day the office could not use the form. No text is sent to the client. Overwrites the day if it already has a count.</div>' +
      '<div class="linkrow"><input id="od_' + s.id + '" type="date" style="flex:1.1">' +
      '<input id="oc_' + s.id + '" type="number" min="0" max="500" placeholder="Lunches" style="flex:.8"></div>' +
      '<div class="linkrow" style="margin-top:6px"><input id="or_' + s.id + '" placeholder="Where it came from — e.g. texted by Roxana" style="flex:1">' +
      '<button onclick="__setCount(\'' + aid + '\',\'' + s.id + '\')">Record</button></div>' +
      '</details>';
  }
  window.__setCount = function (aid, sid) {
    var date = ((document.getElementById('od_' + sid) || {}).value || '').trim();
    var count = ((document.getElementById('oc_' + sid) || {}).value || '').trim();
    var reason = ((document.getElementById('or_' + sid) || {}).value || '').trim();
    if (!date) { Hub.toast('Pick the service date.'); return; }
    if (count === '') { Hub.toast('Enter the head count.'); return; }
    if (!reason) { Hub.toast('Say where the count came from — it goes on the record.'); return; }
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'set_headcount', site_id: sid, service_date: date, headcount: Number(count), reason: reason } })
      .then(function (r) {
        Hub.toast(r && r.ok ? 'Recorded ' + r.headcount + ' for ' + r.service_date + ' — no text sent.' : (r && r.error) || 'Could not record.');
        if (r && r.ok) render();
      });
  };

  function fld(aid, key, label, val) {
    return '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">' + label + '</label>' +
      '<input id="' + key + '_' + aid + '" ' + (key === 'c' ? 'type="time" value="' + val + '"' : 'type="number" step="0.01" min="0" ' + (val ? 'value="' + val + '"' : 'placeholder="' + (key === 'p' ? '10.00' : '25.00') + '"')) +
      ' style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px"></div>';
  }
  function activateForm(acc) {
    var aid = acc.id;
    return '<div class="card" style="border-left:4px solid var(--gold);background:#fff8e9">' +
      '<div class="row-sub" style="margin-bottom:8px">New signup — set the negotiated terms, then activate to turn on their ordering links. (Model: <b>' + esc(acc.billing_model || '') + '</b>)</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        fld(aid, 'p', '$ / lunch') + fld(aid, 'f', '$ delivery / office') + fld(aid, 'r', '$ rush fee', '15.00') + fld(aid, 'c', 'Cut-off (ET)', '09:00') +
      '</div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__activate(\'' + aid + '\')">Activate account</button></div>';
  }
  window.__activate = function (aid) {
    var price = Math.round((parseFloat((document.getElementById('p_' + aid) || {}).value) || 0) * 100);
    var fee = Math.round((parseFloat((document.getElementById('f_' + aid) || {}).value) || 0) * 100);
    var rush = Math.round((parseFloat((document.getElementById('r_' + aid) || {}).value) || 0) * 100);
    var cutoff = (document.getElementById('c_' + aid) || {}).value || '09:00';
    if (price <= 0) { Hub.toast('Set a price per lunch first.'); return; }
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'activate', account_id: aid, price_per_lunch_cents: price, delivery_fee_cents: fee, rush_fee_cents: rush, cutoff_time: cutoff } })
      .then(function (r) { if (r && r.ok) { Hub.toast('Account activated'); render(); } else Hub.toast((r && r.error) || 'Could not activate'); });
  };

  // Who the INVOICE goes to. Without this an account has no billing address, so "Send invoice"
  // fails with "No billing email on this account" and there is nowhere to fix it — and the only
  // people the system can then reach are the site contacts who submit headcounts, who must never
  // be shown pricing. Flagged loudly when missing, because you only discover it at the moment you
  // are trying to get paid.
  function billingBlock(acc) {
    var aid = acc.id;
    var has = !!acc.billing_email;
    return '<div class="card" style="border-left:4px solid ' + (has ? 'var(--green)' : '#d64545') + ';' +
        (has ? '' : 'background:#fdf0ef') + '">' +
      '<div class="row-sub" style="margin-bottom:8px">' +
        (has ? '🧾 Invoices for this account go to <b>' + esc(acc.billing_email) + '</b>'
             : '⚠️ <b>No billing contact.</b> Invoices cannot be sent until you add one — and without it the only people Añejo can reach here are the office staff who count heads, who never see pricing.') +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Billing email</label>' +
          '<input id="be_' + aid + '" type="email" inputmode="email" autocomplete="off" placeholder="ap@company.com" value="' + esc(acc.billing_email || '') + '"' +
          ' style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px"></div>' +
        '<div><label style="font-size:11px;color:var(--green);font-weight:700;display:block;margin-bottom:3px">Billing contact</label>' +
          '<input id="bc_' + aid + '" type="text" autocomplete="off" placeholder="Name (optional)" value="' + esc(acc.billing_contact || '') + '"' +
          ' style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px"></div>' +
      '</div>' +
      // CARD CHECKOUT IS OPT-IN (migrations/0095). Every invoice email used to carry a Square
      // "Pay now" button with no way to turn it off, including for accounts on a signed
      // direct-deposit agreement — which is how DGP-0004 went out on 2026-08-25. Unticked by
      // default, and the label says what ticking it actually does to the client's email rather
      // than naming a column.
      '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:11px;font-size:12.5px;line-height:1.45;cursor:pointer">' +
        '<input type="checkbox" id="card_' + aid + '"' + (acc.allow_card_payment ? ' checked' : '') + ' style="margin-top:2px;flex:0 0 auto">' +
        '<span>Show this client a <b>“Pay now” card button</b> in their invoice emails' +
          '<span class="row-sub" style="display:block">Off by default. Card costs ~2.7% and offers a rail a direct-deposit vendor agreement doesn’t include — tick it only for an account that asked to pay by card.</span>' +
        '</span></label>' +
      '<button class="btn block" style="margin-top:10px" onclick="__setBilling(\'' + aid + '\')">Save billing contact</button></div>';
  }
  window.__setBilling = function (aid) {
    var email = ((document.getElementById('be_' + aid) || {}).value || '').trim();
    var name = ((document.getElementById('bc_' + aid) || {}).value || '').trim();
    var card = !!(document.getElementById('card_' + aid) || {}).checked;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'set_billing', account_id: aid, billing_email: email, billing_contact: name, allow_card_payment: card ? 1 : 0 } })
      .then(function (r) {
        if (r && r.ok) {
          // Say what changed about the CLIENT'S experience, not that a save happened.
          Hub.toast(r.degraded === 'card_payment_column_missing'
            ? 'Saved — but the card setting needs migration 0095'
            : (email ? 'Invoices will go to ' + email + (card ? ' · card button ON' : '') : 'Billing contact cleared'));
          render();
        }
        else Hub.toast((r && r.error) || 'Could not save');
      });
  };

  function invoiceList(invs, aid) {
    if (!invs || !invs.length) return '';
    return '<div style="margin-top:10px"><div class="row-sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Invoices</div>' +
      invs.map(function (v) {
        // paid_at/sent_at only exist once migrations/0046 is applied; until then the status
        // word alone carries the state, exactly as it did before.
        var when = v.paid_at ? ' ' + new Date(v.paid_at).toLocaleDateString()
          : (v.sent_at ? ' ' + new Date(v.sent_at).toLocaleDateString() : '');
        // Void is the "edit" for a wrongly-scoped invoice: not open/sent already-paid money, just
        // release the days so the owner can re-generate the right range. Refused server-side once
        // status is 'paid' (see voidInvoice in contracts.js) — the button just never appears there.
        var canVoid = v.status !== 'paid' && v.status !== 'void';
        // A VOIDED invoice keeps its number and sits in this list next to the live ones. The only
        // thing separating "$1,668 outstanding" from "cancelled document" was the status word at
        // the end of the second line. Disarm it visually: a chip up front, and the amount struck
        // through, so a glance down the column can't read a void row as money owed.
        var isVoid = v.status === 'void';
        var chip = isVoid ? '<span style="display:inline-block;background:#fdf0ef;color:#b3261e;border:1px solid #b3261e;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.8px;padding:1px 5px;margin-right:5px;vertical-align:1px">VOID</span>' : '';
        var strike = isVoid ? 'text-decoration:line-through;' : '';
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px' + (isVoid ? ';opacity:.72' : '') + '">' +
          '<a href="/hub/owner/invoice.html?id=' + esc(v.id) + '" style="flex:1;min-width:0;text-decoration:none;color:var(--ink)">' +
          chip + '🧾 <span style="' + strike + '">' + esc(v.number || v.id) + '</span> <span class="row-sub" style="font-weight:400">' + esc(v.period_from || '') + '–' + esc(v.period_to || '') + '</span><br>' +
          '<span class="row-sub"><span style="' + strike + '">' + money(v.total_cents) + '</span> · ' + (v.status === 'paid' ? '✅ ' : (v.status === 'sent' ? '✉️ ' : (isVoid ? '🚫 ' : ''))) + esc(v.status || '') + esc(when) + '</span></a>' +
          (canVoid ? '<button class="btn ghost" type="button" style="flex:0 0 auto" onclick="__voidInvoice(\'' + esc(aid) + '\',\'' + esc(v.id) + '\')">Void</button>' : '') +
          '</div>';
      }).join('') + '</div>';
  }
  window.__setContact = function (aid, sid) {
    var name = (document.getElementById('cn_' + sid) || {}).value || '';
    var phone = (document.getElementById('cp_' + sid) || {}).value || '';
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'set_contact', account_id: aid, site_id: sid, contact_name: name, contact_phone: phone } })
      .then(function (r) { if (r && r.ok) { Hub.toast('Contact saved'); render(); } else Hub.toast((r && r.error) || 'Could not save'); });
  };

  // Trusted intake devices — who can submit one-tap, with the ability to revoke (forces re-verify).
  function devicesBlock(aid, devices) {
    if (!devices || !devices.length) return '';
    var active = devices.filter(function (d) { return !d.revoked; }).length;
    var rows = devices.map(function (dv) {
      var last = dv.last_used_at ? new Date(dv.last_used_at).toLocaleDateString() : '—';
      return '<div class="dev' + (dv.revoked ? ' rev' : '') + '"><span>📱 ' + esc(dv.contact_name || '—') +
        ' <span class="row-sub">' + esc(dv.phone_hint || '') + ' · last ' + esc(last) + '</span></span>' +
        (dv.revoked ? '<span class="row-sub">revoked</span>' : '<button class="rvk" onclick="__revoke(\'' + aid + '\',\'' + dv.id + '\')">Revoke</button>') + '</div>';
    }).join('');
    return '<details class="aud"><summary>📱 Trusted devices (' + active + ')</summary>' + rows + '</details>';
  }
  window.__revoke = function (aid, did) {
    if (!window.confirm('Revoke this device? They will need to verify again with a code next time.')) return;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'revoke_device', account_id: aid, device_id: did } })
      .then(function (r) { if (r && r.ok) { Hub.toast('Device revoked'); render(); } else Hub.toast('Could not revoke'); });
  };

  // Terms history — who changed the rate, when, and from what. Renders nothing until
  // migrations/0046 (contract_terms_events) is applied, so the desk looks the same as before.
  var TERM_LABEL = { price_per_lunch_cents: '$/lunch', delivery_fee_cents: 'delivery', rush_fee_cents: 'rush', cutoff_time: 'cut-off',
    billing_email: 'invoices to', allow_card_payment: 'card button' };
  // Only these three are cents. The formatter used to treat EVERY audited field as money, so the
  // billing-contact history would have rendered a client's email address as "$0.00".
  var MONEY_KEYS = { price_per_lunch_cents: 1, delivery_fee_cents: 1, rush_fee_cents: 1 };
  function termsHistory(evts, sites) {
    if (!evts || !evts.length) return '';
    var names = {}; (sites || []).forEach(function (s) { names[s.id] = s.name; });
    var rows = evts.map(function (e) {
      var before = {}, after = {};
      try { before = JSON.parse(e.before_json || '{}') || {}; } catch (x) {}
      try { after = JSON.parse(e.after_json || '{}') || {}; } catch (x) {}
      var diffs = e.event === 'menu_price_changed' ? menuPriceDiff(before, after)
        : (e.event === 'menu_updated' ? menuDiff(before, after)
        : Object.keys(after).map(function (k) {
        var fmt = function (v) {
          if (MONEY_KEYS[k]) return '$' + ((Number(v) || 0) / 100).toFixed(2);
          if (k === 'allow_card_payment') return Number(v) ? 'on' : 'off';
          return v === null || v === undefined || v === '' ? '—' : String(v);
        };
        var was = before[k];
        return (TERM_LABEL[k] || k) + ' ' + (was === undefined || was === null ? '' : fmt(was) + ' → ') + fmt(after[k]);
      }).join(' · '));
      var when = e.created_at ? new Date(e.created_at).toLocaleDateString() : '';
      return '<div class="evrow"><span>' + esc(names[e.site_id] || e.site_id || 'all sites') + ' · <b>' + esc(e.event) + '</b> ' +
        '<span class="row-sub">' + esc(diffs) + (e.note ? ' — ' + esc(e.note) : '') + '</span></span>' +
        '<span class="row-sub">' + esc(e.changed_by || '') + ' · ' + esc(when) + '</span></div>';
    }).join('');
    return '<details class="aud"><summary>✏️ Terms history (' + evts.length + ')</summary>' + rows + '</details>';
  }

  // Append-only audit trail — the non-repudiation record you can show a client.
  function auditBlock(events) {
    if (!events || !events.length) return '';
    var rows = events.slice(0, 40).map(function (e) {
      return '<div class="evrow"><span>' + esc(e.service_date) + ' · <b>' + esc(e.event) + '</b>' +
        (e.headcount != null ? ' ' + esc(e.headcount) + '×' : '') + (e.verified ? ' 🔒' : '') + '</span>' +
        '<span class="row-sub">' + esc(e.submitted_by_name || '') + (e.confirmation_no ? ' · ' + esc(e.confirmation_no) : '') + '</span></div>';
    }).join('');
    return '<details class="aud"><summary>🧾 Audit trail — who submitted what (' + events.length + ')</summary>' + rows + '</details>';
  }

  // ---------- invoice period picker ----------
  // THE FIX: "Generate invoice" used to fire with no from/to at all, so the backend (which has
  // always supported a date range — functions/_lib/contract.js generateInvoice) fell back to
  // billing EVERY un-invoiced day, silently pulling the current week into whatever period was
  // meant to close. This panel makes the range explicit — presets for the common cases (this
  // week, last week, the last two weeks / biweekly) plus a custom picker for anything else, like
  // GDP's Jul 27 – Aug 5 catch-up period, which isn't a clean calendar week at all.
  function iso(d) { return d.toISOString().slice(0, 10); }
  function mondayOf(d) { var x = new Date(d); var day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  var INV_PRESETS = [
    { key: 'this_week', label: 'This week', range: function () { var m = mondayOf(new Date()); return [iso(m), iso(new Date())]; } },
    { key: 'last_week', label: 'Last week', range: function () { var m = addDays(mondayOf(new Date()), -7); return [iso(m), iso(addDays(m, 6))]; } },
    { key: 'biweekly', label: 'Last 2 weeks (biweekly)', range: function () { var m = addDays(mondayOf(new Date()), -14); return [iso(m), iso(addDays(m, 13))]; } },
    { key: 'all', label: 'All un-invoiced', range: function () { return [null, null]; } }
  ];

  function invoiceGenPanel(aid) {
    return '<details class="terms-edit" id="invgen_' + aid + '">' +
      '<summary>🧾 Generate invoice (choose period)</summary><div class="body">' +
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px" id="invp_' + aid + '">' +
        INV_PRESETS.map(function (p) {
          return '<button class="btn ghost" type="button" data-preset="' + p.key + '" onclick="__invPreset(\'' + aid + '\',\'' + p.key + '\')">' + esc(p.label) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="terms-grid">' +
        '<div><label>From</label><input id="invf_' + aid + '" type="date"></div>' +
        '<div><label>To</label><input id="invt_' + aid + '" type="date"></div>' +
      '</div>' +
      '<div class="terms-note" style="font-size:11px;color:var(--muted);margin-top:6px">Pick a preset above, or set From/To yourself for a period like a mid-month catch-up. Only un-invoiced days inside the range are billed — anything already invoiced is skipped, never double-billed.</div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__invoice(\'' + aid + '\')">Generate invoice for this period</button>' +
      '</div></details>';
  }

  window.__invPreset = function (aid, key) {
    var p = INV_PRESETS.filter(function (x) { return x.key === key; })[0];
    if (!p) return;
    var r = p.range();
    var f = document.getElementById('invf_' + aid), t = document.getElementById('invt_' + aid);
    if (f) f.value = r[0] || '';
    if (t) t.value = r[1] || '';
    var wrap = document.getElementById('invp_' + aid);
    if (wrap) wrap.querySelectorAll('[data-preset]').forEach(function (b) {
      b.className = 'btn ' + (b.getAttribute('data-preset') === key ? 'gold' : 'ghost');
    });
  };

  window.__invoice = function (aid) {
    var f = (document.getElementById('invf_' + aid) || {}).value || '';
    var t = (document.getElementById('invt_' + aid) || {}).value || '';
    if ((f && !t) || (!f && t)) { Hub.toast('Set both From and To, or leave both blank for all un-invoiced days.'); return; }
    if (f && t && f > t) { Hub.toast('From must be before To.'); return; }
    var msg = f ? ('Generate an invoice for ' + f + ' – ' + t + '? Un-invoiced days in that range will be marked invoiced.')
      : 'Generate an invoice for ALL un-invoiced days for this account? Those days will be marked invoiced.';
    if (!window.confirm(msg)) return;
    var body = { op: 'invoice', account_id: aid };
    if (f) { body.from = f; body.to = t; }
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: body }).then(function (r) {
      if (r && r.ok) { Hub.toast('Invoice ' + r.number + ' created'); location.href = '/hub/owner/invoice.html?id=' + r.invoice_id; }
      else Hub.toast((r && r.error) || 'Could not generate invoice');
    });
  };

  // Correcting a wrongly-scoped invoice: void it, which releases its days back to un-invoiced
  // (functions/api/hub/owner/contracts.js voidInvoice), then re-generate with the right range
  // above. A paid invoice refuses here server-side — money already moved, so that needs a credit,
  // not a silent un-bill.
  window.__voidInvoice = function (aid, invId) {
    if (!window.confirm('Void this invoice? Its days go back to un-invoiced so you can re-generate the correct period. This cannot be used on a paid invoice.')) return;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'void_invoice', account_id: aid, invoice_id: invId } }).then(function (r) {
      if (r && r.ok) { Hub.toast('Invoice voided — its days are un-invoiced again'); render(); }
      else Hub.toast((r && r.error) || 'Could not void that invoice');
    });
  };

  // HOLIDAYS. One section for every account: what is coming, which locations a notice cannot reach
  // BEFORE the day rather than after it, which holidays the kitchen is closed, and what came back.
  // An answer texted to us is only useful if it can be seen here without reading the inbox.
  function holidaysBlock(h) {
    if (!h) return '';
    var closed = (h.settings && h.settings.kitchen_closed) || [];
    var day = function (iso) {
      return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
    };

    var gaps = (h.sites || []).filter(function (x) { return x.email !== 'site' || x.sms !== 'ok'; });
    var reach = gaps.length
      ? '<div class="card" style="border-left:3px solid var(--gold);margin-bottom:8px"><b>Fix before the next holiday</b>' + gaps.map(function (x) {
          var bits = [];
          if (x.email === 'billing_fallback') bits.push('email goes to the billing inbox — add an ops email on the location');
          if (x.email === 'none') bits.push('no email address at all');
          if (x.sms === 'none') bits.push('nobody on the roster can be texted');
          return '<div class="row-sub">' + esc(x.account_name + ' · ' + x.site_name) + ' — ' + esc(bits.join('; ')) + '</div>';
        }).join('') + '</div>'
      : '<div class="row-sub" style="margin-bottom:8px">Every location can be reached by email and by text.</div>';

    var upcoming = (h.holidays || []).slice(0, 6).map(function (x) {
      return '<div class="row-sub">' + esc(day(x.observed)) + ' · ' + esc(x.name) + (x.shifted ? ' <span style="color:var(--muted)">(observed)</span>' : '') + ' — ' +
        (x.kitchen_closed ? '<span class="badge warn">kitchen closed</span>' : '<span class="badge">we ask if they are open</span>') + '</div>';
    }).join('') || '<div class="row-sub">No federal holiday in the next 90 days.</div>';

    var checks = (h.catalog || []).map(function (c) {
      return '<label class="livetoggle"><input type="checkbox" class="hol-closed" value="' + esc(c.key) + '"' + (closed.indexOf(c.key) >= 0 ? ' checked' : '') + '><span>' + esc(c.name) + '</span></label>';
    }).join('');
    var smsOn = !(h.settings && h.settings.sms_enabled === false);

    var rows = (h.notices || []).map(function (n) {
      var answer = n.reply_answer ? '<b>' + esc(n.reply_answer.toUpperCase()) + '</b>' + (n.reply_text ? '<br><span class="row-sub">“' + esc(n.reply_text) + '”</span>' : '')
        : (n.reply_text ? '“' + esc(n.reply_text) + '”' : '<span class="row-sub">—</span>');
      var status = n.outcome === 'sent' && !n.sent_at ? 'interrupted' : n.outcome;
      return '<tr style="border-top:1px solid var(--line,#e3ddcf)">' +
        '<td style="padding:6px 8px 6px 0">' + esc(day(n.observed_date)) + '<br><span class="row-sub">' + esc(n.holiday_name) + '</span></td>' +
        '<td style="padding:6px 8px">' + esc(n.site_name || '') + '</td>' +
        '<td style="padding:6px 8px">' + esc(n.channel === 'sms' ? 'text' : 'email') + '<br><span class="row-sub">' + esc(n.recipient_phone || n.recipient_email || '') + '</span></td>' +
        '<td style="padding:6px 8px">' + esc(status) + (n.failure_reason ? '<br><span class="row-sub">' + esc(n.failure_reason) + '</span>' : '') + '</td>' +
        '<td style="padding:6px 0 6px 8px">' + answer + '</td></tr>';
    }).join('');

    return '<div class="hub-section"><h2>🗓️ Holidays</h2>' +
      '<div class="row-sub" style="margin-bottom:8px">Before every federal holiday we ask each location whether they are open. If our kitchen is closed, they hear it at least 7 days ahead.</div>' +
      reach +
      '<div class="terms-head">Coming up</div>' + upcoming +
      '<details class="terms-edit"' + (closed.length ? '' : ' open') + '><summary>Which holidays is our kitchen closed?</summary><div class="body">' +
        (closed.length ? '' : '<div class="row-sub" style="margin-bottom:6px">None chosen yet — until you choose, no closure notice is ever sent.</div>') +
        checks +
        '<label class="livetoggle" style="margin-top:6px"><input type="checkbox" id="hol-sms"' + (smsOn ? ' checked' : '') + '><span>Also text each location’s primary contact (English and Spanish)</span></label>' +
        '<button class="btn gold block" style="margin-top:10px" onclick="__saveHolidays()">Save holiday settings</button>' +
      '</div></details>' +
      (rows ? '<details class="terms-edit"><summary>Notices sent and what they answered</summary><div class="body"><div style="overflow-x:auto">' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>' +
        '<th align="left" style="padding:0 8px 6px 0">Day</th><th align="left" style="padding:0 8px 6px">Location</th><th align="left" style="padding:0 8px 6px">By</th><th align="left" style="padding:0 8px 6px">Status</th><th align="left" style="padding:0 0 6px 8px">Their answer</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div></div></details>' : '') +
      '</div>';
  }

  window.__saveHolidays = function () {
    var keys = Array.prototype.map.call(document.querySelectorAll('.hol-closed:checked'), function (el) { return el.value; });
    var sms = !!(document.getElementById('hol-sms') || {}).checked;
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'save_holidays', kitchen_closed: keys, sms_enabled: sms } }).then(function (r) {
      if (r && r.ok) {
        // A closure too close to keep the seven-day promise must be seen, not buried in a toast.
        if (r.warnings && r.warnings.length) window.alert(r.warnings.join('\n\n'));
        else Hub.toast('Holiday settings saved');
        render();
      } else Hub.toast((r && r.error) || 'Could not save holiday settings');
    });
  };

  // ---------- WEEKLY MENU ----------
  // The dishes, how many weeks they rotate, the Monday week 1 starts and any per-dish price are the
  // owner's decisions — this panel only records them. An empty day stays off the menu: its orders
  // keep the plain "<Account> Lunch — <Day>" name and the location's own price, exactly as before.
  // A per-dish price overrides the location's price for that day's orders, and is audited in Terms
  // history like any other rate. Offices never see a price; their page shows the dish name only.
  var MENU = {};   // account_id → the last menu payload the server sent
  var DOWL = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function menuPriceDiff(before, after) {
    var f = function (v) { return v === null || v === undefined ? 'location price' : '$' + (Number(v) / 100).toFixed(2); };
    return Object.keys(after).map(function (k) { return k + ' price ' + f(before[k]) + ' → ' + f(after[k]); }).join(' · ');
  }
  function menuDiff(before, after) {
    var bits = [];
    if (after.rotation_weeks !== undefined) bits.push('weeks ' + (before.rotation_weeks == null ? '' : before.rotation_weeks + ' → ') + after.rotation_weeks);
    if (after.rotation_start_date !== undefined) bits.push('week 1 starts ' + (before.rotation_start_date ? before.rotation_start_date + ' → ' : '') + after.rotation_start_date);
    Object.keys(after.slots || {}).forEach(function (k) {
      var was = (before.slots || {})[k], is = after.slots[k];
      bits.push(k + ' ' + (was ? was.item_name + ' → ' : '') + (is ? is.item_name : 'cleared'));
    });
    return bits.join(' · ');
  }

  // Same arithmetic as rotationWeekFor in functions/_lib/contract.js, so the labels move as the
  // owner changes the week count or the start date, before saving.
  function rotWeek(dateIso, startIso, weeks) {
    var d = Math.round((Date.parse(dateIso + 'T12:00:00Z') - Date.parse(startIso + 'T12:00:00Z')) / 86400000);
    if (!(d >= 0)) return 1;
    return (Math.floor(d / 7) % Math.max(1, weeks)) + 1;
  }
  function shortDate(iso) {
    return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function menuBlock(aid) {
    return '<details class="terms-edit" id="menubox_' + aid + '" ontoggle="__menuToggle(\'' + aid + '\', this)">' +
      '<summary>🍽️ Weekly menu &amp; per-dish prices</summary>' +
      '<div class="body" id="menubody_' + aid + '"><div class="row-sub">Loading the menu…</div></div></details>';
  }
  window.__menuToggle = function (aid, el) { if (el.open && !MENU[aid]) loadMenu(aid); };

  function loadMenu(aid) {
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'menu_get', account_id: aid } }).then(function (r) {
      var body = document.getElementById('menubody_' + aid);
      if (!body) return;
      if (!r || !r.ok) { body.innerHTML = '<div class="row-sub">' + esc((r && r.error) || 'Could not load the menu.') + '</div>'; return; }
      MENU[aid] = r;
      drawMenu(aid, null);
    });
  }

  // What is typed on screen right now, keyed "week:dow", so changing the week count redraws the grid
  // without throwing away anything the owner has entered.
  function menuDraft(aid) {
    var out = {};
    for (var w = 1; w <= 8; w++) for (var d = 1; d <= 7; d++) {
      var n = document.getElementById('mn_' + aid + '_' + w + '_' + d);
      if (!n) continue;
      out[w + ':' + d] = {
        item_name: n.value, item_name_es: document.getElementById('me_' + aid + '_' + w + '_' + d).value,
        notes: document.getElementById('mo_' + aid + '_' + w + '_' + d).value, price: document.getElementById('mp_' + aid + '_' + w + '_' + d).value,
      };
    }
    return out;
  }

  function drawMenu(aid, draft) {
    var m = MENU[aid], body = document.getElementById('menubody_' + aid);
    if (!m || !body) return;
    var weeksEl = document.getElementById('mw_' + aid), startEl = document.getElementById('ms_' + aid);
    var weeks = weeksEl ? Number(weeksEl.value) : m.weeks;
    var start = (startEl && startEl.value) || m.rotation_start_date || m.effective_start;
    if (!draft) {
      draft = {};
      (m.rows || []).forEach(function (r) {
        draft[r.rotation_week + ':' + r.dow] = { item_name: r.item_name || '', item_name_es: r.item_name_es || '', notes: r.notes || '',
          price: r.price_per_lunch_cents == null ? '' : dollars(r.price_per_lunch_cents) };
      });
    }
    // Delivery days on the account, plus any day that already has a dish — a location that stopped
    // delivering on a day must not make that day's dish vanish unseen on the next save.
    var dows = (m.dows || []).slice();
    (m.rows || []).forEach(function (r) { if (dows.indexOf(r.dow) < 0) dows.push(r.dow); });
    dows.sort();

    var thisWk = rotWeek(m.this_monday, start, weeks), nextWk = rotWeek(m.next_monday, start, weeks);
    var opts = ''; for (var i = 1; i <= (m.max_weeks || 8); i++) opts += '<option value="' + i + '"' + (i === weeks ? ' selected' : '') + '>' + i + (i === 1 ? ' week (same every week)' : ' weeks') + '</option>';

    var grid = '';
    if (!dows.length) grid = '<div class="row-sub">No location on this account has delivery days yet — set them with ✏️ Edit terms first.</div>';
    for (var w = 1; w <= weeks && dows.length; w++) {
      grid += '<div class="terms-head">Week ' + w +
        (w === thisWk ? ' <span class="pill now">this week</span>' : '') + (w === nextWk && nextWk !== thisWk ? ' <span class="pill gold">next week</span>' : '') + '</div>';
      dows.forEach(function (d) {
        var v = draft[w + ':' + d] || {};
        var k = aid + '_' + w + '_' + d;
        grid += '<div class="menurow"><div class="mday">' + DOWL[d - 1] + '</div>' +
          '<input id="mn_' + k + '" maxlength="80" placeholder="Dish name" value="' + esc(v.item_name || '') + '">' +
          '<input id="me_' + k + '" maxlength="80" placeholder="Spanish name (optional)" value="' + esc(v.item_name_es || '') + '">' +
          '<input id="mo_' + k + '" maxlength="200" placeholder="Notes — allergens, sides (optional)" value="' + esc(v.notes || '') + '">' +
          '<input id="mp_' + k + '" type="number" step="0.01" min="0" placeholder="$ location" title="Leave blank to charge the location\'s price per lunch" value="' + esc(v.price || '') + '">' +
          '</div>';
      });
    }

    var prev = (m.preview || []).map(function (p) {
      var rows = (p.days || []).map(function (x) {
        return '<tr><td>' + esc(shortDate(x.date)) + '<br><span class="row-sub">week ' + x.week + '</span></td>' +
          '<td>' + (x.dish_set ? esc(x.dish) + (x.dish_es ? '<br><span class="row-sub">' + esc(x.dish_es) + '</span>' : '') : '<span class="row-sub">' + esc(x.dish) + ' (no dish set)</span>') + '</td>' +
          '<td>' + money(x.price_per_lunch_cents) + '<br><span class="row-sub">' + (x.price_source === 'menu' ? 'dish price' : (x.price_source === 'quoted' ? 'already counted' : 'location price')) + '</span></td>' +
          '<td>' + (x.kitchen_closed ? '<span class="badge warn">kitchen closed</span><br><span class="row-sub">' + esc(x.kitchen_closed) + '</span>' : '—') + '</td></tr>';
      }).join('') || '<tr><td colspan="4" class="row-sub">No delivery days in the next two weeks.</td></tr>';
      return '<div class="terms-head">' + esc(p.site_name) + ' — next 2 weeks</div><div class="menuprev"><table>' +
        '<tr><th>Date</th><th>Dish</th><th>$ / lunch</th><th>Kitchen</th></tr>' + rows + '</table></div>';
    }).join('');

    body.innerHTML =
      '<div class="row-sub" style="margin-bottom:8px">This week (from ' + esc(shortDate(m.this_monday)) + ') is <b>week ' + thisWk + '</b>; next week (from ' + esc(shortDate(m.next_monday)) + ') is <b>week ' + nextWk + '</b>. The week changes every Monday.</div>' +
      '<div class="menuctl">' +
        '<div><label>Rotation</label><select id="mw_' + aid + '" onchange="__menuRedraw(\'' + aid + '\')">' + opts + '</select></div>' +
        '<div><label>Week 1 starts (a Monday)</label><input id="ms_' + aid + '" type="date" value="' + esc(start) + '" onchange="__menuRedraw(\'' + aid + '\')"></div>' +
      '</div>' +
      grid +
      '<div style="font-size:11px;color:var(--muted);margin-top:8px">Leave a day blank to keep it off the menu. Leave the price blank to charge the location\'s price per lunch. A dish price applies from the next head count on — days already counted keep the price they were quoted. Offices see the dish name, never a price.</div>' +
      '<div class="terms-note"><input id="mnote_' + aid + '" placeholder="Note (optional) — goes on Terms history"></div>' +
      '<button class="btn gold block" style="margin-top:10px" onclick="__menuSave(\'' + aid + '\')">Save weekly menu</button>' +
      (prev ? '<div style="margin-top:14px">' + prev + '</div>' : '');
  }
  window.__menuRedraw = function (aid) { drawMenu(aid, menuDraft(aid)); };

  window.__menuSave = function (aid) {
    var m = MENU[aid]; if (!m) return;
    var weeks = Number((document.getElementById('mw_' + aid) || {}).value) || 1;
    var start = ((document.getElementById('ms_' + aid) || {}).value || '').trim();
    if (start && new Date(start + 'T12:00:00Z').getUTCDay() !== 1) { Hub.toast('Week 1 has to start on a Monday.'); return; }
    var draft = menuDraft(aid), rows = [], bad = null, priceChanges = 0;
    var was = {}; (m.rows || []).forEach(function (r) { was[r.rotation_week + ':' + r.dow] = r; });
    Object.keys(draft).forEach(function (key) {
      var p = key.split(':'), w = Number(p[0]), d = Number(p[1]), v = draft[key];
      if (w > weeks) return;
      var name = v.item_name.trim(), es = v.item_name_es.trim(), notes = v.notes.trim(), price = String(v.price).trim();
      if (!name && !es && !notes && !price) return;
      if (!name) { bad = bad || 'Week ' + w + ' ' + DOWL[d - 1] + ': give the dish a name, or clear the whole day.'; return; }
      var cents = price === '' ? null : Math.round(parseFloat(price) * 100);
      if (cents !== null && !(cents > 0)) { bad = bad || 'Week ' + w + ' ' + DOWL[d - 1] + ': a dish price must be more than $0 (or blank).'; return; }
      var prior = was[key] ? was[key].price_per_lunch_cents : null;
      if ((prior == null ? null : Number(prior)) !== cents) priceChanges++;
      rows.push({ rotation_week: w, dow: d, item_name: name, item_name_es: es, notes: notes, price_per_lunch_cents: cents });
    });
    if (bad) { Hub.toast(bad); return; }
    // A priced day that is cleared, or sits in a week being removed, is a price change too: its
    // orders go back to the location's price.
    (m.rows || []).forEach(function (r) {
      if (r.price_per_lunch_cents == null) return;
      var kept = rows.some(function (x) { return x.rotation_week === r.rotation_week && x.dow === r.dow; });
      if (!kept) priceChanges++;
    });
    var dropped = (m.rows || []).filter(function (r) { return r.rotation_week > weeks; }).length;
    if (dropped && !window.confirm('Weeks after week ' + weeks + ' have ' + dropped + ' dish(es). Saving removes them. Continue?')) return;
    if (priceChanges && !window.confirm(priceChanges + ' dish price(s) change. Orders from the next head count on are billed at the new price. Save?')) return;
    var note = ((document.getElementById('mnote_' + aid) || {}).value || '').trim();
    Hub.api('/api/hub/owner/contracts', { method: 'POST', body: { op: 'menu_save', account_id: aid, weeks: weeks, rotation_start_date: start, rows: rows, note: note } })
      .then(function (r) {
        if (r && r.ok) {
          MENU[aid] = r;
          var ms = document.getElementById('mw_' + aid); if (ms) ms.value = String(r.weeks);
          var st = document.getElementById('ms_' + aid); if (st) st.value = r.rotation_start_date || '';
          drawMenu(aid, null);
          Hub.toast(r.degraded ? 'Menu saved (history unavailable — migration pending)' : (r.slots_changed || r.prices_changed ? 'Menu saved' : 'Menu saved — nothing had changed'));
        } else Hub.toast((r && r.error) || 'Could not save the menu');
      });
  };

  function render() {
    MENU = {};   // every card is redrawn closed; the menu reloads fresh when it is opened again
    Owner.get('/api/hub/owner/contracts').then(function (d) {
      var root = document.getElementById('owner-root'); root.className = '';
      var head = '<div class="hub-section"><a class="btn ghost block" href="/hub/owner/pricing.html" style="text-align:center;text-decoration:none">📊 Pricing &amp; margin model</a></div>' +
        newAccountForm() + holidaysBlock(d && d.holidays);
      // The empty state used to be a dead end: "No contract accounts yet." with no way to add one,
      // so the first B2B client could only be created from the public signup form.
      if (!d || !d.ok || !d.accounts || !d.accounts.length) {
        root.innerHTML = head + '<div class="card"><p class="row-sub">No contract accounts yet — onboard one above.</p></div>';
        if (window.AnejoI18n) window.AnejoI18n.refresh();
        return;
      }
      // Every site keyed by id, so the edit form can diff against what is actually stored rather
      // than re-sending fields the owner never touched.
      SITES = {};
      d.accounts.forEach(function (a) { (a.sites || []).forEach(function (s) { SITES[s.id] = s; }); });
      // Pending signups first (they need terms + activation).
      var accts = d.accounts.slice().sort(function (a, b) { return (a.account.status === 'pending' ? 0 : 1) - (b.account.status === 'pending' ? 0 : 1); });
      root.innerHTML = head + accts.map(function (a) {
        var acc = a.account;
        var pending = acc.status === 'pending';
        var badge = pending ? '<span class="badge warn">pending</span>' : (acc.status === 'active' ? '<span class="badge ok">active</span>' : '<span class="badge">' + esc(acc.status || '') + '</span>');
        var unbilled = (a.recent || []).filter(function (r) { return !r.invoiced; }).reduce(function (s, r) { return s + (r.total_cents || 0); }, 0);
        return '<div class="hub-section"><h2>🏢 ' + esc(acc.name) + ' ' + badge + ' <span class="row-sub" style="font-weight:400">· ' + esc(acc.billing_model || acc.invoice_cadence || '') + (acc.billing_email ? ' · ' + esc(acc.billing_email) : '') + '</span></h2>' +
          (pending ? activateForm(acc) : billingBlock(acc)) +
          a.sites.map(function (s) { return siteCard(s, a.recent, acc.id, pending); }).join('') +
          addSiteForm(acc.id) +
          menuBlock(acc.id) +
          (pending ? '' :
            devicesBlock(acc.id, a.devices) +
            termsHistory(a.terms_events, a.sites) +
            auditBlock(a.events) +
            '<div class="acct-total"><span>Unbilled this period</span><span>' + money(unbilled) + '</span></div>' +
            (unbilled > 0 ? invoiceGenPanel(acc.id) : '') +
            invoiceList(a.invoices, acc.id)
          ) + '</div>';
      }).join('');
      if (window.AnejoI18n) window.AnejoI18n.refresh();
    });
  }

  // Contract accounts are B2B customers and are reached from the Customers desk — highlight that tab.
  Owner.init('customers', render);
})();
</script>
