  var queueFilter = 'drafts';
  function matchesQueue(status, filter) {
    return filter === 'all' || (filter === 'drafts' && status === 'draft') ||
      (filter === 'scheduled' && status === 'scheduled') ||
      (filter === 'attention' && (status === 'failed' || status === 'publishing')) ||
      (filter === 'live' && status === 'published');
  }
  window.MarketingTabs.filterQueue = function (filter, postId) {
    if (!['drafts', 'scheduled', 'attention', 'live', 'all'].includes(filter)) filter = 'drafts';
    queueFilter = filter;
    var cards = Array.from(document.querySelectorAll('[data-queue-card]'));
    var shown = 0, target = null;
    cards.forEach(function (card) {
      card.hidden = !matchesQueue(card.getAttribute('data-queue-status'), filter);
      if (!card.hidden) { shown++; if (card.getAttribute('data-queue-card') === postId) target = card; }
    });
    document.querySelectorAll('[data-queue-filter]').forEach(function (button) {
      var selected = button.getAttribute('data-queue-filter') === filter;
      button.setAttribute('aria-pressed', String(selected)); button.classList.toggle('sel', selected);
    });
    var count = document.getElementById('queue-count'), empty = document.getElementById('queue-empty');
    if (count) count.textContent = shown + ' / ' + cards.length + ' loaded posts · publicaciones cargadas';
    if (empty) empty.hidden = shown > 0;
    if (postId) {
      var focus = target || document.getElementById('post-queue-title');
      if (focus) { focus.scrollIntoView({ block: 'start' }); focus.focus({ preventScroll: true }); }
    }
  };
  window.MarketingTabs.routeQueue = function () {
    var params = new URLSearchParams((location.hash || '').split('?')[1] || '');
    window.MarketingTabs.filterQueue(params.get('filter') || queueFilter, params.get('post'));
  };

  // datetime-local wants LOCAL parts. toISOString() here would shift by the timezone offset and
  // show a post scheduled for 11am as 7am.
  function localValue(ms) {
    var d = new Date(Number(ms)); function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }

  // One file-picker path for phone and desktop: read the file in the browser, ship it as a data
  // URL, get back the R2 key. The server re-checks the magic bytes — this accept filter is a
  // convenience, not the gate.
  function uploadFile(file, cb) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { Hub.toast('Too large — 5MB max. Export a smaller JPEG.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      Hub.toast('Uploading…');
      Hub.api('/api/hub/owner/marketing-library', { method: 'POST', body: { data_url: String(rd.result || ''), name:file.name, folder:'', tags:[] } })
        .then(function (r) {
          if (r && r.ok && r.photo) cb(r.photo.media_key,r.photo);
          else Hub.toast((r && r.error) || 'Upload failed');
        });
    };
    rd.onerror = function () { Hub.toast('Could not read that file.'); };
    rd.readAsDataURL(file);
  }

  function op(body, okMsg) {
    return Hub.api('/api/hub/owner/social', { method:'POST', body: body }).then(function (r) {
      if (r && r.ok) { Hub.toast(okMsg); load(); } else Hub.toast((r && r.error) || 'Could not do that');
      return r;
    });
  }

  function approvalCaption(pid) {
    var post = (DATA.posts || []).find(function (p) { return p.id === pid; });
    var field = document.getElementById('cap_' + pid);
    return { caption: field ? field.value : ((post && post.caption) || ''), expected_caption: (post && post.caption) || '' };
  }

  function wire() {
    document.querySelectorAll('[data-library-post]').forEach(function(b){b.onclick=function(){chooseLibrary(function(photo){return attachLibraryPhoto(b.getAttribute('data-library-post'),photo);});};});
    var lib=document.getElementById('mlibrary'); if(lib)lib.onclick=window.MarketingTabs.chooseLibraryPhoto;
    var polish=document.getElementById('mpolish'); if(polish){polish.hidden=!(DATA._pickedPhoto&&!DATA._pickedPhoto.source_key&&!DATA._pickedPhoto.ai_enhanced&&DATA._pickedPhoto.media_key.startsWith('marketing-library/'));polish.onclick=function(){MarketingPhotoEnhance.open({photo:DATA._pickedPhoto,onUse:setComposerPhoto});};}
    document.querySelectorAll('[data-audit]').forEach(function(b){
      b.onclick=function(){
        var pid=b.getAttribute('data-audit'), visible=approvalCaption(pid);
        if(visible.caption!==visible.expected_caption){Hub.toast('Save your caption changes before auditing');return;}
        b.disabled=true;
        op({op:'audit',id:pid,expected_caption:visible.caption},'Saved-source review recorded — inspect the findings; no live post was changed')
          .finally(function(){b.disabled=false;});
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-editcap]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-editcap');
        op(Object.assign({ op: 'edit', id: pid }, approvalCaption(pid)), 'Caption saved as draft — review before scheduling');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-upload]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-upload');
        var fi = document.getElementById('file_' + pid);
        if (!fi) return;
        fi.onchange = function () {
          uploadFile(fi.files && fi.files[0], function (key) {
            attachLibraryPhoto(pid,{media_key:key}).catch(function(e){Hub.toast(e.message);});
          });
        };
        fi.click();
      });
    });
    // Generating an image is a 15-20s round trip through an external provider AND it costs money
    // against the weekly AI ceiling. So the button disables ITSELF before the call, not after the
    // response: without that, an owner who sees nothing happen clicks three times and pays three
    // times for three covers. It stays disabled through load() re-rendering the page.
    Array.prototype.forEach.call(document.querySelectorAll('[data-genc]'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        b.disabled = true;
        b.textContent = '🍽️ Generating a food photo…';
        op({ op: 'generate_cover', id: b.getAttribute('data-genc') }, 'Food photo added as slide 1 — still a draft, replace it with a real photo when you have one')
          .then(function (r) {
            // Only re-enable on failure; on success load() has already replaced this card.
            if (!r || !r.ok) { b.disabled = false; b.textContent = '🍽️ Generate a food photo'; }
          })
          .catch(function () { b.disabled = false; b.textContent = '🍽️ Generate a food photo'; });
      });
    });
    wireBranding();
    wireCarousel();
    wireReferenceVariant();
    wirePromptImage();
    Array.prototype.forEach.call(document.querySelectorAll('[data-detach]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-detach').split('|');
        op({ op: 'detach', id: parts[0], media_id: parts[1] }, 'Photo removed');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvl]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvl').split('|');
        moveSlide(parts[0], parts[1], -1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvr]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvr').split('|');
        moveSlide(parts[0], parts[1], 1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-attach]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-attach');
        var v = ((document.getElementById('mk_' + pid) || {}).value || '').trim();
        if (!v) { Hub.toast('Paste the image key first.'); return; }
        op({ op:'attach', id:pid, media_key:v }, 'Image attached');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sched]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-sched');
        var raw = ((document.getElementById('wh_' + pid) || {}).value || '');
        var when = raw ? Date.parse(raw) : NaN;
        if (!Number.isFinite(when)) { Hub.toast('Pick a date and time.'); return; }
        if (!window.confirm('Schedule this to post automatically at ' + whenLabel(when) + '?\n\nIt goes on the public profile without asking again.')) return;
        op(Object.assign({ op:'schedule', id:pid, scheduled_at:when }, approvalCaption(pid)), 'Scheduled');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-unsched]'), function (b) {
      b.addEventListener('click', function () { op({ op:'unschedule', id:b.getAttribute('data-unsched') }, 'Back to draft'); });
    });
    var teSave = document.getElementById('te_save');
    if (teSave) teSave.addEventListener('click', function () {
      var raw = (document.getElementById('te_date') || {}).value || '';
      if (!raw) { Hub.toast('Pick a date first.'); return; }
      // Parsed as local midnight, same as every other date-only field in the HUB — the exact
      // hour does not matter for a warning measured in days.
      var at = Date.parse(raw + 'T00:00:00');
      if (!Number.isFinite(at)) { Hub.toast('That date did not parse.'); return; }
      op({ op:'set_token_expiry', expires_at: at }, 'Expiry recorded');
    });
    var teClear = document.getElementById('te_clear');
    if (teClear) teClear.addEventListener('click', function () {
      if (!window.confirm('Clear the recorded expiry date? The HUB will show it as unknown until you record it again.')) return;
      op({ op:'set_token_expiry', expires_at: null }, 'Cleared');
    });

    var mtypesel = document.getElementById('mtypesel');
    if (mtypesel) mtypesel.addEventListener('change', function () {
      DATA._draftType = mtypesel.value;
      renderKeepingFields();
    });

    var manualKey=document.getElementById('mkey');if(manualKey)manualKey.addEventListener('change',function(){setComposerPhoto({media_key:manualKey.value.trim(),url:'/api/hub/media/'+manualKey.value.trim(),name:'Selected media',ai_enhanced:true});});
    var mpick = document.getElementById('mpick');
    if (mpick) mpick.addEventListener('click', function () {
      var fi = document.getElementById('mfile');
      if (!fi) return;
      fi.onchange = function () {
        uploadFile(fi.files && fi.files[0], function (key,photo) {
          setComposerPhoto(photo);
          Hub.toast('Photo saved in your shared library.');
        });
      };
      fi.click();
    });

    var genBtn = document.getElementById('genimg');
    if (genBtn) genBtn.addEventListener('click', function () {
      if (genBtn.disabled) return;
      var val = ((document.getElementById('genprompt') || {}).value || '').trim();
      if (!val) { Hub.toast('Describe the photo first.'); return; }
      DATA._genPrompt = val;
      // A 20-90s provider call that looks like nothing happened gets clicked twice and charged
      // twice against the weekly AI budget — self-disable BEFORE the call, same as every other
      // generate button in this tab (generate_cover's own repair button, the carousel tool, the
      // reference-variant tool).
      genBtn.disabled = true; genBtn.textContent = 'Generating…';
      // Shape the render to the surface it is being made for, from the media type already chosen
      // right above this control. A Reel or Story is 9:16 and a square render there gets dead
      // pillarbox bars; a FEED post is the opposite — Instagram's tallest feed ratio is 4:5, and
      // portrait is 2:3, so a tall render on a feed post gets cropped by Instagram instead.
      var mtSel = document.getElementById('mtypesel');
      var mtVal = mtSel ? mtSel.value : '';
      var aspect = (mtVal === 'REELS' || mtVal === 'STORIES') ? 'portrait' : 'square';
      Hub.api('/api/hub/owner/social', { method: 'POST', body: { op: 'generate_cover', prompt: val, aspect: aspect } })
        .then(function (r) {
          genBtn.disabled = false; genBtn.textContent = 'Generate';
          if (!r || !r.ok || !r.media_key) { Hub.toast((r && r.error) || 'Could not generate an image'); return; }
          DATA._genPreview = { key: r.media_key, provider: r.provider };
          render();
        })
        .catch(function () { genBtn.disabled = false; genBtn.textContent = 'Generate'; Hub.toast('Could not generate an image'); });
    });
    var genUse = document.getElementById('genuse');
    if (genUse) genUse.addEventListener('click', function () {
      if (!DATA._genPreview) return;
      // The SAME field the 📷 uploader sets — the composer does not care which source a photo
      // came from, only that one is now picked. Nothing is attached to a real post yet: that only
      // happens when "Save post" below actually creates the draft.
      setComposerPhoto({media_key:DATA._genPreview.key,url:DATA._genPreview.url||('/api/hub/media/'+DATA._genPreview.key),name:'Generated image',ai_enhanced:true});
      DATA._genPreview = null;
      Hub.toast('Photo ready — Save post to use it');
      renderKeepingFields();
    });
    var genDiscard = document.getElementById('gendiscard');
    if (genDiscard) genDiscard.addEventListener('click', function () { DATA._genPreview = null; render(); });

    var captionGenerate = document.getElementById('photo-caption-generate');
    if (captionGenerate) captionGenerate.onclick = async function () {
      var status = document.getElementById('photo-caption-status');
      var preview = document.getElementById('photo-caption-preview');
      captionGenerate.disabled = true; preview.hidden = true; status.textContent = 'Generating preview… / Generando vista previa…';
      try {
        var result = await Hub.api('/api/hub/owner/marketing-caption', { method: 'POST', body: { topic: document.getElementById('photo-topic').value, notes: document.getElementById('photo-notes').value, language: document.getElementById('photo-language').value } });
        if (!result || !result.ok || !result.caption) throw new Error((result && result.error) || 'Could not generate a caption.');
        if (!status.isConnected) return;
        document.getElementById('photo-caption-text').textContent = result.caption;
        preview.hidden = false; status.textContent = 'Preview only. Review food, names and claims. / Vista previa. Revisa comida, nombres y afirmaciones.';
      } catch (error) { status.textContent = error.message; }
      finally { captionGenerate.disabled = false; }
    };
    var captionUse = document.getElementById('photo-caption-use');
    if (captionUse) captionUse.onclick = function () {
      var cap = document.getElementById('cap');
      if (cap.value.trim() && !window.confirm('Replace your current caption with this preview? / ¿Reemplazar tu texto con esta vista previa?')) return;
      cap.value = document.getElementById('photo-caption-text').textContent; cap.focus();
    };

    var save = document.getElementById('save');
    if (save) save.addEventListener('click', function () {
      var key = (document.getElementById('mkey') || {}).value || '';
      var cap = (document.getElementById('cap') || {}).value || '';
      var s = (document.getElementById('sched') || {}).value || '';
      var mtype = (document.getElementById('mtypesel') || {}).value || '';
      if (!key.trim()) { Hub.toast(mtype === 'REELS' ? 'Paste a video key first.' : 'Pick an image first.'); return; }
      var when = s ? Date.parse(s) : null;
      if (s && !Number.isFinite(when)) { Hub.toast('Pick a valid date and time.'); return; }
      if (when && !window.confirm('Schedule this photo and caption for ' + whenLabel(when) + '? It will post publicly without asking again.')) return;
      save.disabled = true;
      Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'draft', media_key:key.trim(), media_type: mtype || null, caption:cap, scheduled_at: Number.isFinite(when) ? when : null } })
        .then(function (r) {
          save.disabled = false;
          if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not save'); return; }
          Hub.toast(r.status === 'scheduled' ? 'Scheduled' : 'Saved as a draft');
          load();
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-pub]'), function (b) {
      b.addEventListener('click', function () {
        var mt = b.getAttribute('data-mtype');
        // A Story is not a feed post — say so in the one place the owner confirms an irreversible
        // public action, or "the public profile" reads as the grid when it is actually the
        // 24-hour Story tray.
        var confirmMsg = mt === 'REELS' ? 'Publish this Reel now? It goes on your public profile.'
          : mt === 'STORIES' ? 'Publish this to your Story now? It is public for 24 hours, then gone.'
          : 'Publish this to Instagram now? It goes on the public profile.';
        if (!window.confirm(confirmMsg)) return;
        b.disabled = true; b.textContent = 'Publishing…';
        // Deliberately slow: Instagram fetches the image and we poll until it is ready, so this
        // can take ~20 seconds. Better to make them wait than to report success early.
        Hub.api('/api/hub/owner/social', { method:'POST', body:Object.assign({ op:'publish', id:b.getAttribute('data-pub') }, approvalCaption(b.getAttribute('data-pub'))) })
          .then(function (r) {
            if (r && r.ok) Hub.toast(r.already ? 'That was already live' : 'Posted to Instagram');
            else Hub.toast((r && r.error) || 'Could not publish');
            load();
          });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this post? It has not gone out.')) return;
        Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'delete', id:b.getAttribute('data-del') } })
          .then(function (r) { if (r && r.ok) { Hub.toast('Deleted'); load(); } else Hub.toast((r && r.error) || 'Could not delete'); });
      });
    });
  }

  function load() { Owner.get('/api/hub/owner/social').then(function (d) { DATA = d; render(); }); }
  window.MarketingTabs.createInstagram = load;
})();
</script>

<!-- ============================================================================================
     MODULE: Create > Email — copied from the old campaigns.html unchanged except the mount point
     (owner-root -> campaigns-root). Exposed as MarketingTabs.createEmail (= load). This is a
     DIFFERENT channel than Instagram above: its own compose form, its own audience/consent
     preview, its own "Send now…" confirm — nothing here is shared with the Instagram module, on
     purpose, so a moment of channel confusion cannot become a wrong send.
     ============================================================================================ -->
<script>
(function () {
  if (!window.MarketingTabs) window.MarketingTabs = {};
  var esc = Hub.esc, $ = Hub.$;
  var data = { campaigns: [], segments: [], email_ready: false, sms_ready: false };
  var view = 'list';                 // 'list' | 'compose' | 'detail'
  var detailId = null;
  var draft = { id: null, name: '', channel: 'email', segment: 'launch_list', subject: '', body: '', body_format: 'text', scheduled_at: null, schedule_note: null };
  var preview = null;                // last /preview result for the current segment+channel
  var previewT = 0;
  var sending = false;

  function refresh() { if (window.AnejoI18n) window.AnejoI18n.refresh(); }
  function segLabel(k) {
    for (var i = 0; i < data.segments.length; i++) if (data.segments[i].key === k) return data.segments[i].label;
    return k;
  }
  function statusBadge(s) {
    if (s === 'scheduled') return '<span class="badge warn">scheduled</span>';
    if (s === 'sent')     return '<span class="badge ok">sent</span>';
    if (s === 'sending')  return '<span class="badge warn">sending</span>';
    if (s === 'canceled') return '<span class="badge">canceled</span>';
    return '<span class="badge">draft</span>';
  }
  function chanBadge(c) {
    return c === 'sms'
      ? '<span class="badge" style="background:#fff4e8;border-color:#b5651d;color:#7a3f00">SMS</span>'
      : '<span class="badge">Email</span>';
  }

  // ---------- shell ----------
  function render() {
    var root = document.getElementById('campaigns-root'); root.className = '';
    root.innerHTML =
      '<div class="hub-section">' +
        '<div class="pt-chips" id="chips"></div>' +
        '<div id="pane"></div>' +
      '</div>';
    $('#chips').innerHTML = [
      { k: 'list',    label: 'Campaigns' },
      { k: 'compose', label: '+ New campaign' }
    ].map(function (d) {
      return '<button data-v="' + d.k + '" class="' + (d.k === view ? 'sel' : '') + '"><span data-i18n>' + d.label + '</span></button>';
    }).join('');
    $('#chips').querySelectorAll('[data-v]').forEach(function (bt) {
      bt.addEventListener('click', function () {
        var v = bt.getAttribute('data-v');
        if (v === 'compose') newDraft();
        view = v; render();
      });
    });

    if (view === 'compose') paintCompose();
    else if (view === 'detail') paintDetail();
    else paintList();
    refresh();
  }

  function newDraft() {
    draft = { id: null, name: '', channel: 'email', segment: 'launch_list', subject: '', body: '', body_format: 'text', scheduled_at: null, schedule_note: null };
    preview = null;
  }

  // ---------- list ----------
  function paintList() {
    if (!data.campaigns.length) {
      $('#pane').innerHTML = '<div class="card accent"><p data-i18n>No campaigns yet. “+ New campaign” drafts one — you will see exactly who it reaches, and who it does not, before anything sends.</p></div>';
      return;
    }
    $('#pane').innerHTML = data.campaigns.map(function (c) {
      var right = c.status === 'scheduled'
        ? '<span>' + esc(whenLabel(c.scheduled_at)) + '</span>'
        : c.status === 'draft'
        ? '<span data-i18n>draft</span>'
        : (c.sent_count || 0) + ' <span data-i18n>sent</span>' +
          (c.failed_count ? ' · ' + c.failed_count + ' <span data-i18n>failed</span>' : '') +
          (c.skipped ? ' · ' + c.skipped + ' <span data-i18n>skipped</span>' : '');
      return '<div class="card list-row" data-c="' + esc(c.id) + '" style="cursor:pointer">' +
        '<div><strong>' + esc(c.name) + '</strong> ' + chanBadge(c.channel) + ' ' + statusBadge(c.status) +
          '<div><small>' + esc(segLabel(c.segment)) + (c.subject ? ' · ' + esc(c.subject) : '') + '</small></div></div>' +
        '<div class="pt-right">' + right +
          (c.queued ? '<div>' + c.queued + ' <span data-i18n>left to send</span></div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    $('#pane').querySelectorAll('[data-c]').forEach(function (el) {
      el.addEventListener('click', function () { open(el.getAttribute('data-c')); });
    });
  }

  function open(cid) {
    var c = data.campaigns.filter(function (x) { return x.id === cid; })[0];
    if (!c) return;
    if (c.status === 'draft' || c.status === 'scheduled') {
      draft = { id: c.id, name: c.name || '', channel: c.channel || 'email', segment: c.segment,
                subject: c.subject || '', body: c.body || '', body_format: c.body_format === 'html' ? 'html' : 'text',
                scheduled_at: c.scheduled_at || null, schedule_note: c.schedule_note || null };
      preview = null;
      view = 'compose';
    } else {
      detailId = cid; view = 'detail';
    }
    render();
  }

  // ---------- the exclusion panel ----------
  // Plain English on purpose. "127 excluded" teaches nobody anything; "they never opted in to
  // marketing texts, and order-update consent is not the same permission" does.
  function exclusionCopy(channel) {
    return channel === 'sms' ? {
      no_consent: 'have not given express written consent for marketing texts. The consent we already hold is for order and delivery updates — a different permission, and not one that can be stretched to cover a promotion.',
      unsubscribed: 'have opted out of marketing texts.',
      no_address: 'have no mobile number on file.'
    } : {
      no_consent: 'have marketing email switched off on their record.',
      unsubscribed: 'have unsubscribed from marketing email.',
      no_address: 'have no email address on file.'
    };
  }

  function reachHtml() {
    if (!preview) return '<div class="reach"><span data-i18n>Counting the audience…</span></div>';
    var copy = exclusionCopy(preview.channel);
    var rows = [
      { k: 'no_consent',   n: preview.skipped.no_consent,   why: copy.no_consent },
      { k: 'unsubscribed', n: preview.skipped.unsubscribed, why: copy.unsubscribed },
      { k: 'no_address',   n: preview.skipped.no_address,   why: copy.no_address }
    ].filter(function (r) { return r.n > 0; });

    var src = [];
    Object.keys(preview.by_source || {}).forEach(function (k) { src.push(preview.by_source[k] + ' ' + k.replace(/_/g, ' ')); });

    var html =
      '<div class="reach">' +
        '<div class="big">' + preview.count + '</div>' +
        '<div><span data-i18n>people will receive this</span>' +
          (preview.channel === 'sms' ? ' <span data-i18n>by text</span>' : ' <span data-i18n>by email</span>') + '</div>' +
        (src.length ? '<p class="hint" style="margin-top:6px">' + esc(src.join(' · ')) + '</p>' : '') +
      '</div>';

    html += '<div class="excl"><h4 data-i18n>Who will NOT get this, and why</h4>';
    if (!rows.length) {
      html += '<p class="hint" data-i18n>Nobody in this segment is being excluded.</p>';
    } else {
      html += rows.map(function (r) {
        return '<div class="excl-row"><span data-i18n>' + r.why + '</span><b>' + r.n + '</b></div>';
      }).join('');
      html += '<p class="hint" style="margin-top:8px">' + preview.excluded + ' <span data-i18n>of</span> ' +
        preview.evaluated + ' <span data-i18n>people in this segment are excluded.</span></p>';
    }
    html += '</div>';

    if (preview.channel === 'sms' && preview.count === 0) {
      html += '<div class="warn" data-i18n>Nobody has opted in to marketing texts yet. That is expected: the consent already on file was collected for order and delivery updates, and nobody was carried over into marketing. This list fills up only as people tick a box that specifically says marketing texts.</div>';
    }
    if (!preview.channel_ready) {
      html += '<div class="warn" data-i18n>This channel is not configured on the server, so sending will be refused.</div>';
    }
    return html;
  }

  function loadPreview() {
    var box = $('#reach');
    if (box) box.innerHTML = '<div class="reach"><span data-i18n>Counting the audience…</span></div>';
    clearTimeout(previewT);
    previewT = setTimeout(function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'preview', segment: draft.segment, channel: draft.channel } })
        .then(function (d) {
          if (!d || !d.ok) { preview = null; if ($('#reach')) $('#reach').innerHTML = '<div class="excl"><p class="hint">' + esc((d && d.error) || 'Could not count that segment.') + '</p></div>'; return; }
          preview = d;
          if ($('#reach')) $('#reach').innerHTML = reachHtml();
          refresh();
        });
    }, 180);
  }

  // ---------- compose ----------
  function paintCompose() {
    var isSms = draft.channel === 'sms';
    var isHtml = !isSms && draft.body_format === 'html';
    $('#pane').innerHTML =
      '<div class="card">' +
        '<h3 data-i18n>' + (draft.id ? 'Edit draft' : 'New campaign') + '</h3>' +
        '<div class="form-row"><label data-i18n>Internal name</label><input id="f_name" autocomplete="off" value="' + esc(draft.name) + '"></div>' +
        '<div class="form-two">' +
          '<div class="form-row"><label data-i18n>Channel</label><select id="f_chan">' +
            '<option value="email"' + (isSms ? '' : ' selected') + '>Email</option>' +
            '<option value="sms"' + (isSms ? ' selected' : '') + '>SMS</option></select></div>' +
          '<div class="form-row"><label data-i18n>Segment</label><select id="f_seg">' +
            data.segments.map(function (s) {
              return '<option value="' + esc(s.key) + '"' + (s.key === draft.segment ? ' selected' : '') + '>' + esc(s.label) + '</option>';
            }).join('') +
          '</select></div>' +
        '</div>' +
        '<p class="hint" id="segwhy"></p>' +
        // Shown only when the test segment is selected. An always-visible field for a setting you
        // touch twice a year is clutter; this one only matters at the moment you are testing.
        (draft.segment === 'test'
          ? '<div class="form-row"><label>Send test to</label>' +
            '<input id="f_testto" autocomplete="off" placeholder="you@example.com" value="' + esc(data.test_recipients || '') + '">' +
            '<p class="hint">Comma-separated, max 5. Only these addresses receive it — no customer is touched. ' +
            'Consent is not checked here (you do not need your own permission to email yourself), but a bounced address is still skipped.</p></div>'
          : '') +
        // Compliance surfaced where the send actually happens, not buried in a settings page.
        // Email only — CAN-SPAM governs email; SMS carries its own STOP disclosure instead.
        // Shown ONLY while the fallback is in use; once a real address is set this goes quiet.
        ((!isSms && data.postal_is_fallback)
          ? '<div class="form-row" style="border-left:4px solid #d64545;padding-left:10px">' +
            '<label>Postal address on marketing email</label>' +
            '<input id="f_postal" autocomplete="off" placeholder="1234 Okeechobee Blvd, Suite 200, West Palm Beach, FL 33401">' +
            '<p class="hint">Currently <b>' + esc(data.postal_address || '') + '</b> — a county is not a postal address, so ' +
            'marketing email does not yet meet CAN-SPAM. A <b>PO Box</b> or a <b>virtual mailbox</b> both satisfy it; ' +
            'you do not have to publish your home address. Fine to leave while you are only testing yourself.</p></div>'
          : '') +
        '<div class="form-row" id="subjrow" style="' + (isSms ? 'display:none' : '') + '">' +
          '<label data-i18n>Subject line</label><input id="f_subj" autocomplete="off" value="' + esc(draft.subject) + '"></div>' +
        // Saved templates for THIS channel. An email template in an SMS dropdown is a trap.
        (function () {
          var mine = (data.templates || []).filter(function (x) { return (x.channel || 'email') === draft.channel; });
          if (!mine.length) return '<p class="hint" style="margin-bottom:10px">No saved templates yet — write or load one below, then “Save as template”.</p>';
          return '<div class="form-row"><label>Saved templates</label>' +
            '<div style="display:flex;gap:8px"><select id="f_tpl" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px">' +
              '<option value="">— pick a template —</option>' +
              mine.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + (x.body_format === 'html' ? ' (HTML)' : '') + '</option>'; }).join('') +
            '</select>' +
            '<button class="btn ghost" id="f_tplload" type="button" style="white-space:nowrap">Load</button>' +
            '<button class="btn ghost" id="f_tpldel" type="button" style="white-space:nowrap;color:#8a2b22">Delete</button></div>' +
            '<p class="hint">Loading replaces the subject, format and message below. It does not change the segment, and it never touches a campaign already sent.</p></div>';
        })() +
        // Email only. SMS has no HTML, so offering the choice there would be a control that
        // cannot do anything.
        (isSms ? '' :
          '<div class="form-row"><label data-i18n>Message format</label><select id="f_fmt">' +
            '<option value="text"' + (isHtml ? '' : ' selected') + '>Write it here (plain text)</option>' +
            '<option value="html"' + (isHtml ? ' selected' : '') + '>Use a designed HTML template</option>' +
          '</select></div>') +
        (isHtml
          ? '<div class="form-row"><label>Template file</label>' +
            '<input id="f_file" type="file" accept=".html,.htm,text/html">' +
            '<p class="hint">Pick a .html file and it loads into the box below. Nothing is uploaded — the file is read here in the browser.</p></div>'
          : '') +
        '<div class="form-row"><label data-i18n>Message</label>' +
          '<textarea id="f_body"' + (isHtml ? ' spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:220px"' : '') +
            ' placeholder="' + (isHtml ? 'Paste the full HTML document, or pick a file above.' : 'Blank line starts a new paragraph.') + '">' + esc(draft.body) + '</textarea></div>' +
        (isHtml ? '<div class="form-two" style="margin-bottom:6px"><button class="btn ghost" id="f_prev" type="button">Preview it</button><span></span></div>' : '') +
        '<p class="hint" id="bodyhint"></p>' +
        '<div id="tplaudit"></div>' +
        // A schedule that did not fire must say so HERE, not vanish into a draft that looks like
        // the owner never scheduled it.
        (draft.schedule_note ? '<div class="warn" style="margin-top:10px">' + esc(draft.schedule_note) + '</div>' : '') +
        '<div id="reach"></div>' +
        '<p class="legal" id="legal"></p>' +
        '<div class="form-two" style="margin-top:12px">' +
          '<button class="btn ghost" id="f_save" data-i18n>Save draft</button>' +
          '<button class="btn gold" id="f_send" data-i18n>Send now…</button>' +
        '</div>' +
        '<div class="form-two" style="margin-top:8px">' +
          '<button class="btn ghost" id="f_tplsave" type="button">Save as template</button><span></span>' +
        '</div>' +
        scheduleBlock() +
        '<p class="prog" id="prog"></p>' +
        '<p class="hint" id="msg"></p>' +
      '</div>';

    paintSegWhy();
    paintLegal();
    wireTemplates();
    wireSchedule();
    paintBodyHint();
    loadPreview();

    $('#f_chan').addEventListener('change', function () {
      draft.channel = $('#f_chan').value === 'sms' ? 'sms' : 'email';
      collect(); render();
    });
    $('#f_seg').addEventListener('change', function () {
      draft.segment = $('#f_seg').value; collect(); render(); loadPreview();
    });
    $('#f_body').addEventListener('input', paintBodyHint);
    (function () {
      var fm = document.getElementById('f_fmt');
      if (fm) fm.addEventListener('change', function () {
        draft.body_format = fm.value === 'html' ? 'html' : 'text';
        collect(); render();
      });
      var fi = document.getElementById('f_file');
      if (fi) fi.addEventListener('change', function () {
        var f = fi.files && fi.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          $('#f_body').value = String(rd.result || '');
          draft.body = $('#f_body').value;
          if (!draft.name) { draft.name = f.name.replace(/\.html?$/i, ''); var n = document.getElementById('f_name'); if (n) n.value = draft.name; }
          paintBodyHint();
          Hub.toast('Loaded ' + f.name);
        };
        rd.onerror = function () { Hub.toast('Could not read that file.'); };
        rd.readAsText(f);
      });
      var pv = document.getElementById('f_prev');
      if (pv) pv.addEventListener('click', function () { collect(); openPreview(); });
    })();
    bindTestTo();
    (function () {
      var pa = document.getElementById('f_postal');
      if (!pa) return;
      pa.addEventListener('blur', function () {
        if (!pa.value.trim()) return;
        Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'set_postal_address', value: pa.value } })
          .then(function (r) {
            if (r && r.ok) { Hub.toast('Postal address saved'); load(); }
            else Hub.toast((r && r.error) || 'Could not save');
          });
      });
    })();
    $('#f_save').addEventListener('click', function () { collect(); save().then(function (ok) { if (ok) { $('#msg').textContent = 'Draft saved.'; load(); } }); });
    $('#f_send').addEventListener('click', function () { collect(); startSend(); });
    refresh();
  }

  // ---------- schedule ----------
  function whenLabel(ms) {
    return new Date(Number(ms)).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

  // Default the picker to the next round hour, local time. datetime-local wants a local-time
  // string with no zone, so it is built from the local parts — using this here would offset
  // it by the timezone and quietly schedule the send four hours early.
  function defaultWhen() {
    var d = new Date(Date.now() + 60 * 60 * 1000);
    d.setMinutes(0, 0, 0);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function scheduleBlock() {
    if (!draft.id && !draft.scheduled_at) {
      return '<p class="hint" style="margin-top:10px">Save the draft first, then you can schedule it.</p>';
    }
    // A campaign already scheduled shows WHEN, and one control: take it off again.
    if (draft.scheduled_at) {
      return '<div class="reach" style="margin-top:12px">' +
        '<div><b>Scheduled to send ' + esc(whenLabel(draft.scheduled_at)) + '</b> — your local time.</div>' +
        (data.scheduler_ready ? '' :
          '<div class="warn" style="margin:8px 0 0">The scheduler is not configured, so this will <b>not</b> send on its own. Use “Send now” instead.</div>') +
        '<div class="form-two" style="margin-top:10px"><button class="btn ghost" id="f_unsched" type="button">Cancel schedule</button><span></span></div>' +
      '</div>';
    }
    return '<div class="form-row" style="margin-top:12px"><label>Or send it later</label>' +
      '<div style="display:flex;gap:8px"><input id="f_when" type="datetime-local" style="flex:1" value="' + defaultWhen() + '">' +
      '<button class="btn ghost" id="f_sched" type="button" style="white-space:nowrap">Schedule</button></div>' +
      '<p class="hint">Your local time. The audience is worked out when it fires, not now — so anyone who joins between now and then is included.' +
      (data.scheduler_ready ? '' : ' <b>The scheduler is not configured yet, so a scheduled campaign would not send.</b>') + '</p></div>';
  }

  function wireSchedule() {
    var sc = document.getElementById('f_sched');
    if (sc) sc.addEventListener('click', function () {
      collect();
      var raw = (document.getElementById('f_when') || {}).value || '';
      var when = raw ? Date.parse(raw) : NaN;
      if (!Number.isFinite(when)) { Hub.toast('Pick a date and time.'); return; }
      // Save first: scheduling copy that was never written to the row would send the OLD body.
      save().then(function (ok) {
        if (!ok) return;
        Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'schedule', id: draft.id, scheduled_at: when } })
          .then(function (r) {
            if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not schedule'); return; }
            draft.scheduled_at = r.scheduled_at;
            Hub.toast('Scheduled for ' + whenLabel(r.scheduled_at));
            load();
          });
      });
    });
    var un = document.getElementById('f_unsched');
    if (un) un.addEventListener('click', function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'unschedule', id: draft.id } })
        .then(function (r) {
          if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not cancel'); return; }
          draft.scheduled_at = null;
          Hub.toast('Schedule cancelled — it is a draft again.');
          load();
        });
    });
  }

  // ---------- the template library ----------
  function wireTemplates() {
    var ld = document.getElementById('f_tplload');
    if (ld) ld.addEventListener('click', function () {
      var sel = document.getElementById('f_tpl');
      var t = (data.templates || []).filter(function (x) { return x.id === (sel && sel.value); })[0];
      if (!t) { Hub.toast('Pick a template first.'); return; }
      // Deliberately NOT silent: this overwrites what is in the box.
      if (draft.body.trim() && !window.confirm('Replace the message below with “' + t.name + '”?')) return;
      draft.subject = t.subject || draft.subject;
      draft.body = t.body || '';
      draft.body_format = t.body_format === 'html' ? 'html' : 'text';
      render();
      Hub.toast('Loaded “' + t.name + '”');
    });

    var dl = document.getElementById('f_tpldel');
    if (dl) dl.addEventListener('click', function () {
      var sel = document.getElementById('f_tpl');
      var t = (data.templates || []).filter(function (x) { return x.id === (sel && sel.value); })[0];
      if (!t) { Hub.toast('Pick a template first.'); return; }
      if (!window.confirm('Delete the template “' + t.name + '”? Campaigns already sent are not affected.')) return;
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'template_delete', id: t.id } })
        .then(function (r) { if (r && r.ok) { Hub.toast('Deleted'); load(); } else Hub.toast((r && r.error) || 'Could not delete'); });
    });

    var sv = document.getElementById('f_tplsave');
    if (sv) sv.addEventListener('click', function () {
      collect();
      if (!draft.body.trim()) { Hub.toast('There is nothing to save yet.'); return; }
      var name = window.prompt('Save this as a template called:', draft.name || '');
      if (name === null) return;
      name = name.trim();
      if (!name) { Hub.toast('Give the template a name.'); return; }
      var existing = (data.templates || []).filter(function (x) {
        return x.name === name && (x.channel || 'email') === draft.channel;
      })[0];
      if (existing && !window.confirm('“' + name + '” already exists. Replace it?')) return;
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: {
        op: 'template_save', name: name, channel: draft.channel,
        subject: draft.subject, body: draft.body, body_format: draft.body_format
      } }).then(function (r) {
        if (r && r.ok) { Hub.toast('Saved “' + name + '”'); load(); }
        else Hub.toast((r && r.error) || 'Could not save');
      });
    });
  }

  function paintSegWhy() {
    var s = data.segments.filter(function (x) { return x.key === draft.segment; })[0];
    var el = $('#segwhy'); if (el && s) { el.textContent = s.why; }
  }

  // The compliance note is shown while writing, not after — it is a constraint on the copy,
  // not a disclaimer bolted on at send time.
  function paintLegal() {
    var el = $('#legal'); if (!el) return;
    var addr = data.postal_address || 'Añejo Catering Co. · Palm Beach County, FL';
    el.innerHTML = draft.channel === 'sms'
      ? 'Every text ends with “Reply STOP to opt out.” — added automatically if you don’t write it. Only people who gave express consent for <em>marketing</em> texts are included.'
      : 'Every email carries a one-click unsubscribe link and “' + esc(addr) + '” in the footer. That is what makes emailing your customer list lawful, so it is not optional.' +
        (draft.body_format === 'html'
          ? ' A designed template gets that footer added underneath it — unless the template places <code>{{unsubscribe_url}}</code> and <code>{{postal_address}}</code> itself, in which case the design is left alone.'
          : '');
  }

  function paintBodyHint() {
    var el = $('#bodyhint'); if (!el) return;
    var n = ($('#f_body') && $('#f_body').value.length) || 0;
    if (draft.channel === 'sms') {
      var withOptOut = n + 26;   // "\n\nReply STOP to opt out."
      el.textContent = n + ' characters (~' + withOptOut + ' with the opt-out line). Over 160 sends as multiple segments and is billed per segment.';
    } else if (draft.body_format === 'html') {
      var src = ($('#f_body') && $('#f_body').value) || '';
      var kb = (new Blob([src]).size / 1024);
      el.textContent = Math.round(kb * 10) / 10 + ' KB of HTML.';
      paintTemplateAudit(src, kb);
    } else {
      el.textContent = n + ' characters. A blank line starts a new paragraph.';
    }
  }

  // Everything below is knowable before the send, so it is said before the send. Finding out that
  // a grey compliance strip was stapled under your artwork by looking at your own inbox copy —
  // after it reached the list — is the outcome this panel exists to prevent.
  function paintTemplateAudit(src, kb) {
    var el = document.getElementById('tplaudit'); if (!el) return;
    if (!src.trim()) { el.innerHTML = ''; return; }
    var hasUnsub  = /\{\{\s*unsubscribe_url\s*\}\}/i.test(src);
    var hasPostal = /\{\{\s*postal_address\s*\}\}/i.test(src);
    var notes = [];
    if (!(hasUnsub && hasPostal)) {
      notes.push('A compliance footer will be <b>added below your design</b> — it carries the unsubscribe link and the postal address, both legally required. ' +
        'To place them yourself instead, put <code>{{unsubscribe_url}}</code> and <code>{{postal_address}}</code> in your own footer. ' +
        'Both are needed; one on its own still gets the added block.');
    } else {
      notes.push('Your template carries the unsubscribe link and postal address itself, so <b>nothing is added</b> — the design goes out exactly as written.');
    }
    if (kb > 99) notes.push('<b>Over 100 KB.</b> Gmail clips messages around that size and hides the rest behind “View entire message” — including the unsubscribe link, which sits at the bottom.');
    if (/<link\b[^>]*rel=["\']?stylesheet/i.test(src)) notes.push('There is a <code>&lt;link&gt;</code> stylesheet (usually a webfont). Gmail and Outlook strip it, so the email falls back to the fonts named inline. That is normal, not a fault — it just will not look like the browser.');
    if (/<script\b/i.test(src)) notes.push('There is a <code>&lt;script&gt;</code> tag. It is removed before sending — no email client runs scripts.');
    if (!/<body\b/i.test(src) && !/<html\b/i.test(src)) notes.push('This looks like a fragment rather than a whole document. It will still send, but a full <code>&lt;html&gt;</code>…<code>&lt;/html&gt;</code> renders more predictably.');
    notes.push('You can also use <code>{{first_name}}</code>, <code>{{name}}</code> and <code>{{email}}</code> anywhere in the template.');
    el.innerHTML = '<div class="excl" style="margin-top:10px"><h4>Before you send</h4>' +
      notes.map(function (n) { return '<div class="excl-row"><span>' + n + '</span></div>'; }).join('') + '</div>';
  }

  // Rendered in a sandboxed frame: it is the owner's own markup, but a preview that could run
  // script in the HUB would be a preview with more privileges than the inbox it is imitating.
  function openPreview() {
    var src = draft.body || '';
    if (!src.trim()) { Hub.toast('Nothing to preview yet.'); return; }
    var w = document.getElementById('tplframe');
    if (w) w.remove();
    var wrap = document.createElement('div');
    wrap.id = 'tplframe';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99995;display:flex;flex-direction:column;padding:14px;';
    wrap.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">' +
        '<span style="color:#fff;font-size:13px">Preview — merge tokens shown as sample values</span>' +
        '<button id="tplclose" class="btn ghost" style="background:#fff">Close</button></div>' +
      '<iframe sandbox="" style="flex:1;width:100%;border:0;border-radius:10px;background:#fff"></iframe>';
    document.body.appendChild(wrap);
    // Sample values, clearly marked: a preview that silently renders an empty {{first_name}} looks
    // like a bug, and one that renders a real unsubscribe URL invites clicking it.
    var demo = src
      .replace(/\{\{\s*unsubscribe_url\s*\}\}/gi, '#unsubscribe-link')
      .replace(/\{\{\s*postal_address\s*\}\}/gi, esc(data.postal_address || ''))
      .replace(/\{\{\s*first_name\s*\}\}/gi, 'Arianne')
      .replace(/\{\{\s*name\s*\}\}/gi, 'Arianne Vega')
      .replace(/\{\{\s*email\s*\}\}/gi, 'arianne@example.com');
    wrap.querySelector('iframe').srcdoc = demo;
    document.getElementById('tplclose').addEventListener('click', function () { wrap.remove(); });
  }

  // Save the test recipients as soon as focus leaves the field, so the setting is not lost if the
  // page reloads before a send.
  function bindTestTo() {
    var el = document.getElementById('f_testto');
    if (!el) return;
    el.addEventListener('blur', function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'set_test_recipients', value: el.value } })
        .then(function (r) {
          if (r && r.ok) { data.test_recipients = r.test_recipients; Hub.toast('Test recipients saved'); }
          else Hub.toast((r && r.error) || 'Could not save');
        });
    });
  }

  function collect() {
    if ($('#f_name')) draft.name = $('#f_name').value.trim();
    if ($('#f_body')) draft.body = $('#f_body').value;
    if ($('#f_subj')) draft.subject = $('#f_subj').value.trim();
    if ($('#f_seg')) draft.segment = $('#f_seg').value;
    if ($('#f_fmt')) draft.body_format = $('#f_fmt').value === 'html' ? 'html' : 'text';
  }

  // Save first, always: a campaign has to exist as a row before it can be sent, and that row is
  // the audit trail of exactly what copy went out.
  function save() {
    var body = { op: 'save', id: draft.id, name: draft.name, channel: draft.channel,
                 segment: draft.segment, subject: draft.subject, body: draft.body,
                 body_format: draft.body_format || 'text' };
    if (!body.name) { $('#msg').textContent = 'Give the campaign a name.'; return Promise.resolve(false); }
    if (!body.body) { $('#msg').textContent = 'Write the message.'; return Promise.resolve(false); }
    if (draft.channel === 'email' && !body.subject) { $('#msg').textContent = 'An email campaign needs a subject line.'; return Promise.resolve(false); }
    $('#msg').textContent = '…';
    return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: body }).then(function (d) {
      if (!d || !d.ok) { $('#msg').textContent = (d && d.error) || 'Could not save.'; return false; }
      draft.id = d.id;
      $('#msg').textContent = '';
      return true;
    });
  }

  // ---------- sending ----------
  function startSend() {
    if (sending) return;
    save().then(function (ok) {
      if (!ok) return;
      // Re-count immediately before asking: the number in the confirm must be the number the
      // server is about to act on, not one from a preview several edits ago.
      return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'preview', segment: draft.segment, channel: draft.channel } })
        .then(function (p) {
          if (!p || !p.ok) { $('#msg').textContent = (p && p.error) || 'Could not count the audience.'; return; }
          preview = p;
          if ($('#reach')) $('#reach').innerHTML = reachHtml();
          refresh();
          if (!p.count) { $('#msg').textContent = 'Nobody in that segment is reachable on this channel.'; return; }
          var what = draft.channel === 'sms' ? 'text messages' : 'emails';
          var line = 'Send "' + draft.name + '" — ' + p.count + ' ' + what + ' to ' + segLabel(draft.segment) + '.\n\n' +
                     p.excluded + ' people are excluded (see the panel above).\n\nThis cannot be undone. Send now?';
          if (!window.confirm(line)) return;
          runSend(draft.id, p.count);
        });
    });
  }

  // A Worker cannot hold a 500-recipient send open, so the page drives it: each call sends a
  // batch and reports what is left, and a dropped connection resumes instead of double-sending.
  function runSend(cid, expect) {
    sending = true;
    var send = $('#f_send'), sv = $('#f_save');
    if (send) send.disabled = true;
    if (sv) sv.disabled = true;

    function step(first) {
      var body = { op: 'send', id: cid };
      // `expect` is the number the owner just confirmed. Resuming has no such number — the
      // audience was frozen at the first send and must not be re-counted.
      if (first && typeof expect === 'number') body.expect = expect;
      return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: body }).then(function (d) {
        if (!d || !d.ok) {
          if ($('#prog')) $('#prog').textContent = (d && d.error) || 'Send stopped.';
          sending = false; if (send) send.disabled = false; if (sv) sv.disabled = false;
          load(); return;
        }
        if ($('#prog')) {
          $('#prog').textContent = d.done
            ? 'Done — ' + d.totals.sent + ' sent, ' + d.totals.failed + ' failed, ' + d.totals.skipped + ' skipped.'
            : 'Sending… ' + d.totals.sent + ' sent, ' + d.remaining + ' to go.';
        }
        if (!d.done) return step(false);
        sending = false; if (send) send.disabled = false; if (sv) sv.disabled = false;
        newDraft(); view = 'list'; load();
      });
    }
    if ($('#prog')) $('#prog').textContent = 'Starting…';
    step(true);
  }

  // ---------- detail (a campaign that has already left the drafts) ----------
  function paintDetail() {
    var c = data.campaigns.filter(function (x) { return x.id === detailId; })[0];
    if (!c) { view = 'list'; render(); return; }
    $('#pane').innerHTML =
      '<button class="btn ghost" id="back" data-i18n>← Back</button>' +
      '<div class="card" style="margin-top:10px">' +
        '<h3>' + esc(c.name) + ' ' + chanBadge(c.channel) + ' ' + statusBadge(c.status) + '</h3>' +
        '<p class="hint">' + esc(segLabel(c.segment)) + (c.subject ? ' · ' + esc(c.subject) : '') + '</p>' +
        '<div class="excl" style="margin-top:12px">' +
          '<div class="excl-row"><span data-i18n>Recipients frozen at send</span><b>' + (c.recipients || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Sent</span><b>' + (c.sent_count || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Failed</span><b>' + (c.failed_count || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Skipped (bounced or complained before)</span><b>' + (c.skipped || 0) + '</b></div>' +
          (c.queued ? '<div class="excl-row"><span data-i18n>Still queued</span><b>' + c.queued + '</b></div>' : '') +
        '</div>' +
        (c.status === 'sending'
          ? '<button class="btn gold" id="resume" style="width:100%" data-i18n>Resume sending</button>'
          : '') +
        '<p class="prog" id="prog"></p>' +
        '<p class="hint" style="margin-top:12px" data-i18n>Message sent</p>' +
        (c.body_format === 'html'
          // Escaped source would be a wall of markup. Sandboxed so viewing the record of what was
          // sent cannot execute anything.
          ? '<iframe sandbox="" style="width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff" srcdoc="' + esc(c.body || '') + '"></iframe>'
          : '<div class="card" style="white-space:pre-wrap;font-size:14px;line-height:1.6">' + esc(c.body || '') + '</div>') +
      '</div>';
    $('#back').addEventListener('click', function () { view = 'list'; render(); });
    var r = $('#resume');
    // Resuming picks up only the rows still queued — everyone already marked sent is skipped,
    // which is what makes a retry safe rather than a second campaign.
    if (r) r.addEventListener('click', function () { r.disabled = true; runSend(c.id, null); });
    refresh();
  }

  // ---------- load ----------
  function load() {
    Owner.get('/api/hub/owner/campaigns').then(function (d) {
      // These three were being dropped on the floor, which is why the postal-address control never
      // appeared and the test-recipients field always painted empty even with recipients saved.
      data = {
        campaigns: (d && d.campaigns) || [],
        segments: (d && d.segments) || [],
        templates: (d && d.templates) || [],
        scheduler_ready: !!(d && d.scheduler_ready),
        test_recipients: (d && d.test_recipients) || '',
        postal_address: (d && d.postal_address) || '',
        postal_is_fallback: !!(d && d.postal_is_fallback),
        email_ready: !!(d && d.email_ready),
        sms_ready: !!(d && d.sms_ready)
      };
      if (!draft.segment && data.segments.length) draft.segment = data.segments[0].key;
      render();
    }).catch(function () { Owner.fail('owner-root'); });
  }

  window.MarketingTabs.createEmail = load;
})();
</script>
