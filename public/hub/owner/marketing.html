      while (ctx.measureText(footer).width > maxW && fPx > 11) { fPx = Math.round(fPx * 0.94); ctx.font = 'italic 500 ' + fPx + 'px "Cormorant Garamond", Georgia, serif'; }
      var fy = H - inset - Math.round(W * 0.055) - fPx;
      // The closing line sits at the BOTTOM, which on a poster is over the photograph itself —
      // and a bowl is the brightest thing in the frame. Measured, not assumed: MAR's line landed
      // on a pale ceramic rim and vanished. If gold cannot hold there, the same edge-anchored
      // fade the overlay uses goes down first — a gradient to zero alpha, never a bar.
      var fStats = regionStats(ctx, canvas, inset, fy - Math.round(W * 0.06), W - inset * 2, fPx + Math.round(W * 0.09));
      if (inkContrast(gold, fStats) < 3) {
        var fadeTop = Math.round(H * 0.72);
        var fg = ctx.createLinearGradient(0, fadeTop, 0, H);
        fg.addColorStop(0, 'rgba(' + VEIL_RGB + ',0)');
        fg.addColorStop(1, 'rgba(' + VEIL_RGB + ',0.72)');
        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = fg;
        ctx.fillRect(0, fadeTop, W, H - fadeTop);
        ctx.restore();
      }
      drawStar(ctx, cx, fy - Math.round(W * 0.035), Math.round(W * 0.011));
      ctx.fillStyle = gold.css;
      ctx.textAlign = 'center';
      ctx.fillText(footer, cx, fy);
      ctx.textAlign = 'left';
    }
    ctx.restore();

    return canvas.toDataURL('image/jpeg', 0.92);
  }

  // photoUrl: the HUB-authenticated media route for the slide being branded (same-origin, so the
  // canvas is never "tainted" and both getImageData and toDataURL work). Returns a
  // Promise<string> of a JPEG data URL.
  function compositeBranding(photoUrl, opts) {
    opts = opts || {};
    // Poster mode always uses the EMBLEM: it sets the company name as type on its own line, so the
    // full lockup would print that name twice, once as artwork and once as type, at two different
    // sizes in two different faces. The references use the emblem for exactly this reason.
    var markKey = opts.preset === 'poster' ? 'emblem' : (opts.mark === 'lockup' ? 'lockup' : 'emblem');
    return ensureBrandFonts()
      .then(function () { return Promise.all([loadImageEl(photoUrl), loadImageEl(MARK_SRC[markKey])]); })
      .then(function (imgs) {
      if (opts.preset === 'poster') return composePoster(imgs[0], imgs[1], opts);
      var photo = imgs[0], logo = imgs[1];
      var canvas = document.createElement('canvas');
      canvas.width = photo.naturalWidth || photo.width;
      canvas.height = photo.naturalHeight || photo.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);

      var W = canvas.width, H = canvas.height;
      var S = Math.min(W, H);                    // every size below derives from the SHORTER side,
      var M = Math.round(S * 0.075);             // so a square render and a tall photo compose alike
      var safeW = W - M * 2;

      // ---- WORDING ---------------------------------------------------------------------------
      // Drawn first so the mark can be told where NOT to go. The headline keeps the owner's exact
      // characters and casing; only the kicker is uppercased, because a letterspaced cap kicker is
      // the form itself, not a transform of meaning.
      var headline = String(opts.text || '').trim().slice(0, 48);
      var kicker = String(opts.kicker || '').trim().slice(0, 28).toUpperCase();
      var layout = opts.layout && opts.layout !== 'auto' ? opts.layout : ((headline || kicker) ? chooseLayout(ctx, canvas) : 'editorial');
      var wordRect = null;

      if (headline || kicker) {
        var align = layout === 'caption' ? 'left' : 'center';
        var atTop = layout === 'masthead';

        var head = headline ? fitHeadline(ctx, headline, safeW, Math.round(S * 0.088), Math.round(S * 0.042)) : { px: 0, lines: [] };
        var kickPx = Math.max(Math.round((head.px || S * 0.075) * 0.27), Math.round(S * 0.021));
        var tracking = kickPx * 0.34;
        var lineH = Math.round(head.px * 1.16);
        var ruleH = Math.max(1, Math.round(S * 0.0028));
        var ruleW = Math.round(S * 0.085);
        var gapRule = Math.round(kickPx * 0.95);
        var gapKick = kicker ? Math.round((head.px || kickPx) * 0.44) : 0;

        // Canvas measures from the em-box TOP, so a line of size px hangs its descenders BELOW
        // top + px. Without this allowance the last line of a bottom-anchored block runs off the
        // bottom of the photo — which is precisely what a two-line auto-fit headline did.
        var descAllow = head.lines.length ? Math.round(head.px * 0.32) : 0;
        var blockH = ruleH + gapRule + (kicker ? kickPx + gapKick : 0) + head.lines.length * lineH + descAllow;
        var top = atTop ? M : H - M - blockH;

        // Measure what is actually behind the block, then decide ink. Type is held to 4.5:1 (the
        // WCAG floor for text, not the looser one for large graphics) across the whole band, and
        // only when the best available ink cannot reach it does the edge fade appear — a gradient
        // that reaches zero alpha, so there is no line anywhere on it to read as a box.
        var wStats = regionStats(ctx, canvas, M, top - S * 0.02, align === 'left' ? Math.round(safeW * 0.68) : safeW, blockH + S * 0.04);
        var titleInk = pickTitleInk(wStats);
        var accentInk = pickAccentInk(wStats);
        // Gated on the TITLE, because it is the biggest and most-read element: if the title needs
        // the fade to be legible, the accents riding with it need it too.
        if (inkContrast(titleInk, wStats) < 4.5) {
          var fadeSpan = Math.round(S * 0.22);
          var solid = 'rgba(' + VEIL_RGB + ',0.66)', clear = 'rgba(' + VEIL_RGB + ',0)';
          var g = atTop
            ? ctx.createLinearGradient(0, 0, 0, top + blockH + fadeSpan)
            : ctx.createLinearGradient(0, top - fadeSpan, 0, H);
          g.addColorStop(0, atTop ? solid : clear);   // the edge it is anchored to is the only
          g.addColorStop(1, atTop ? clear : solid);   // opaque end; the other reaches zero alpha
          ctx.fillStyle = g;
          if (atTop) ctx.fillRect(0, 0, W, top + blockH + fadeSpan);
          else ctx.fillRect(0, top - fadeSpan, W, H - (top - fadeSpan));
          // The fade lays down the same deep forest field the reference posters are built on, and
          // on that field the brand pairing stops being a judgement call: parchment title, gold
          // accents, exactly as printed.
          titleInk = BRAND_INK.parchment;
          accentInk = BRAND_INK.gold;
        }

        var cx = align === 'left' ? M : Math.round(W / 2);
        ctx.save();
        ctx.textBaseline = 'top';
        ctx.shadowBlur = Math.round(S * 0.018);

        // Rule and kicker: GOLD.
        var y = top;
        var ruleX = align === 'left' ? M : Math.round(cx - ruleW / 2);
        ctx.fillStyle = accentInk.css;
        ctx.shadowColor = haloFor(accentInk);
        ctx.fillRect(ruleX, y, ruleW, ruleH);
        y += ruleH + gapRule;

        if (kicker) {
          ctx.font = kickerFont(kickPx);
          ctx.textAlign = 'left';
          var kw = trackedWidth(ctx, kicker, tracking);
          drawTracked(ctx, kicker, align === 'left' ? M : Math.round(cx - kw / 2), y, tracking);
          y += kickPx + gapKick;
        }
        // Title: PARCHMENT.
        if (head.lines.length) {
          ctx.fillStyle = titleInk.css;
          ctx.shadowColor = haloFor(titleInk);
          ctx.font = headlineFont(head.px);
          ctx.textAlign = align === 'left' ? 'left' : 'center';
          for (var li = 0; li < head.lines.length; li++) {
            ctx.fillText(head.lines[li], align === 'left' ? M : cx, y);
            y += lineH;
          }
        }
        ctx.restore();
        wordRect = { x: M, y: top, w: align === 'left' ? Math.round(safeW * 0.68) : safeW, h: blockH };
      }

      // ---- THE MARK --------------------------------------------------------------------------
      // Sized restrained (the lockup is a tall three-part composition; at the old 22% it dominated
      // a square render). Placement is measured, not assumed, and never lands on the wording.
      var markW = Math.round(S * (markKey === 'lockup' ? 0.17 : 0.115));
      var markH = Math.round(markW * ((logo.naturalHeight || logo.height) / (logo.naturalWidth || logo.width)));
      // Six anchors, not four. TOP CENTRE is where the reference posters put the mark — centred
      // above the title, the whole layout hanging off it — and BOTTOM CENTRE is its mirror for a
      // photo whose subject sits high. Both are in the Auto pool too, so a centred layout can
      // actually choose the centred mark instead of being forced into a corner.
      var cxMark = Math.round((W - markW) / 2);
      var anchors = {
        tl: [M, M],          tc: [cxMark, M],          tr: [W - markW - M, M],
        bl: [M, H - markH - M], bc: [cxMark, H - markH - M], br: [W - markW - M, H - markH - M]
      };
      function collides(a) {
        if (!wordRect) return false;
        var pad = Math.round(M * 0.6);
        return !(a[0] + markW + pad < wordRect.x || a[0] > wordRect.x + wordRect.w + pad ||
                 a[1] + markH + pad < wordRect.y || a[1] > wordRect.y + wordRect.h + pad);
      }

      var chosen = anchors[opts.position] || null;
      if (!chosen) {
        var keys = Object.keys(anchors).filter(function (k) { return !collides(anchors[k]); });
        if (!keys.length) keys = Object.keys(anchors);
        var best = null;
        keys.forEach(function (k) {
          var a = anchors[k];
          var st = regionStats(ctx, canvas, a[0], a[1], markW, markH);
          // Contrast is capped because past a point more of it buys nothing, while clutter keeps
          // costing — a calm corner at 5:1 beats a cluttered one at 12:1 every time. Busy is only
          // lightly weighted here on top of that because inkContrast already charges for it.
          var score = Math.min(inkContrast(pickInk(st), st), 8) - st.busy * 5;
          if (!best || score > best.score) best = { score: score, a: a, st: st };
        });
        chosen = best.a;
      }

      var mStats = regionStats(ctx, canvas, chosen[0], chosen[1], markW, markH);
      var mInk = pickInk(mStats);
      var drawable = opts.finish === 'original' ? logo : tintMark(logo, markW, markH, mInk.css);
      ctx.save();
      ctx.shadowColor = haloFor(opts.finish === 'original' ? BRAND_INK.gold : mInk);
      ctx.shadowBlur = Math.round(S * 0.045);
      ctx.drawImage(drawable, chosen[0], chosen[1], markW, markH);
      ctx.restore();

      return canvas.toDataURL('image/jpeg', 0.92);
    });
  }

  // Reused by both tools below: only photo slides can be branded or extended — a video slide has
  // no meaning for either.
  function photoSlides(p) {
    return (p.media || []).filter(function (m) { return !VIDEO_EXT.test(m.media_key || ''); });
  }

  function brandingTool(p) {
    var locked = p.status === 'published' || p.status === 'publishing';
    if (locked) return '';
    var media = photoSlides(p);
    if (!media.length) return '';
    return '<details style="margin-top:8px"><summary style="font-size:11.5px;opacity:.7;cursor:pointer">🏷️ Add branding (logo + optional wording)</summary>' +
      '<div class="brand-panel" data-post="' + esc(p.id) + '" style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfaf6">' +
        '<div class="form-row"><label>Which photo</label><select class="brand-slide">' +
          media.map(function (m, i) { return '<option value="' + esc(m.id) + '" data-key="' + esc(m.media_key) + '">Slide ' + (i + 1) + '</option>'; }).join('') +
        '</select></div>' +
        // Wording first, controls second: the owner came here to say something. Both fields are
        // optional and separately labelled rather than one field with magic syntax — the kicker and
        // the headline are set in different faces at different sizes, so they are different inputs.
        '<div class="form-row"><label>Style</label><select class="brand-preset">' +
          '<option value="overlay">Overlay — mark and wording on the photo</option>' +
          '<option value="poster">Reposado poster — full editorial layout</option>' +
        '</select>' +
          '<p class="hint">The poster builds the whole composition: gold hairline frame, emblem and AÑEJO CATERING CO. centred at the top, the title, a star rule, and a closing line. It needs height, so a square photo is EXTENDED to 9:16 on a field sampled from its own top edge — the food is never stretched or cropped.</p></div>' +
        '<div class="form-row"><label>Wording (optional)</label><input class="brand-text" type="text" maxlength="48" placeholder="e.g. Order by Thursday">' +
          '<p class="hint">Set in Cormorant Garamond, in your own capitalisation. Drawn from these exact characters, never generated — it cannot be misspelled. It resizes and wraps itself to fit the photo.</p></div>' +
        '<div class="form-row"><label>Small line above (optional)</label><input class="brand-kicker" type="text" maxlength="28" placeholder="e.g. This week only">' +
          '<p class="hint">The letterspaced line above the headline. Always set in capitals. On a poster this is the subtitle under the title — e.g. PLANT-BASED WELLNESS BOWL.</p></div>' +
        '<div class="form-row"><label>Accent line — poster only (optional)</label><input class="brand-accent" type="text" maxlength="44" placeholder="e.g. Rooted. Warm. Nourishing.">' +
          '<p class="hint">One restrained italic line, and one is enough — the style says so, and the field is capped to keep it that way.</p></div>' +
        '<div class="form-row"><label>Closing line — poster only (optional)</label><input class="brand-footer" type="text" maxlength="52" placeholder="e.g. Clean sips to pair with your bowl."></div>' +
        '<div class="form-two">' +
          '<div class="form-row"><label>Layout</label><select class="brand-layout">' +
            '<option value="auto">Auto — read the photo</option>' +
            '<option value="editorial">Editorial — lower centre</option>' +
            '<option value="caption">Caption — lower left</option>' +
            '<option value="masthead">Masthead — top</option>' +
          '</select></div>' +
          '<div class="form-row"><label>Mark</label><select class="brand-mark">' +
            '<option value="emblem">Emblem — tree only</option>' +
            '<option value="lockup">Full lockup</option>' +
          '</select></div>' +
        '</div>' +
        '<div class="form-two">' +
          '<div class="form-row"><label>Mark position</label><select class="brand-pos">' +
            '<option value="auto">Auto — calmest spot</option>' +
            '<option value="tc">Top centre</option><option value="bc">Bottom centre</option>' +
            '<option value="br">Bottom right</option><option value="bl">Bottom left</option>' +
            '<option value="tr">Top right</option><option value="tl">Top left</option>' +
          '</select></div>' +
          '<div class="form-row"><label>Mark finish</label><select class="brand-finish">' +
            '<option value="adaptive">Adaptive — one brand colour</option>' +
            '<option value="original">Original colours</option>' +
          '</select></div>' +
        '</div>' +
        '<p class="hint" style="margin-bottom:8px">No plate behind the mark and no band behind the wording. The photo underneath is read first, and the mark and the type are inked in whichever kit colour separates from it — gold, cream or deep forest — so they sit on the image instead of on a box.</p>' +
        '<button class="btn ghost block brand-preview" type="button">Preview branded photo</button>' +
        '<div class="brand-result" style="margin-top:8px"></div>' +
      '</div></details>';
  }

  function wireBranding() {
    Array.prototype.forEach.call(document.querySelectorAll('.brand-preview'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var panel = btn.closest('.brand-panel');
        var postId = panel.getAttribute('data-post');
        var slideSel = panel.querySelector('.brand-slide');
        var chosen = slideSel.options[slideSel.selectedIndex];
        var key = chosen ? chosen.getAttribute('data-key') : '';
        if (!key) { Hub.toast('Pick a photo first.'); return; }
        var pos = panel.querySelector('.brand-pos').value;
        var text = panel.querySelector('.brand-text').value;
        var resultBox = panel.querySelector('.brand-result');
        btn.disabled = true; btn.textContent = 'Compositing…';
        compositeBranding('/api/hub/media/' + key, {
          position: pos === 'auto' ? '' : pos,   // '' means "measure the photo and decide"
          text: text,
          kicker: panel.querySelector('.brand-kicker').value,
          accent: panel.querySelector('.brand-accent').value,
          footer: panel.querySelector('.brand-footer').value,
          preset: panel.querySelector('.brand-preset').value,
          layout: panel.querySelector('.brand-layout').value,
          mark: panel.querySelector('.brand-mark').value,
          finish: panel.querySelector('.brand-finish').value
        })
          .then(function (dataUrl) {
            btn.disabled = false; btn.textContent = 'Preview branded photo';
            resultBox.innerHTML =
              '<img src="' + dataUrl + '" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;margin-bottom:6px">' +
              '<div style="display:flex;gap:8px"><button class="btn gold brand-use" type="button">Use this — add as a new slide</button>' +
              '<button class="btn ghost brand-discard" type="button">Discard</button></div>';
            resultBox.querySelector('.brand-use').addEventListener('click', function () {
              var useBtn = resultBox.querySelector('.brand-use');
              if (useBtn.disabled) return;
              useBtn.disabled = true; useBtn.textContent = 'Saving…';
              // Carry the source slide's role suffix forward (e.g. `_photo`) so a branded AI-made
              // food photo is still RECOGNISED as a food photo by the food-first guard afterward —
              // see social-upload.js's `role` param comment for why this matters.
              var sourceRole = (key.match(/_([a-z0-9]+)\.[a-z0-9]+$/i) || [])[1] || '';
              Hub.api('/api/hub/owner/social-upload', { method: 'POST', body: { data_url: dataUrl, role: sourceRole } })
                .then(function (r) {
                  if (!r || !r.ok || !r.media_key) {
                    Hub.toast((r && r.error) || 'Could not save the branded photo');
                    useBtn.disabled = false; useBtn.textContent = 'Use this — add as a new slide';
                    return;
                  }
                  op({ op: 'attach', id: postId, media_key: r.media_key }, 'Branded photo added as a new slide — the original is unchanged');
                })
                .catch(function () {
                  Hub.toast('Could not save the branded photo');
                  useBtn.disabled = false; useBtn.textContent = 'Use this — add as a new slide';
                });
            });
            resultBox.querySelector('.brand-discard').addEventListener('click', function () { resultBox.innerHTML = ''; });
          })
          .catch(function () {
            btn.disabled = false; btn.textContent = 'Preview branded photo';
            Hub.toast('Could not composite the logo onto that photo — try again.');
          });
      });
    });
  }

  // ---------------------------------------------------------------------------------------------
  // CAROUSEL — generate the REST of a carousel for a draft. One photo is what Creative Studio has
  // always made; a carousel needs several that look shot together, and until now the owner's only
  // way to get more was to generate a cover one at a time and hope the "one at a time" stayed
  // consistent. This calls _lib/carousel_gen.js through the `generate_carousel` op: the owner picks
  // a TOTAL slide count, the server makes however many are missing, and every one of them draws
  // from the SAME art direction as the rest of this post (image_brief or caption) so the set reads
  // as one shoot, not five unrelated bowls.
  //
  // ON DEMAND ONLY — this button is the only thing that calls it; nothing in the planner or any
  // background job generates a carousel automatically, because every slide is a real charge against
  // the weekly AI budget (see the op's `message` on a partial batch for what a spent budget looks
  // like from here).
  function carouselTool(p) {
    var locked = p.status === 'published' || p.status === 'publishing';
    if (locked) return '';
    var count = photoSlides(p).length;
    if (count >= 10) return ''; // Instagram's own ceiling (instagram.js CAROUSEL_MAX) — nothing left to add
    var opts = [];
    var start = Math.max(2, count + 1);
    var dflt = Math.min(count + 4, 10);
    for (var n = start; n <= 10; n++) opts.push('<option value="' + n + '"' + (n === dflt ? ' selected' : '') + '>' + n + ' photos total</option>');
    return '<details style="margin-top:8px"><summary style="font-size:11.5px;opacity:.7;cursor:pointer">🎞️ Generate the rest of a carousel</summary>' +
      '<div style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfaf6">' +
        '<p class="hint" style="margin-bottom:6px">The Team Lead reads your cover and plans the rest as ONE story — distinct on-brand frames that flow from it and end on a call-to-action — and writes the wording for each frame so you can paste it straight into branding. Costs against the weekly AI budget: one provider call per new slide.</p>' +
        '<textarea class="carousel-instr" placeholder="What should the rest be about? (optional) — e.g. “the Palm Beach cities we deliver to”. Leave blank and it infers from the cover." style="width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;margin-bottom:6px"></textarea>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<select class="carousel-count" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px">' + opts.join('') + '</select>' +
          '<button class="btn gold carousel-gen" data-carousel="' + esc(p.id) + '" type="button" style="white-space:nowrap">Generate</button>' +
        '</div>' +
        '<div class="carousel-overlays" style="margin-top:8px"></div>' +
      '</div></details>';
  }

  function wireCarousel() {
    Array.prototype.forEach.call(document.querySelectorAll('.carousel-gen'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        var panel = b.closest('details');
        var sel = panel ? panel.querySelector('.carousel-count') : null;
        var instrEl = panel ? panel.querySelector('.carousel-instr') : null;
        var overEl = panel ? panel.querySelector('.carousel-overlays') : null;
        var count = Number(sel && sel.value);
        if (!count) { Hub.toast('Pick a size first.'); return; }
        // Several ~20-90s provider calls run back to back here — self-disable BEFORE the call for
        // the same reason generate_cover's button does: without it, an owner who sees nothing
        // happen clicks again and pays for a second batch on top of the first.
        b.disabled = true; b.textContent = 'Generating…';
        var body = { op: 'generate_carousel', id: b.getAttribute('data-carousel'), count: count };
        var instr = instrEl && instrEl.value.trim(); if (instr) body.instruction = instr;
        Hub.api('/api/hub/owner/social', { method: 'POST', body: body })
          .then(function (r) {
            if (r && r.ok) {
              Hub.toast(r.message || 'Carousel updated');
              // Surface the Team Lead's per-slide wording so branding is paste-ready, not retyped.
              if (overEl && r.overlays && r.overlays.length) {
                overEl.innerHTML = '<p class="hint" style="margin:2px 0 4px"><b>Wording for each new frame</b> (paste into branding):</p>' +
                  r.overlays.map(function (o) {
                    var line = (o.headline || '') + (o.sub ? ' — ' + o.sub : '');
                    if (!line.trim()) return '';
                    return '<div style="font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)">' +
                      '<b>' + esc(o.role === 'cta' ? 'CTA' : ('Frame ' + ((o.seq || 0) + 1))) + ':</b> ' + esc(line) + '</div>';
                  }).join('');
              }
              load();
            } else { Hub.toast((r && r.error) || 'Could not generate the carousel'); b.disabled = false; b.textContent = 'Generate'; }
          })
          .catch(function () { b.disabled = false; b.textContent = 'Generate'; Hub.toast('Could not generate the carousel'); });
      });
    });
  }

  // ---------------------------------------------------------------------------------------------
  // REFERENCE VARIANT — the owner's own request: "teach [the model] to use the original bowl
  // images and just change the positions, background, themes as we work in different campaigns."
  // Sends one of the 8 REAL bowl photos (public/assets/img/bowl_*.jpg, staged in R2 by
  // _lib/bowl_art.js) into OpenAI/Gemini as a reference image and asks it to restyle only the
  // surroundings — see _lib/reference_variant.js for the exact faithfulness boundary in the prompt.
  //
  // ON DEMAND ONLY, by design (the owner's own next sentence: "there is not that many posts that
  // require replicating the original bowl images"). This tool is the ONLY way `generate_reference_
  // variant` is ever called — never the planner, never a repair button, never automatic.

  // PREVIEW-THEN-COMMIT, same posture as the branding tool right above: Generate makes and STORES
  // the image server-side but does not touch this post; the owner sees it, then taps "Use this —

  // second, explicit tap.
  function referenceVariantTool(p) {
    var locked = p.status === 'published' || p.status === 'publishing';
    if (locked) return '';
    var count = photoSlides(p).length;
    if (count >= 10) return ''; // Instagram's own ceiling — nothing left to add
    var bowls = (DATA && DATA.reference_bowls) || [];
    if (!bowls.length) return '';
    var geminiNote = (DATA && DATA.reference_gemini_configured)
      ? ''
      : ' Runs on OpenAI today — Gemini is built in but not connected yet, so it never gets tried, and OpenAI is never blocked by that.';
    return '<details style="margin-top:8px"><summary style="font-size:11.5px;opacity:.7;cursor:pointer">🖼️ Reference variant — same bowl, new scene</summary>' +
      '<div class="refvar-panel" data-post="' + esc(p.id) + '" style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfaf6">' +
        // THE ONE LINE THE BUILD BRIEF SAID NEVER TO BURY: this is a styled variant of a real
        // photo, not a new picture of the actual food. Plain, up front, every time this panel is
        // opened — not a tooltip, not a footnote.
        '<p class="hint" style="margin-bottom:6px"><b>This makes a styled variant of a real Añejo photo</b> — the exact same dish, ' +
          'a different background and setting. It is never a new picture of food, and the bowl itself is never changed.' + esc(geminiNote) + '</p>' +
        '<div class="form-row"><label>Which bowl</label><select class="refvar-bowl">' +
          bowls.map(function (bw) { return '<option value="' + esc(bw.key) + '">' + esc(bw.label) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-row"><label>Campaign look</label><input class="refvar-look" type="text" maxlength="300" placeholder="e.g. beach picnic, golden hour" style="width:100%">' +
          '<p class="hint">Background, surface, camera angle, lighting, theme — whatever this campaign needs. The food never changes.</p></div>' +
        '<button class="btn ghost block refvar-gen" type="button">Generate</button>' +
        '<div class="refvar-result" style="margin-top:8px"></div>' +
      '</div></details>';

  // BRAND AUDITOR verdict on the card. The row already carries the Haiku judge's output
  // (audit_score / audit_flags / audit_status from migrations/0071, now selected in social.js);
  // this is the missing UI-OUT half — the score, the compact reason list, and the pass/flag
  // verdict the owner should read before approving a time. NULL audit_at (row predates the
  // auditor) reads as UNSCORED, never as passed — matching the migration's own contract.
  function auditBadge(p) {
    var scored = p.audit_at != null || p.audit_status != null || p.audit_score != null;
    if (!scored) {
      return '<div class="audit unscored"><span class="audit-head">🔍 Brand Auditor · not scored yet</span></div>';
    }
    var flags = [];
    if (p.audit_flags) { try { flags = JSON.parse(p.audit_flags) || []; } catch (e) { flags = []; } }
    if (!Array.isArray(flags)) flags = [];
    var status = p.audit_status === 'pass' ? 'pass' : p.audit_status === 'flag' ? 'flag'
      : (flags.length ? 'flag' : 'pass');   // derive from flags if the canonical column is absent
    var label = status === 'pass' ? '✅ Brand Auditor · Pass' : '⚠️ Brand Auditor · Flagged';
    var scoreStr = (p.audit_score != null) ? '<span class="audit-score">Score ' + esc(String(p.audit_score)) + '/100</span>' : '';
    var flagList = flags.length
      ? '<ul>' + flags.map(function (f) {
          var t = f && f.type ? String(f.type) : 'note';
          var d = f && f.detail ? String(f.detail) : '';
          return '<li><b>' + esc(t) + '</b>' + (d ? ' — ' + esc(d) : '') + '</li>';
        }).join('') + '</ul>'
      : (status === 'pass' ? '<div class="row-sub" style="margin-top:2px;font-size:11.5px">No brand or claims issues found.</div>' : '');
    return '<div class="audit ' + status + '"><span class="audit-head">' + label +
      (scoreStr ? ' <span style="opacity:.7">·</span> ' + scoreStr : '') + '</span>' + flagList + '</div>';
  }

  // PROVENANCE on the card — what CAUSED this post, from social.js's batched post_provenance join
  // (migrations/0076 + intel_id 0081). Connects "I wrote a training rule / ran a brief / had this
  // market read" to the post it produced, so effect is finally traceable to cause. A post with no
  // recorded row is UNKNOWN — it predates the feature — and says so plainly rather than implying
  // nothing was behind it. When a row IS present, only the parts that are actually attributed show.
  function provenanceBadge(p) {
    var pr = p.provenance;
    if (!pr || !pr.recorded) {
      return '<div class="prov"><span class="prov-head">🧭 Provenance</span> <span class="prov-unknown">not recorded — this post predates provenance tracking.</span></div>';
    }
    var items = [];
    if (pr.brief_title || pr.brief_id) items.push('<li>📋 Campaign brief: <b>' + esc(pr.brief_title || pr.brief_id) + '</b></li>');
    if (pr.intel_title || pr.intel_id) {
      var kind = pr.intel_kind ? ' (' + esc(pr.intel_kind) + ')' : '';
      items.push('<li>🔎 Market intel' + kind + ': <b>' + esc(pr.intel_title || pr.intel_id) + '</b></li>');
    }
    if (pr.category) items.push('<li>🏷️ Category: <b>' + esc(pr.category) + '</b></li>');
    if (pr.format) items.push('<li>🖼️ Format: <b>' + esc(pr.format) + (pr.slide_count != null && pr.format === 'carousel' ? ' · ' + esc(String(pr.slide_count)) + ' slides' : '') + '</b></li>');
    if (pr.rules_count != null) items.push('<li>📐 Training rules active: <b>' + esc(String(pr.rules_count)) + '</b></li>');
    var body = items.length
      ? '<ul>' + items.join('') + '</ul>'
      : ' <span class="prov-unknown">recorded, but no brief, intel, or rules were attributed to it.</span>';
    return '<div class="prov"><span class="prov-head">🧭 Provenance</span>' + body + '</div>';
  }

  function postCard(p) {
    var mtype = p.media_type || null;   // null = legacy/undeclared (migrations/0080) — image/carousel by slide count, as always
    var slideCap = (mtype === 'REELS' || mtype === 'STORIES') ? 1 : 10;   // Meta allows no carousel for either
    var isFeed = mtype !== 'REELS' && mtype !== 'STORIES';   // branding + carousel generation are feed-post concepts only
    // The image preview uses the HUB-authenticated route, never the public token — the owner is
    // signed in, and printing the public URL here would put it in screenshots.
    return '<div class="post ' + esc(p.status) + '">' +
      '<div class="post-head"><span style="display:flex;gap:6px;align-items:center"><span class="tag ' + esc(p.status) + '">' + (WORD[p.status] || esc(p.status)) + '</span>' +
        (MTYPE_WORD[mtype] ? '<span class="mtype ' + esc(mtype) + '">' + esc(MTYPE_WORD[mtype]) + '</span>' : '') + '</span>' +
        '<span class="row-sub" style="font-size:11.5px">' + esc(when(p)) + '</span></div>' +
      (p.source === 'planner' ? '<div class="row-sub" style="font-size:11px;margin-bottom:4px">✍️ Drafted for you — review before it goes anywhere</div>' : '') +
      // The caption is EDITABLE until it is live. This existed as an API op and not as a field —
      // which meant it did not exist. A published caption is shown read-only: our copy changing
      // after the fact would disagree with what people actually read.
      (p.status === 'published'
        ? '<div class="cap">' + esc(p.caption || '(no caption)') + '</div>'
        : '<textarea id="cap_' + esc(p.id) + '" maxlength="2200" style="width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;line-height:1.5;resize:vertical">' + esc(p.caption || '') + '</textarea>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:4px"><button class="btn ghost" data-editcap="' + esc(p.id) + '" style="font-size:12px;padding:6px 12px">Save caption</button></div>') +
      // Brand Auditor verdict — the score/flags/status the row already carries, so the owner reads
      // WHY a draft is clean or flagged before approving a time.
      auditBadge(p) +
      // Provenance — the brief / market intel / category / format / training rules behind this post.
      provenanceBadge(p) +
      // Slides. One photo is a normal post; 2-10 is a carousel, and the ORDER is editorial — the
      // strip shows it and the arrows change it. All of it locks once the post is live.
      slideStrip(p) +
      coverNote(p) +
      (isFeed ? brandingTool(p) + carouselTool(p) + referenceVariantTool(p) + promptImageTool(p) : '') +
      (p.status === 'published' ? '' : uploadCard(p, mtype, slideCap)) +
      (p.error ? '<div class="row-sub" style="color:var(--crit);margin-top:6px">' + esc(p.error) + '</div>' : '') +
      (p.permalink ? '<div style="margin-top:8px"><a href="' + esc(p.permalink) + '" target="_blank" rel="noopener">View on Instagram →</a></div>' : '') +
      (p.metrics
        ? '<div class="row-sub" style="margin-top:6px;font-size:12px">📊 ' +
          [p.metrics.reach != null ? 'reach ' + p.metrics.reach : null,
           p.metrics.likes != null ? p.metrics.likes + ' likes' : null,
           p.metrics.saved != null ? p.metrics.saved + ' saves' : null,
           p.metrics.comments != null ? p.metrics.comments + ' comments' : null
          ].filter(Boolean).join(' · ') + ' <span style="opacity:.6">(' + esc(p.metrics.capture_date) + ')</span></div>'
        : (p.status !== 'published' ? '' :
            // A Story's insights are impressions/taps/exits, not reach/likes/saves — and this app
            // does not fetch them at all yet (see the STORIES section of _lib/instagram.js). Saying
            // "the daily sweep collects it" here would promise data that is never coming; say what
            // is actually true instead.
            mtype === 'STORIES'
              ? '<div class="row-sub" style="margin-top:6px;font-size:12px;opacity:.6">📊 Stories report different metrics (views, replies, exits) that this HUB does not fetch yet — check them in the Instagram app.</div>'
              : '<div class="row-sub" style="margin-top:6px;font-size:12px;opacity:.6">📊 No performance data yet — the daily sweep collects it.</div>')) +
      (p.status === 'published' ? '' :
        // Approving a time is the human gate the planner deliberately stops short of.
        ((p.media || []).length
          ? '<div class="form-row" style="margin-top:10px"><label>Post it at</label>' +
              '<div style="display:flex;gap:8px"><input type="datetime-local" id="wh_' + esc(p.id) + '" style="flex:1" value="' +
                (p.scheduled_at ? localValue(p.scheduled_at) : '') + '">' +
              (p.status === 'scheduled'
                ? '<button class="btn ghost" data-unsched="' + esc(p.id) + '" style="white-space:nowrap">Cancel</button>'
                : '<button class="btn ghost" data-sched="' + esc(p.id) + '" style="white-space:nowrap">Schedule</button>') +
              '</div></div>'
          : '') +
        '<div class="acts">' +
          ((p.media || []).length ? '<button class="go" data-pub="' + esc(p.id) + '" data-mtype="' + esc(mtype || '') + '">' +
            (p.status === 'failed' ? 'Retry' :
              mtype === 'REELS' ? 'Publish Reel' :
              mtype === 'STORIES' ? 'Publish to Story' :
              (p.media || []).length > 1 ? 'Publish carousel · ' + (p.media || []).length + ' photos' : 'Publish now') + '</button>' : '') +
          '<button class="del" data-del="' + esc(p.id) + '">Delete</button>' +
        '</div>') +
      '</div>';
  }

  // ---------------------------------------------------------------------------------------------
  // GENERATE AN IMAGE — the owner's own complaint, verbatim: "Team used to generate images and
  // now it does a draft I can turn into a real image... I don't see generate image of a single
  // prompt." Everything else that makes a photo in this tab starts from something the post
  // already carries — generate_cover repairs FROM the post's own caption/image_brief,
  // referenceVariantTool restyles ONE of the 8 real bowl photos. Neither is "type a description,
  // get a picture." This is, and it lives in the composer (the FIRST-CLASS spot for a new post,
  // not buried behind a warning state that only appears once a post already exists and is
  // missing a photo).
  //
  // Runs through the exact same op as the repair button (`generate_cover` -> _lib/plate_image.js
  // -> OpenAI -> Gemini -> Workers AI, same $50/week budget gate, same owner-training grounding)
  // — see that op's `prompt` branch in social.js for why this is an extension, not a second path.
  //
  // PREVIEW FIRST, NEVER AUTO-ATTACHED: the server call only generates and stores the image; nothing
  // is added to the post being composed until the owner taps "Use this photo" (which sets the SAME
  // _pickedKey the 📷 uploader sets — the composer does not know or care which source a photo came
  // from) or "Discard" (which simply forgets the preview). An owner-uploaded photo is never
  // touched — this tool only ever writes to `_pickedKey` when the owner explicitly asks it to.
  //
  // State lives on DATA (same pattern as _pickedKey/_draftType) so the typed prompt and any
  // pending preview survive the composer's own re-render, the same way an uploaded key does.
  function genImageBlock() {
    var promptVal = (DATA && DATA._genPrompt) || '';
    var preview = DATA && DATA._genPreview;
    return '<details style="margin-top:8px"><summary style="font-size:11.5px;opacity:.7;cursor:pointer">✨ or generate an image from a description</summary>' +
      '<div style="margin-top:6px">' +
        '<div style="display:flex;gap:8px">' +
          '<input id="genprompt" type="text" maxlength="400" placeholder="e.g. FUEGO bowl on a rustic wood table, morning light" style="flex:1" value="' + esc(promptVal) + '">' +
          '<button class="btn ghost" id="genimg" type="button" style="white-space:nowrap">Generate</button>' +
        '</div>' +
        '<p class="hint">Runs through the same AI photo chain as the rest of Studio — OpenAI, then Gemini, then Workers AI — and costs against the weekly AI budget. Preview first; nothing is used until you tap "Use this photo".</p>' +
        (preview
          ? '<div style="margin-top:8px"><img src="/api/hub/media/' + esc(preview.key) + '" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;margin-bottom:6px">' +
              '<p class="hint" style="margin-bottom:6px">Made by ' + esc(preview.provider || 'the image provider') + ' — still just a preview.</p>' +
              '<div style="display:flex;gap:8px"><button class="btn gold" id="genuse" type="button">Use this photo</button>' +
                '<button class="btn ghost" id="gendiscard" type="button">Discard</button></div></div>'
          : '') +
      '</div></details>';
  }

  function render() {
    var d = DATA;
    var root = document.getElementById('social-root'); root.className = '';
    if (!d || !d.ok) { root.innerHTML = '<div class="hub-empty">Could not load.</div>'; return; }

    // Three states, three different actions: add credentials, fix a broken token, or nothing.
    var status;
    if (!d.configured) {
      status = '<div class="live off"><b>Not set up yet.</b> ' + esc(d.setup || '') + '</div>';
    } else if (d.connected) {
      status = '<div class="live on">🟢 <b>Connected as @' + esc(d.account.username) + '</b> · ' +
        (d.account.followers || 0) + ' followers · ' + (d.account.media_count || 0) + ' posts' +
        '<div class="row-sub" style="margin-top:4px">' + d.remaining_today + ' of ' + d.daily_cap + ' posts left today (Instagram\'s limit).' +
        // Which of Meta's two APIs the token came from — it decides where it gets renewed.
        (d.host === 'instagram_login' ? ' Token renews under Instagram → API setup with Instagram business login.'
          : d.host === 'facebook_login' ? ' Token is a Facebook Page token.' : '') +
        '</div></div>';
    } else {
      status = '<div class="live off">⚠️ <b>Set up, but Instagram refused the token.</b> ' + esc(d.account_error || '') +
        '<div class="row-sub" style="margin-top:4px">Long-lived tokens expire after ~60 days — this usually means it needs renewing.</div></div>';
    }

    // Composer post-type: what the "Photo" field below accepts, and what the draft is tagged with
    // (migrations/0080). Kept in DATA (same pattern as _pickedKey) so choosing it does not lose an
    // already-picked file across the re-render.
    var draftType = (DATA && DATA._draftType) || '';
    var draftIsReel = draftType === 'REELS';
    var draftIsStory = draftType === 'STORIES';

    root.innerHTML =
      '<div class="hub-section"><h2>Instagram</h2>' + status + expiryBanner(d) +
        '<div class="card">' +
          '<div class="form-row"><label>Post type</label>' +
            '<select id="mtypesel">' +
              '<option value=""' + (draftType === '' ? ' selected' : '') + '>Feed photo or carousel</option>' +
              '<option value="REELS"' + (draftIsReel ? ' selected' : '') + '>Reel (video)</option>' +
              '<option value="STORIES"' + (draftIsStory ? ' selected' : '') + '>Story (photo or video)</option>' +
            '</select>' +
            '<p class="hint">' + (draftIsReel ? 'A Reel is one video, and Instagram has no carousel for it.'
              : draftIsStory ? 'A Story is one photo or video, live for 24 hours — no carousel.'
              : 'A feed post: one photo, or a 2-10 photo carousel added after saving.') + '</p></div>' +
          '<div class="form-row"><label>' + (draftIsReel ? 'Video' : draftIsStory ? 'Photo or video' : 'Photo') + '</label>' +
            '<input type="file" id="mfile" accept="image/jpeg" style="display:none">' +
            (draftIsReel ? '' :
              '<button class="btn ghost" id="mpick" type="button">📷 ' + ((DATA && DATA._pickedKey) ? 'Change photo' : 'Upload a photo') + '</button>') +
            ((DATA && DATA._pickedKey) ? '<p class="hint">✓ ' + esc(DATA._pickedKey) + '</p>' : '') +
            '<details style="margin-top:4px"' + (draftIsReel ? ' open' : '') + '><summary style="font-size:11.5px;opacity:.6;cursor:pointer">or paste a Studio ' + (draftType ? 'image/video' : 'image') + ' key</summary>' +
              '<input id="mkey" type="text" placeholder="studio/2026-07/xxxx.' + (draftIsReel ? 'mp4' : 'jpg') + '" style="margin-top:6px" value="' + esc((DATA && DATA._pickedKey) || '') + '"></details>' +
            '<p class="hint">' + (draftIsReel
              ? 'MP4 or MOV, already staged in R2 — video upload from this screen is not available yet, paste the key above.'
              : draftIsStory
                ? 'JPEG from your phone/computer uploads here; an MP4/MOV Story needs a key already staged in R2, pasted above — video upload from this screen is not available yet.'
                : 'JPEG from your phone or computer. Instagram rejects PNG and WebP; iPhone HEIC needs sharing as JPEG first.') + '</p>' +
            (draftIsReel ? '' : genImageBlock()) + '</div>' +
          '<div class="form-row"><label>Caption</label><textarea id="cap" maxlength="2200" placeholder="Write the caption…"></textarea>' +
            '<p class="hint">Up to 2,200 characters. Hashtags count toward it.</p></div>' +
          '<div class="form-row"><label>Schedule (optional)</label><input id="sched" type="datetime-local">' +
            '<p class="hint">Leave empty to save as a draft you publish by hand.</p></div>' +
          '<button class="btn gold block" id="save">Save post</button>' +
        '</div></div>' +
      '<div class="hub-section"><h2>Posts</h2>' +
        (d.posts.length ? d.posts.map(postCard).join('') : '<div class="card"><p class="row-sub">Nothing yet.</p></div>') +
      '</div>';

    wire();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  // datetime-local wants LOCAL parts. toISOString() here would shift by the timezone offset and
  // show a post scheduled for 11am as 7am.
  function localValue(ms) {
    var d = new Date(Number(ms)); function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }

  // One file-picker path for phone and desktop: read the file in the browser, ship it as a data
  // URL, get back the R2 key. The server re-checks the magic bytes — this accept filter is a
  // convenience, not the gate.
  function uploadFile(file, cb) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { Hub.toast('Too large — 5MB max. Export a smaller JPEG.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      Hub.toast('Uploading…');
      Hub.api('/api/hub/owner/social-upload', { method: 'POST', body: { data_url: String(rd.result || '') } })
        .then(function (r) {
          if (r && r.ok && r.media_key) cb(r.media_key);
          else Hub.toast((r && r.error) || 'Upload failed');
        });
    };
    rd.onerror = function () { Hub.toast('Could not read that file.'); };
    rd.readAsDataURL(file);
  }

  function op(body, okMsg) {
    return Hub.api('/api/hub/owner/social', { method:'POST', body: body }).then(function (r) {
      if (r && r.ok) { Hub.toast(okMsg); load(); } else Hub.toast((r && r.error) || 'Could not do that');
      return r;
    });
  }

  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-editcap]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-editcap');
        var el = document.getElementById('cap_' + pid);
        op({ op: 'edit', id: pid, caption: (el && el.value) || '' }, 'Caption saved');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-upload]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-upload');
        var fi = document.getElementById('file_' + pid);
        if (!fi) return;
        fi.onchange = function () {
          uploadFile(fi.files && fi.files[0], function (key) {
            op({ op: 'attach', id: pid, media_key: key }, 'Photo attached');
          });
        };
        fi.click();
      });
    });
    // Generating an image is a 15-20s round trip through an external provider AND it costs money
    // against the weekly AI ceiling. So the button disables ITSELF before the call, not after the
    // response: without that, an owner who sees nothing happen clicks three times and pays three
    // times for three covers. It stays disabled through load() re-rendering the page.
    Array.prototype.forEach.call(document.querySelectorAll('[data-genc]'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        b.disabled = true;
        b.textContent = '🍽️ Generating a food photo…';
        op({ op: 'generate_cover', id: b.getAttribute('data-genc') }, 'Food photo added as slide 1 — still a draft, replace it with a real photo when you have one')
          .then(function (r) {
            // Only re-enable on failure; on success load() has already replaced this card.
            if (!r || !r.ok) { b.disabled = false; b.textContent = '🍽️ Generate a food photo'; }
          })
          .catch(function () { b.disabled = false; b.textContent = '🍽️ Generate a food photo'; });
      });
    });
    wireBranding();
    wireCarousel();
    wireReferenceVariant();
    wirePromptImage();
    Array.prototype.forEach.call(document.querySelectorAll('[data-detach]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-detach').split('|');
        op({ op: 'detach', id: parts[0], media_id: parts[1] }, 'Photo removed');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvl]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvl').split('|');
        moveSlide(parts[0], parts[1], -1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvr]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvr').split('|');
        moveSlide(parts[0], parts[1], 1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-attach]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-attach');
        var v = ((document.getElementById('mk_' + pid) || {}).value || '').trim();
        if (!v) { Hub.toast('Paste the image key first.'); return; }
        op({ op:'attach', id:pid, media_key:v }, 'Image attached');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sched]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-sched');
        var raw = ((document.getElementById('wh_' + pid) || {}).value || '');
        var when = raw ? Date.parse(raw) : NaN;
        if (!Number.isFinite(when)) { Hub.toast('Pick a date and time.'); return; }
        if (!window.confirm('Schedule this to post automatically at ' + whenLabel(when) + '?\n\nIt goes on the public profile without asking again.')) return;
        op({ op:'schedule', id:pid, scheduled_at:when }, 'Scheduled');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-unsched]'), function (b) {
      b.addEventListener('click', function () { op({ op:'unschedule', id:b.getAttribute('data-unsched') }, 'Back to draft'); });
    });
    var teSave = document.getElementById('te_save');
    if (teSave) teSave.addEventListener('click', function () {
      var raw = (document.getElementById('te_date') || {}).value || '';
      if (!raw) { Hub.toast('Pick a date first.'); return; }
      // Parsed as local midnight, same as every other date-only field in the HUB — the exact
      // hour does not matter for a warning measured in days.
      var at = Date.parse(raw + 'T00:00:00');
      if (!Number.isFinite(at)) { Hub.toast('That date did not parse.'); return; }
      op({ op:'set_token_expiry', expires_at: at }, 'Expiry recorded');
    });
    var teClear = document.getElementById('te_clear');
    if (teClear) teClear.addEventListener('click', function () {
      if (!window.confirm('Clear the recorded expiry date? The HUB will show it as unknown until you record it again.')) return;
      op({ op:'set_token_expiry', expires_at: null }, 'Cleared');
    });

    var mtypesel = document.getElementById('mtypesel');
    if (mtypesel) mtypesel.addEventListener('change', function () {
      DATA._draftType = mtypesel.value;
      render();
    });

    var mpick = document.getElementById('mpick');
    if (mpick) mpick.addEventListener('click', function () {
      var fi = document.getElementById('mfile');
      if (!fi) return;
      fi.onchange = function () {
        uploadFile(fi.files && fi.files[0], function (key) {
          DATA._pickedKey = key;
          var mk = document.getElementById('mkey'); if (mk) mk.value = key;
          Hub.toast('Photo ready');
          render();
        });
      };
      fi.click();
    });

    var genBtn = document.getElementById('genimg');
    if (genBtn) genBtn.addEventListener('click', function () {
      if (genBtn.disabled) return;
      var val = ((document.getElementById('genprompt') || {}).value || '').trim();
      if (!val) { Hub.toast('Describe the photo first.'); return; }
      DATA._genPrompt = val;
      // A 20-90s provider call that looks like nothing happened gets clicked twice and charged
      // twice against the weekly AI budget — self-disable BEFORE the call, same as every other
      // generate button in this tab (generate_cover's own repair button, the carousel tool, the
      // reference-variant tool).
      genBtn.disabled = true; genBtn.textContent = 'Generating…';
      // Shape the render to the surface it is being made for, from the media type already chosen
      // right above this control. A Reel or Story is 9:16 and a square render there gets dead
      // pillarbox bars; a FEED post is the opposite — Instagram's tallest feed ratio is 4:5, and
      // portrait is 2:3, so a tall render on a feed post gets cropped by Instagram instead.
      var mtSel = document.getElementById('mtypesel');
      var mtVal = mtSel ? mtSel.value : '';
      var aspect = (mtVal === 'REELS' || mtVal === 'STORIES') ? 'portrait' : 'square';
      Hub.api('/api/hub/owner/social', { method: 'POST', body: { op: 'generate_cover', prompt: val, aspect: aspect } })
        .then(function (r) {
          genBtn.disabled = false; genBtn.textContent = 'Generate';
          if (!r || !r.ok || !r.media_key) { Hub.toast((r && r.error) || 'Could not generate an image'); return; }
          DATA._genPreview = { key: r.media_key, provider: r.provider };
          render();
        })
        .catch(function () { genBtn.disabled = false; genBtn.textContent = 'Generate'; Hub.toast('Could not generate an image'); });
    });
    var genUse = document.getElementById('genuse');
    if (genUse) genUse.addEventListener('click', function () {
      if (!DATA._genPreview) return;
      // The SAME field the 📷 uploader sets — the composer does not care which source a photo
      // came from, only that one is now picked. Nothing is attached to a real post yet: that only
      // happens when "Save post" below actually creates the draft.
      DATA._pickedKey = DATA._genPreview.key;
      DATA._genPreview = null;
      Hub.toast('Photo ready — Save post to use it');
      render();
    });
    var genDiscard = document.getElementById('gendiscard');
    if (genDiscard) genDiscard.addEventListener('click', function () { DATA._genPreview = null; render(); });

    var save = document.getElementById('save');
    if (save) save.addEventListener('click', function () {
      var key = (document.getElementById('mkey') || {}).value || '';
      var cap = (document.getElementById('cap') || {}).value || '';
      var s = (document.getElementById('sched') || {}).value || '';
      var mtype = (document.getElementById('mtypesel') || {}).value || '';
      if (!key.trim()) { Hub.toast(mtype === 'REELS' ? 'Paste a video key first.' : 'Pick an image first.'); return; }
      var when = s ? Date.parse(s) : null;
      save.disabled = true;
      Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'draft', media_key:key.trim(), media_type: mtype || null, caption:cap, scheduled_at: Number.isFinite(when) ? when : null } })
        .then(function (r) {
          save.disabled = false;
          if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not save'); return; }
          Hub.toast(r.status === 'scheduled' ? 'Scheduled' : 'Saved as a draft');
          load();
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-pub]'), function (b) {
      b.addEventListener('click', function () {
        var mt = b.getAttribute('data-mtype');
        // A Story is not a feed post — say so in the one place the owner confirms an irreversible
        // public action, or "the public profile" reads as the grid when it is actually the
        // 24-hour Story tray.
        var confirmMsg = mt === 'REELS' ? 'Publish this Reel now? It goes on your public profile.'
          : mt === 'STORIES' ? 'Publish this to your Story now? It is public for 24 hours, then gone.'
          : 'Publish this to Instagram now? It goes on the public profile.';
        if (!window.confirm(confirmMsg)) return;
        b.disabled = true; b.textContent = 'Publishing…';
        // Deliberately slow: Instagram fetches the image and we poll until it is ready, so this
        // can take ~20 seconds. Better to make them wait than to report success early.
        Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'publish', id:b.getAttribute('data-pub') } })
          .then(function (r) {
            if (r && r.ok) Hub.toast(r.already ? 'That was already live' : 'Posted to Instagram');
            else Hub.toast((r && r.error) || 'Could not publish');
            load();
          });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this post? It has not gone out.')) return;
        Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'delete', id:b.getAttribute('data-del') } })
          .then(function (r) { if (r && r.ok) { Hub.toast('Deleted'); load(); } else Hub.toast((r && r.error) || 'Could not delete'); });
      });
    });
  }

  function load() { Owner.get('/api/hub/owner/social').then(function (d) { DATA = d; render(); }); }
  window.MarketingTabs.createInstagram = load;
})();
</script>

<!-- ============================================================================================
     MODULE: Create > Email — copied from the old campaigns.html unchanged except the mount point
     (owner-root -> campaigns-root). Exposed as MarketingTabs.createEmail (= load). This is a
     DIFFERENT channel than Instagram above: its own compose form, its own audience/consent
     preview, its own "Send now…" confirm — nothing here is shared with the Instagram module, on
     purpose, so a moment of channel confusion cannot become a wrong send.
     ============================================================================================ -->
<script>
(function () {
  if (!window.MarketingTabs) window.MarketingTabs = {};
  var esc = Hub.esc, $ = Hub.$;
  var data = { campaigns: [], segments: [], email_ready: false, sms_ready: false };
  var view = 'list';                 // 'list' | 'compose' | 'detail'
  var detailId = null;
  var draft = { id: null, name: '', channel: 'email', segment: 'launch_list', subject: '', body: '', body_format: 'text', scheduled_at: null, schedule_note: null };
  var preview = null;                // last /preview result for the current segment+channel
  var previewT = 0;
  var sending = false;

  function refresh() { if (window.AnejoI18n) window.AnejoI18n.refresh(); }
  function segLabel(k) {
    for (var i = 0; i < data.segments.length; i++) if (data.segments[i].key === k) return data.segments[i].label;
    return k;
  }
  function statusBadge(s) {
    if (s === 'scheduled') return '<span class="badge warn">scheduled</span>';
    if (s === 'sent')     return '<span class="badge ok">sent</span>';
    if (s === 'sending')  return '<span class="badge warn">sending</span>';
    if (s === 'canceled') return '<span class="badge">canceled</span>';
    return '<span class="badge">draft</span>';
  }
  function chanBadge(c) {
    return c === 'sms'
      ? '<span class="badge" style="background:#fff4e8;border-color:#b5651d;color:#7a3f00">SMS</span>'
      : '<span class="badge">Email</span>';
  }

  // ---------- shell ----------
  function render() {
    var root = document.getElementById('campaigns-root'); root.className = '';
    root.innerHTML =
      '<div class="hub-section">' +
        '<div class="pt-chips" id="chips"></div>' +
        '<div id="pane"></div>' +
      '</div>';
    $('#chips').innerHTML = [
      { k: 'list',    label: 'Campaigns' },
      { k: 'compose', label: '+ New campaign' }
    ].map(function (d) {
      return '<button data-v="' + d.k + '" class="' + (d.k === view ? 'sel' : '') + '"><span data-i18n>' + d.label + '</span></button>';
    }).join('');
    $('#chips').querySelectorAll('[data-v]').forEach(function (bt) {
      bt.addEventListener('click', function () {
        var v = bt.getAttribute('data-v');
        if (v === 'compose') newDraft();
        view = v; render();
      });
    });

    if (view === 'compose') paintCompose();
    else if (view === 'detail') paintDetail();
    else paintList();
    refresh();
  }

  function newDraft() {
    draft = { id: null, name: '', channel: 'email', segment: 'launch_list', subject: '', body: '', body_format: 'text', scheduled_at: null, schedule_note: null };
    preview = null;
  }

  // ---------- list ----------
  function paintList() {
    if (!data.campaigns.length) {
      $('#pane').innerHTML = '<div class="card accent"><p data-i18n>No campaigns yet. “+ New campaign” drafts one — you will see exactly who it reaches, and who it does not, before anything sends.</p></div>';
      return;
    }
    $('#pane').innerHTML = data.campaigns.map(function (c) {
      var right = c.status === 'scheduled'
        ? '<span>' + esc(whenLabel(c.scheduled_at)) + '</span>'
        : c.status === 'draft'
        ? '<span data-i18n>draft</span>'
        : (c.sent_count || 0) + ' <span data-i18n>sent</span>' +
          (c.failed_count ? ' · ' + c.failed_count + ' <span data-i18n>failed</span>' : '') +
          (c.skipped ? ' · ' + c.skipped + ' <span data-i18n>skipped</span>' : '');
      return '<div class="card list-row" data-c="' + esc(c.id) + '" style="cursor:pointer">' +
        '<div><strong>' + esc(c.name) + '</strong> ' + chanBadge(c.channel) + ' ' + statusBadge(c.status) +
          '<div><small>' + esc(segLabel(c.segment)) + (c.subject ? ' · ' + esc(c.subject) : '') + '</small></div></div>' +
        '<div class="pt-right">' + right +
          (c.queued ? '<div>' + c.queued + ' <span data-i18n>left to send</span></div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    $('#pane').querySelectorAll('[data-c]').forEach(function (el) {
      el.addEventListener('click', function () { open(el.getAttribute('data-c')); });
    });
  }

  function open(cid) {
    var c = data.campaigns.filter(function (x) { return x.id === cid; })[0];
    if (!c) return;
    if (c.status === 'draft' || c.status === 'scheduled') {
      draft = { id: c.id, name: c.name || '', channel: c.channel || 'email', segment: c.segment,
                subject: c.subject || '', body: c.body || '', body_format: c.body_format === 'html' ? 'html' : 'text',
                scheduled_at: c.scheduled_at || null, schedule_note: c.schedule_note || null };
      preview = null;
      view = 'compose';
    } else {
      detailId = cid; view = 'detail';
    }
    render();
  }

  // ---------- the exclusion panel ----------
  // Plain English on purpose. "127 excluded" teaches nobody anything; "they never opted in to
  // marketing texts, and order-update consent is not the same permission" does.
  function exclusionCopy(channel) {
    return channel === 'sms' ? {
      no_consent: 'have not given express written consent for marketing texts. The consent we already hold is for order and delivery updates — a different permission, and not one that can be stretched to cover a promotion.',
      unsubscribed: 'have opted out of marketing texts.',
      no_address: 'have no mobile number on file.'
    } : {
      no_consent: 'have marketing email switched off on their record.',
      unsubscribed: 'have unsubscribed from marketing email.',
      no_address: 'have no email address on file.'
    };
  }

  function reachHtml() {
    if (!preview) return '<div class="reach"><span data-i18n>Counting the audience…</span></div>';
    var copy = exclusionCopy(preview.channel);
    var rows = [
      { k: 'no_consent',   n: preview.skipped.no_consent,   why: copy.no_consent },
      { k: 'unsubscribed', n: preview.skipped.unsubscribed, why: copy.unsubscribed },
      { k: 'no_address',   n: preview.skipped.no_address,   why: copy.no_address }
    ].filter(function (r) { return r.n > 0; });

    var src = [];
    Object.keys(preview.by_source || {}).forEach(function (k) { src.push(preview.by_source[k] + ' ' + k.replace(/_/g, ' ')); });

    var html =
      '<div class="reach">' +
        '<div class="big">' + preview.count + '</div>' +
        '<div><span data-i18n>people will receive this</span>' +
          (preview.channel === 'sms' ? ' <span data-i18n>by text</span>' : ' <span data-i18n>by email</span>') + '</div>' +
        (src.length ? '<p class="hint" style="margin-top:6px">' + esc(src.join(' · ')) + '</p>' : '') +
      '</div>';

    html += '<div class="excl"><h4 data-i18n>Who will NOT get this, and why</h4>';
    if (!rows.length) {
      html += '<p class="hint" data-i18n>Nobody in this segment is being excluded.</p>';
    } else {
      html += rows.map(function (r) {
        return '<div class="excl-row"><span data-i18n>' + r.why + '</span><b>' + r.n + '</b></div>';
      }).join('');
      html += '<p class="hint" style="margin-top:8px">' + preview.excluded + ' <span data-i18n>of</span> ' +
        preview.evaluated + ' <span data-i18n>people in this segment are excluded.</span></p>';
    }
    html += '</div>';

    if (preview.channel === 'sms' && preview.count === 0) {
      html += '<div class="warn" data-i18n>Nobody has opted in to marketing texts yet. That is expected: the consent already on file was collected for order and delivery updates, and nobody was carried over into marketing. This list fills up only as people tick a box that specifically says marketing texts.</div>';
    }
    if (!preview.channel_ready) {
      html += '<div class="warn" data-i18n>This channel is not configured on the server, so sending will be refused.</div>';
    }
    return html;
  }

  function loadPreview() {
    var box = $('#reach');
    if (box) box.innerHTML = '<div class="reach"><span data-i18n>Counting the audience…</span></div>';
    clearTimeout(previewT);
    previewT = setTimeout(function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'preview', segment: draft.segment, channel: draft.channel } })
        .then(function (d) {
          if (!d || !d.ok) { preview = null; if ($('#reach')) $('#reach').innerHTML = '<div class="excl"><p class="hint">' + esc((d && d.error) || 'Could not count that segment.') + '</p></div>'; return; }
          preview = d;
          if ($('#reach')) $('#reach').innerHTML = reachHtml();
          refresh();
        });
    }, 180);
  }

  // ---------- compose ----------
  function paintCompose() {
    var isSms = draft.channel === 'sms';
    var isHtml = !isSms && draft.body_format === 'html';
    $('#pane').innerHTML =
      '<div class="card">' +
        '<h3 data-i18n>' + (draft.id ? 'Edit draft' : 'New campaign') + '</h3>' +
        '<div class="form-row"><label data-i18n>Internal name</label><input id="f_name" autocomplete="off" value="' + esc(draft.name) + '"></div>' +
        '<div class="form-two">' +
          '<div class="form-row"><label data-i18n>Channel</label><select id="f_chan">' +
            '<option value="email"' + (isSms ? '' : ' selected') + '>Email</option>' +
            '<option value="sms"' + (isSms ? ' selected' : '') + '>SMS</option></select></div>' +
          '<div class="form-row"><label data-i18n>Segment</label><select id="f_seg">' +
            data.segments.map(function (s) {
              return '<option value="' + esc(s.key) + '"' + (s.key === draft.segment ? ' selected' : '') + '>' + esc(s.label) + '</option>';
            }).join('') +
          '</select></div>' +
        '</div>' +
        '<p class="hint" id="segwhy"></p>' +
        // Shown only when the test segment is selected. An always-visible field for a setting you
        // touch twice a year is clutter; this one only matters at the moment you are testing.
        (draft.segment === 'test'
          ? '<div class="form-row"><label>Send test to</label>' +
            '<input id="f_testto" autocomplete="off" placeholder="you@example.com" value="' + esc(data.test_recipients || '') + '">' +
            '<p class="hint">Comma-separated, max 5. Only these addresses receive it — no customer is touched. ' +
            'Consent is not checked here (you do not need your own permission to email yourself), but a bounced address is still skipped.</p></div>'
          : '') +
        // Compliance surfaced where the send actually happens, not buried in a settings page.
        // Email only — CAN-SPAM governs email; SMS carries its own STOP disclosure instead.
        // Shown ONLY while the fallback is in use; once a real address is set this goes quiet.
        ((!isSms && data.postal_is_fallback)
          ? '<div class="form-row" style="border-left:4px solid #d64545;padding-left:10px">' +
            '<label>Postal address on marketing email</label>' +
            '<input id="f_postal" autocomplete="off" placeholder="1234 Okeechobee Blvd, Suite 200, West Palm Beach, FL 33401">' +
            '<p class="hint">Currently <b>' + esc(data.postal_address || '') + '</b> — a county is not a postal address, so ' +
            'marketing email does not yet meet CAN-SPAM. A <b>PO Box</b> or a <b>virtual mailbox</b> both satisfy it; ' +
            'you do not have to publish your home address. Fine to leave while you are only testing yourself.</p></div>'
          : '') +
        '<div class="form-row" id="subjrow" style="' + (isSms ? 'display:none' : '') + '">' +
          '<label data-i18n>Subject line</label><input id="f_subj" autocomplete="off" value="' + esc(draft.subject) + '"></div>' +
        // Saved templates for THIS channel. An email template in an SMS dropdown is a trap.
        (function () {
          var mine = (data.templates || []).filter(function (x) { return (x.channel || 'email') === draft.channel; });
          if (!mine.length) return '<p class="hint" style="margin-bottom:10px">No saved templates yet — write or load one below, then “Save as template”.</p>';
          return '<div class="form-row"><label>Saved templates</label>' +
            '<div style="display:flex;gap:8px"><select id="f_tpl" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px">' +
              '<option value="">— pick a template —</option>' +
              mine.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + (x.body_format === 'html' ? ' (HTML)' : '') + '</option>'; }).join('') +
            '</select>' +
            '<button class="btn ghost" id="f_tplload" type="button" style="white-space:nowrap">Load</button>' +
            '<button class="btn ghost" id="f_tpldel" type="button" style="white-space:nowrap;color:#8a2b22">Delete</button></div>' +
            '<p class="hint">Loading replaces the subject, format and message below. It does not change the segment, and it never touches a campaign already sent.</p></div>';
        })() +
        // Email only. SMS has no HTML, so offering the choice there would be a control that
        // cannot do anything.
        (isSms ? '' :
          '<div class="form-row"><label data-i18n>Message format</label><select id="f_fmt">' +
            '<option value="text"' + (isHtml ? '' : ' selected') + '>Write it here (plain text)</option>' +
            '<option value="html"' + (isHtml ? ' selected' : '') + '>Use a designed HTML template</option>' +
          '</select></div>') +
        (isHtml
          ? '<div class="form-row"><label>Template file</label>' +
            '<input id="f_file" type="file" accept=".html,.htm,text/html">' +
            '<p class="hint">Pick a .html file and it loads into the box below. Nothing is uploaded — the file is read here in the browser.</p></div>'
          : '') +
        '<div class="form-row"><label data-i18n>Message</label>' +
          '<textarea id="f_body"' + (isHtml ? ' spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:220px"' : '') +
            ' placeholder="' + (isHtml ? 'Paste the full HTML document, or pick a file above.' : 'Blank line starts a new paragraph.') + '">' + esc(draft.body) + '</textarea></div>' +
        (isHtml ? '<div class="form-two" style="margin-bottom:6px"><button class="btn ghost" id="f_prev" type="button">Preview it</button><span></span></div>' : '') +
        '<p class="hint" id="bodyhint"></p>' +
        '<div id="tplaudit"></div>' +
        // A schedule that did not fire must say so HERE, not vanish into a draft that looks like
        // the owner never scheduled it.
        (draft.schedule_note ? '<div class="warn" style="margin-top:10px">' + esc(draft.schedule_note) + '</div>' : '') +
        '<div id="reach"></div>' +
        '<p class="legal" id="legal"></p>' +
        '<div class="form-two" style="margin-top:12px">' +
          '<button class="btn ghost" id="f_save" data-i18n>Save draft</button>' +
          '<button class="btn gold" id="f_send" data-i18n>Send now…</button>' +
        '</div>' +
        '<div class="form-two" style="margin-top:8px">' +
          '<button class="btn ghost" id="f_tplsave" type="button">Save as template</button><span></span>' +
        '</div>' +
        scheduleBlock() +
        '<p class="prog" id="prog"></p>' +
        '<p class="hint" id="msg"></p>' +
      '</div>';

    paintSegWhy();
    paintLegal();
    wireTemplates();
    wireSchedule();
    paintBodyHint();
    loadPreview();

    $('#f_chan').addEventListener('change', function () {
      draft.channel = $('#f_chan').value === 'sms' ? 'sms' : 'email';
      collect(); render();
    });
    $('#f_seg').addEventListener('change', function () {
      draft.segment = $('#f_seg').value; collect(); render(); loadPreview();
    });
    $('#f_body').addEventListener('input', paintBodyHint);
    (function () {
      var fm = document.getElementById('f_fmt');
      if (fm) fm.addEventListener('change', function () {
        draft.body_format = fm.value === 'html' ? 'html' : 'text';
        collect(); render();
      });
      var fi = document.getElementById('f_file');
      if (fi) fi.addEventListener('change', function () {
        var f = fi.files && fi.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          $('#f_body').value = String(rd.result || '');
          draft.body = $('#f_body').value;
          if (!draft.name) { draft.name = f.name.replace(/\.html?$/i, ''); var n = document.getElementById('f_name'); if (n) n.value = draft.name; }
          paintBodyHint();
          Hub.toast('Loaded ' + f.name);
        };
        rd.onerror = function () { Hub.toast('Could not read that file.'); };
        rd.readAsText(f);
      });
      var pv = document.getElementById('f_prev');
      if (pv) pv.addEventListener('click', function () { collect(); openPreview(); });
    })();
    bindTestTo();
    (function () {
      var pa = document.getElementById('f_postal');
      if (!pa) return;
      pa.addEventListener('blur', function () {
        if (!pa.value.trim()) return;
        Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'set_postal_address', value: pa.value } })
          .then(function (r) {
            if (r && r.ok) { Hub.toast('Postal address saved'); load(); }
            else Hub.toast((r && r.error) || 'Could not save');
          });
      });
    })();
    $('#f_save').addEventListener('click', function () { collect(); save().then(function (ok) { if (ok) { $('#msg').textContent = 'Draft saved.'; load(); } }); });
    $('#f_send').addEventListener('click', function () { collect(); startSend(); });
    refresh();
  }

  // ---------- schedule ----------
  function whenLabel(ms) {
    return new Date(Number(ms)).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

  // Default the picker to the next round hour, local time. datetime-local wants a local-time
  // string with no zone, so it is built from the local parts — using this here would offset
  // it by the timezone and quietly schedule the send four hours early.
  function defaultWhen() {
    var d = new Date(Date.now() + 60 * 60 * 1000);
    d.setMinutes(0, 0, 0);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function scheduleBlock() {
    if (!draft.id && !draft.scheduled_at) {
      return '<p class="hint" style="margin-top:10px">Save the draft first, then you can schedule it.</p>';
    }
    // A campaign already scheduled shows WHEN, and one control: take it off again.
    if (draft.scheduled_at) {
      return '<div class="reach" style="margin-top:12px">' +
        '<div><b>Scheduled to send ' + esc(whenLabel(draft.scheduled_at)) + '</b> — your local time.</div>' +
        (data.scheduler_ready ? '' :
          '<div class="warn" style="margin:8px 0 0">The scheduler is not configured, so this will <b>not</b> send on its own. Use “Send now” instead.</div>') +
        '<div class="form-two" style="margin-top:10px"><button class="btn ghost" id="f_unsched" type="button">Cancel schedule</button><span></span></div>' +
      '</div>';
    }
    return '<div class="form-row" style="margin-top:12px"><label>Or send it later</label>' +
      '<div style="display:flex;gap:8px"><input id="f_when" type="datetime-local" style="flex:1" value="' + defaultWhen() + '">' +
      '<button class="btn ghost" id="f_sched" type="button" style="white-space:nowrap">Schedule</button></div>' +
      '<p class="hint">Your local time. The audience is worked out when it fires, not now — so anyone who joins between now and then is included.' +
      (data.scheduler_ready ? '' : ' <b>The scheduler is not configured yet, so a scheduled campaign would not send.</b>') + '</p></div>';
  }

  function wireSchedule() {
    var sc = document.getElementById('f_sched');
    if (sc) sc.addEventListener('click', function () {
      collect();
      var raw = (document.getElementById('f_when') || {}).value || '';
