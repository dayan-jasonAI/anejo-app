      var when = raw ? Date.parse(raw) : NaN;
      if (!Number.isFinite(when)) { Hub.toast('Pick a date and time.'); return; }
      // Save first: scheduling copy that was never written to the row would send the OLD body.
      save().then(function (ok) {
        if (!ok) return;
        Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'schedule', id: draft.id, scheduled_at: when } })
          .then(function (r) {
            if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not schedule'); return; }
            draft.scheduled_at = r.scheduled_at;
            Hub.toast('Scheduled for ' + whenLabel(r.scheduled_at));
            load();
          });
      });
    });
    var un = document.getElementById('f_unsched');
    if (un) un.addEventListener('click', function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'unschedule', id: draft.id } })
        .then(function (r) {
          if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not cancel'); return; }
          draft.scheduled_at = null;
          Hub.toast('Schedule cancelled — it is a draft again.');
          load();
        });
    });
  }

  // ---------- the template library ----------
  function wireTemplates() {
    var ld = document.getElementById('f_tplload');
    if (ld) ld.addEventListener('click', function () {
      var sel = document.getElementById('f_tpl');
      var t = (data.templates || []).filter(function (x) { return x.id === (sel && sel.value); })[0];
      if (!t) { Hub.toast('Pick a template first.'); return; }
      // Deliberately NOT silent: this overwrites what is in the box.
      if (draft.body.trim() && !window.confirm('Replace the message below with “' + t.name + '”?')) return;
      draft.subject = t.subject || draft.subject;
      draft.body = t.body || '';
      draft.body_format = t.body_format === 'html' ? 'html' : 'text';
      render();
      Hub.toast('Loaded “' + t.name + '”');
    });

    var dl = document.getElementById('f_tpldel');
    if (dl) dl.addEventListener('click', function () {
      var sel = document.getElementById('f_tpl');
      var t = (data.templates || []).filter(function (x) { return x.id === (sel && sel.value); })[0];
      if (!t) { Hub.toast('Pick a template first.'); return; }
      if (!window.confirm('Delete the template “' + t.name + '”? Campaigns already sent are not affected.')) return;
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'template_delete', id: t.id } })
        .then(function (r) { if (r && r.ok) { Hub.toast('Deleted'); load(); } else Hub.toast((r && r.error) || 'Could not delete'); });
    });

    var sv = document.getElementById('f_tplsave');
    if (sv) sv.addEventListener('click', function () {
      collect();
      if (!draft.body.trim()) { Hub.toast('There is nothing to save yet.'); return; }
      var name = window.prompt('Save this as a template called:', draft.name || '');
      if (name === null) return;
      name = name.trim();
      if (!name) { Hub.toast('Give the template a name.'); return; }
      var existing = (data.templates || []).filter(function (x) {
        return x.name === name && (x.channel || 'email') === draft.channel;
      })[0];
      if (existing && !window.confirm('“' + name + '” already exists. Replace it?')) return;
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: {
        op: 'template_save', name: name, channel: draft.channel,
        subject: draft.subject, body: draft.body, body_format: draft.body_format
      } }).then(function (r) {
        if (r && r.ok) { Hub.toast('Saved “' + name + '”'); load(); }
        else Hub.toast((r && r.error) || 'Could not save');
      });
    });
  }

  function paintSegWhy() {
    var s = data.segments.filter(function (x) { return x.key === draft.segment; })[0];
    var el = $('#segwhy'); if (el && s) { el.textContent = s.why; }
  }

  // The compliance note is shown while writing, not after — it is a constraint on the copy,
  // not a disclaimer bolted on at send time.
  function paintLegal() {
    var el = $('#legal'); if (!el) return;
    var addr = data.postal_address || 'Añejo Catering Co. · Palm Beach County, FL';
    el.innerHTML = draft.channel === 'sms'
      ? 'Every text ends with “Reply STOP to opt out.” — added automatically if you don’t write it. Only people who gave express consent for <em>marketing</em> texts are included.'
      : 'Every email carries a one-click unsubscribe link and “' + esc(addr) + '” in the footer. That is what makes emailing your customer list lawful, so it is not optional.' +
        (draft.body_format === 'html'
          ? ' A designed template gets that footer added underneath it — unless the template places <code>{{unsubscribe_url}}</code> and <code>{{postal_address}}</code> itself, in which case the design is left alone.'
          : '');
  }

  function paintBodyHint() {
    var el = $('#bodyhint'); if (!el) return;
    var n = ($('#f_body') && $('#f_body').value.length) || 0;
    if (draft.channel === 'sms') {
      var withOptOut = n + 26;   // "\n\nReply STOP to opt out."
      el.textContent = n + ' characters (~' + withOptOut + ' with the opt-out line). Over 160 sends as multiple segments and is billed per segment.';
    } else if (draft.body_format === 'html') {
      var src = ($('#f_body') && $('#f_body').value) || '';
      var kb = (new Blob([src]).size / 1024);
      el.textContent = Math.round(kb * 10) / 10 + ' KB of HTML.';
      paintTemplateAudit(src, kb);
    } else {
      el.textContent = n + ' characters. A blank line starts a new paragraph.';
    }
  }

  // Everything below is knowable before the send, so it is said before the send. Finding out that
  // a grey compliance strip was stapled under your artwork by looking at your own inbox copy —
  // after it reached the list — is the outcome this panel exists to prevent.
  function paintTemplateAudit(src, kb) {
    var el = document.getElementById('tplaudit'); if (!el) return;
    if (!src.trim()) { el.innerHTML = ''; return; }
    var hasUnsub  = /\{\{\s*unsubscribe_url\s*\}\}/i.test(src);
    var hasPostal = /\{\{\s*postal_address\s*\}\}/i.test(src);
    var notes = [];
    if (!(hasUnsub && hasPostal)) {
      notes.push('A compliance footer will be <b>added below your design</b> — it carries the unsubscribe link and the postal address, both legally required. ' +
        'To place them yourself instead, put <code>{{unsubscribe_url}}</code> and <code>{{postal_address}}</code> in your own footer. ' +
        'Both are needed; one on its own still gets the added block.');
    } else {
      notes.push('Your template carries the unsubscribe link and postal address itself, so <b>nothing is added</b> — the design goes out exactly as written.');
    }
    if (kb > 99) notes.push('<b>Over 100 KB.</b> Gmail clips messages around that size and hides the rest behind “View entire message” — including the unsubscribe link, which sits at the bottom.');
    if (/<link\b[^>]*rel=["\']?stylesheet/i.test(src)) notes.push('There is a <code>&lt;link&gt;</code> stylesheet (usually a webfont). Gmail and Outlook strip it, so the email falls back to the fonts named inline. That is normal, not a fault — it just will not look like the browser.');
    if (/<script\b/i.test(src)) notes.push('There is a <code>&lt;script&gt;</code> tag. It is removed before sending — no email client runs scripts.');
    if (!/<body\b/i.test(src) && !/<html\b/i.test(src)) notes.push('This looks like a fragment rather than a whole document. It will still send, but a full <code>&lt;html&gt;</code>…<code>&lt;/html&gt;</code> renders more predictably.');
    notes.push('You can also use <code>{{first_name}}</code>, <code>{{name}}</code> and <code>{{email}}</code> anywhere in the template.');
    el.innerHTML = '<div class="excl" style="margin-top:10px"><h4>Before you send</h4>' +
      notes.map(function (n) { return '<div class="excl-row"><span>' + n + '</span></div>'; }).join('') + '</div>';
  }

  // Rendered in a sandboxed frame: it is the owner's own markup, but a preview that could run
  // script in the HUB would be a preview with more privileges than the inbox it is imitating.
  function openPreview() {
    var src = draft.body || '';
    if (!src.trim()) { Hub.toast('Nothing to preview yet.'); return; }
    var w = document.getElementById('tplframe');
    if (w) w.remove();
    var wrap = document.createElement('div');
    wrap.id = 'tplframe';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99995;display:flex;flex-direction:column;padding:14px;';
    wrap.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">' +
        '<span style="color:#fff;font-size:13px">Preview — merge tokens shown as sample values</span>' +
        '<button id="tplclose" class="btn ghost" style="background:#fff">Close</button></div>' +
      '<iframe sandbox="" style="flex:1;width:100%;border:0;border-radius:10px;background:#fff"></iframe>';
    document.body.appendChild(wrap);
    // Sample values, clearly marked: a preview that silently renders an empty {{first_name}} looks
    // like a bug, and one that renders a real unsubscribe URL invites clicking it.
    var demo = src
      .replace(/\{\{\s*unsubscribe_url\s*\}\}/gi, '#unsubscribe-link')
      .replace(/\{\{\s*postal_address\s*\}\}/gi, esc(data.postal_address || ''))
      .replace(/\{\{\s*first_name\s*\}\}/gi, 'Arianne')
      .replace(/\{\{\s*name\s*\}\}/gi, 'Arianne Vega')
      .replace(/\{\{\s*email\s*\}\}/gi, 'arianne@example.com');
    wrap.querySelector('iframe').srcdoc = demo;
    document.getElementById('tplclose').addEventListener('click', function () { wrap.remove(); });
  }

  // Save the test recipients as soon as focus leaves the field, so the setting is not lost if the
  // page reloads before a send.
  function bindTestTo() {
    var el = document.getElementById('f_testto');
    if (!el) return;
    el.addEventListener('blur', function () {
      Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'set_test_recipients', value: el.value } })
        .then(function (r) {
          if (r && r.ok) { data.test_recipients = r.test_recipients; Hub.toast('Test recipients saved'); }
          else Hub.toast((r && r.error) || 'Could not save');
        });
    });
  }

  function collect() {
    if ($('#f_name')) draft.name = $('#f_name').value.trim();
    if ($('#f_body')) draft.body = $('#f_body').value;
    if ($('#f_subj')) draft.subject = $('#f_subj').value.trim();
    if ($('#f_seg')) draft.segment = $('#f_seg').value;
    if ($('#f_fmt')) draft.body_format = $('#f_fmt').value === 'html' ? 'html' : 'text';
  }

  // Save first, always: a campaign has to exist as a row before it can be sent, and that row is
  // the audit trail of exactly what copy went out.
  function save() {
    var body = { op: 'save', id: draft.id, name: draft.name, channel: draft.channel,
                 segment: draft.segment, subject: draft.subject, body: draft.body,
                 body_format: draft.body_format || 'text' };
    if (!body.name) { $('#msg').textContent = 'Give the campaign a name.'; return Promise.resolve(false); }
    if (!body.body) { $('#msg').textContent = 'Write the message.'; return Promise.resolve(false); }
    if (draft.channel === 'email' && !body.subject) { $('#msg').textContent = 'An email campaign needs a subject line.'; return Promise.resolve(false); }
    $('#msg').textContent = '…';
    return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: body }).then(function (d) {
      if (!d || !d.ok) { $('#msg').textContent = (d && d.error) || 'Could not save.'; return false; }
      draft.id = d.id;
      $('#msg').textContent = '';
      return true;
    });
  }

  // ---------- sending ----------
  function startSend() {
    if (sending) return;
    save().then(function (ok) {
      if (!ok) return;
      // Re-count immediately before asking: the number in the confirm must be the number the
      // server is about to act on, not one from a preview several edits ago.
      return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: { op: 'preview', segment: draft.segment, channel: draft.channel } })
        .then(function (p) {
          if (!p || !p.ok) { $('#msg').textContent = (p && p.error) || 'Could not count the audience.'; return; }
          preview = p;
          if ($('#reach')) $('#reach').innerHTML = reachHtml();
          refresh();
          if (!p.count) { $('#msg').textContent = 'Nobody in that segment is reachable on this channel.'; return; }
          var what = draft.channel === 'sms' ? 'text messages' : 'emails';
          var line = 'Send "' + draft.name + '" — ' + p.count + ' ' + what + ' to ' + segLabel(draft.segment) + '.\n\n' +
                     p.excluded + ' people are excluded (see the panel above).\n\nThis cannot be undone. Send now?';
          if (!window.confirm(line)) return;
          runSend(draft.id, p.count);
        });
    });
  }

  // A Worker cannot hold a 500-recipient send open, so the page drives it: each call sends a
  // batch and reports what is left, and a dropped connection resumes instead of double-sending.
  function runSend(cid, expect) {
    sending = true;
    var send = $('#f_send'), sv = $('#f_save');
    if (send) send.disabled = true;
    if (sv) sv.disabled = true;

    function step(first) {
      var body = { op: 'send', id: cid };
      // `expect` is the number the owner just confirmed. Resuming has no such number — the
      // audience was frozen at the first send and must not be re-counted.
      if (first && typeof expect === 'number') body.expect = expect;
      return Hub.api('/api/hub/owner/campaigns', { method: 'POST', body: body }).then(function (d) {
        if (!d || !d.ok) {
          if ($('#prog')) $('#prog').textContent = (d && d.error) || 'Send stopped.';
          sending = false; if (send) send.disabled = false; if (sv) sv.disabled = false;
          load(); return;
        }
        if ($('#prog')) {
          $('#prog').textContent = d.done
            ? 'Done — ' + d.totals.sent + ' sent, ' + d.totals.failed + ' failed, ' + d.totals.skipped + ' skipped.'
            : 'Sending… ' + d.totals.sent + ' sent, ' + d.remaining + ' to go.';
        }
        if (!d.done) return step(false);
        sending = false; if (send) send.disabled = false; if (sv) sv.disabled = false;
        newDraft(); view = 'list'; load();
      });
    }
    if ($('#prog')) $('#prog').textContent = 'Starting…';
    step(true);
  }

  // ---------- detail (a campaign that has already left the drafts) ----------
  function paintDetail() {
    var c = data.campaigns.filter(function (x) { return x.id === detailId; })[0];
    if (!c) { view = 'list'; render(); return; }
    $('#pane').innerHTML =
      '<button class="btn ghost" id="back" data-i18n>← Back</button>' +
      '<div class="card" style="margin-top:10px">' +
        '<h3>' + esc(c.name) + ' ' + chanBadge(c.channel) + ' ' + statusBadge(c.status) + '</h3>' +
        '<p class="hint">' + esc(segLabel(c.segment)) + (c.subject ? ' · ' + esc(c.subject) : '') + '</p>' +
        '<div class="excl" style="margin-top:12px">' +
          '<div class="excl-row"><span data-i18n>Recipients frozen at send</span><b>' + (c.recipients || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Sent</span><b>' + (c.sent_count || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Failed</span><b>' + (c.failed_count || 0) + '</b></div>' +
          '<div class="excl-row"><span data-i18n>Skipped (bounced or complained before)</span><b>' + (c.skipped || 0) + '</b></div>' +
          (c.queued ? '<div class="excl-row"><span data-i18n>Still queued</span><b>' + c.queued + '</b></div>' : '') +
        '</div>' +
        (c.status === 'sending'
          ? '<button class="btn gold" id="resume" style="width:100%" data-i18n>Resume sending</button>'
          : '') +
        '<p class="prog" id="prog"></p>' +
        '<p class="hint" style="margin-top:12px" data-i18n>Message sent</p>' +
        (c.body_format === 'html'
          // Escaped source would be a wall of markup. Sandboxed so viewing the record of what was
          // sent cannot execute anything.
          ? '<iframe sandbox="" style="width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff" srcdoc="' + esc(c.body || '') + '"></iframe>'
          : '<div class="card" style="white-space:pre-wrap;font-size:14px;line-height:1.6">' + esc(c.body || '') + '</div>') +
      '</div>';
    $('#back').addEventListener('click', function () { view = 'list'; render(); });
    var r = $('#resume');
    // Resuming picks up only the rows still queued — everyone already marked sent is skipped,
    // which is what makes a retry safe rather than a second campaign.
    if (r) r.addEventListener('click', function () { r.disabled = true; runSend(c.id, null); });
    refresh();
  }

  // ---------- load ----------
  function load() {
    Owner.get('/api/hub/owner/campaigns').then(function (d) {
      // These three were being dropped on the floor, which is why the postal-address control never
      // appeared and the test-recipients field always painted empty even with recipients saved.
      data = {
        campaigns: (d && d.campaigns) || [],
        segments: (d && d.segments) || [],
        templates: (d && d.templates) || [],
        scheduler_ready: !!(d && d.scheduler_ready),
        test_recipients: (d && d.test_recipients) || '',
        postal_address: (d && d.postal_address) || '',
        postal_is_fallback: !!(d && d.postal_is_fallback),
        email_ready: !!(d && d.email_ready),
        sms_ready: !!(d && d.sms_ready)
      };
      if (!draft.segment && data.segments.length) draft.segment = data.segments[0].key;
      render();
    }).catch(function () { Owner.fail('owner-root'); });
  }

  window.MarketingTabs.createEmail = load;
})();
</script>

<!-- ============================================================================================
     SHELL — tab strip, hash routing, and Today (the loop's own results cockpit: same budget,
     links, inbox, trust-ledger, attribution and performance-watch cards marketing.html has always
     had, only renamed to a today-root mount point). This is the ONE Owner.init call for the whole
     page — the four modules above are lazily started from here once their tab is opened.
     ============================================================================================ -->
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }
  var esc = Hub.esc;

  // ---------- Today: budget / links / inbox / trust / attribution / performance ----------
  // Unchanged from the old marketing.html cockpit — this is the "learn" half of the loop (what
  // happened) plus the landing pulse (what needs a look today).
  var DATA = { budget: null, links: null, inbox: null, trust: null, attribution: null, perf: null };
  var CAT_WORD = { menu: 'Menu', macro_portal: 'Macro Portal', catering: 'Catering', brand_story: 'Brand story', promo: 'Promos' };

  function budgetCard() {
    var d = DATA.budget;
    var b = d && d.ok && d.ai_budget;
    if (!b) return '<div class="card"><h3>AI budget</h3><p class="row-sub">Could not load the meter.</p></div>';
    var pct = b.limit_usd > 0 ? Math.min(100, Math.round((b.spent_usd / b.limit_usd) * 100)) : 0;
    return '<div class="card"><h3>AI budget · week ' + esc(String(b.week)) + '</h3>' +
      '<div class="meter"><span class="' + (pct >= 90 ? 'hot' : '') + '" style="width:' + pct + '%"></span></div>' +
      '<div class="row-sub">$' + b.spent_usd.toFixed(2) + ' of $' + b.limit_usd.toFixed(2) + ' spent · $' + b.remaining_usd.toFixed(2) + ' left</div>' +
      '<p class="hint">Hard ceiling: at the limit every AI feature waits for the new week — nothing borrows ahead.</p></div>';
  }

  function linksCard() {
    var d = DATA.links;
    if (!d || !d.ok) return '<div class="card"><h3>Tracked links</h3><p class="row-sub">Could not load links.</p></div>';
    var rows = (d.links || []).map(function (l) {
      return '<tr><td><b>' + esc(l.code) + '</b>' + (l.active ? '' : ' <span class="badge">off</span>') +
        '<div class="row-sub" style="font-size:11px">' + esc(l.label || '') + '</div></td>' +
        '<td class="num">' + (l.clicks_7d || 0) + '</td>' +
        '<td class="num">' + (l.clicks_30d || 0) + '</td>' +
        '<td class="num"><b>' + (l.orders_attributed || 0) + '</b></td></tr>';
    }).join('');
    return '<div class="card"><h3>Tracked links</h3>' +
      ((d.links || []).length
        ? '<table class="mini-table"><thead><tr><th>Link</th><th style="text-align:right">7d</th><th style="text-align:right">30d</th><th style="text-align:right">Orders</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p class="row-sub">No links yet.</p>') +
      '<p class="hint">Orders are attributed by campaign — the same tag the /l/ redirect stamps on the visit.</p></div>';
  }

  function inboxCard() {
    var d = DATA.inbox;
    if (!d || !d.ok) return '<div class="card"><h3>Aña’s inbox</h3><p class="row-sub">Could not load the inbox.</p></div>';
    var withWork = (d.items || []).filter(function (t) { return (t.drafts || []).length || (t.escalations || []).length; }).slice(0, 8);
    var body = withWork.length ? withWork.map(function (t) {
      var esct = (t.escalations || []).length;
      return '<div class="inbox-item">' +
        '<b>' + esc(t.username ? '@' + t.username : (t.subject || 'Thread')) + '</b>' +
        ' <span class="row-sub" style="font-size:11px">' + (t.kind === 'dm' ? 'DM' : 'comment') + '</span>' +
        ((t.drafts || []).length ? ' ' + Owner.badge((t.drafts || []).length + ' draft' + ((t.drafts || []).length > 1 ? 's' : ''), 'warn') : '') +
        (esct ? ' ' + Owner.badge(esct + ' escalated', 'crit') : '') +
        (t.window && t.window.hours_left != null ? '<div class="row-sub" style="font-size:11.5px">' + t.window.hours_left + 'h left in the reply window</div>' : '') +
        '<div style="margin-top:4px"><a href="/hub/owner/comms.html">Review in Comms →</a></div>' +
        '</div>';
    }).join('') : '<p class="row-sub">Nothing waiting — Aña’s queue is clear.</p>';
    return '<div class="card"><h3>Aña’s inbox' + (d.pending ? ' ' + Owner.badge(d.pending + ' pending', 'warn') : '') + '</h3>' + body + '</div>';
  }

  function trustCard() {
    var d = DATA.trust;
    if (!d || !d.ok) return '<div class="card"><h3>Trust ledger</h3><p class="row-sub">Could not load the ledger.</p></div>';
    var n = d.threshold || 5;
    var lanes = (d.categories || []).map(function (c) {
      var pips = '';
      for (var i = 0; i < n; i++) pips += '<i class="' + (i < Math.min(c.approved_clean, n) ? 'on' : '') + '"></i>';
      return '<div class="lane">' +
        '<div><div class="name">' + esc(CAT_WORD[c.category] || c.category) +
          (c.auto_publish ? ' ' + Owner.badge('auto', 'ok') : (c.eligible ? ' ' + Owner.badge('eligible', 'ok') : '')) + '</div>' +
        '<div class="streak">' + Math.min(c.approved_clean, 99) + '/' + n + ' clean approvals<span class="pips">' + pips + '</span></div></div>' +
        '<button data-trust="' + esc(c.category) + '" data-on="' + (c.auto_publish ? 0 : 1) + '"' +
          (c.auto_publish || c.eligible ? '' : ' disabled style="opacity:.45;cursor:default"') +
          ' class="' + (c.auto_publish ? 'on' : '') + '">' + (c.auto_publish ? 'Auto-publish ON' : 'Turn on') + '</button>' +
        '</div>';
    }).join('');
    return '<div class="card"><h3>Trust ledger</h3>' + lanes +
      '<p class="hint">A lane earns auto-publish after ' + n + ' drafts in a row approved without an edit. ' +
      'One edit resets its streak. The switch is yours — nothing flips it for you.</p></div>';
  }

  // Card 5: reach by cause — does a rule/brief/category/format actually correlate with better
  // reach? Backed by functions/_lib/instagram_insights.js:attributionRollup, which refuses to
  // rank a comparison built on too few posts. This card must show THAT refusal as plainly as it
  // shows a real result — a missing "not enough data" line would let a confident-looking number
  // stand in for one the system itself doesn't trust yet.
  function causeRow(label, c) {
    var withM = Math.round(c.withMedianReach || 0), withoutM = Math.round(c.withoutMedianReach || 0);
    var dir = withM > withoutM ? 'higher ↑' : (withM < withoutM ? 'lower ↓' : 'no different');
    return '<tr><td>' + esc(label) + '</td>' +
      (c.enoughData
        ? '<td class="num">' + withM + ' vs ' + withoutM + '</td><td class="num">' + dir + '</td><td class="num">n=' + c.withN + ' / ' + c.withoutN + '</td>'
        : '<td class="num" colspan="2" style="text-align:left;color:var(--green);opacity:.7">Not enough data yet</td><td class="num">n=' + c.withN + ' / ' + c.withoutN + '</td>') +
      '</tr>';
  }
  function attributionCard() {
    var d = DATA.attribution;
    if (!d || !d.ok) return '<div class="card"><h3>Reach by cause</h3><p class="row-sub">Could not load the rollup.</p></div>';
    if (!d.totalPublished) {
      return '<div class="card"><h3>Reach by cause</h3>' +
        '<p class="row-sub">No published posts with measured reach yet — this fills in once the daily Instagram sweep has something to compare.</p></div>';
    }
    var used = function (rows) { return (rows || []).filter(function (r) { return r.withN > 0; }); };
    var sections = [
      { title: 'Training rules', rows: used(d.byRule), label: function (r) { return r.ruleText; } },
      { title: 'Categories', rows: used(d.byCategory), label: function (r) { return CAT_WORD[r.category] || r.category; } },
      { title: 'Format', rows: used(d.byFormat), label: function (r) { return r.format === 'carousel' ? 'Carousel' : 'Single image'; } },
      { title: 'Campaign briefs', rows: used(d.byBrief), label: function (r) { return r.briefTitle; } },
    ];
    var body = sections.map(function (s) {
      if (!s.rows.length) return '';
      var rows = s.rows.map(function (r) { return causeRow(s.label(r), r); }).join('');
      return '<p class="row-sub" style="margin:10px 0 2px;font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em">' + esc(s.title) + '</p>' +
        '<table class="mini-table"><thead><tr><th>vs. without</th><th style="text-align:right">median reach</th><th></th><th style="text-align:right">sample</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }).join('');
    return '<div class="card"><h3>Reach by cause</h3>' +
      (body || '<p class="row-sub">Nothing has been attributed to a rule, brief, category or format yet.</p>') +
      '<p class="hint">Comparing published posts WITH each cause against published posts WITHOUT it, by median reach. ' +
      'Below ' + d.minSampleSize + ' posts on either side, this refuses to rank — one post is not a pattern.</p></div>';
  }

  // Card 6: performance watch — is anything posted actually landing, and is the team reacting?
  // Backed by functions/_lib/instagram_insights.js:detectPerformanceSignals (0079). Each of the
  // four signals renders its OWN "not enough data yet" state independently — a missing table or a
  // thin history for one signal must never blank the other three.
  function perfRow(label, ok, readingHtml, statusHtml) {
    return '<tr><td>' + esc(label) + '</td>' +
      (ok
        ? '<td class="num">' + readingHtml + '</td><td class="num">' + statusHtml + '</td>'
        : '<td class="num" colspan="2" style="text-align:left;color:var(--green);opacity:.7">Not enough data yet</td>') +
      '</tr>';
  }
  function perfCard() {
    var d = DATA.perf;
    if (!d || !d.ok) return '<div class="card"><h3>Performance watch</h3><p class="row-sub">Could not load the performance watch.</p></div>';
    var sp = d.singlePost || {}, wr = d.weakRun || {}, ft = d.followerTrend || {}, sl = d.silence || {};
    var rows =
      perfRow('Latest post', sp.enoughData,
        sp.reach + ' vs ' + Math.round(sp.baselineMedian || 0) + ' baseline',
        sp.flagged ? 'Soft ↓' : 'On track') +
      perfRow('Last ' + (d.weakRunLength || 3) + ' posts', wr.enoughData,
        (wr.reaches || []).join(', ') + ' vs ' + Math.round(wr.baselineMedian || 0),
        wr.flagged ? 'Weak run ↓' : 'On track') +
      perfRow('Followers (' + (d.followerWindowDays || 14) + 'd)', ft.enoughData,
        ft.latestFollowers + ' (' + (ft.delta >= 0 ? '+' : '') + ft.delta + ')',
        ft.falling ? 'Falling ↓' : (ft.flat ? 'Flat →' : 'Growing ↑')) +
      perfRow('Posting activity', sl.enoughData,
        sl.daysSince + ' days since last post',
        sl.flagged ? 'Silent ↓' : 'Active');
    // "here is what is and isn't working, and here is what the team is doing about it" — the
    // owner's own bar for this card. Only a real weak run (enough data AND flagged) changes what
    // the planner tries; everything else is left honestly alone rather than reacting to noise.
    var doing = (wr.enoughData && wr.flagged)
      ? 'The planner has been told to try a different format, category and angle this week instead of repeating what the last three posts used.'
      : 'No change to the planner’s approach — nothing here has cleared the bar for a real pattern yet.';
    return '<div class="card"><h3>Performance watch</h3>' +
      '<table class="mini-table"><thead><tr><th>Signal</th><th style="text-align:right">Reading</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<p class="hint">' + esc(doing) + ' Below the sample floor, this stays silent rather than guess — a false "it’s not working" is worse than no answer.</p></div>';
  }

  function renderToday() {
    var root = document.getElementById('today-root'); root.className = '';
    root.innerHTML =
      '<div class="hub-section"><h2 data-i18n>What happened since last time</h2>' +
        budgetCard() + linksCard() + inboxCard() + trustCard() + attributionCard() + perfCard() +
      '</div>';
    wireToday();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function wireToday() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-trust]'), function (b) {
      b.addEventListener('click', function () {
        var cat = b.getAttribute('data-trust');
        var on = Number(b.getAttribute('data-on'));
        // Turning autonomy ON is the one decision this page exists to make deliberate.
        if (on && !window.confirm('Let ' + (CAT_WORD[cat] || cat) + ' posts schedule themselves once the audit clears them?\n\nYou can turn this off any time.')) return;
        Hub.api('/api/hub/owner/trust', { method: 'POST', body: { category: cat, auto_publish: on } })
          .then(function (r) {
            if (r && r.ok) { Hub.toast(on ? 'Auto-publish on' : 'Back to manual approval'); loadToday(); }
            else Hub.toast((r && r.error) || 'Could not change that');
          });
      });
    });
  }

  // Six independent fetches; render once, with whatever answered. Promise.all is safe because
  // Hub.api never rejects — a failed endpoint answers {} and its card says so.
  function loadToday() {
    Promise.all([
      Hub.api('/api/hub/automations/run'),
      Hub.api('/api/hub/owner/links'),
      Hub.api('/api/hub/owner/social-inbox'),
      Hub.api('/api/hub/owner/trust'),
      Hub.api('/api/hub/owner/marketing-attribution'),
      Hub.api('/api/hub/owner/performance-alerts')
    ]).then(function (r) {
      DATA.budget = r[0]; DATA.links = r[1]; DATA.inbox = r[2]; DATA.trust = r[3]; DATA.attribution = r[4]; DATA.perf = r[5];
      renderToday();
    });
  }

  // ---------- tab strip + hash routing ----------
  var SHELL_HTML =
    '<div class="hub-section">' +
      '<div class="pt-chips" id="mkt-tabs">' +
        '<button type="button" data-tab="today" class="sel"><span data-i18n>Today</span></button>' +
        '<button type="button" data-tab="teach"><span data-i18n>Teach</span></button>' +
        '<button type="button" data-tab="create"><span data-i18n>Create &amp; schedule</span></button>' +
      '</div>' +
      '<p class="hint mkt-loop" data-i18n>One loop, not six pages: what worked shows up here on Today, you teach the team in Teach, drafts get made and approved in Create — then the results come back to Today.</p>' +
    '</div>' +
    '<div id="view-today" class="mkt-view">' +
      '<div id="today-root"><div class="hub-loading">…</div></div>' +
    '</div>' +
    '<div id="view-teach" class="mkt-view" style="display:none">' +
      '<div class="hub-section">' +
        '<h2 data-i18n>Team Lead</h2>' +
        '<p class="hint" data-i18n>Talk strategy. The Lead proposes and drafts — you approve, schedule and publish in Create.</p>' +
        '<div id="team-root"><div class="hub-loading">…</div></div>' +
      '</div>' +
      '<div class="hub-section">' +
        '<h2 data-i18n>Train the team</h2>' +
        '<p class="hint" data-i18n>Plain-language rules and reference photos — the AI reads this exact text before every plan it writes.</p>' +
        '<div id="training-root"><div class="hub-loading">…</div></div>' +
      '</div>' +
    '</div>' +
    '<div id="view-create" class="mkt-view" style="display:none">' +
      '<div class="pt-chips lane-chips" id="mkt-lanes">' +
        '<button type="button" data-lane="instagram" class="sel"><span data-i18n>Instagram</span></button>' +
        '<button type="button" data-lane="email"><span data-i18n>Email</span></button>' +
      '</div>' +
      // Constraint 2 (channel safety), said in the copy itself, not just enforced structurally —
      // an owner scanning quickly should not need to infer it from two separate compose forms.
      '<p class="hint mkt-lane-note" data-i18n>Different channels, different rules — Instagram posting and email campaigns keep their own compose form and their own send button, so one can never go out thinking it was the other.</p>' +
      '<div id="lane-instagram">' +
        '<div id="social-root"><div class="hub-loading">…</div></div>' +
      '</div>' +
      '<div id="lane-email" style="display:none">' +
        '<div id="campaigns-root"><div class="hub-loading">…</div></div>' +
      '</div>' +
    '</div>';

  var loadedOnce = { teach: false, ig: false, email: false };

  function tabFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h === 'teach') return { tab: 'teach', lane: null };
    if (h === 'create-email') return { tab: 'create', lane: 'email' };
    if (h === 'create' || h === 'create-instagram') return { tab: 'create', lane: 'instagram' };
    return { tab: 'today', lane: null };
  }

  function selectLane(lane) {
    document.getElementById('lane-instagram').style.display = (lane === 'email') ? 'none' : '';
    document.getElementById('lane-email').style.display = (lane === 'email') ? '' : 'none';
    Array.prototype.forEach.call(document.querySelectorAll('#mkt-lanes [data-lane]'), function (b) {
      b.classList.toggle('sel', b.getAttribute('data-lane') === lane);
    });
    // Lazy: an owner who never opens Email never pays for loading campaigns, and vice versa.
    if (lane === 'instagram' && !loadedOnce.ig) { loadedOnce.ig = true; window.MarketingTabs.createInstagram(); }
    if (lane === 'email' && !loadedOnce.email) { loadedOnce.email = true; window.MarketingTabs.createEmail(); }
  }

  function selectTab(tab, lane) {
    ['today', 'teach', 'create'].forEach(function (t) {
      document.getElementById('view-' + t).style.display = (t === tab) ? '' : 'none';
    });
    Array.prototype.forEach.call(document.querySelectorAll('#mkt-tabs [data-tab]'), function (b) {
      b.classList.toggle('sel', b.getAttribute('data-tab') === tab);
    });
    if (tab === 'teach' && !loadedOnce.teach) {
      loadedOnce.teach = true;
      window.MarketingTabs.teachTeam();
      window.MarketingTabs.teachTraining();
    }
    if (tab === 'create') selectLane(lane || 'instagram');
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function route() { var r = tabFromHash(); selectTab(r.tab, r.lane); }
  window.addEventListener('hashchange', route);

  function wireShell() {
    Array.prototype.forEach.call(document.querySelectorAll('#mkt-tabs [data-tab]'), function (b) {
      b.addEventListener('click', function () {
        var t = b.getAttribute('data-tab');
        // The hash is the single source of truth for which tab is open, so a bookmark, a share,
        // or the browser back button lands on the same view a click would — same pattern as
        // /hub/comms.html's #t=<thread> routing.
        location.hash = t === 'today' ? '' : (t === 'create' ? 'create-instagram' : t);
        route();   // hashchange never fires for '' -> '' (e.g. Today -> Today); drive it directly.
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#mkt-lanes [data-lane]'), function (b) {
      b.addEventListener('click', function () { location.hash = 'create-' + b.getAttribute('data-lane'); route(); });
    });
  }

  // ---------- boot ----------
  function load(me) {
    var root = document.getElementById('owner-root');
    root.className = '';
    root.innerHTML = SHELL_HTML;
    wireShell();
    route();
    loadToday();
  }

  Owner.init('marketing', load, { roles: Owner.MARKETING_DESK });
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
