<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Marketing</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">

<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<link rel="stylesheet" href="/hub/owner/assets/marketing-library.css?v=asset-review-2">
<link rel="stylesheet" href="/hub/owner/assets/marketing-photo-picker.css?v=photo-polish-2">

<!-- The two Añejo brand faces, the SAME link the public site uses (public/index.html). They are
     not here to restyle the hub — hub.css pins its own system font stack and nothing below
     changes that. They are here because the branding tool typesets real Cormorant Garamond and
     Josefin Sans INTO A CANVAS, and canvas can only draw a face the document has actually loaded.
     Without this link `ctx.font = '... "Cormorant Garamond"'` silently fell back to the system
     serif, which is why the old wording never looked like Añejo. font-display:swap + the timeout
     race in ensureBrandFonts() mean a slow or blocked CDN degrades the composite, never blocks it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* 2026-08-04 — one Marketing workspace, not six pages.
     The owner: "having trouble finding value on having Team + Social + Campaign + Train the Team
     all in different tabs... it should all be one smooth automation under one tab." He was right.
     This page absorbs team.html (Team Lead chat), team-training.html (rules + examples),
     social.html (Instagram drafts/scheduling) and campaigns.html (email campaigns), plus this
     page's own existing cockpit — presented as Today / Teach / Create, the loop the owner
     actually runs. Every rule below is copied VERBATIM from wherever it used to live: no
     confirmation dialog, no approval gate, no send/publish check got easier by moving house. */

  /* ---- workspace tabs + the Create-tab channel toggle: the same chip idiom the old Campaigns
     page already used, reused rather than inventing a second pattern for the same job. ---- */
  .pt-chips { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .pt-chips button { flex:1; min-width:110px; border:1px solid var(--line); background:#fff; color:var(--green);
    border-radius:10px; padding:9px 8px; font:inherit; font-size:13px; cursor:pointer; }
  .pt-chips button.sel { border-color:var(--gold,#C6A85B); box-shadow:0 0 0 1px var(--gold,#C6A85B); background:#fff8e9; }
  #social-root [data-queue-card][hidden], #queue-empty[hidden] { display:none!important; }
  .queue-filters button { min-height:44px; }
  [data-queue-card]:focus { outline:3px solid var(--gold); outline-offset:3px; }
  .mkt-loop { margin:0 0 16px; }
  .mkt-lane-note { margin-bottom:14px; }

  /* ---- shared form bits used by both Create lanes ---- */
  .form-row { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .form-row label { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--green); opacity:.8; }
  .form-row input, .form-row select, .form-row textarea { padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  .form-row textarea { min-height:110px; resize:vertical; line-height:1.5; }
  .form-two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint { font-size:12px; color:var(--green); opacity:.72; line-height:1.5; margin:2px 0 0; }
  .pt-right { text-align:right; font-size:12px; color:var(--green); white-space:nowrap; }
  input, select, textarea { width:100%; }

  /* ---- Create > Instagram (from the old Social page) ---- */
  .post { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .post.published { border-left-color:#2c6b3f; background:#f4faf6; }
  .post.scheduled { border-left-color:var(--gold); }
  .post.failed { border-left-color:var(--crit,#b3402f); background:#fdf0ef; }
  .post.publishing { border-left-color:#5b7fa6; }
  .post-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .tag { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:20px; padding:3px 9px; white-space:nowrap; }
  .tag.published { background:#2c6b3f; color:#fff; }
  .tag.scheduled { background:#efe7cf; color:#8a7a2e; }
  .tag.draft { background:#e6e6e3; color:#4a4d49; }
  .tag.failed { background:#b3402f; color:#fff; }
  .tag.publishing { background:#5b7fa6; color:#fff; }
  .cap { font-size:13.5px; line-height:1.5; white-space:pre-wrap; color:var(--ink); }
  .thumb { width:100%; max-width:220px; border-radius:8px; margin-top:8px; display:block; }
  .acts { display:flex; gap:8px; margin-top:10px; }
  .acts button { flex:1; padding:8px 10px; font-size:13px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); }
  .acts button.go { background:var(--gold); border-color:var(--gold); color:var(--green); }
  .acts button.del { color:#8a2b22; border-color:#e3c9c5; }
  .live { border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.5; }
  .live.on { background:#e7f0ea; border:1px solid #2c6b3f; color:#1b4d2b; }
  .live.off { background:#f6f5f1; border:1px solid var(--line); color:var(--green); }
  /* Token-expiry banner. Escalates by COLOR AND WEIGHT with how close the recorded date is —
     'unknown' is deliberately its own quiet, neutral tone: it is a gap to fill, not a fire. */
  .live.expiry-unknown { background:#f6f5f1; border:1px solid var(--line); color:var(--green); }
  .live.expiry-ok { background:#f6f5f1; border:1px solid var(--line); color:var(--green); opacity:.85; }
  .live.expiry-warning { background:#fbf3da; border:1px solid var(--gold-dark); color:var(--gold-dark); }
  .live.expiry-urgent, .live.expiry-expired { background:#fbe3e1; border:1px solid var(--crit); color:var(--crit); font-weight:600; }
  .expiry-set { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .expiry-set input[type="date"] { width:auto; padding:8px 10px; }
  .expiry-set button { white-space:nowrap; }
  /* Food-first indicator: Instagram's grid shows ONLY the first slide, so a text-card cover is
     invisible in every other view of the post — this is the one place the owner can catch it
     before the profile does. 'info' = publishing will fix it automatically (a photo exists
     later); 'warn' = it will not, because there is no photo to promote. */
  .cover-note { font-size:12px; line-height:1.45; border-radius:8px; padding:7px 10px; margin-top:8px; }
  .cover-note.info { background:#eef3fb; border:1px solid #9db8de; color:#2c4a72; }
  .cover-note.warn { background:#fbf3da; border:1px solid var(--gold-dark); color:var(--gold-dark); font-weight:600; }
  /* Brand Auditor verdict (migrations/0071 audit_score/audit_flags/audit_status). The Haiku judge
     scores every planner draft the moment it exists; this surfaces that verdict on the card so the
     owner reads WHY a draft is clean or flagged before approving a time — the same audit the
     auto-publish gate reads (automations.js). NULL columns = predates the auditor = UNSCORED,
     shown neutrally, never as passed. */
  .audit { font-size:12px; line-height:1.45; border-radius:8px; padding:7px 10px; margin-top:8px; }
  .audit.pass { background:#e7f0ea; border:1px solid #2c6b3f; color:#1b4d2b; }
  .audit.flag { background:#fbf3da; border:1px solid var(--gold-dark); color:var(--gold-dark); }
  .audit.unscored { background:#f6f5f1; border:1px solid var(--line); color:var(--green); opacity:.9; }
  .audit .audit-head { font-weight:700; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .audit .audit-score { font-variant-numeric:tabular-nums; }
  .audit ul { margin:6px 0 0; padding-left:18px; }
  .audit li { margin:2px 0; }
  /* Provenance (migrations/0076 + intel_id 0081): what CAUSED this draft — the campaign brief that
     directed it, the market-intel finding behind its angle, its category/format, and how many
     training rules were active. Data comes from social.js's batched post_provenance join. A post
     with no row is UNKNOWN (predates the feature), shown as a quiet neutral line, never as "none". */
  .prov { font-size:11.5px; line-height:1.5; border-radius:8px; padding:7px 10px; margin-top:8px; background:#f4f1ea; border:1px solid var(--line); color:var(--green); }
  .prov .prov-head { font-weight:700; display:flex; gap:6px; align-items:center; }
  .prov ul { margin:4px 0 0; padding-left:18px; }
  .prov li { margin:2px 0; }
  .prov .prov-unknown { opacity:.7; font-style:italic; }
  /* Media-type badge (migrations/0080): a REEL/STORY is not a feed post, and the owner has to be
     able to tell at a glance — the tag next to status answers "what IS this", the status tag
     already answers "what state is it in". Both show; they answer different questions. */
  .mtype { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:20px; padding:3px 9px; white-space:nowrap; background:#2c4a72; color:#fff; }
  .mtype.STORIES { background:#8a2b8a; }
  /* A video slide. Deliberately NOT an <img> — Instagram's grid/story is video, and rendering it as
     a broken photo thumbnail (or worse, silently as nothing) is exactly the "looks like a photo
     post" mistake this feature exists to avoid. */
  .vidslide { width:96px; height:96px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:#111; }

  /* ---- Create > Email (from the old Campaigns page) ---- */
  .reach { border:1px solid var(--gold,#C6A85B); background:#fff8e9; border-radius:10px; padding:12px 14px; margin:12px 0; }
  .reach .big { font-size:26px; font-weight:700; color:#8B6B3E; line-height:1.1; }
  .excl { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 12px; background:#fbfbf8; }
  .excl h4 { margin:0 0 8px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--green); opacity:.8; }
  .excl-row { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:5px 0; border-top:1px solid var(--line); }
  .excl-row:first-of-type { border-top:0; }
  .excl-row b { color:#8B6B3E; white-space:nowrap; }
  .excl-row span { color:var(--green); opacity:.85; line-height:1.5; }
  .warn { border:1px solid #b5651d; background:#fff4e8; border-radius:10px; padding:12px 14px; margin:0 0 12px;
    font-size:13px; color:#7a3f00; line-height:1.6; }
  .legal { font-size:12px; color:var(--green); opacity:.75; line-height:1.6; margin:10px 0 0; }
  .prog { font-size:13px; color:var(--green); margin-top:8px; }

  /* ---- Teach > Team Lead chat (from the old Team page) ---- */
  .team-chat { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 0; }
  .team-msg { max-width: 86%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .team-msg.owner { align-self: flex-end; background: #1b3a2b; color: #fff; border-bottom-right-radius: 4px; }
  .team-msg.lead { align-self: flex-start; background: rgba(0,0,0,.06); border-bottom-left-radius: 4px; }
  .team-msg .msg-meta { font-size: 11px; opacity: .65; margin-top: 6px; }
  .team-send { display: flex; gap: 8px; margin-top: 10px; }
  .team-send textarea { flex: 1; min-height: 44px; max-height: 140px; resize: vertical; }
  /* The Lead's real actions (create_brief, request_intel, draft_posts, and since 2026-09-10
     propose_campaign — a Broadcast DRAFT, never a send — see team.js's
     executeAction), made VISIBLE next to the chat instead of only discoverable by guessing the
     right sentence. Always-open rows, not another accordion to click through — "the owner should
     see at a glance that the Lead can..." was the actual ask. */
  .orch-item { padding:10px 0; border-top:1px solid var(--line); }
  .orch-item:first-of-type { border-top:0; padding-top:0; }
  .orch-label { font-size:13.5px; line-height:1.45; margin-bottom:6px; }
  .orch-controls { display:flex; gap:6px; flex-wrap:wrap; }
  .orch-controls input[type="text"] { flex:1; min-width:140px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13px; }
  .orch-controls select { padding:8px 6px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13px; width:auto; }
  .orch-controls button { white-space:nowrap; padding:8px 14px; font-size:12.5px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); }
  /* The track record: what the Lead has actually DONE, not just what it can do — "a team member
     with a track record, not a text box." */
  .orch-recent { font-size:12px; color:var(--green); opacity:.85; line-height:1.6; margin-top:6px; }

  /* ---- Teach > Train the team (from the old Train-the-Team page) ---- */
  .tt-drop { border:1.5px dashed rgba(198,168,91,.5); border-radius:14px; padding:22px 16px; text-align:center; cursor:pointer; background:rgba(198,168,91,.06); }
  .tt-drop.over { background:rgba(198,168,91,.14); }
  .tt-preview-box { background:#12261c; color:#eef4ef; border-radius:10px; padding:14px 16px; margin-top:10px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:340px; overflow-y:auto; }
  .tt-empty { border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:#f6f5f1; color:var(--green); font-size:13.5px; line-height:1.55; }
  .tt-warn { border:1px solid rgba(179,38,30,.4); background:rgba(179,38,30,.06); border-radius:10px; padding:11px 14px; margin-top:10px; font-size:13px; line-height:1.55; color:#8a2b22; }
  .tt-rule { display:flex; gap:10px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
  .tt-rule:last-child { border-bottom:0; }
  .tt-rule .tt-text { flex:1; font-size:14px; line-height:1.5; }
  .tt-rule textarea { margin-top:4px; }
  .tt-meta { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .tt-acts { display:flex; gap:6px; flex-shrink:0; }
  .tt-acts button { padding:7px 10px; font-size:12px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); }
  .tt-acts button.del { color:#8a2b22; border-color:#e3c9c5; }
  .tt-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-top:12px; }
  .tt-card { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .tt-card img { width:100%; height:120px; object-fit:cover; display:block; background:#e7e2d6; }
  .tt-card .tt-body { padding:9px 10px; }
  .tt-card .tt-note { font-size:12.5px; line-height:1.4; color:var(--ink); margin:6px 0; }
  .tt-flagrow { display:flex; gap:6px; margin-top:6px; }
  .tt-flagrow button { flex:1; padding:6px; font-size:11.5px; font-weight:700; border-radius:7px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--muted); }
  .tt-flagrow button.on.good { background:#e7f0ea; color:#2c6b3f; border-color:#2c6b3f; }
  .tt-flagrow button.on.bad { background:#fbe3e1; color:#9b2226; border-color:#9b2226; }

  /* ---- Today: the loop's measurement cockpit (unchanged from the old Marketing page) ---- */
  .meter { height:14px; border-radius:8px; background:#eceae4; overflow:hidden; margin:8px 0 4px; }
  .meter > span { display:block; height:100%; border-radius:8px; background:var(--gold); }
  .meter > span.hot { background:#b3402f; }
  .mini-table { width:100%; border-collapse:collapse; font-size:13px; }
  .mini-table th { text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--green); opacity:.7; padding:6px 8px 4px; }
  .mini-table td { padding:6px 8px; border-top:1px solid var(--line); }
  .mini-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .lane { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .lane:first-of-type { border-top:0; }
  .lane .name { font-weight:700; font-size:13.5px; }
  .lane .streak { font-size:12px; color:var(--green); opacity:.8; }
  .pips { display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle; }
  .pips i { width:8px; height:8px; border-radius:50%; background:#e0ddd4; display:inline-block; }
  .pips i.on { background:#2c6b3f; }
  .lane button { padding:7px 12px; font-size:12.5px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); white-space:nowrap; }
  .lane button.on { background:#2c6b3f; border-color:#2c6b3f; color:#fff; }
  .inbox-item { padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .inbox-item:first-of-type { border-top:0; }
</style>
</head>

<div class="hub-bar">
  <h1>AÑEJO · MARKETING</h1>

    <button id="lang-toggle" type="button">ES</button>
  </div>
</div>

<div class="hub-wrap">

</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>

<!-- ============================================================================================
     MODULE: Teach > Team Lead — copied from the old team.html almost unchanged. Only the mount
     point (owner-root -> team-root) and the chat-input id (msg -> team-msg, which collided with
     the Email lane's own #msg status line once both live in the same DOM) were renamed. Exposed
     as MarketingTabs.teachTeam() instead of auto-running, so it only loads once Teach is opened.
     ============================================================================================ -->
<script>
(function () {
  if (!window.MarketingTabs) window.MarketingTabs = {};
  var state = { messages: [], briefs: [], spine: null, activity: { drafts: [], intel: [] } };

  function render() {
    var root = document.getElementById('team-root'); root.className = '';
    root.innerHTML =
      '<div id="spine-head"></div>' +
      // ORCHESTRATOR PANEL — the owner's complaint, verbatim: "I used Team and its original design
      // was to orchestrate the rest of the team and now its just a random chat box that lacks."
      // team.js's executeAction has always implemented exactly three real actions (create_brief,
      // request_intel, draft_posts); the gap was never capability, it was that each one appeared
      // exactly once, buried in a transcript. This is the SAME three actions, surfaced as labelled
      // controls next to the conversation — invoking one still goes through the Lead (its judgement
      // on HOW to draft/brief/research is the point, per the build brief), but the owner no longer
      // has to guess the right sentence to reach it.
      '<div class="card" id="orch-panel" style="margin-bottom:14px">' +
        '<h3 style="margin:0 0 2px" data-i18n>What the Lead can do</h3>' +
        '<p class="row-sub" style="margin-bottom:10px" data-i18n>Ask for one of these directly, or just talk it through below — same three things either way.</p>' +
        '<div class="orch-item">' +
          '<div class="orch-label"><b>📝 <span data-i18n>Draft posts</span></b> — <span class="row-sub" data-i18n>writes captions and stages them in Create for your review</span></div>' +
          '<div class="orch-controls">' +
            '<input type="text" id="orch-draft-topic" placeholder="Topic (optional) — e.g. the FUEGO bowl">' +
            '<select id="orch-draft-count"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="5">5</option></select>' +
            '<button id="orch-draft-go" type="button" data-i18n>Draft posts</button>' +
          '</div>' +
          '<div id="orch-draft-recent" class="orch-recent"></div>' +
        '</div>' +
        '<div class="orch-item">' +
          '<div class="orch-label"><b>📋 <span data-i18n>Create a campaign brief</span></b> — <span class="row-sub" data-i18n>objective, audience and angle, filed for the record</span></div>' +
          '<div class="orch-controls">' +
            '<input type="text" id="orch-brief-topic" placeholder="What is this campaign about?">' +
            '<button id="orch-brief-go" type="button" data-i18n>Create brief</button>' +
          '</div>' +
        '</div>' +
        '<div class="orch-item">' +
          '<div class="orch-label"><b>🔍 <span data-i18n>Commission research</span></b> — <span class="row-sub" data-i18n>files a question for the Intel Bench to answer</span></div>' +
          '<div class="orch-controls">' +
            '<input type="text" id="orch-intel-q" placeholder="What do you need researched?">' +
            '<button id="orch-intel-go" type="button" data-i18n>Ask</button>' +
          '</div>' +
          '<div id="orch-intel-recent" class="orch-recent"></div>' +
        '</div>' +
      '</div>' +
      '<div id="chat" class="team-chat"></div>' +
      '<div class="team-send">' +
        '<textarea id="team-msg" placeholder="Ask for a plan, a brief, a read on the numbers…"></textarea>' +
        '<button class="btn gold" id="send" type="button" data-i18n>Send</button>' +
      '</div>' +
      '<h3 style="margin-top:18px" data-i18n>Campaign briefs</h3>' +
      '<div id="briefs" class="list"><div class="hub-loading">…</div></div>';
    document.getElementById('send').addEventListener('click', send);
    document.getElementById('team-msg').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
    });

    // Each control composes an explicit, unambiguous request and sends it exactly like a typed
    // message — the Lead still decides HOW (what to write, what to ask), but WHETHER to try is no
    // longer left to the owner phrasing it just right.
    document.getElementById('orch-draft-go').addEventListener('click', function (e) {
      var topic = (document.getElementById('orch-draft-topic').value || '').trim();
      var count = document.getElementById('orch-draft-count').value || '2';
      var msg = 'Draft ' + count + ' post' + (count === '1' ? '' : 's') +
        (topic ? ' about ' + topic : ' for the approval queue') + '.';
      sendMessage(msg, e.currentTarget);
    });
    document.getElementById('orch-brief-go').addEventListener('click', function (e) {
      var topic = (document.getElementById('orch-brief-topic').value || '').trim();
      if (!topic) { Hub.toast('Say what the campaign is about first.'); return; }
      sendMessage('Create a campaign brief for: ' + topic + '.', e.currentTarget);
      document.getElementById('orch-brief-topic').value = '';
    });
    document.getElementById('orch-intel-go').addEventListener('click', function (e) {
      var q = (document.getElementById('orch-intel-q').value || '').trim();
      if (!q) { Hub.toast('Say what you need researched first.'); return; }
      sendMessage('I need this researched: ' + q, e.currentTarget);
      document.getElementById('orch-intel-q').value = '';
    });

    paint();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function paintSpine() {
    var el = document.getElementById('spine-head');
    if (!el || !state.spine) return;
    var s = state.spine;
    var bits = [];
    if (s.followers != null) bits.push(Hub.esc(String(s.followers)) + ' followers · snapshot ' + Hub.esc(s.metrics_as_of ? String(s.metrics_as_of) : 'date unavailable'));
    if (s.budget) bits.push(s.budget.status === 'unavailable' || !Number.isFinite(s.budget.spent_usd) ? 'AI budget unavailable · paid calls paused' : '$' + s.budget.spent_usd.toFixed(2) + ' / $' + Number(s.budget.limit_usd).toFixed(0) + ' AI this week');
    bits.push(Hub.esc(String(s.drafts_pending)) + ' drafts pending');
    if (s.menu_total) bits.push(Hub.esc(String(s.menu_available)) + '/' + Hub.esc(String(s.menu_total)) + ' menu items on sale');
    // WHICH brief the Lead read, in words. The API has reported this since the spine fix; without
    // it on the page, a Lead answering off-brand and a Lead that never received the brief read
    // identically from the chat. Stated, not colour-coded — the distinction has to survive a
    // screenshot and a colourblind reader.
    if (s.brand_source) bits.push(s.brand_source === 'd1' ? 'brief: live from the HUB' : 'brief: repo snapshot');
    el.innerHTML = '<p class="row-sub">' + bits.join(' · ') + '</p>';
  }

  function paintChat() {
    var el = document.getElementById('chat');
    if (!el) return;
    if (!state.messages.length) {
      el.innerHTML = '<div class="team-msg lead" data-i18n>No conversation yet. Ask the Lead where marketing should go next.</div>';
      return;
    }
    el.innerHTML = state.messages.map(function (m) {
      var meta = '';
      if (m.actions && m.actions.ok) {
        if (m.actions.action === 'create_brief') meta = 'Created brief: ' + (m.actions.title || m.actions.brief_id);
        else if (m.actions.action === 'request_intel') meta = 'Logged intel request';
        else if (m.actions.action === 'draft_posts') meta = 'Drafted ' + m.actions.drafted + ' post(s) for review in Create';
      }
      // Hide the machine block from the human — the executed summary line replaces it.
      var body = String(m.body || '').replace(/```json[\s\S]*?```/g, '').trim();
      return '<div class="team-msg ' + (m.role === 'owner' ? 'owner' : 'lead') + '">' + Hub.esc(body) +
        (meta ? '<div class="msg-meta">⚙ ' + Hub.esc(meta) + '</div>' : '') +
        '<div class="msg-meta">' + Owner.timeAgo(m.created_at) + '</div></div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  // The track record: what the Lead has actually done, not just what it can do. Same data the
  // owner would otherwise have to scroll the whole transcript to find — team_briefs is already
  // shown below the chat, so this covers the other two (social_posts it commissioned, questions it
  // filed), pulled straight from the `activity` the API now reports (functions/api/hub/owner/team.js).
  function paintOrchestrator() {
    var drafts = (state.activity && state.activity.drafts) || [];
    var intel = (state.activity && state.activity.intel) || [];
    var dEl = document.getElementById('orch-draft-recent');
    if (dEl) {
      dEl.innerHTML = drafts.length
        ? '<div data-i18n>Recently commissioned:</div>' + drafts.slice(0, 3).map(function (r) {
            return '<div>· ' + Hub.esc(String(r.caption || '').split('\n')[0].slice(0, 70)) +
              ' (' + Hub.esc(r.status) + ', ' + Owner.timeAgo(r.created_at) + ')</div>';
          }).join('')
        : '';
    }
    var iEl = document.getElementById('orch-intel-recent');
    if (iEl) {
      iEl.innerHTML = intel.length
        ? '<div data-i18n>Recently asked:</div>' + intel.slice(0, 3).map(function (r) {
            return '<div>· ' + Hub.esc(r.question) + ' (' + Hub.esc(r.status) + ')</div>';
          }).join('')
        : '';
    }
  }

  function paintBriefs() {
    var el = document.getElementById('briefs');
    if (!el) return;
    if (!state.briefs.length) {
      el.innerHTML = '<div class="card"><p class="row-sub" data-i18n>No briefs yet — ask the Lead to propose a campaign.</p></div>';
      return;
    }
    el.innerHTML = state.briefs.map(function (b) {
      var kind = b.status === 'approved' ? 'ok' : b.status === 'archived' ? '' : 'warn';
      return '<div class="row"><div class="row-main">' +
        '<div class="row-title">' + Owner.esc(b.title) + '</div>' +
        (b.objective ? '<div class="row-sub">' + Owner.esc(b.objective) + '</div>' : '') +
        '<div class="row-sub">' + (b.success_metric ? 'Success: ' + Owner.esc(b.success_metric) + ' · ' : '') + Owner.timeAgo(b.created_at) + '</div>' +
        '</div>' + Owner.badge(b.status, kind) + '</div>';
    }).join('');
  }

  function paint() { paintSpine(); paintChat(); paintBriefs(); paintOrchestrator(); }

  function apply(d) {
    if (!d || !d.ok) return;
    state.messages = d.messages || [];
    state.briefs = d.briefs || [];
    state.spine = d.spine || null;
    state.activity = d.activity || { drafts: [], intel: [] };
    paint();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function load() { Owner.get('/api/hub/owner/team').then(apply); }

  // The one call every path into the Lead makes — the free-text box below AND the three
  // orchestrator controls above. `extraBtn` (the specific control clicked) is disabled alongside
  // the main Send button so a slow model turn cannot be read as "nothing happened" and re-clicked
  // into a duplicate brief/draft/intel request.
  function sendMessage(text, extraBtn) {
    var btn = document.getElementById('send');
    if (!text || (btn && btn.disabled) || (extraBtn && extraBtn.disabled)) return;
    if (btn) btn.disabled = true;
    if (extraBtn) extraBtn.disabled = true;
    // Optimistic echo so the chat feels alive during the model's think time.
    state.messages = state.messages.concat([{ role: 'owner', body: text, created_at: Date.now() }]);
    paintChat();
    Hub.api('/api/hub/owner/team', { method: 'POST', body: { message: text } }).then(function (d) {
      if (btn) btn.disabled = false;
      if (extraBtn) extraBtn.disabled = false;
      if (d && d.ok) { apply(d); if (d.reply && d.reply.saved === false) { state.messages = state.messages.concat([{ role: 'lead', body: 'Not saved—do not repeat actions blindly.\n\n' + String(d.reply.text || d.reply.body || ''), created_at: Date.now(), ephemeral: true }]); paintChat(); Hub.toast('Reply not saved—do not repeat actions blindly.'); } if (d.degraded) Hub.toast('Lead is degraded: ' + d.degraded); }
      else Hub.toast((d && d.error) || 'Could not send.');
    }).catch(function () {
      if (btn) btn.disabled = false;
      if (extraBtn) extraBtn.disabled = false;
      Hub.toast('Could not send.');
    });
  }

  function send() {
    var inp = document.getElementById('team-msg');
    var text = (inp.value || '').trim();
    if (!text) return;
    inp.value = '';
    sendMessage(text);
  }

  window.MarketingTabs.teachTeam = function () { render(); load(); };
})();
</script>

<!-- ============================================================================================
     MODULE: Teach > Train the team — copied from the old team-training.html unchanged except the
     mount point (owner-root -> training-root). Exposed as MarketingTabs.teachTraining().
     ============================================================================================ -->
<script>
(function () {
  if (!window.MarketingTabs) window.MarketingTabs = {};
  var esc = Hub.esc;
  var editingRule = null;   // rule id currently in edit mode, or null
  var pendingKey = null;    // media_key of the last uploaded, not-yet-saved example photo
  var pendingFlag = 'good';

  function root() { return document.getElementById('training-root'); }

  function load() {
    Owner.get('/api/hub/owner/team-training').then(render);
  }

  function render(d) {
    if (!d || !d.ok) { root().innerHTML = '<div class="card accent"><p data-i18n>Could not load. Pull to refresh.</p></div>'; return; }

    var previewBox;
    var trainingUnavailable = d.preview && d.preview.read_status && Object.values(d.preview.read_status).some(function (v) { return v === 'unavailable'; });
    if (trainingUnavailable) { previewBox = '<div class="tt-warn">Training read incomplete. One or more sources are unavailable; this is not proof that no guidance exists.</div>' + (d.preview.text ? '<div class="tt-preview-box">' + esc(d.preview.text) + '</div>' : '');
    } else if (!d.trained) {
      // HONEST WHEN EMPTY — this is the whole point of the panel. A fresh install must never
      // read as "the team already knows something."
      previewBox = '<div class="tt-empty"><strong data-i18n>The team has not been trained yet.</strong> ' +
        '<span data-i18n>Nothing below is being sent to the marketing team\'s AI. Add a rule or a reference photo and it will appear here — in the shared Lead/planner preview.</span></div>';
    } else {
      previewBox = '<div class="tt-preview-box">' + esc(d.preview.text) + '</div>' +
        '<p class="tt-meta" style="margin-top:8px">' + d.preview.ruleCount + ' ' + (d.preview.ruleCount === 1 ? 'rule' : 'rules') +
        ' · ' + d.preview.exampleCount + ' example' + (d.preview.exampleCount === 1 ? '' : 's') +
        ' · ' + d.preview.usedChars.toLocaleString() + ' / ' + d.preview.maxChars.toLocaleString() + ' characters</p>';
      if (d.preview.truncated) {
        previewBox += '<div class="tt-warn"><strong data-i18n>Some of your training did not fit.</strong> ' +
          '<span data-i18n>You have ' + d.preview.totalRules + ' rule(s) and ' + d.preview.totalExamples + ' example(s) total, but only the retained rows above fit this Lead/planner preview cap. Remove something you no longer need, or trim what you have.</span></div>';
      }
    }

    if (trainingUnavailable && d.preview.truncated) previewBox += '<div class="tt-warn">Available training also exceeded the 16,000-character cap; some rows were omitted.</div>';
    if (d.preview && d.preview.selection_may_be_limited && (d.preview.selection_may_be_limited.rules || d.preview.selection_may_be_limited.examples)) previewBox += '<div class="tt-warn">Source selection reached its 500-row limit; older rows may be omitted.</div>';

    root().innerHTML =
      '<p class="sub" data-i18n>Teach the marketing team without touching a file or a deploy. Write plain-language rules and mark up photo examples — the Lead and planner use a shared 16,000-character training cap. Other tools may use different context limits.</p>' +

      '<section class="card">' +
        '<h2 data-i18n>What the team currently believes</h2>' +
        '<p class="tt-meta" data-i18n>Current Lead/planner training preview. Actual inference receipts show what each completed call received.</p>' +
        previewBox +
      '</section>' +

      '<section class="card">' +
        '<h2 data-i18n>Rules</h2>' +
        '<p class="tt-meta" data-i18n>Plain language. e.g. "Always show food in the first slide" or "Never use stock-looking plates."</p>' +
        '<div id="ruleForm" style="margin-top:10px">' +
          '<textarea id="newRule" placeholder="Write a rule the team should always follow…" style="min-height:64px"></textarea>' +
          '<button id="addRule" class="btn primary" style="margin-top:8px" data-i18n>Add rule</button>' +
        '</div>' +
        '<div id="ruleList" style="margin-top:6px">' + (d.rules.length ? d.rules.map(ruleRow).join('') : '<p class="tt-meta" data-i18n>No rules yet.</p>') + '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2 data-i18n>Reference examples</h2>' +
        '<p class="tt-meta" data-i18n>Upload a photo and explain it in your own words — "this is the look I want" or "never do this."</p>' +
        '<div id="exDrop" class="tt-drop" style="margin-top:10px">' +
          '<strong data-i18n>Drop a photo here or tap to choose</strong>' +
          '<div class="tt-meta" style="margin-top:4px" data-i18n>JPEG, PNG or WebP. 5MB max.</div>' +
          '<input id="exFile" type="file" hidden accept="image/jpeg,image/png,image/webp">' +
        '</div>' +
        '<div id="exStatus" class="tt-meta" style="margin-top:6px"></div>' +
        '<div id="exForm" style="margin-top:10px;display:none">' +
          '<div class="tt-flagrow" style="margin-bottom:8px">' +
            '<button type="button" id="flagGood" class="on good" data-i18n>✓ Good example — do this</button>' +
            '<button type="button" id="flagBad" data-i18n>✕ Avoid — never do this</button>' +
          '</div>' +
          '<textarea id="exNote" placeholder="Explain the example in plain language…" style="min-height:60px"></textarea>' +
          '<button id="saveExample" class="btn primary" style="margin-top:8px" data-i18n>Save example</button>' +
        '</div>' +
        '<div id="exGrid" class="tt-grid">' + (d.examples.length ? d.examples.map(exampleCard).join('') : '<p class="tt-meta" data-i18n>No reference photos yet.</p>') + '</div>' +
      '</section>';

    wire(d);
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  function who(r) {
    return r.created_by ? esc(r.created_by) : 'the owner';
  }

  function ruleRow(r) {
    if (editingRule === r.id) {
      return '<div class="tt-rule"><div class="tt-text">' +
        '<textarea id="editRuleText" style="min-height:64px">' + esc(r.text) + '</textarea>' +
        '<div class="tt-acts" style="margin-top:8px"><button data-save-rule="' + esc(r.id) + '">Save</button><button data-cancel-rule="1">Cancel</button></div>' +
        '</div></div>';
    }
    return '<div class="tt-rule"><div class="tt-text">' + esc(r.text) +
      '<div class="tt-meta">by ' + who(r) + '</div></div>' +
      '<div class="tt-acts"><button data-edit-rule="' + esc(r.id) + '">Edit</button><button class="del" data-del-rule="' + esc(r.id) + '">Remove</button></div>' +
      '</div>';
  }

  function exampleCard(e) {
    var badgeCls = e.flag === 'bad' ? 'crit' : 'ok';
    var badgeText = e.flag === 'bad' ? 'AVOID' : 'GOOD';
    return '<div class="tt-card">' +
      '<img src="' + esc(e.url) + '" alt="" loading="lazy">' +
      '<div class="tt-body">' +
        '<span class="badge ' + badgeCls + '">' + badgeText + '</span>' +
        '<div class="tt-note">' + esc(e.note) + '</div>' +
        '<div class="tt-meta">by ' + who(e) + '</div>' +
        '<div class="tt-acts" style="margin-top:8px"><button class="del" data-del-ex="' + esc(e.id) + '" style="flex:1">Remove</button></div>' +
      '</div></div>';
  }

  function post(body) {
    return Hub.api('/api/hub/owner/team-training', { method: 'POST', body: body });
  }

  function uploadFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { Hub.toast('Too large — 5MB max.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      document.getElementById('exStatus').textContent = 'Uploading…';
      Hub.api('/api/hub/owner/team-training-upload', { method: 'POST', body: { data_url: String(rd.result || '') } })
        .then(function (r) {
          if (r && r.ok && r.media_key) {
            pendingKey = r.media_key;
            document.getElementById('exStatus').innerHTML = '✓ Uploaded — ' + Math.round((r.bytes || 0) / 1024) + ' KB';
            document.getElementById('exForm').style.display = '';
          } else {
            document.getElementById('exStatus').textContent = '';
            Hub.toast((r && r.error) || 'Upload failed');
          }
        });
    };
    rd.onerror = function () { Hub.toast('Could not read that file.'); };
    rd.readAsDataURL(file);
  }

  function wire(d) {
    // ---- rules ----
    document.getElementById('addRule').addEventListener('click', function () {
      var t = document.getElementById('newRule').value.trim();
      if (!t) return;
      post({ op: 'add_rule', text: t }).then(function (r) {
        if (r && r.ok) { Hub.toast('Rule added'); load(); } else Hub.toast((r && r.error) || 'Could not add that rule');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit-rule]'), function (b) {
      b.addEventListener('click', function () { editingRule = b.getAttribute('data-edit-rule'); render(d); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cancel-rule]'), function (b) {
      b.addEventListener('click', function () { editingRule = null; render(d); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-save-rule]'), function (b) {
      b.addEventListener('click', function () {
        var rid = b.getAttribute('data-save-rule');
        var t = document.getElementById('editRuleText').value.trim();
        if (!t) return;
        post({ op: 'update_rule', id: rid, text: t }).then(function (r) {
          editingRule = null;
          if (r && r.ok) { Hub.toast('Rule saved'); load(); } else { Hub.toast((r && r.error) || 'Could not save'); load(); }
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del-rule]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Remove this rule? The team will stop seeing it.')) return;
        post({ op: 'delete_rule', id: b.getAttribute('data-del-rule') }).then(load);
      });
    });

    // ---- examples: upload ----
    var drop = document.getElementById('exDrop');
    drop.addEventListener('click', function () { document.getElementById('exFile').click(); });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { uploadFile(e.dataTransfer.files && e.dataTransfer.files[0]); });
    document.getElementById('exFile').addEventListener('change', function () { uploadFile(this.files && this.files[0]); });

    document.getElementById('flagGood').addEventListener('click', function () {
      pendingFlag = 'good';
      document.getElementById('flagGood').classList.add('on', 'good');
      document.getElementById('flagBad').classList.remove('on', 'bad');
    });
    document.getElementById('flagBad').addEventListener('click', function () {
      pendingFlag = 'bad';
      document.getElementById('flagBad').classList.add('on', 'bad');
      document.getElementById('flagGood').classList.remove('on', 'good');
    });
    document.getElementById('saveExample').addEventListener('click', function () {
      var note = document.getElementById('exNote').value.trim();
      if (!pendingKey) { Hub.toast('Upload a photo first'); return; }
      if (!note) { Hub.toast('Explain the example first'); return; }
      post({ op: 'add_example', media_key: pendingKey, note: note, flag: pendingFlag }).then(function (r) {
        if (r && r.ok) {
          pendingKey = null; pendingFlag = 'good';
          Hub.toast('Example saved');
          load();
        } else Hub.toast((r && r.error) || 'Could not save that example');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del-ex]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Remove this example? The team will stop seeing it.')) return;
        post({ op: 'delete_example', id: b.getAttribute('data-del-ex') }).then(load);
      });
    });
  }

  window.MarketingTabs.teachTraining = function () { load(); };
})();
</script>

<!-- ============================================================================================
     MODULE: Create > Instagram — copied from the old social.html unchanged except the mount
     point (owner-root -> social-root). Exposed as MarketingTabs.createInstagram (= load).
     ============================================================================================ -->
<script>
(function () {
  if (!window.MarketingTabs) window.MarketingTabs = {};
  var esc = Hub.esc;
  var DATA = null;
  window.MarketingTabs.confirmPhotoDraft = function () {
    var cap = document.getElementById('cap'), key = document.getElementById('mkey');
    if ((cap && cap.value.trim()) || (key && key.value.trim())) return window.confirm('Start a new photo draft? Unsaved composer changes will be replaced. / ¿Empezar un borrador nuevo? Se reemplazarán los cambios sin guardar.');
    return true;
  };
  function setComposerPhoto(photo) {
    DATA._pickedKey=photo.media_key; DATA._pickedPreview=photo.url; DATA._pickedLabel=photo.name; DATA._pickedPhoto=photo;
    var key=document.getElementById('mkey'); if(key)key.value=photo.media_key;
    var box=document.getElementById('picked-photo-preview');
    if(box)box.innerHTML='<p class="hint">Photo selected · Foto seleccionada</p><img src="'+esc(photo.url)+'" alt="'+esc(photo.name||'Selected photo')+'" style="width:100%;max-width:320px;max-height:320px;object-fit:contain">';
    var polish=document.getElementById('mpolish'); if(polish)polish.hidden=!!photo.source_key || !!photo.ai_enhanced || !photo.media_key.startsWith('marketing-library/');
  }
  window.MarketingTabs.pickLibraryPhoto = async function (photo) {
    if(!DATA || !document.getElementById('cap')) {
      var d=await Owner.get('/api/hub/owner/social');
      if(!d||!d.ok)throw new Error('Could not open the composer.');
      DATA=d; render();
    }
    if(DATA._draftType==='REELS')throw new Error('Choose Feed or Story to use a photo.');
    window.MarketingTabs.openPhotoComposer(); setComposerPhoto(photo);
    document.getElementById('cap').focus();
  };
  function chooseLibrary(onSelect) {
    return MarketingPhotoPicker.open({onSelect:onSelect,onEnhance:function(photo){return MarketingPhotoEnhance.open({photo:photo,onUse:onSelect});}});
  }
  window.MarketingTabs.chooseLibraryPhoto=function(){return chooseLibrary(window.MarketingTabs.pickLibraryPhoto);};
  function capturePhotoFields(){var values={};document.querySelectorAll('#social-root textarea,#social-root input:not([type=file]),#social-root select').forEach(function(n){if(n.id)values[n.id]=n.value;});return values;}
  function restorePhotoFields(values){Object.keys(values).forEach(function(id){var n=document.getElementById(id);if(n)n.value=values[id];});}
  function renderKeepingFields(){var values=capturePhotoFields();render();restorePhotoFields(values);}
  async function attachLibraryPhoto(pid,photo) {
    var post=(DATA.posts||[]).find(function(p){return p.id===pid;});
    if(!post || !['draft','failed'].includes(post.status))throw new Error('Return this post to draft before changing photos.');
    var r=await Hub.api('/api/hub/owner/social',{method:'POST',body:{op:'attach',id:pid,media_key:photo.media_key}});
    if(!r||!r.ok)throw new Error(r&&r.error||'Could not attach photo.');
    var d=await Owner.get('/api/hub/owner/social');
    var picked={}; Object.keys(DATA).filter(function(k){return k.startsWith('_');}).forEach(function(k){picked[k]=DATA[k];});
    if(d&&d.ok){DATA=Object.assign(d,picked);renderKeepingFields();Hub.toast('Photo attached. Caption edits preserved.');}
    else Hub.toast('Photo attached, but the list could not refresh. Refresh before adding it again.');
  }

  // BRANDING — the Añejo mark and an optional editorial line, composited onto a Studio photo

  //
  // THE ONE RULE: an image model never draws the Añejo logo. An AI "approximation" of a logo is a
  // corrupted logo — wrong proportions, wrong glyphs, subtly wrong forever — and that is a worse
  // outcome than no logo at all on a real client-facing profile. So the logo pixel data has to come
  // from the REAL assets (MARK_SRC below — the committed emblem and full lockup), and it has to be

  // image onto another (no Cloudflare Images binding, no Image Resizing zone feature configured, no

  // the cheap way: a dark rounded rectangle behind the mark and a full-width dark band behind the
  // wording. Both read as stickers stuck onto the photo — "it cannot have the box in the back or
  // the logo in the square". Both are gone, and nothing replaced them that draws an edge. The mark
  // now sits on the photograph itself and stays legible three ways:

  //      boundary to see; it only stops the mark dissolving into a busy plate rim.
  //   3. PLACEMENT THAT READS THE PHOTO — every candidate corner is scored on the contrast it can
  //      reach and on how BUSY it is, and the calmest, highest-contrast one that does not collide
  //      with the wording wins. That is what "blends nicely" actually costs: measurement, not one
  //      fixed corner treatment plus hope.

  // appear — a vertical gradient anchored to the image edge that fades to fully transparent. A
  // fade has no boundary anywhere along it, which is precisely what makes it not a box.
  //
  // WORDING IS TYPESET, NOT STAMPED. It is still real canvas text drawn from the owner's own typed
  // characters — a deliberate departure from asking gpt-image-2 to render words onto the photo,
  // because that model renders text well but not perfectly and there is no automated way to catch a
  // misspelling after the fact except a human reading it. Drawing the owner's exact string with the
  // Canvas API cannot misspell it; there is no generation step for a typo to come from. What
  // CHANGED is the typography. It is now the Añejo editorial system, the same one the public site
  // uses: a hairline rule, a letterspaced Josefin Sans kicker in caps, and a Cormorant Garamond
  // headline set in the owner's own casing. Sizes are all derived from the image's shorter side and
  // the headline auto-fits — it shrinks and wraps to two lines — so the same wording composes
  // correctly on a 1024² Studio render and on a tall phone photo without anyone retyping it.
  //
  // OPTIONAL, PER IMAGE. Clicking "Preview" never touches the post — it only renders a canvas and
  // shows it. Nothing is uploaded or attached until the owner taps "Use this", and even then the
  // The source image stays in storage. Accepting a preview replaces the selected draft reference
  // without changing carousel count or order, and invalidates prior scheduling approval.

  // The REAL committed assets, and the only two images this tool will ever draw as the mark. Both

  function compositeBranding(photoUrl, opts) { return window.AnejoBranding.compose(photoUrl, opts); }

          layout: panel.querySelector('.brand-layout').value,
          mark: panel.querySelector('.brand-mark').value,
          finish: panel.querySelector('.brand-finish').value,
          onLayout: function(report){layoutEvidence=report;}
        };
        // Hash and render the same source bytes, preserving the original in storage.
        fetch('/api/hub/media/' + key, {credentials:'same-origin'})
          .then(function(response){if(!response.ok)throw new Error('Could not read the original photo');return response.blob();})
          .then(async function(blob){
            if(blob.size>5*1024*1024)throw new Error('Original photo exceeds the 5 MB preview limit');
            sourceHash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),function(b){return b.toString(16).padStart(2,'0');}).join('');
            var sourceUrl=URL.createObjectURL(blob);
            try{return await compositeBranding(sourceUrl,renderOptions);}finally{URL.revokeObjectURL(sourceUrl);}
          })
          .then(function (dataUrl) {
            btn.disabled = false; btn.textContent = 'Preview branded photo';
            resultBox.innerHTML =
              '<img src="' + dataUrl + '" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;margin-bottom:6px">' +
              (layoutEvidence ? '<p class="hint">' + (layoutEvidence.protectionSource === 'center_geometry_only' ? 'The center is protected geometrically. ' : '') + 'Review the actual food, packaging, emblem and wording before using. Template placement is not automatic food recognition.</p>' : '') +
              '<div style="display:flex;gap:8px"><button class="btn gold brand-use" type="button">Use this — replace selected slide</button>' +
              '<button class="btn ghost brand-discard" type="button">Discard</button></div>';
            resultBox.querySelector('.brand-use').addEventListener('click', function () {
              var useBtn = resultBox.querySelector('.brand-use');
              if (useBtn.disabled) return;
              useBtn.disabled = true; useBtn.textContent = 'Saving…';
              var declaredOptions = {};
              Object.keys(renderOptions).forEach(function(name){if(name!=='onLayout')declaredOptions[name]=renderOptions[name];});
              Hub.api('/api/hub/owner/marketing-branded-save', { method: 'POST', body: {
                request_id:previewRequestId,post_id:postId,media_id:chosen.value,source_key:key,source_sha256:sourceHash,data_url:dataUrl,
                declaration:{renderer_version:window.AnejoBranding.rendererVersion,template_id:renderOptions.preset || 'overlay',options:declaredOptions,layout:layoutEvidence || {capture:'unavailable'}}
              } })
                .then(function (r) {
                  if (!r || !r.ok || !r.attached) {
                    Hub.toast((r && r.error) || 'Could not attach the branded photo. Your original is preserved.');
                    useBtn.disabled = false; useBtn.textContent = 'Use this — replace selected slide';
                    return;
                  }
                  Hub.toast('Branded slide saved as draft with source record — review before scheduling');
                  load();
                })
                .catch(function () {
                  Hub.toast('Could not save the branded photo');
                  useBtn.disabled = false; useBtn.textContent = 'Use this — replace selected slide';
                });
            });
            resultBox.querySelector('.brand-discard').addEventListener('click', function () { resultBox.innerHTML = ''; });
          })
          .catch(function (error) {
            btn.disabled = false; btn.textContent = 'Preview branded photo';
            Hub.toast(error && error.message && error.message !== 'image_load_failed' ? error.message : 'Could not load the original photograph or emblem. Try again.');
          });
      });
    });
  }

  // ---------------------------------------------------------------------------------------------
  // CAROUSEL — generate the REST of a carousel for a draft. One photo is what Creative Studio has
  // always made; a carousel needs several that look shot together, and until now the owner's only
  // way to get more was to generate a cover one at a time and hope the "one at a time" stayed
  // consistent. This calls _lib/carousel_gen.js through the `generate_carousel` op: the owner picks
  // a TOTAL slide count, the server makes however many are missing, and every one of them draws
  // from the SAME art direction as the rest of this post (image_brief or caption) so the set reads
  // as one shoot, not five unrelated bowls.
  //
  // ON DEMAND ONLY — this button is the only thing that calls it; nothing in the planner or any
  // background job generates a carousel automatically, because every slide is a real charge against
  // the weekly AI budget (see the op's `message` on a partial batch for what a spent budget looks
  // like from here).
  function carouselTool(p) {
    var locked = p.status === 'published' || p.status === 'publishing';
    if (locked) return '';
    var count = photoSlides(p).length;
    if (count >= 10) return ''; // Instagram's own ceiling (instagram.js CAROUSEL_MAX) — nothing left to add
    var opts = [];
    var start = Math.max(2, count + 1);
    var dflt = Math.min(count + 4, 10);
    for (var n = start; n <= 10; n++) opts.push('<option value="' + n + '"' + (n === dflt ? ' selected' : '') + '>' + n + ' photos total</option>');
    return '<details style="margin-top:8px"><summary style="font-size:11.5px;opacity:.7;cursor:pointer">🎞️ Generate the rest of a carousel</summary>' +
      '<div style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfaf6">' +
        '<p class="hint" style="margin-bottom:6px">The Team Lead reads your cover and plans the rest as ONE story — distinct on-brand frames that flow from it and end on a call-to-action — and writes the wording for each frame so you can paste it straight into branding. Costs against the weekly AI budget: one provider call per new slide.</p>' +
        '<textarea class="carousel-instr" placeholder="What should the rest be about? (optional) — e.g. “the Palm Beach cities we deliver to”. Leave blank and it infers from the cover." style="width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;margin-bottom:6px"></textarea>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<select class="carousel-count" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px">' + opts.join('') + '</select>' +
          '<button class="btn gold carousel-gen" data-carousel="' + esc(p.id) + '" type="button" style="white-space:nowrap">Generate</button>' +
        '</div>' +
        '<div class="carousel-overlays" style="margin-top:8px"></div>' +
      '</div></details>';
  }

  function wireCarousel() {
    Array.prototype.forEach.call(document.querySelectorAll('.carousel-gen'), function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        var panel = b.closest('details');
        var sel = panel ? panel.querySelector('.carousel-count') : null;
        var instrEl = panel ? panel.querySelector('.carousel-instr') : null;
        var overEl = panel ? panel.querySelector('.carousel-overlays') : null;

        // happen clicks again and pays for a second batch on top of the first.
        b.disabled = true; b.textContent = 'Generating…';

    });
  }

  // Audit evidence belongs to a saved design and its source context, never to approval.
  function auditBadge(p) {
    var scored = p.audit_at != null || p.audit_status != null || p.audit_score != null;
    if (!scored) return '<div class="audit unscored"><span class="audit-head">Brand Auditor · not scored yet</span></div>';
    var flags = [], detail = null;
    try { flags = JSON.parse(p.audit_flags || '[]'); } catch (e) { flags = []; }
    try { detail = JSON.parse(p.audit_detail_json || 'null'); } catch (e) { detail = null; }
    if (!Array.isArray(flags)) flags = [];
    var unavailable = flags.some(function(f) { return f && f.type === 'audit_unavailable'; });
    var current = p.audit_current === 1 || p.audit_current === true;
    var structured = detail && detail.rubric_version && Array.isArray(detail.observations);
    var partial = structured && (detail.complete === false || detail.observations.some(function(o) { return o && o.status === 'unknown'; }));
    var status = !partial && !unavailable && current && p.audit_status === 'pass' ? 'pass' : 'flag';
    var label = unavailable ? 'unavailable' : !current ? 'outdated — re-audit required' : partial ? 'partial — unresolved evidence' : p.audit_status === 'pass' ? 'requirements met' : 'needs review';
    var body = '';
    if (structured) {
      var applicable = detail.observations.filter(function(o) { return o && o.status !== 'not_applicable'; });
      var met = applicable.filter(function(o) { return o.status === 'met'; }).length;
      body += '<div class="audit-score">Requirements met: ' + met + '/' + applicable.length + (partial ? ' · ' + applicable.filter(function(o) { return o.status === 'unknown'; }).length + ' unresolved — review required' : '') + (current ? '' : ' · historical result') + '</div>';
      var names = {branding:'Emblem visual consistency',readability:'Readability',caption_image:'Caption and imagery',themed_packaging:'Personalized packaging',product_fidelity:'Product accuracy',claims:'Supported claims',owner_instructions:'Owner direction'};
      body += '<details><summary>Review audit evidence</summary><ul>' + detail.observations.map(function(o) {
        if (!o || typeof o !== 'object') return '';
        return '<li><b>' + esc(names[o.criterion_id] || o.criterion_id || 'Requirement') + ' · ' + esc(o.status || 'unknown') + '</b><div>' + esc(o.explanation || '') + '</div>' +
          (o.rule_quote ? '<div class="hint">Rule: ' + esc(o.rule_quote) + '</div>' : '') +
          (o.caption_quote ? '<div class="hint">Caption: ' + esc(o.caption_quote) + '</div>' : '') +
          (Array.isArray(o.slides) && o.slides.length ? '<div class="hint">Slides: ' + esc(o.slides.join(', ')) + '</div>' : '') + '</li>';
      }).join('') + '</ul></details>';
      if (detail.product_evidence) {
        var productEvidence=detail.product_evidence;
        body += '<details><summary>Product claim scope</summary><p class="hint">Model-classified scope: ' + esc(productEvidence.scope || 'unknown') + '. Exact caption and registered overlay excerpts are checked against saved source text; this does not prove the model found every claim.</p>' +
          '<ul>' + (Array.isArray(productEvidence.claims) ? productEvidence.claims : []).map(function(claim){return '<li>' + esc(claim.quote || '') + ' · ' + esc(claim.source || 'unknown') + (claim.source==='image_text' ? ' (model observation, not verified OCR)' : '') + ' · ' + (claim.caption_line ? 'caption line ' + esc(String(claim.caption_line)) : 'slide ' + esc(String(claim.slide))) + '</li>';}).join('') + '</ul></details>';
      }
      var slideSources = detail.input_coverage && detail.input_coverage.slide_sources;
      if (Array.isArray(slideSources) && slideSources.length) {
        body += '<details><summary>Saved design source records</summary><p class="hint">Exact saved-image hashes and registered render declarations. These do not prove public Instagram pixels, food ingredients, readability, or owner approval. Audit explanations above remain model judgments.</p><ul>' + slideSources.map(function(source) {
          var facts = source.design_facts;
          var words = facts && Array.isArray(facts.rendered_text) ? facts.rendered_text.map(function(item) { return item.text; }).join(' · ') : '';
          return '<li><b>Slide ' + esc(String(source.slide)) + '</b> · ' + (facts ? 'registered output matched' : source.unreviewed_render ? 'browser declaration saved · image bytes matched · layout unverified' : source.render_receipt_status === 'receipt_read_unavailable' ? 'render receipt unavailable' : 'no registered design declaration') +
            (source.sha256 ? '<div class="hint">SHA-256: ' + esc(source.sha256) + '</div>' : '') +
            (words ? '<div>Recorded overlay: ' + esc(words) + '</div>' : '') + '</li>';
        }).join('') + '</ul></details>';
      }
      if (Array.isArray(detail.suggestions) && detail.suggestions.length) body += '<details><summary>Optional refinements</summary><ul>' + detail.suggestions.map(function(s) { return '<li>' + esc(String(s)) + '</li>'; }).join('') + '</ul></details>';
    } else if (p.audit_score != null) {
      body += '<div class="audit-score">Legacy score: ' + esc(String(p.audit_score)) + '/100 · not a complete current requirements audit</div>';
    }
    if (flags.length) body += '<ul>' + flags.map(function(f) { return '<li>' + esc(f && f.detail || '') + '</li>'; }).join('') + '</ul>';
    if (unavailable && detail && detail.audit_diagnostic) {
      var diagnostic = detail.audit_diagnostic;
      body += '<details><summary>Why this audit needs review</summary><p>' + esc(diagnostic.criterion_id || diagnostic.reason || 'Audit evidence') + '</p>' +
        (diagnostic.field || diagnostic.issue ? '<p>Evidence field: ' + esc(String(diagnostic.field || 'unknown').slice(0,80)) + ' · ' + esc(String(diagnostic.issue || 'invalid').slice(0,120)) + '</p>' : '') +
        (diagnostic.length != null || diagnostic.max != null ? '<p>Length/count: ' + esc(String(diagnostic.length == null ? 'unknown' : diagnostic.length).slice(0,30)) + ' · maximum: ' + esc(String(diagnostic.max == null ? 'unknown' : diagnostic.max).slice(0,30)) + '</p>' : '') +
        (diagnostic.explanation ? '<p>' + esc(diagnostic.explanation) + '</p>' : '') +
        (diagnostic.quote ? '<p>Rejected caption citation: ' + esc(diagnostic.quote) + '</p>' : '') +
        '<p class="hint">This is a rejected auditor observation, not a verified defect in your design.</p></details>';
    }
    body += '<div class="hint">' + (!current ? 'The design or source guidance must be checked again. ' : '') + 'Visual comparison does not prove image or logo provenance. An audit is not permission to publish.</div>';
    return '<div class="audit ' + status + '"><span class="audit-head">Brand Auditor · ' + label + '</span>' + body + '</div>';
  }

  // PROVENANCE on the card — what CAUSED this post, from social.js's batched post_provenance join
  // (migrations/0076 + intel_id 0081). Connects "I wrote a training rule / ran a brief / had this
  // market read" to the post it produced, so effect is finally traceable to cause. A post with no
  // recorded row is UNKNOWN — it predates the feature — and says so plainly rather than implying
  // nothing was behind it. When a row IS present, only the parts that are actually attributed show.
  function provenanceBadge(p) {
    var pr = p.provenance;
    if (!pr || !pr.recorded) {
      return '<div class="prov"><span class="prov-head">🧭 Provenance</span> <span class="prov-unknown">not recorded — review the original photo and caption before approval.</span></div>';
    }
    var items = [];
    if (pr.brief_title || pr.brief_id) items.push('<li>📋 Campaign brief: <b>' + esc(pr.brief_title || pr.brief_id) + '</b></li>');

    if (pr.rules_count != null) items.push('<li>📐 Training rules active: <b>' + esc(String(pr.rules_count)) + '</b></li>');
    var body = items.length
      ? '<ul>' + items.join('') + '</ul>'
      : ' <span class="prov-unknown">recorded, but no brief, intel, or rules were attributed to it.</span>';
    return '<div class="prov"><span class="prov-head">🧭 Provenance</span>' + body + '</div>';
  }

  function postCard(p) {
    var mtype = p.media_type || null;   // null = legacy/undeclared (migrations/0080) — image/carousel by slide count, as always
    var slideCap = (mtype === 'REELS' || mtype === 'STORIES') ? 1 : 10;   // Meta allows no carousel for either
    var isFeed = mtype !== 'REELS' && mtype !== 'STORIES';   // branding + carousel generation are feed-post concepts only
    // The image preview uses the HUB-authenticated route, never the public token — the owner is

    return '<div class="post ' + esc(p.status) + '" data-queue-card="' + esc(p.id) + '" data-queue-status="' + esc(p.status) + '" tabindex="-1">' +
      '<div class="post-head"><span style="display:flex;gap:6px;align-items:center"><span class="tag ' + esc(p.status) + '">' + (WORD[p.status] || esc(p.status)) + '</span>' +

      (['draft','failed','published'].includes(p.status) ? '<button class="btn ghost" data-audit="' + esc(p.id) + '">' + (p.status === 'published' ? 'Review saved source design' : 'Audit saved draft') + '</button>' : '') +

      provenanceBadge(p) +
      // Slides. One photo is a normal post; 2-10 is a carousel, and the ORDER is editorial — the

      slideStrip(p) +
      coverNote(p) +
      (isFeed ? '<details class="queue-advanced"><summary>Advanced creative tools / Herramientas creativas avanzadas</summary>' + brandingTool(p) + carouselTool(p) + referenceVariantTool(p) + promptImageTool(p) + '</details>' : '') +

            mtype === 'STORIES'

  // ---------------------------------------------------------------------------------------------

  // already carries — generate_cover repairs FROM the post's own caption/image_brief,

  // get a picture." This is, and it lives in the composer (the FIRST-CLASS spot for a new post,

  // missing a photo).

  // State lives on DATA (same pattern as _pickedKey/_draftType) so the typed prompt and any
  // pending preview survive the composer's own re-render, the same way an uploaded key does.

      '<div class="hub-section" id="post-queue"><h2 tabindex="-1" id="post-queue-title">Posts / Publicaciones</h2>' +
        '<p class="hint">Latest 60 posts returned · Últimas 60 publicaciones devueltas</p><div class="pt-chips queue-filters" role="group" aria-label="Filter posts / Filtrar publicaciones">' +
        [['drafts','Drafts / Borradores'],['scheduled','Scheduled / Programadas'],['attention','Attention / Atención'],['live','Live / Publicadas'],['all','All / Todas']].map(function (f) { return '<button type="button" data-queue-filter="' + f[0] + '" aria-pressed="false">' + f[1] + '</button>'; }).join('') + '</div><p id="queue-count" class="hint" role="status"></p><p id="queue-empty" hidden>No matching posts in this loaded list. / No hay publicaciones coincidentes en esta lista.</p>' +
        (d.posts.length ? d.posts.map(postCard).join('') : '<div class="card"><p class="row-sub">Nothing yet.</p></div>') +
