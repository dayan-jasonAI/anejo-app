<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Añejo Hub · Guía de operaciones</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/emblem.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
@font-face{font-family:Cormorant Garamond;src:url('/assets/fonts/CormorantGaramond-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:Josefin Sans;src:url('/assets/fonts/JosefinSans-Regular.ttf') format('truetype');font-display:swap}
.guide{max-width:920px;padding-top:22px}
#lang-toggle{min-width:44px;min-height:44px;font-size:13px}
.guide-back{display:inline-flex;align-items:center;min-height:44px;padding:8px 2px;font-size:14px;font-weight:650;text-decoration:none}
.guide-hero{position:relative;overflow:hidden;padding:24px 22px 26px;border-radius:16px;background:var(--green);color:var(--cream);box-shadow:0 10px 28px rgba(27,58,43,.12)}
.guide-eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold);font:500 12px/1.4 'Josefin Sans',sans-serif;letter-spacing:1.8px;text-transform:uppercase}
.guide-eyebrow img{width:34px;height:34px;object-fit:contain}
.guide-hero h2{max-width:700px;margin:12px 0 9px;color:var(--cream);font:500 clamp(34px,7vw,54px)/.98 'Cormorant Garamond',Georgia,serif;letter-spacing:.2px}
.guide-hero p{max-width:710px;color:rgba(245,242,236,.92);font-size:16px;line-height:1.6}
.guide-section-title{margin:26px 0 12px;color:var(--green);font:500 31px/1.1 'Cormorant Garamond',Georgia,serif}
.guide-list{display:grid;gap:12px;counter-reset:ops}
.guide-card{overflow:hidden;border:1px solid rgba(27,58,43,.16);border-radius:14px;background:var(--white);box-shadow:var(--shadow);counter-increment:ops}
.guide-card>summary{display:flex;align-items:center;gap:13px;min-height:72px;padding:16px;cursor:pointer;list-style:none}
.guide-card>summary::-webkit-details-marker{display:none}
.guide-card>summary:after{flex:0 0 auto;margin-left:auto;color:var(--gold-dark);font-size:20px;line-height:1;content:"⌄"}
.guide-card[open]>summary:after{transform:rotate(180deg)}
.guide-number{display:grid;flex:0 0 36px;width:36px;height:36px;place-items:center;border-radius:50%;background:var(--green);color:var(--gold);font:500 18px/1 'Cormorant Garamond',Georgia,serif}
.guide-heading{min-width:0;padding-top:1px}
.guide-heading strong{display:block;color:var(--green);font-size:17px;line-height:1.35}
.guide-heading span{display:block;margin-top:3px;color:#4f5d55;font-size:14px;line-height:1.4}
.guide-details{padding:0 18px 18px 65px}
.guide-details ol{margin:0 0 14px;padding-left:20px}
.guide-details li{padding:3px 0;font-size:15px;line-height:1.5}
.guide-primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:11px 15px;border-radius:9px;background:var(--green);color:#fffdf8;font-size:14px;font-weight:700;line-height:1.35;text-decoration:none;transition:background-color .15s ease,transform .1s ease}
.guide-primary:hover{background:#244a38}
.guide-primary:active{transform:scale(.985)}
.guide-related{margin-top:10px}
.guide-related>summary{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--green);font-size:13px;font-weight:650;list-style:none}
.guide-related>summary::-webkit-details-marker{display:none}
.guide-related>summary:after{content:"⌄";color:var(--gold-dark)}
.guide-related[open]>summary:after{transform:rotate(180deg)}
.guide-related>div{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px}
.guide-related a{display:inline-flex;align-items:center;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--green);font-size:13px;font-weight:600;line-height:1.3;text-decoration:none}
.guide-related a:hover{background:var(--cream)}
@media(min-width:760px){.guide{padding-top:30px}.guide-hero{padding:34px 38px 36px}.guide-list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.guide-card:first-child,.guide-card:last-child{grid-column:1/-1}.guide-details{padding-right:22px}}
@media(max-width:420px){.guide{padding-left:12px;padding-right:12px}.guide-hero{padding:21px 17px}.guide-card>summary{padding:14px 12px;gap:10px}.guide-details{padding:0 13px 15px 58px}.guide-primary{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body data-i18n-local-only>
<div class="hub-bar">
  <h1>AÑEJO · HUB</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button" aria-label="Cambiar idioma a inglés">EN</button></div>
</div>
<main id="owner-root" class="hub-wrap guide" aria-live="polite">
  <p class="hub-loading">Cargando guía de operaciones…</p><noscript>Activa JavaScript para abrir la guía y verificar tu acceso.</noscript>
</main>
<nav id="owner-nav" class="hub-nav" aria-label="Navegación de dueña"></nav>
<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script src="/hub/assets/operator-playbooks.js?v=1"></script>
</body>
</html>
