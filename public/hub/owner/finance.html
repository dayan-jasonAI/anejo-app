<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Finance</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · FINANCE</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading finance…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }

  var days = 7;

  // ---------- QuickBooks ----------
  // Three states needing three different actions, so they are never collapsed into "not working":
  // no app credentials yet (nothing the owner can do here), not connected (press Connect), and
  // connection expired (reconnect — a different action from retrying).
  function qboRender(d) {
    var el = document.getElementById('qbo'); if (!el) return;
    if (!d || !d.ok) { el.innerHTML = '<p class="row-sub" data-i18n>Could not load the QuickBooks status.</p>'; return; }

    if (!d.configured) {
      el.innerHTML = '<p class="row-sub"><b>Not set up yet.</b> ' + Owner.esc(d.setup || '') + '</p>' +
        '<p class="row-sub" style="margin-top:6px">Invoices still generate, send and mark paid without it — QuickBooks is an extra copy for the books, not where the money lives.</p>';
      return;
    }
    if (d.connected) {
      el.innerHTML = '<p><b>✅ Connected</b> <span class="row-sub">company ' + Owner.esc(d.realm_id || '') +
          (d.environment === 'sandbox' ? ' · sandbox' : '') + '</span></p>' +
        (d.refreshed_at ? '<p class="row-sub">Token last refreshed ' + Owner.timeAgo(d.refreshed_at) + '.</p>' : '') +
        (d.last_error ? '<p class="row-sub" style="color:var(--crit)">Last error: ' + Owner.esc(d.last_error) + '</p>' : '') +
        '<p class="row-sub" style="margin-top:6px">Send an invoice to QuickBooks from the invoice page.</p>' +
        '<button class="btn ghost block" id="qbo-off" type="button" style="margin-top:8px" data-i18n>Disconnect</button>';
    } else {
      el.innerHTML = '<p><b>' + (d.needs_reconnect ? '⚠️ The connection expired' : 'Not connected') + '</b></p>' +
        (d.last_error ? '<p class="row-sub" style="color:var(--crit)">' + Owner.esc(d.last_error) + '</p>' : '') +
        '<button class="btn gold block" id="qbo-on" type="button" style="margin-top:8px">' +
          (d.needs_reconnect ? 'Reconnect QuickBooks' : 'Connect QuickBooks') + '</button>' +
        // redirect_uri_mismatch is the usual first-time failure and its error message says nothing
        // useful, so the exact value to register is printed here.
        '<p class="row-sub" style="margin-top:8px">Redirect URI to register on the Intuit app: <code>' + Owner.esc(d.redirect_uri || '') + '</code></p>';
    }

    var on = document.getElementById('qbo-on');
    if (on) on.addEventListener('click', function () {
      on.disabled = true;
      Hub.api('/api/hub/owner/qbo', { method: 'POST', body: { op: 'connect' } }).then(function (r) {
        if (r && r.ok && r.url) { location.href = r.url; return; }
        on.disabled = false; Hub.toast((r && r.error) || 'Could not start the connection');
      });
    });
    var off = document.getElementById('qbo-off');
    if (off) off.addEventListener('click', function () {
      if (!window.confirm('Disconnect QuickBooks? Invoices already sent there stay where they are.')) return;
      off.disabled = true;
      Hub.api('/api/hub/owner/qbo', { method: 'POST', body: { op: 'disconnect' } }).then(function (r) {
        if (r && r.ok) { Hub.toast('QuickBooks disconnected'); qboLoad(); }
        else { off.disabled = false; Hub.toast('Could not disconnect'); }
      });
    });
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }
  function qboLoad() { Owner.get('/api/hub/owner/qbo').then(qboRender); }

  // The callback bounces back here with the outcome, so it is read in the HUB rather than as a
  // bare status code on a blank page.
  function qboFlash() {
    var p = new URLSearchParams(location.search);
    var s = p.get('qbo');
    if (!s) return;
    if (s === 'connected') Hub.toast('QuickBooks connected');
    else if (s === 'cancelled') Hub.toast('QuickBooks connection cancelled');
    else Hub.toast(p.get('qbo_msg') || 'Could not connect QuickBooks');
    history.replaceState({}, '', location.pathname);
  }

  function render() {
    var root = document.getElementById('owner-root'); root.className = '';
    root.innerHTML =
      '<div class="hub-section"><h2 data-i18n>Window</h2>' +
      '<div class="card"><label data-i18n>Days</label><select id="days"><option value="7">7</option><option value="30">30</option><option value="90">90</option></select></div></div>' +
      '<div id="tiles" class="card-grid"></div>' +
      '<div class="hub-section"><a class="btn ghost block" href="/hub/owner/payouts.html" style="text-align:center;text-decoration:none">💵 Driver payouts — who’s owed what →</a>' +
      '<a class="btn ghost block" href="/hub/owner/trainers.html" style="text-align:center;text-decoration:none;margin-top:8px">🤝 Trainer commissions — partners &amp; clients →</a></div>' +
      '<div class="hub-section"><h2 data-i18n>Automatic payments</h2><div id="autopay" class="card"><div class="hub-loading">…</div></div></div>' +
      '<div class="hub-section"><h2 data-i18n>QuickBooks</h2><div id="qbo" class="card"><div class="hub-loading">…</div></div></div>' +
      '<div class="hub-section"><h2 data-i18n>Pending expenses</h2><div id="pexp" class="list"><div class="hub-loading">…</div></div></div>' +
      '<div class="hub-section"><h2 data-i18n>Export report</h2><div class="card">' +
      '<div class="field"><label data-i18n>Report type</label><select id="rtype">' +
      '<option value="finance">finance</option><option value="payroll">payroll</option>' +
      '<option value="deliveries">deliveries</option><option value="accountability">accountability</option>' +
      '<option value="temp_compliance">temp_compliance</option></select></div>' +
      '<button class="btn gold block" id="exportBtn" type="button" data-i18n>Export</button>' +
      '<p class="row-sub" style="margin-top:8px" data-i18n>Downloads a CSV of the selected report.</p></div></div>';

    var sel = document.getElementById('days');
    sel.value = String(days);
    sel.addEventListener('change', function () { days = parseInt(sel.value, 10) || 7; load(); });
    document.getElementById('exportBtn').addEventListener('click', doExport);
    load();
    loadExpenses();
    autopayLoad();
    qboLoad();
    qboFlash();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  // ---------- Automatic payments ----------
  // Dayan asked for "an on/off switch button to the hub that is visible and properly wired so I
  // can turn it on and off as I please, OR leave it on with the rule that it doesn't send unless
  // Dayan approves the number." Both are here, because they are different guarantees:
  //   · the SWITCHES are the standing posture — off means nothing automatic can charge at all;
  //   · the APPROVE button below is per-invoice and per-amount, and re-approval is required if
  //     the invoice total moves after it was approved.
  // Both default OFF and the page says so out loud, so nobody has to guess what state it is in.
  function autopayRender(d) {
    var el = document.getElementById('autopay'); if (!el) return;
    if (!d || !d.ok) { el.innerHTML = '<p class="row-sub" data-i18n>Could not load the automatic-payment switches.</p>'; return; }
    var s = d.settings || {};

    function sw(which, on, label, sub) {
      return '<div class="row"><div class="row-main">' +
        '<div class="row-title">' + label + ' — <b style="color:' + (on ? 'var(--ok,#2e7d32)' : 'var(--crit,#b3261e)') + '">' +
          (on ? 'ON' : 'OFF') + '</b></div>' +
        '<div class="row-sub">' + sub + '</div></div>' +
        '<button class="btn ' + (on ? 'ghost' : 'gold') + '" type="button" data-switch="' + which + '" data-next="' + (on ? '0' : '1') + '">' +
          (on ? 'Turn OFF' : 'Turn ON') + '</button></div>';
    }

    var pending = (d.invoices || []).filter(function (i) { return !i.autopay_approved_at; });
    var approved = (d.invoices || []).filter(function (i) { return !!i.autopay_approved_at; });

    var rows = (d.invoices || []).map(function (i) {
      var isApproved = !!i.autopay_approved_at;
      var stale = isApproved && Number(i.autopay_approved_cents) !== Number(i.total_cents);
      return '<div class="row"><div class="row-main">' +
        '<div class="row-title">' + Owner.esc(i.account_name || i.id) + ' · ' + Owner.money(i.total_cents) + '</div>' +
        '<div class="row-sub">' + Owner.esc(i.number || i.id) + ' · ' + Owner.esc(i.status) +
          (i.has_card ? ' · card ' + Owner.esc(i.card_brand || '') + ' ••' + Owner.esc(i.card_last4 || '') : ' · <b>no card on file</b>') +
          (stale ? ' · <b style="color:var(--crit,#b3261e)">approved ' + Owner.money(i.autopay_approved_cents) + ' — amount changed, approve again</b>'
                 : (isApproved ? ' · <b>approved ' + Owner.money(i.autopay_approved_cents) + '</b>' : ' · not approved')) +
          (i.autopay_error ? ' · last error: ' + Owner.esc(i.autopay_error) : '') +
        '</div></div>' +
        (isApproved && !stale
          ? '<button class="btn ghost" type="button" data-revoke="' + Owner.esc(i.id) + '">Un-approve</button>'
          : '<button class="btn gold" type="button" data-approve-inv="' + Owner.esc(i.id) + '" data-cents="' + Number(i.total_cents || 0) + '">Approve ' + Owner.money(i.total_cents) + '</button>') +
        '</div>';
    }).join('');

    el.innerHTML =
      sw('contracts', !!s.contracts_enabled, 'Charge contract invoices automatically',
         'When ON, an approved invoice is charged to that account’s card on file. When OFF, nothing is ever charged automatically — invoices still generate and send.') +
      sw('payouts', !!s.payouts_enabled, 'Allow payouts to be marked paid',
         'When OFF, driver and partner payouts cannot be marked paid at all. When ON, each payout still needs its exact amount approved first.') +
      '<p class="row-sub" style="margin-top:10px"><b>Both safeties always apply.</b> A charge needs the switch ON <i>and</i> the exact amount approved. ' +
        'Change the invoice total after approving and the charge refuses instead of charging the new number.</p>' +
      (s.degraded ? '<p class="row-sub" style="color:var(--crit,#b3261e)">Settings could not be read — treating both switches as OFF.</p>' : '') +
      '<h3 style="margin:16px 0 6px">Unpaid contract invoices (' + approved.length + ' approved · ' + pending.length + ' waiting)</h3>' +
      (rows || '<p class="row-sub">No open contract invoices.</p>');

    el.querySelectorAll('[data-switch]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var which = btn.getAttribute('data-switch');
        var next = btn.getAttribute('data-next') === '1';
        if (next && !window.confirm('Turn ' + which + ' automatic payments ON? Approved amounts will then be able to move money.')) return;
        btn.disabled = true;
        Hub.api('/api/hub/owner/autopay', { method: 'POST', body: { op: 'set', which: which, on: next } }).then(function (r) {
          if (r && r.ok) { Hub.toast(which + ' automatic payments ' + (next ? 'ON' : 'OFF')); autopayLoad(); }
          else { btn.disabled = false; Hub.toast((r && r.error) || 'Could not change that switch'); }
        });
      });
    });
    el.querySelectorAll('[data-approve-inv]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var invId = btn.getAttribute('data-approve-inv');
        var cents = Number(btn.getAttribute('data-cents'));
        if (!window.confirm('Approve ' + Owner.money(cents) + ' to be charged automatically to this account’s card?')) return;
        btn.disabled = true;
        Hub.api('/api/hub/owner/autopay', { method: 'POST', body: { op: 'approve_invoice', invoice_id: invId, amount_cents: cents } }).then(function (r) {
          if (r && r.ok) { Hub.toast('Approved ' + Owner.money(cents)); autopayLoad(); }
          else { btn.disabled = false; Hub.toast((r && r.error) || 'Could not approve'); }
        });
      });
    });
    el.querySelectorAll('[data-revoke]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.disabled = true;
        Hub.api('/api/hub/owner/autopay', { method: 'POST', body: { op: 'revoke_invoice', invoice_id: btn.getAttribute('data-revoke') } }).then(function (r) {
          if (r && r.ok) { Hub.toast('Approval withdrawn'); autopayLoad(); }
          else { btn.disabled = false; Hub.toast('Could not withdraw that approval'); }
        });
      });
    });
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }
  function autopayLoad() { Owner.get('/api/hub/owner/autopay').then(autopayRender); }

  function loadExpenses() {
    Owner.get('/api/hub/owner/expenses?status=pending').then(function (d) {
      var el = document.getElementById('pexp');
      if (!el) return;
      if (!d || !d.ok || !d.items || !d.items.length) {
        el.innerHTML = '<div class="card"><p class="row-sub" data-i18n>No pending expenses.</p></div>';
        if (window.AnejoI18n) window.AnejoI18n.refresh();
        return;
      }
      el.innerHTML = d.items.map(function (e) {
        var receipt = e.receipt_photo
          ? '📎 <span data-i18n>receipt</span>'
          : '<span data-i18n>no receipt</span>';
        return '<div class="row"><div class="row-main">' +
          '<div class="row-title">' + Owner.esc(e.staff_name || e.staff_id) + ' · ' + Owner.money(e.amount_cents) + '</div>' +
          '<div class="row-sub">' + Owner.esc(e.expense_type || 'other') + ' · ' + Owner.timeAgo(e.created_at) + ' · ' + receipt + '</div>' +
          (e.note ? '<div class="row-sub">' + Owner.esc(e.note) + '</div>' : '') + '</div>' +
          '<button class="btn gold" data-approve="' + Owner.esc(e.id) + '" type="button" data-i18n>Approve</button>' +
          '<button class="btn ghost" data-reject="' + Owner.esc(e.id) + '" type="button" data-i18n>Reject</button>' +
          '</div>';
      }).join('');
      el.querySelectorAll('[data-approve],[data-reject]').forEach(function (b) {
        b.addEventListener('click', function () {
          var idv = b.getAttribute('data-approve') || b.getAttribute('data-reject');
          var decision = b.hasAttribute('data-approve') ? 'approved' : 'rejected';
          b.disabled = true;
          Hub.api('/api/hub/owner/expenses', { method: 'POST', body: { id: idv, decision: decision } }).then(function (r) {
            if (r && r.ok) {
              Hub.toast(decision === 'approved' ? 'Expense approved' : 'Expense rejected');
              loadExpenses();
              load();
            } else {
              b.disabled = false;
              Hub.toast('Could not update expense');
            }
          });
        });
      });
      if (window.AnejoI18n) window.AnejoI18n.refresh();
    });
  }

  function load() {
    Owner.get('/api/hub/owner/finance/rollup?days=' + days).then(function (d) {
      var el = document.getElementById('tiles');
      if (!d || !d.ok) { el.innerHTML = '<div class="hub-empty" data-i18n>No data.</div>'; return; }
      el.innerHTML = [
        Owner.tile(Owner.money(d.orders.revenue_cents), 'Revenue', { accent: 'accent-green' }),
        Owner.tile(Owner.money(d.net_estimate_cents), 'Net (est)'),
        Owner.tile(d.orders.pending_count, 'Orders pending', { badge: Owner.money(d.orders.pending_cents) }),
        Owner.tile(Owner.money(d.expenses.approved_cents), 'Expenses approved'),
        Owner.tile(d.expenses.pending_count, 'Expenses pending', { accent: d.expenses.pending_count ? 'accent' : '', badge: Owner.money(d.expenses.pending_cents) }),
        Owner.tile(d.mileage.pending_count, 'Mileage pending', { badge: (d.mileage.pending_miles || 0).toFixed(1) + ' mi' }),
        Owner.tile(Owner.money(d.rev_share.pending_cents), 'Rev-share owed'),
        Owner.tile(Owner.money((d.driver_pay && d.driver_pay.completed_cents) || 0), 'Driver pay (earned)', { badge: (d.driver_pay ? d.driver_pay.route_count : 0) + ' routes' }),
        Owner.tile(Owner.money((d.driver_pay && d.driver_pay.scheduled_cents) || 0), 'Driver pay (scheduled)')
      ].join('');
      if (window.AnejoI18n) window.AnejoI18n.refresh();
    });
  }

  function doExport() {
    var rtype = document.getElementById('rtype').value;
    var btn = document.getElementById('exportBtn'); btn.disabled = true;
    // Real CSV download: the endpoint streams text/csv with a Content-Disposition filename.
    fetch('/api/hub/owner/report', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ report_type: rtype, format: 'csv' }),
    }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      var dispo = r.headers.get('Content-Disposition') || '';
      var m = dispo.match(/filename="?([^";]+)"?/);
      return r.blob().then(function (blob) { return { blob: blob, name: (m && m[1]) || ('anejo-' + rtype + '.csv') }; });
    }).then(function (f) {
      btn.disabled = false;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(f.blob);
      a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      Hub.toast('Report downloaded');
    }).catch(function () { btn.disabled = false; Hub.toast('Export failed'); });
  }

  Owner.init('finance', render);
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
