<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Catering &amp; Quotes</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .qcard{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px;margin:10px 0;background:#fff}
  .qcard .nm{font-weight:800;color:var(--green);font-size:17px}
  .split{display:flex;gap:8px;margin:10px 0}
  .split .s{flex:1;background:var(--cream);border-radius:10px;padding:10px;text-align:center}
  .split .s .v{font-size:19px;font-weight:800;color:var(--green)}
  .split .s .l{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .pill{font-size:11px;font-weight:700;background:#eee;color:#555;border-radius:20px;padding:3px 9px}
  .pill.gold{background:#efe7cf;color:#8a7a2e}.pill.green{background:#e1efe5;color:#1A3D2E}
  .pill.crit{background:#f7e3de;color:#7a2418}
  .terms{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .terms summary{font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer}
  .terms li{font-size:12.5px;color:var(--muted);line-height:1.55;margin:6px 0 0 16px}
  .lnk{font-size:12px;word-break:break-all}
  .rcard{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:15px;margin:10px 0;background:#fff}
  .rcard.targeted{box-shadow:0 0 0 3px rgba(198,168,91,.38);border-left-color:var(--gold)}
  .rcard .nm{font-weight:800;color:var(--green);font-size:17px}
  .rbody{margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:9px;color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-line}
  .ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ractions .btn{width:auto}
  .rfiles{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#faf8f2}.rfiles b{display:block;color:var(--green);font-size:12px;margin-bottom:5px}.rfiles a{display:block;font-size:12.5px;line-height:1.6;word-break:break-word}
  .cajita-review-summary{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · CATERING</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button" aria-label="Language / Idioma" translate="no">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading quotes…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/catering-i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var esc = Hub.esc, money = Owner.money, C = window.CateringI18n;
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }

  var ENDPOINT = '/api/hub/owner/catering-deposit';

  // Dollars typed by a human → integer cents. The API refuses anything over $100,000 as a
  // "you typed dollars where cents were meant" guard, so this conversion has to be the only one.
  function toCents(v) {
    var n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, ''));
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function pct(row) {
    // THE ROW'S OWN RATE, never a constant from this file. A quote sold at a different percentage
    // must display that percentage — see the terms note below.
    var p = Number(row && row.deposit_pct);
    return Number.isFinite(p) ? Math.round(p * 100) + '%' : '';
  }
  function day(ms) { if (!ms) return ''; try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; } }

  // ---------- the terms ----------
  // RENDERED FROM THE SNAPSHOT ON THE ROW. `q.terms` is the parsed terms_json that was written
  // when the deposit link was minted. This page never calls termsFor(), never reads DEPOSIT_PCT,
  // and never rebuilds a line of this copy: a customer who booked in August agreed to August's
  // terms, and changing the constants next year must not retroactively re-word their contract.
  function termsHtml(q) {
    var t = q && q.terms;
    if (!t || !t.lines || !t.lines.length) {
      return '<div class="terms"><p class="row-sub">No terms snapshot on this quote — it predates stored terms. Do not quote terms from this screen; check what was sent.</p></div>';
    }
    return '<details class="terms"><summary>Terms this customer agreed to · ' +
      esc(t.version || q.terms_version || 'unversioned') + '</summary><ul>' +
      t.lines.map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('') +
      '</ul></details>';
  }

  function quoteCard(q) {
    var paid = q.deposit_status === 'paid';
    var balPaid = q.balance_status === 'paid';
    return '<div class="qcard">' +
      '<div class="nm">' + esc(q.customer_name || 'Quote ' + q.id) + '</div>' +
      '<div class="row-sub">' + (q.guests || 0) + ' guests' +
        (q.event_date ? ' · event ' + esc(q.event_date) : ' · no event date') +
        (q.customer_email ? ' · ' + esc(q.customer_email) : '') + '</div>' +

      // The split, straight off the row: deposit + balance were computed by depositSplit() at
      // creation and stored, so they always sum to the total on screen exactly as they do in D1.
      '<div class="split">' +
        '<div class="s"><div class="v">' + money(q.deposit_cents) + '</div><div class="l">Deposit ' + pct(q) + '</div></div>' +
        '<div class="s"><div class="v">' + money(q.balance_cents) + '</div><div class="l">Balance</div></div>' +
        '<div class="s"><div class="v">' + money(q.total_cents) + '</div><div class="l">Total</div></div>' +
      '</div>' +

      '<div class="meta">' +
        '<span class="pill ' + (paid ? 'green' : 'crit') + '">Deposit ' + esc(q.deposit_status || 'unpaid') +
          (paid && q.deposit_paid_at ? ' · ' + day(q.deposit_paid_at) : '') + '</span>' +
        '<span class="pill ' + (balPaid ? 'green' : 'gold') + '">Balance ' + esc(q.balance_status || 'due') +
          (q.balance_due_date ? ' · due ' + esc(q.balance_due_date) : '') + '</span>' +
        (q.final_count_due ? '<span class="pill">Final count by ' + esc(q.final_count_due) + '</span>' : '') +
      '</div>' +

      (q.payment_link_url
        ? '<div class="row-sub lnk">Deposit link: <a href="' + esc(q.payment_link_url) + '" target="_blank" rel="noopener">' + esc(q.payment_link_url) + '</a></div>'
        : '<div class="row-sub">No deposit link on this quote.</div>') +

      (q.balance_payment_link_url && !balPaid ? '<div class="row-sub lnk">Balance link: <a href="'+esc(q.balance_payment_link_url)+'" target="_blank" rel="noopener">Pay final balance through Square</a></div>' : '') +
      (!balPaid && paid && !q.balance_payment_link_url ? '<button class="btn gold block" data-balance-link="'+esc(q.id)+'">Create Square balance link</button>' : '') +
      termsHtml(q) +

      (!balPaid && paid && !q.balance_payment_link_url
        ? '<button class="btn ghost block" style="margin-top:10px" data-balance="' + esc(q.id) + '">Mark ' + money(q.balance_cents) + ' balance paid</button>'
        : '') +
    '</div>';
  }

  // ---------- inbound website requests ----------
  function msgField(message, label) {
    var line = String(message || '').split('\n').find(function (x) { return x.indexOf(label + ':') === 0; });
    return line ? line.slice(label.length + 1).trim() : '';
  }

  function requestCard(r) {
    var payload = {
      name: r.name || '', email: r.email || '', phone: r.phone || '',
      event_date: msgField(r.message, 'Event date'),
      guests: Number(msgField(r.message, 'Guest count')) || '',
      note: [r.interest ? 'Requested menu: ' + r.interest : '', r.message || ''].filter(Boolean).join('\n'),
      // The suggested total travels with the prefill so "Start a quote" opens with a number in it.
      total: r.suggested && r.suggested.total_cents ? (r.suggested.total_cents / 100).toFixed(2) : '',
      // So the server can read her language and SMS consent off the lead she created, instead of
      // asking whoever fills this in to remember what she agreed to.
      lead_id: r.lead_id || r.id || '',
    };
    var contact = [r.email || '', r.phone || ''].filter(Boolean).join(' · ');
    var targetLead = new URLSearchParams(window.location.search).get('lead');
    var files = (r.attachments || []).map(function (file) {
      var base = '/api/hub/owner/catering-attachments/' + encodeURIComponent(file.id);
      var size = Math.max(1, Math.round(Number(file.byte_size || 0) / 1024));
      return '<a href="' + base + '" target="_blank" rel="noopener">' + C.label('Preview') + ' ' + esc(file.filename) + ' · ' + size + ' KB</a>' +
        '<a href="' + base + '?download=1">' + C.label('Download') + ' ' + esc(file.filename) + '</a>';
    }).join('');
    return '<article translate="no" class="rcard' + (targetLead === r.id ? ' targeted' : '') + '"' + (targetLead === r.id ? ' id="selected-request"' : '') + '>' +
      '<div class="nm">' + (r.name ? esc(r.name) : C.label('Catering request')) + '</div>' +
      '<div class="row-sub">' + (r.interest ? C.menu(r.interest) : C.label('Menu not specified')) +
        (r.company ? ' · ' + esc(r.company) : '') +
        (r.created_at ? ' · ' + C.label('received') + ' ' + day(r.created_at) : '') + '</div>' +
      (contact ? '<div class="row-sub">' + esc(contact) + '</div>' : '') +
      '<div class="rbody"><b>' + C.label('Original request (as submitted)') + '</b><br>' + (r.message ? esc(r.message) : C.label('No event details provided.')) + '</div>' +
      (r.cajita_configuration || r.cajita_summary ? '<details class="rbody"><summary>' + C.label('Exact Cajita configuration') + '</summary>' + C.summaryHtml(r.cajita_configuration,r.cajita_summary) + '</details>' : '') +
      (files ? '<div class="rfiles"><b>' + C.label('Private design files · owner only') + '</b>' + files + '</div>' : '') +
      suggestionHtml(r.suggested) +
      '<div class="ractions">' +
        '<button class="btn ghost" type="button" data-prefill="' + esc(JSON.stringify(payload)) + '">' + C.label('Start a quote') + '</button>' +
        (r.email ? '<a class="btn ghost" href="mailto:' + esc(encodeURIComponent(r.email)) + '?subject=' + encodeURIComponent('Your Añejo catering request') + '">' + C.label('Email customer') + '</a>' : '') +
      '</div></article>';
  }

  // What the live menu says this request costs, shown ON the request card.
  //
  // It is labelled a suggestion everywhere, because that is what it is: the priced lines at
  // today's menu prices with the standard volume discount, and an explicit list of everything
  // still needing a hand quote. The Agreed total field stays editable — this replaces a blank
  // box with a starting point, not Dayan's judgement with a machine's.
  function suggestionHtml(s) {
    if (!s || (!s.total_cents && !(s.unpriced || []).length)) return '';
    var rows = '';
    if (s.subtotal_cents) rows += '<div class="row-sub">' + C.label('Menu price for the priced lines') + ': <b>' + dollars(s.subtotal_cents) + '</b></div>';
    if (s.discount_cents) rows += '<div class="row-sub">' + C.label('Volume discount') + ': −' + dollars(s.discount_cents) + '</div>';
    if (s.total_cents) rows += '<div class="row-sub"><b>' + C.label('Suggested total') + ': ' + dollars(s.total_cents) + '</b></div>';
    var open = (s.unpriced || []).filter(function (u) { return u && u.id; });
    if (open.length) {
      rows += '<div class="row-sub">' + C.label('You still need to price') + ': ' +
        esc(open.map(function (u) { return (u.quantity || '') + ' × ' + u.id; }).join(', ')) + '</div>';
    }
    if (s.live_menu === false) rows += '<div class="row-sub">' + C.label('Live menu unavailable — this is not a current price.') + '</div>';
    return '<div class="rbody"><b>' + C.label('Suggested from the live menu') + '</b>' + rows + '</div>';
  }

  function dollars(cents) {
    return '$' + (Number(cents || 0) / 100).toFixed(2);
  }

  // ---------- the create form ----------
  function formHtml(d) {
    return '<div class="hub-section"><h2>New catering quote</h2><div class="card">' +
      '<div class="field"><label>Customer name</label><input id="q-name" type="text" placeholder="Who the event is for"></div>' +
      '<div class="field"><label>Email</label><input id="q-email" type="email" placeholder="For the deposit link"></div>' +
      '<div class="field"><label>Phone</label><input id="q-phone" type="tel"></div>' +
      '<div class="field"><label>Event date</label><input id="q-date" type="date"></div>' +
      '<div class="field"><label>Guests</label><input id="q-guests" type="number" min="1" step="1"></div>' +
      '<div class="field"><label>Agreed total (dollars)</label><input id="q-total" type="text" inputmode="decimal" placeholder="1200.00"></div>' +
      '<div class="field"><label>Note (optional)</label><input id="q-note" type="text"></div>' +
      // WHAT SHE READ THE SITE IN IS NOT ALWAYS WHAT SHE WANTS TO BE SOLD IN. The quote defaults
      // to the language on her lead, and this overrides it. Dayan hit exactly this on 2026-09-09:
      // a Spanish-speaking client had filled the form in English, so the automatic pick would
      // have emailed and texted her the English quote.
      '<div class="field"><label>Send the quote in</label><select id="q-lang">' +
        '<option value="">Whatever she used on the site</option>' +
        '<option value="en">English</option>' +
        '<option value="es">Español</option>' +
      '</select></div>' +
      '<label class="field" style="display:flex;gap:8px;align-items:center">' +
        '<input id="q-send" type="checkbox" checked style="width:auto">' +
        '<span>Email and text it to her when I create it</span></label>' +
      '<button class="btn ghost block" id="q-preview" type="button">Preview the ' +
        Math.round(Number(d.deposit_pct || 0) * 100) + '% split</button>' +
      '<div id="q-split"></div>' +
      '<button class="btn gold block" id="q-create" type="button" style="margin-top:8px">Create deposit checkout</button>' +
      '<p class="row-sub" style="margin-top:8px">Creating the checkout mints a Square payment link for the deposit only and stores the terms as they stand today. It charges nothing — the customer pays the link.</p>' +
      '</div></div>';
  }

  function body() {
    return {
      customer_name: document.getElementById('q-name').value.trim(),
      customer_email: document.getElementById('q-email').value.trim(),
      customer_phone: document.getElementById('q-phone').value.trim(),
      event_date: document.getElementById('q-date').value,
      guests: Number(document.getElementById('q-guests').value),
      total_cents: toCents(document.getElementById('q-total').value),
      note: document.getElementById('q-note').value.trim(),
      // Empty means "use her lead's language". A blank must NOT be sent as 'en' or it would
      // override the very thing it is meant to defer to.
      lang: document.getElementById('q-lang').value || undefined,
      send: document.getElementById('q-send').checked,
      lead_id: leadId || undefined,
    };
  }

  // Carried from the request card, so the server can read her language and SMS consent off the
  // lead rather than asking whoever is filling this in to remember them.
  var leadId = null;

  function wireForm() {
    document.getElementById('q-preview').addEventListener('click', function () {
      var b = body();
      if (!Number.isFinite(b.total_cents) || b.total_cents <= 0) { Hub.toast('Enter the agreed total first'); return; }
      Hub.api(ENDPOINT, { method: 'POST', body: { op: 'preview', total_cents: b.total_cents, event_date: b.event_date } }).then(function (r) {
        var el = document.getElementById('q-split');
        if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not price that'); el.innerHTML = ''; return; }
        el.innerHTML = '<div class="split" style="margin-top:10px">' +
          '<div class="s"><div class="v">' + money(r.deposit_cents) + '</div><div class="l">Deposit ' + Math.round(r.deposit_pct * 100) + '%</div></div>' +
          '<div class="s"><div class="v">' + money(r.balance_cents) + '</div><div class="l">Balance</div></div>' +
          '<div class="s"><div class="v">' + money(r.total_cents) + '</div><div class="l">Total</div></div></div>' +
          (r.terms && r.terms.final_count_due ? '<p class="row-sub">Final count due ' + esc(r.terms.final_count_due) + ' · balance due ' + esc(r.terms.balance_due_date || '') + '</p>' : '');
      });
    });

    document.getElementById('q-create').addEventListener('click', function () {
      var btn = this, b = body();
      if (!Number.isFinite(b.total_cents) || b.total_cents <= 0) { Hub.toast('Enter the agreed total'); return; }
      if (!Number.isFinite(b.guests) || b.guests <= 0) { Hub.toast('Enter the guest count'); return; }
      var willSend = b.send
        ? 'It will be emailed and texted to her straight away.'
        : 'Nothing will be sent — you will get the link to send yourself.';
      if (!window.confirm('Create a deposit checkout for ' + money(b.total_cents) + '?\n\n'
        + 'This mints a payable link and stores today’s terms on the quote.\n' + willSend)) return;
      btn.disabled = true;
      b.op = 'create';
      Hub.api(ENDPOINT, { method: 'POST', body: b }).then(function (r) {
        btn.disabled = false;
        if (r && r.ok) { Hub.toast('Deposit link created — ' + money(r.deposit_cents)); render(); }
        else Hub.toast((r && r.error) || 'Could not create the deposit link');
      });
    });
  }

  function wireRequests(root) {
    root.querySelectorAll('[data-prefill]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var r;
        try { r = JSON.parse(btn.getAttribute('data-prefill') || '{}'); } catch (e) { r = {}; }
        document.getElementById('q-name').value = r.name || '';
        document.getElementById('q-email').value = r.email || '';
        document.getElementById('q-phone').value = r.phone || '';
        document.getElementById('q-date').value = r.event_date || '';
        document.getElementById('q-guests').value = r.guests || '';
        document.getElementById('q-note').value = r.note || '';
        leadId = r.lead_id || null;
        document.getElementById('q-lang').value = '';
        // Prefilled from the live menu when the request carried priceable products. It stays
        // editable and is still called the AGREED total: the suggestion is a starting point, and
        // anything the menu could not price is listed on the request card above.
        document.getElementById('q-total').value = r.total || '';
        document.getElementById('q-total').focus();
        document.getElementById('q-total').select();
        document.getElementById('q-total').scrollIntoView({ behavior: 'smooth', block: 'center' });
        Hub.toast(r.total
          ? 'Suggested total filled in from the live menu — change it if you agreed something else'
          : 'Request copied into a new quote — enter the agreed total');
      });
    });
  }

  function render() {
    Owner.get(ENDPOINT).then(function (d) {
      var root = document.getElementById('owner-root');
      root.className = '';
      if (!d || !d.ok) { root.innerHTML = '<div class="card"><p class="row-sub">Could not load catering quotes.</p></div>'; return; }
      var qs = d.quotes || [];
      var rs = d.requests || [];
      var unpaid = qs.filter(function (q) { return q.deposit_status !== 'paid'; });
      var owed = qs.reduce(function (n, q) { return n + (q.balance_status === 'due' ? Number(q.balance_cents || 0) : 0); }, 0);

      root.innerHTML =
        '<div class="card-grid">' +
          Owner.tile(String(rs.length), 'Website requests', { accent: rs.length ? 'accent' : '' }) +
          Owner.tile(String(qs.length), 'Quotes') +
          Owner.tile(String(unpaid.length), 'Deposits unpaid', { accent: unpaid.length ? 'accent' : '' }) +
          Owner.tile(money(owed), 'Balances still owed') +
        '</div>' +
        '<div class="hub-section"><h2>Website quote requests</h2><p><a href="/hub/kitchen/catering.html">Open kitchen design-request summary</a></p>' +
        (rs.length ? rs.map(requestCard).join('') : '<div class="hub-empty">No website catering requests yet.</div>') +
        '</div>' +
        formHtml(d) +
        '<div class="hub-section"><h2>Quotes</h2>' +
        (qs.length ? qs.map(quoteCard).join('') : '<div class="hub-empty">No catering quotes yet.</div>') +
        '</div>';

      wireForm();
      wireRequests(root);
      var selected = document.getElementById('selected-request');
      if (selected) selected.scrollIntoView({ behavior: 'smooth', block: 'center' });
      root.querySelectorAll('[data-balance-link]').forEach(function(btn){ btn.addEventListener('click',function(){btn.disabled=true;Hub.api(ENDPOINT,{method:'POST',body:{op:'create_balance_link',quote_id:btn.getAttribute('data-balance-link')}}).then(function(r){if(r&&r.ok){Hub.toast('Square balance link ready');render();}else{btn.disabled=false;Hub.toast((r&&r.error)||'Could not create the balance link');}});});});
      root.querySelectorAll('[data-balance]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!window.confirm('Mark this balance paid? This records the money as received — it does not charge anybody.')) return;
          btn.disabled = true;
          Hub.api(ENDPOINT, { method: 'POST', body: { op: 'mark_balance_paid', quote_id: btn.getAttribute('data-balance') } }).then(function (r) {
            if (r && r.ok) { Hub.toast('Balance closed'); render(); }
            else { btn.disabled = false; Hub.toast((r && r.error) || 'Could not close that balance'); }
          });
        });
      });
      if (window.AnejoI18n) window.AnejoI18n.refresh();
    });
  }

  Owner.init('catering', render);
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
