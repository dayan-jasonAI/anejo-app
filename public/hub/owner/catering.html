<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Catering &amp; Quotes</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .qcard{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px;margin:10px 0;background:#fff}
  .qcard .nm{font-weight:800;color:var(--green);font-size:17px}
  .split{display:flex;gap:8px;margin:10px 0}
  .split .s{flex:1;background:var(--cream);border-radius:10px;padding:10px;text-align:center}
  .split .s .v{font-size:19px;font-weight:800;color:var(--green)}
  .split .s .l{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .pill{font-size:11px;font-weight:700;background:#eee;color:#555;border-radius:20px;padding:3px 9px}
  .pill.gold{background:#efe7cf;color:#8a7a2e}.pill.green{background:#e1efe5;color:#1A3D2E}
  .pill.crit{background:#f7e3de;color:#7a2418}
  .terms{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .terms summary{font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer}
  .terms li{font-size:12.5px;color:var(--muted);line-height:1.55;margin:6px 0 0 16px}
  .lnk{font-size:12px;word-break:break-all}
  .rcard{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:15px;margin:10px 0;background:#fff}
  .rcard.targeted{box-shadow:0 0 0 3px rgba(198,168,91,.38);border-left-color:var(--gold)}
  .rcard .nm{font-weight:800;color:var(--green);font-size:17px}
  .rbody{margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:9px;color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-line}
  .ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ractions .btn{width:auto}
  .rfiles{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#faf8f2}.rfiles b{display:block;color:var(--green);font-size:12px;margin-bottom:5px}.rfiles a{display:block;font-size:12.5px;line-height:1.6;word-break:break-word}
  .q-payment-status{white-space:pre-line;overflow-wrap:anywhere;line-height:1.6}.q-retired-history{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}.q-retired-history>summary{min-height:44px;padding:10px 0;cursor:pointer;color:var(--green);font-weight:700}
  .q-action-dialog{width:min(560px,calc(100% - 28px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--cream);color:var(--green);padding:24px}.q-action-dialog::backdrop{background:rgba(12,32,22,.7)}.q-action-dialog h2{font:600 27px/1.15 Georgia,serif;margin:0 0 14px}.q-action-dialog p{white-space:pre-line;overflow-wrap:anywhere;line-height:1.6}.q-action-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.q-action-actions button{width:auto;min-height:44px;flex:1}
  .q-line{display:grid!important;grid-template-columns:minmax(0,2fr) minmax(0,.8fr) minmax(0,1fr) 44px;gap:6px!important}.q-line input{min-width:0!important;width:100%}.q-line button{min-width:44px;min-height:44px}.qcard .btn{white-space:normal;min-height:44px}
  .q-editor-status{padding:14px;border-left:4px solid var(--gold);background:var(--cream);line-height:1.6;color:var(--green)}.q-existing-choice{padding:16px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}.q-existing-choice select,.q-existing-choice button{min-height:44px;width:100%;margin:8px 0}.qcard [data-revise]{min-height:48px;background:var(--green);color:#fff}
  .cajita-review-summary{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
  .q-catalog,.q-drafts{padding:16px;background:var(--cream);border:1px solid var(--line);border-radius:12px;margin:16px 0}.q-catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:12px}.q-catalog-item{display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line)}.q-catalog-item img{width:68px;height:68px;object-fit:contain}.q-catalog-item button{min-height:44px;width:100%;margin-top:8px}.q-catalog-item small{display:block;line-height:1.5}.q-line label{display:block;font-size:13px;font-weight:650}.q-line-options{grid-column:1/-1;display:grid;gap:6px;padding:8px 0 12px;border-bottom:1px solid var(--line)}.q-line-options input[type=checkbox]{width:auto;min-width:24px!important}.q-line-options small{line-height:1.5;font-weight:400}.q-draft-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.q-draft-row button{min-height:44px}.q-review-check{display:flex;gap:12px;align-items:center;padding:14px;background:var(--cream)}.q-review-check input{width:24px;height:24px}.q-preview-failure{color:#7a2418}.q-plain-preview{white-space:pre-wrap;overflow-wrap:anywhere}.q-line input{min-height:44px}@media(max-width:560px){.q-line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.q-line>label:first-child{grid-column:1/-1}.q-line-options{grid-column:1/-1}.split .s{padding:8px}.split .s b{display:block}.q-drafts,.q-catalog{padding:12px}}
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · CATERING</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button" aria-label="Language / Idioma" translate="no">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading quotes…</p></div>
</div>

<dialog id="q-action-confirm" class="q-action-dialog" aria-labelledby="q-action-title" aria-describedby="q-action-message"><h2 id="q-action-title">Review the change</h2><p id="q-action-message"></p><div class="q-action-actions"><button id="q-action-cancel" class="btn ghost" type="button" autofocus>Cancel · keep unchanged</button><button id="q-action-approve" class="btn gold" type="button">Confirm change</button></div></dialog>
<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/catering-i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var esc = Hub.esc, money = Owner.money, C = window.CateringI18n;
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }

  var revisionSource = null, revisionPreview = null, quoteCache = [], actionConfirmPending = false;
  var previewSequence=0, editorDirty=false, draftRecord=null, catalogItems=[], catalogSequence=0, savedReviewSequence=0, draftPendingId=null;
  var ENDPOINT = '/api/hub/owner/catering-deposit';

  function confirmOwnerAction(title,message,label){
    if(actionConfirmPending)return Promise.resolve(false);
    actionConfirmPending=true;
    var dialog=document.getElementById('q-action-confirm');
    document.getElementById('q-action-title').textContent=title;
    document.getElementById('q-action-message').textContent=message;
    document.getElementById('q-action-approve').textContent=label;
    return new Promise(function(resolve){
      function finish(approved){if(!actionConfirmPending)return;actionConfirmPending=false;dialog.close();resolve(approved);}
      document.getElementById('q-action-approve').onclick=function(){finish(true);};
      document.getElementById('q-action-cancel').onclick=function(){finish(false);};
      dialog.oncancel=function(event){event.preventDefault();finish(false);};
      try{dialog.showModal();}catch(_error){actionConfirmPending=false;Hub.toast('Could not open the confirmation. Nothing was changed.');resolve(false);}
    });
  }

  function resetPreview(){previewSequence++;revisionPreview=null;var b=document.getElementById('q-preview');if(b)b.disabled=false;}
  function markEditorDirty(event){if(event&&event.target&&!/^q-(name|email|phone|date|guests|note|lang|delivery-fee|total|recommendation|recommendation-packs)$/.test(event.target.id)&&!(event.target.closest&&event.target.closest('#q-lines')))return;editorDirty=true;resetPreview();savedReviewSequence++;var send=document.getElementById('q-sent');if(send)send.innerHTML='';}
  async function guardEditorSwitch(){return !editorDirty||await confirmOwnerAction('Unsaved quote changes','Your unsaved edits will be replaced. Save a draft first if you want to keep them. No checkout or message will be created.','Discard unsaved edits');}
  window.addEventListener('beforeunload',function(event){if(editorDirty){event.preventDefault();event.returnValue='';}});
  function mountEmailPreview(host,mail,current){
    host.innerHTML='<p><b>Subject:</b> '+esc(mail.subject||'Quote')+'</p><iframe sandbox="" title="The email she would receive" style="width:100%;height:65vh;background:white;border:1px solid var(--line);border-radius:10px"></iframe><p class="row-sub q-frame-status" role="status">Loading the rendered email…</p><details><summary>Plain-text copy</summary><p class="q-plain-preview"></p></details>';
    host.querySelector('.q-plain-preview').textContent=mail.text||'Plain-text copy unavailable; the rendered email must load before approval.';
    var frame=host.querySelector('iframe'),say=host.querySelector('.q-frame-status');
    return new Promise(function(resolve,reject){var settled=false;var timer=setTimeout(function(){finish(Error('The rendered email did not load.'));},15000);if(timer.unref)timer.unref();
      function finish(error){if(settled)return;settled=true;clearTimeout(timer);if(!current())return resolve(false);if(error){say.textContent='Preview failed. Retry before approving or sending.';say.className='q-preview-failure';reject(error);}else{say.textContent='Rendered email loaded. Read the complete preview before approval.';resolve(true);}}
      frame.addEventListener('load',function(){finish();},{once:true});frame.addEventListener('error',function(){finish(Error('The rendered email failed to load.'));},{once:true});
      frame.srcdoc=mail.html;
    });
  }
  function catalogLine(item,quantity){return {name:item.name_en||item.name_es,qty:String(quantity),price:(item.unit_cents*quantity/100).toFixed(2),metadata:{product_id:item.id,name_es:item.name_es,image:item.image,detail:item.detail,unit_label:item.unit_label,unit_cents:item.unit_cents,catalog_unit_cents:item.unit_cents,pricing_mode:'catalog',owner_override:false}};}
  async function loadCatalog(){
    var seq=++catalogSequence,host=document.getElementById('q-catalog-results');host.textContent='Loading published dishes…';
    try{var result=await Owner.get('/api/hub/owner/catering-quote-catalog');if(seq!==catalogSequence)return;if(!result?.ok)throw Error(result?.error||'Catalog unavailable');catalogItems=(result.items||[]).filter(function(i){return i.available&&Number.isSafeInteger(i.unit_cents)&&i.unit_cents>0;});document.getElementById('q-catalog-search').oninput=renderCatalog;renderCatalog();}catch(error){host.textContent='Menu unavailable. Retry by reloading this page, or use an explicitly priced custom line. '+error.message;}
  }
  function renderCatalog(){var term=document.getElementById('q-catalog-search').value.toLowerCase().trim(),matches=catalogItems.filter(function(i){return [i.name_en,i.name_es,i.detail,i.category].join(' ').toLowerCase().includes(term);}).slice(0,12),host=document.getElementById('q-catalog-results');
    host.innerHTML=matches.length?'<p class="row-sub">Prices below are per stated serving or pack. New lines use this published price; existing agreed lines remain unchanged.</p><div class="q-catalog-grid">'+matches.map(function(item){return '<article class="q-catalog-item">'+(item.image?'<img src="'+esc(/^https?:\/\//.test(item.image)||item.image.charAt(0)==='/'?item.image:'/'+item.image)+'" alt="" loading="lazy" width="68" height="68">':'<span aria-hidden="true"></span>')+'<div><b>'+esc(item.name_en||item.name_es)+'</b><small>'+esc(item.detail||item.unit_label||'')+'</small><small>'+money(item.unit_cents)+' / '+esc(item.unit_label||'unit')+'</small><button type="button" class="btn ghost" data-add-catalog="'+esc(item.id)+'">Add this dish / pack</button></div></article>';}).join('')+'</div>':'<p>No matching published dishes.</p>';
    host.querySelectorAll('[data-add-catalog]').forEach(function(button){button.onclick=function(){var item=catalogItems.find(function(i){return i.id===button.getAttribute('data-add-catalog');});if(!item)return;addLine(catalogLine(item,1));markEditorDirty();Hub.toast('Added one '+(item.unit_label||'unit')+'. Set the quantity on its line.');};});
  }
  var DRAFTS='/api/hub/owner/catering-drafts';
  async function loadDrafts(){var host=document.getElementById('q-draft-list');try{var result=await Owner.get(DRAFTS);if(!result?.ok)throw Error(result?.error||'Unavailable');host.innerHTML=(result.drafts||[]).map(function(d){return '<div class="q-draft-row"><span>'+esc(typeof d.summary==='string'?d.summary:(d.summary?.customer_name||'Unfinished event'))+' · '+esc(d.state)+' · version '+esc(d.version)+'</span><button type="button" class="btn ghost" data-load-draft="'+esc(d.id)+'">'+(d.state==='prepared'?'View prepared quote':'Open draft')+'</button>'+(d.state==='draft'?'<button type="button" class="btn ghost" data-archive-draft="'+esc(d.id)+'" data-version="'+esc(d.version)+'">Archive</button>':'')+'</div>';}).join('')||'<p class="row-sub">No saved drafts.</p>';host.querySelectorAll('[data-load-draft]').forEach(function(b){b.onclick=function(){loadDraft(b.getAttribute('data-load-draft'));};});host.querySelectorAll('[data-archive-draft]').forEach(function(b){b.onclick=function(){archiveDraft(b.getAttribute('data-archive-draft'),Number(b.getAttribute('data-version')));};});}catch(error){host.textContent='Draft list unavailable: '+error.message;}}
  async function saveDraft(){var button=document.getElementById('q-save-draft');if(button.disabled)return;button.disabled=true;try{var payload=body();delete payload.draft_id;if(!payload.guests)payload.guests=null;if(!payload.lines&&!payload.total_cents)payload.total_cents=null;if(Number.isNaN(payload.delivery_fee_cents))throw Error('Check the delivery fee before saving.');var result=await Hub.api(DRAFTS,{method:'POST',body:{op:'save',id:draftRecord?.id||(draftPendingId||(draftPendingId=crypto.randomUUID())),expected_version:draftRecord?.version||0,payload:payload}});if(!result?.ok)throw Error(result?.error||'Draft not saved; refresh the draft list before retrying.');draftRecord=result.draft;draftPendingId=null;editorDirty=false;document.getElementById('q-draft-status').textContent='Draft saved · version '+draftRecord.version+'. No checkout created; nothing sent.';loadDrafts();}catch(error){document.getElementById('q-draft-status').textContent=error.message+' Your current edits remain here.';}finally{button.disabled=false;}}
  async function loadDraft(id){if(!await guardEditorSwitch())return;try{var result=await Owner.get(DRAFTS+'?id='+encodeURIComponent(id));if(!result?.ok)throw Error(result?.error||'Draft unavailable');var record=result.draft,p=record.payload||{};if(record.state==='prepared'){var q=quoteCache.find(function(q){return q.id===record.quote_id;});if(q){document.getElementById('quote-'+q.id)?.scrollIntoView({behavior:'smooth'});return;}throw Error('Prepared quote is not in the current list. Reload quotes.');}if(record.state!=='draft')throw Error('Archived drafts are read-only.');var q=p.quote_id&&quoteCache.find(function(q){return q.id===p.quote_id;});editorDirty=false;if(p.quote_id&&!q)throw Error('The original quote is unavailable. Reload before editing this draft.');if(q)await beginRevision(q,p.lead_id,p);else{revisionSource=null;leadId=p.lead_id||null;fillDraftPayload(p);}draftRecord=record;editorDirty=false;document.getElementById('q-draft-status').textContent='Opened saved draft · version '+record.version+'. No checkout or message created.';document.getElementById('quote-editor').scrollIntoView({behavior:'smooth'});}catch(error){document.getElementById('q-draft-status').textContent=error.message;}}
  function fillDraftPayload(p){resetPreview();document.querySelectorAll('#q-name,#q-email,#q-phone,#q-date,#q-guests,#q-lang,#q-note,#q-delivery-fee,#q-lines input,#q-lines button,#q-add-line,#q-recommendation,#q-recommendation-packs').forEach(function(input){input.disabled=false;});loadRecommendations(p.recommendations&&p.recommendations[0]);[['q-name','customer_name'],['q-email','customer_email'],['q-phone','customer_phone'],['q-date','event_date'],['q-guests','guests'],['q-note','note'],['q-lang','lang']].forEach(function(pair){document.getElementById(pair[0]).value=p[pair[1]]??'';});document.getElementById('q-delivery-fee').value=Number.isInteger(p.delivery_fee_cents)?(p.delivery_fee_cents/100).toFixed(2):'';document.getElementById('q-lines').innerHTML=(p.lines||[]).map(function(line){return lineRowHtml({name:line.name,qty:line.qty,price:Number.isInteger(line.cents)?(line.cents/100).toFixed(2):'',metadata:line});}).join('');document.getElementById('q-total').value=Number.isInteger(p.total_cents)?((p.total_cents-(p.delivery_fee_cents||0))/100).toFixed(2):'';document.getElementById('q-create').disabled=false;document.getElementById('q-create').textContent='Create deposit checkout';document.getElementById('q-editor-title').textContent='Saved draft · no checkout yet';document.getElementById('q-sent').innerHTML='';renderLinesSum();}
  async function archiveDraft(id,version){if(!await confirmOwnerAction('Archive draft','Keep its history but remove this unfinished draft from active work. Existing quotes and payment links are not changed.','Confirm archive'))return;try{var result=await Hub.api(DRAFTS,{method:'POST',body:{op:'archive',id:id,expected_version:version}});if(!result?.ok)throw Error(result?.error||'Archive failed');if(draftRecord?.id===id)draftRecord=null;loadDrafts();}catch(error){document.getElementById('q-draft-status').textContent=error.message;}}
  async function recoverDraft(){var button=document.getElementById('q-recover-draft');if(!draftRecord){document.getElementById('q-draft-status').textContent='Open a saved draft first. No checkout has been created by this check.';return;}if(button.disabled)return;button.disabled=true;try{var result=await Hub.api(DRAFTS,{method:'POST',body:{op:'recover',id:draftRecord.id,expected_version:draftRecord.version}});if(!result?.ok)throw Error(result?.error||'No matching prepared checkout could be verified.');draftRecord=result.draft;document.getElementById('q-draft-status').textContent='Existing prepared quote found. No duplicate checkout created. Reload the quote list to open it.';document.getElementById('q-save-draft').disabled=true;document.getElementById('q-create').disabled=true;loadDrafts();}catch(error){document.getElementById('q-draft-status').textContent=error.message+' Do not create another checkout until the quote list is checked.';}finally{button.disabled=draftRecord?.state==='prepared';}}
  async function attachDraft(quoteId){try{var result=await Hub.api(DRAFTS,{method:'POST',body:{op:'attach',id:draftRecord.id,expected_version:draftRecord.version,quote_id:quoteId}});if(!result?.ok)throw Error(result?.error||'Could not link draft');draftRecord=result.draft;document.getElementById('q-draft-status').textContent='Draft linked to the prepared quote. Nothing sent.';document.getElementById('q-save-draft').disabled=true;document.getElementById('q-recover-draft').disabled=true;loadDrafts();}catch(error){document.getElementById('q-draft-status').textContent='Checkout exists, but the draft link is unconfirmed. Do not create another checkout. '+error.message;}}
  async function reviewSavedQuote(id,contact){
    var host=document.getElementById('q-saved-review'),seq=++savedReviewSequence;document.getElementById('q-sent').innerHTML='';host.textContent='Loading the exact saved quote email…';
    try{var result=await Hub.api(ENDPOINT,{method:'POST',body:{op:'render_saved',quote_id:id}});if(seq!==savedReviewSequence)return;if(!result?.ok||!result.review_hash)throw Error(result?.error||'Saved email preview unavailable');var loaded=await mountEmailPreview(host,result,function(){return seq===savedReviewSequence;});if(!loaded||seq!==savedReviewSequence)return;var q=result.quote||quoteCache.find(function(q){return q.id===id;})||contact||{};showSend({quote_id:id,customer_email:result.customer_email||q.customer_email||result.to,customer_phone:result.customer_phone||q.customer_phone||'',review_hash:result.review_hash});host.scrollIntoView({behavior:'smooth'});}catch(error){if(seq===savedReviewSequence)host.textContent='Cannot approve this email: '+error.message+' Use Review / send this quote to retry.';}
  }

  // Dollars typed by a human → integer cents. The API refuses anything over $100,000 as a
  // "you typed dollars where cents were meant" guard, so this conversion has to be the only one.
  function toCents(v) {
    var n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, ''));
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function pct(row) {
    // THE ROW'S OWN RATE, never a constant from this file. A quote sold at a different percentage
    // must display that percentage — see the terms note below.
    var p = Number(row && row.deposit_pct);
    return Number.isFinite(p) ? Math.round(p * 100) + '%' : '';
  }
  function day(ms) { if (!ms) return ''; try { return new Date(ms).toLocaleDateString(); } catch (e) { return ''; } }

  // ---------- the terms ----------
  // RENDERED FROM THE SNAPSHOT ON THE ROW. `q.terms` is the parsed terms_json that was written
  // when the deposit link was minted. This page never calls termsFor(), never reads DEPOSIT_PCT,
  // and never rebuilds a line of this copy: a customer who booked in August agreed to August's
  // terms, and changing the constants next year must not retroactively re-word their contract.
  function termsHtml(q) {
    var t = q && q.terms;
    if (!t || !t.lines || !t.lines.length) {
      return '<div class="terms"><p class="row-sub">No terms snapshot on this quote — it predates stored terms. Do not quote terms from this screen; check what was sent.</p></div>';
    }
    return '<details class="terms"><summary>Terms this customer agreed to · ' +
      esc(t.version || q.terms_version || 'unversioned') + '</summary><ul>' +
      t.lines.map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('') +
      '</ul></details>';
  }

  // THE GIFT SWITCH — off unless someone turns it on, on ONE quote at a time.
  //
  // Dayan, 2026-09-14: "free cakes is not a rule that applies for everyone ... make sure this is
  // just an option I get to turn on or off from the hub and it is never a default setting."
  //
  // So the control renders "No gift" selected unless this quote already carries one, there is no
  // global setting anywhere that changes that, and the label says plainly what turning it on
  // costs and when the customer finds out.
  function giftHtml(q) {
    var on = q.gift === 'tres-leches-fresa';
    var balPaid = q.balance_status === 'paid';
    var summary = {};
    try { summary = JSON.parse(q.quote_json || '{}'); } catch (e) { /* historical bare total */ }
    return '<div class="gift" style="margin-top:10px;padding:10px 12px;border:1px solid #2a4a28;border-radius:8px">' +
      '<label class="row-sub" style="display:block;margin-bottom:6px">Gift for this customer</label>' +
      '<select data-gift-for="' + esc(q.id) + '" style="width:100%">' +
        '<option value=""' + (on ? '' : ' selected') + '>No gift</option>' +
        '<option value="tres-leches-fresa"' + (on ? ' selected' : '') + '>Strawberry tres leches — free, on the house</option>' +
      '</select>' +
      '<p class="row-sub" style="margin:6px 0 0">' +
        (on
          ? (balPaid
            ? 'On. She has paid in full, so the reveal is showing on her quote page now.'
            : 'On. The reveal appears once she pays the <b>balance</b> — not before.')
          : 'Off. Nothing is promised and nothing is shown.') +
      '</p></div>';
  }

  function quoteDeliveryFee(q) {
    if(Object.prototype.hasOwnProperty.call(q,'delivery_fee_cents'))return q.delivery_fee_cents;
    try{return JSON.parse(q.quote_json||'{}').delivery_fee_cents;}catch(_error){return null;}
  }

  function quoteCard(q) {

      // A paid quote is an event somebody has to cook, and this is the way through to the work.

      '<div class="split">' +

      (!balPaid && paid && !q.balance_payment_link_url ? '<button class="btn gold block" data-balance-link="'+esc(q.id)+'">Create Square balance link</button>' : '') +

  // ---------- inbound website requests ----------
  function msgField(message, label) {
    var line = String(message || '').split('\n').find(function (x) { return x.indexOf(label + ':') === 0; });
    return line ? line.slice(label.length + 1).trim() : '';
  }

  function checkoutEvidence(row,label){
    if(!row)return label+': not available.';
    var lines=[label+' · '+String(row.quote_id||'Quote not recorded'),'Local deposit status: '+String(row.local_status||'not recorded'),'Square order lookup: '+(row.provider_verified?'verified':'not verified'),'Square order state: '+String(row.order_state||'UNKNOWN'),'Recorded tenders: '+(Number.isInteger(row.tender_count)?row.tender_count:'not verified')];
    var payments=Array.isArray(row.payments)?row.payments:[];
    payments.forEach(function(payment){lines.push('Payment '+String(payment.id||'receipt not recorded')+': '+String(payment.status||'UNKNOWN'));});
    if(!payments.length)lines.push('No payment receipt was returned by this lookup.');
    if(row.error)lines.push('Lookup detail: '+String(row.error));
    return lines.join('\n');
  }
  async function checkCheckoutStatus(id,button){
    if(button.disabled)return;
    button.disabled=true;var host=document.getElementById('q-payment-status-'+id);host.textContent='Checking the current Square order and recorded payment statuses…';
    try{
      var result=await Hub.api(ENDPOINT,{method:'POST',body:{op:'checkout_status',quote_id:id}});
      if(!result?.ok){host.textContent='Payment status could not be verified. '+(result?.error||'Try the read-only lookup again when the connection is available.');return;}
      host.textContent='Read-only check · '+new Date().toLocaleString()+'\n'+checkoutEvidence(result.source,'Selected quote')+(result.retained?'\n\n'+checkoutEvidence(result.retained,'Retained replacement'):'')+'\n\nThis lookup does not charge, cancel, revise or send a message. Order state alone does not establish payment.';
    }catch(_error){host.textContent='Payment status could not be verified. No quote, checkout or message was changed.';}finally{button.disabled=false;}
  }
  function wireCheckoutStatus(root){root.querySelectorAll('[data-checkout-status]').forEach(function(button){button.onclick=function(){return checkCheckoutStatus(button.getAttribute('data-checkout-status'),button);};});}
  function quoteListHtml(quotes){
    var active=quotes.filter(function(q){return q.deposit_status!=='void';}),retired=quotes.filter(function(q){return q.deposit_status==='void';});
    return (active.length?active.map(quoteCard).join(''):'<div class="hub-empty">No active catering quotes.</div>')+(retired.length?'<details class="q-retired-history"><summary>Previous / retired quotes ('+retired.length+')</summary><p class="row-sub">Historical records are preserved here. These checkouts are no longer active; use the active quote above for the current offer.</p>'+retired.map(quoteCard).join('')+'</details>':'');
  }

  function duplicateAlternatives(source){return quoteCache.filter(function(q){return q.id!==source.id&&q.deposit_status!=='void'&&q.event_date&&q.event_date===source.event_date&&String(q.customer_email||'').trim().toLowerCase()===String(source.customer_email||'').trim().toLowerCase()&&String(source.customer_email||'').includes('@');});}
  function reviewDuplicateRetirement(source){
    var candidates=duplicateAlternatives(source),host=document.getElementById('q-duplicate-retirement');
    document.getElementById('q-create').disabled=true;
    host.innerHTML='<div class="q-existing-choice"><h3>Retire an obsolete duplicate</h3><p><b>Checkout to retire:</b> '+esc(source.id)+' · '+money(source.total_cents)+'</p><label for="q-retain-quote">Correct quote to keep</label><select id="q-retain-quote"><option value="">Choose the correct quote</option>'+candidates.map(function(q){return '<option value="'+esc(q.id)+'">'+esc(q.id)+' · '+money(q.total_cents)+' · '+esc(q.event_date)+'</option>';}).join('')+'</select><p class="row-sub">Only the obsolete checkout is retired. Order history remains. This does not refund or charge money and sends no email or text.</p><label><input type="checkbox" id="q-retire-reviewed" style="width:auto"> I compared the quotes and confirm the checkout above is the obsolete duplicate.</label><button class="btn ghost" type="button" id="q-retire-now" disabled>Retire only the obsolete checkout</button><p id="q-retire-status" class="row-sub" role="status"></p></div>';
    function update(){document.getElementById('q-retire-now').disabled=!document.getElementById('q-retire-reviewed').checked||!document.getElementById('q-retain-quote').value;}
    document.getElementById('q-retain-quote').onchange=function(){document.getElementById('q-retire-reviewed').checked=false;update();};document.getElementById('q-retire-reviewed').onchange=update;
    document.getElementById('q-retire-now').onclick=async function(){
      var button=this,retained=candidates.find(function(q){return q.id===document.getElementById('q-retain-quote').value;});
      if(button.disabled||!document.getElementById('q-retire-reviewed').checked||!retained)return;
      if(!await confirmOwnerAction('Confirm duplicate retirement','RETIRE: '+source.id+' · '+money(source.total_cents)+'\nKEEP: '+retained.id+' · '+money(retained.total_cents)+'\n\nOnly the obsolete checkout will stop working. Order history remains. No refund or charge is made, and no email or text is sent.','Confirm retirement'))return;
      button.disabled=true;document.getElementById('q-retire-status').textContent='Checking and retiring only the selected obsolete checkout…';
      Hub.api(ENDPOINT,{method:'POST',body:{op:'retire_duplicate',quote_id:source.id,replacement_quote_id:retained.id,expected_updated_at:source.updated_at,expected_replacement_updated_at:retained.updated_at,reviewed:true}}).then(function(result){
        if(!result?.ok){document.getElementById('q-retire-status').textContent=result?.error||'Retirement not verified. Refresh the quote evidence before retrying.';return;}
        Hub.toast('Obsolete duplicate retired. Correct quote kept; no message sent.');render();
      });
    };host.scrollIntoView({behavior:'smooth',block:'center'});
  }
  function associatedQuotes(request){
    var id=request.lead_id||request.id,email=String(request.email||'').trim().toLowerCase(),date=request.event_date||msgField(request.message,'Event date');
    var ids=request.active_quote_ids||request.existing_quote_ids;
    if(Array.isArray(ids)&&ids.length)return quoteCache.filter(function(q){return ids.includes(q.id)&&q.deposit_status!=='void';});
    var active=quoteCache.filter(function(q){return q.deposit_status!=='void';});
    var direct=active.filter(function(q){var blob={};try{blob=JSON.parse(q.quote_json||'{}');}catch(_error){}return id&&(q.source_lead_id===id||blob.lead_id===id);});
    if(direct.length)return direct;
    return email&&date?active.filter(function(q){return String(q.customer_email||'').trim().toLowerCase()===email&&q.event_date===date;}):[];
  }
  function showExistingChoice(candidates,requestLeadId,draft){
    document.getElementById('q-create').disabled=true;
    document.getElementById('q-editor-title').textContent='Choose the existing quote to edit';
    document.getElementById('q-revision-status').textContent='An active quote already exists. A revision replaces its checkout; creating another quote would duplicate the offer.';
    var host=document.getElementById('q-existing-choice');
    host.innerHTML='<div class="q-existing-choice"><label for="q-existing-select">Existing quotes for this request</label><select id="q-existing-select"><option value="">Choose a quote</option>'+candidates.map(function(q){return '<option value="'+esc(q.id)+'">'+esc(q.id)+' · '+money(q.total_cents)+' · '+esc(q.event_date||'No date')+' · '+esc(q.deposit_status||'unpaid')+'</option>';}).join('')+'</select><p class="row-sub">'+(draft?'Your current draft will be copied into the selected unpaid quote revision after you choose it. No message is sent.':'Compare the amounts and choose the correct quote. Paid quotes are read-only. Nothing is sent.')+'</p><button class="btn gold" id="q-open-existing" type="button">'+(draft?'Revise selected quote with my draft':'Open selected quote')+'</button></div>';
    document.getElementById('q-open-existing').onclick=function(){var selected=document.getElementById('q-existing-select').value,q=candidates.find(function(row){return row.id===selected;});if(!q){Hub.toast('Choose an existing quote first.');return;}beginRevision(q,requestLeadId,draft);};
    host.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function requestCard(r) {
    var payload = {
      existing_quote_ids: r.active_quote_ids||associatedQuotes(r).map(function(q){return q.id;}),
      quote_lookup_unavailable: Boolean(r.quote_lookup_unavailable),
      name: r.name || '', email: r.email || '', phone: r.phone || '',
      event_date: msgField(r.message, 'Event date'),

      note: [r.interest ? 'Requested menu: ' + r.interest : '', r.message || ''].filter(Boolean).join('\n'),
      // The suggested total travels with the prefill so "Start a quote" opens with a number in it.
      total: r.suggested && r.suggested.total_cents ? (r.suggested.total_cents / 100).toFixed(2) : '',
      // And so does her order, one line at a time, so the desk opens with what she asked for

      lines: (r.suggested && r.suggested.lines) || [],

        '<a href="' + base + '?download=1">' + C.label('Download') + ' ' + esc(file.filename) + '</a>';

    return '<article translate="no" class="rcard' + (targetLead === r.id ? ' targeted' : '') + '"' + (targetLead === r.id ? ' id="selected-request"' : '') + '>' +

      (contact ? '<div class="row-sub">' + esc(contact) + '</div>' : '') +
      '<div class="rbody"><b>'+esc(msgField(r.message,'Event type')||'Event')+'</b><br>'+esc(msgField(r.message,'Event date'))+' · '+esc(msgField(r.message,'Serving time'))+'<br>'+esc(msgField(r.message,'Guest count'))+' guests · '+esc(msgField(r.message,'Location'))+'</div>'+
      '<details class="rbody"><summary>' + C.label('Original request (as submitted)') + '</summary>' + (r.message ? esc(r.message) : C.label('No event details provided.')) + '</details>' +
      (r.cajita_configuration || r.cajita_summary ? '<details class="rbody"><summary>' + C.label('Exact Cajita configuration') + '</summary>' + C.summaryHtml(r.cajita_configuration,r.cajita_summary) + '</details>' : '') +
      (files ? '<div class="rfiles"><b>' + C.label('Private design files · owner only') + '</b>' + files + '</div>' : '') +

        (r.email ? '<a class="btn ghost" href="mailto:' + esc(encodeURIComponent(r.email)) + '?subject=' + encodeURIComponent('Your Añejo catering request') + '">' + C.label('Email customer') + '</a>' : '') +

  // What the live menu says this request costs, shown ON the request card.
  //
  // It is labelled a suggestion everywhere, because that is what it is: the priced lines at
  // today's menu prices with the standard volume discount, and an explicit list of everything
  // still needing a hand quote. The Agreed total field stays editable — this replaces a blank
  // box with a starting point, not Dayan's judgement with a machine's.
  function suggestionHtml(s) {
    if (!s || (!s.total_cents && !(s.unpriced || []).length)) return '';
    var rows = '';
    if (s.subtotal_cents) rows += '<div class="row-sub">' + C.label('Menu price for the priced lines') + ': <b>' + dollars(s.subtotal_cents) + '</b></div>';
    if (s.discount_cents) rows += '<div class="row-sub">' + C.label('Volume discount') + ': −' + dollars(s.discount_cents) + '</div>';
    if (s.total_cents) rows += '<div class="row-sub"><b>' + C.label('Suggested total') + ': ' + dollars(s.total_cents) + '</b></div>';
    var open = (s.unpriced || []).filter(function (u) { return u && u.id; });
    if (open.length) {
      rows += '<div class="row-sub">' + C.label('You still need to price') + ': ' +
        esc(open.map(function (u) { return (u.quantity || '') + ' × ' + u.id; }).join(', ')) + '</div>';
    }
    if (s.live_menu === false) rows += '<div class="row-sub">' + C.label('Live menu unavailable — this is not a current price.') + '</div>';
    return '<div class="rbody"><b>' + C.label('Suggested from the live menu') + '</b>' + rows + '</div>';
  }

  function dollars(cents) {
    return '$' + (Number(cents || 0) / 100).toFixed(2);
  }

  function deliveryFee(){var raw=document.getElementById('q-delivery-fee').value.trim();return raw===''?null:/^\d+(?:\.\d{1,2})?$/.test(raw)?Math.round(Number(raw)*100):NaN;}
  function deliverySummary(){var field=document.getElementById('q-delivery-summary');if(!field)return;var fee=deliveryFee(),food=readLines().length?readLines().reduce(function(n,line){return n+(Number.isInteger(line.cents)?line.cents:0);},0):toCents(document.getElementById('q-total').value);field.textContent=Number.isNaN(fee)?'Enter a non-negative delivery / setup amount with no more than two decimals.':fee===null?'Delivery / setup fee unconfirmed; not included in the food subtotal.': 'Food '+money(food||0)+' + delivery / setup '+money(fee)+' = quote total '+money((food||0)+fee)+'.';}

  function body() {
    return {
      draft_id:draftRecord?.id,

  // ---------- the line-item editor ----------
  // Dayan, 2026-09-10: "my decision should override whatever the hub has as a standing rule ...
  // add the option to manually modify pricing directly from the catering section in the hub
  // instead of having the hub override me." A row here is a row in her quote email, at his price.

  function lineRowHtml(v) {
    v=v||{};var metadata=v.metadata||{},qty=Number(v.qty),cents=toCents(v.price),rate=Number.isInteger(metadata.unit_cents)&&metadata.pricing_mode==='catalog'?metadata.unit_cents:cents,denom=Number.isInteger(metadata.unit_cents)&&metadata.pricing_mode==='catalog'?1:qty;
    var automatic=!metadata.owner_override&&Number.isInteger(rate)&&rate>=0&&Number.isInteger(denom)&&denom>0;
    return '<div class="q-line" data-metadata="'+esc(JSON.stringify(metadata))+'" data-rate-cents="'+(automatic?rate:'')+'" data-rate-qty="'+(automatic?denom:'')+'">'+
      '<label>Dish / pack<input class="q-l-name" type="text" value="'+esc(v.name||'')+'" placeholder="Custom dish name"></label>'+
      '<label>Quantity'+(metadata.unit_label?' · '+esc(metadata.unit_label):'')+'<input class="q-l-qty" type="number" min="1" step="1" value="'+esc(v.qty||'')+'"></label>'+
      '<label>Line total ($)<input class="q-l-price" type="text" inputmode="decimal" value="'+esc(v.price||'')+'"'+(automatic?' readonly':'')+'></label>'+
      '<button type="button" class="btn ghost q-l-del" aria-label="Remove '+esc(v.name||'line')+'">×</button>'+
      '<div class="q-line-options"><label><input class="q-l-override" type="checkbox"'+(automatic?'':' checked')+'> Set a negotiated / custom line total</label><small class="q-line-rate">'+(automatic?(metadata.catalog_unit_cents!==undefined?'Published price × quantity of the stated pack / serving. This is not an individual-piece count unless the unit says so.':'Agreed quote rate × quantity; no current-price overwrite.'):'Manual total: changing quantity does not change this amount.')+'</small><label>Pricing note (optional)<input class="q-l-reason" type="text" maxlength="160" value="'+esc(metadata.override_reason||'')+'"></label></div></div>';
  }
  function updateLinePricing(row,customChanged){
    var qty=Number(row.querySelector('.q-l-qty').value),price=row.querySelector('.q-l-price'),override=row.querySelector('.q-l-override');
    var numerator=Number(row.getAttribute('data-rate-cents')),denominator=Number(row.getAttribute('data-rate-qty'));
    if(!override.checked&&(!row.getAttribute('data-rate-qty')||denominator<=0)){override.checked=true;}
    price.readOnly=!override.checked;
    if(!override.checked&&Number.isInteger(qty)&&qty>0)price.value=(Math.round(numerator*qty/denominator)/100).toFixed(2);
    row.querySelector('.q-line-rate').textContent=override.checked?'Manual total: changing quantity does not change this amount.':'Price scales with quantity using this line’s agreed rate.';
    if(customChanged)markEditorDirty();renderLinesSum();
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Read the table back as the server wants it. A row with no name AND no price is a row the user
  // has not filled in yet, so it is dropped rather than refused — but a half-filled row is kept,
  // so the server names it and nothing is quietly priced at zero.
  function readLines() {
    var out = [];
    var rows = document.querySelectorAll('#q-lines .q-line');
    for (var i = 0; i < rows.length; i++) {
      var name = rows[i].querySelector('.q-l-name').value.trim();
      var priceRaw = rows[i].querySelector('.q-l-price').value.trim();
      var qty = rows[i].querySelector('.q-l-qty').value.trim();
      if (!name && !priceRaw) continue;
      var metadata = {};
      try { metadata = JSON.parse(rows[i].getAttribute('data-metadata') || '{}'); } catch (e) { /* manual row */ }
      var override=rows[i].querySelector('.q-l-override'),reason=rows[i].querySelector('.q-l-reason');
      out.push(Object.assign({}, metadata, { name: name, qty: qty || undefined, cents: priceRaw === '' ? null : toCents(priceRaw),owner_override:override?Boolean(override.checked):Boolean(metadata.owner_override),pricing_mode:override&&override.checked?'custom':metadata.pricing_mode||'quoted',override_reason:reason?reason.value:metadata.override_reason }));
    }
    return out;
  }

  function renderLinesSum() {
    var el = document.getElementById('q-lines-sum');
    if (!el) return;
    var rows = readLines();
    if (!rows.length) { el.textContent = ''; document.getElementById('q-total').disabled = false; deliverySummary(); return; }
    // The moment there are lines, they own the total — so the bare-total field is disabled rather
    // than left editable next to a number it cannot change.
    var totalEl = document.getElementById('q-total');
    totalEl.disabled = true;
    var sum = 0;
    var incomplete = 0;
    for (var i = 0; i < rows.length; i++) {
      if (!rows[i].name || !Number.isInteger(rows[i].cents)) { incomplete++; continue; }
      sum += rows[i].cents;
    }
    totalEl.value = (sum / 100).toFixed(2);
    el.textContent = rows.length + ' line' + (rows.length === 1 ? '' : 's') + ' \u00b7 ' + dollars(sum) +
      (incomplete ? ' \u00b7 ' + incomplete + ' still needs a name and a price' : '');
    deliverySummary();
  }

  function addLine(v) {
    var host = document.getElementById('q-lines');
    if (!host) return;
    host.insertAdjacentHTML('beforeend', lineRowHtml(v));
    renderLinesSum();
  }

  function wireLines() {
    var host = document.getElementById('q-lines');
    if (!host) return;
    document.getElementById('q-add-line').addEventListener('click', function () { addLine();markEditorDirty(); });
    host.addEventListener('input', function(event){var row=event.target.closest&&event.target.closest('.q-line');if(row)updateLinePricing(row,true);else renderLinesSum();});
    host.addEventListener('change',function(event){var row=event.target.closest&&event.target.closest('.q-line');if(row)updateLinePricing(row,true);});

    renderLinesSum();
  }

  function wireRequests(root) {

        if(selectedRequest.quote_lookup_unavailable){document.getElementById('q-create').disabled=true;document.getElementById('q-revision-status').textContent='Existing quote lookup is unavailable. Refresh before creating a checkout for this request.';Hub.toast('Existing quote lookup is unavailable. Refresh the quote list before starting another checkout.');return;}
        var existing=(selectedRequest.existing_quote_ids||[]).map(function(id){return quoteCache.find(function(q){return q.id===id;});}).filter(Boolean);

        // Prefilled from the live menu when the request carried priceable products. It stays
        // editable and is still called the AGREED total: the suggestion is a starting point, and

          ? (open

            : 'Her order is laid out below at menu prices — every one of them is yours to change')
          : (r.total
            ? 'Suggested total filled in from the live menu — change it if you agreed something else'
            : 'Request copied into a new quote — enter the agreed total'));

  // WHAT THE CUSTOMERS HAVE ASKED FOR. Until now this table was written and read by nothing, so a

      '<div class="nm">' + esc(c.customer_name || 'A customer') + ' ' + badge + '</div>' +
      '<div class="row-sub">' + esc(when) + (c.customer_email ? ' · ' + esc(c.customer_email) : '') +
        ' · ' + esc(KIND_LABEL[c.kind] || 'Change request') + '</div>' +
      (items ? '<ul style="margin:8px 0 0;padding-left:18px;font-size:14px">' + items + '</ul>' : '') +
      (c.guests ? '<p class="row-sub" style="margin:8px 0 0">New guest count asked for: <b>' + esc(String(c.guests)) + '</b></p>' : '') +
      '<p style="margin:8px 0 0;white-space:pre-wrap;font-size:14px">' + esc(c.message || '') + '</p>' +
      (c.owner_note ? '<p class="row-sub" style="margin:8px 0 0"><b>Your reply:</b> ' + esc(c.owner_note) + '</p>' : '') +
      (open
        ? '<div style="margin:10px 0 0">' +
          '<input class="chg-note" data-for="' + esc(c.id) + '" placeholder="What should she be told? (she sees this)" ' +
          'style="width:100%;padding:9px;margin:0 0 8px;border:1px solid var(--line);border-radius:8px">' +
          '<button class="btn gold" data-chg="' + esc(c.id) + '" data-status="accepted">Accept</button> ' +
          '<button class="btn ghost" data-chg="' + esc(c.id) + '" data-status="declined">Decline</button>' +
          '</div>'
        : '<div style="margin:10px 0 0"><button class="btn ghost" data-chg="' + esc(c.id) + '" data-status="open">Reopen</button></div>') +
      '</div>';
  }

  var KIND_LABEL = {
    message: 'Message', add_items: 'Wants to add items', guests: 'Guest count',
    cajita: 'Cajita request', dietary: 'Allergies / dietary'
  };

  function wireChanges(root) {
    root.querySelectorAll('[data-chg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-chg');
        var note = root.querySelector('.chg-note[data-for="' + id + '"]');
        btn.disabled = true;
        Hub.api(ENDPOINT, { method: 'POST', body: {
          op: 'decide_change', change_id: id,
          status: btn.getAttribute('data-status'),
          owner_note: note ? note.value.trim() : ''
        } }).then(function (r) {
          if (r && r.ok) { Hub.toast('Answered'); render(); }
          else { btn.disabled = false; Hub.toast((r && r.error) || 'Could not save that'); }
        });
      });
    });
  }

  function loadRecommendations(selected) {
    Hub.api('/api/catering-catalog').then(function (catalog) {
      var select = document.getElementById('q-recommendation');
      if (!select || !catalog.live) return;
      var map = { ham: 'jamon', chicken: 'pollo', beef: 'res', chorizo: 'chorizo', sausage: 'sausage', tuna: 'tuna' };
      select.innerHTML = '<option value="">No recommendation</option>';
      (catalog.products || []).filter(function (p) { return p.id === 'croqueta-platter' || p.id === 'croqueta'; }).forEach(function (p) {
        Object.keys(p.flavors || {}).forEach(function (flavor) {
          (p.flavors[flavor].packs || []).filter(function (pack) { return p.id === 'croqueta' ? pack.size === 10 : [30,60,90].indexOf(pack.size) !== -1; }).forEach(function (pack) {
            var sku = 'catering_' + (p.id === 'croqueta-platter' ? 'platter' : 'croq') + '-' + map[flavor] + '-' + pack.size;
            var option = document.createElement('option'); option.value = sku;
            option.textContent = (p.id === 'croqueta-platter' ? 'Platter' : 'Loose box') + ' · ' + p.flavors[flavor].en + ' · ' + pack.size + ' pieces · ' + money(pack.cents);
            option.dataset.cents = pack.cents; option.dataset.pieces = pack.size; select.appendChild(option);
          });
        });
      });
      if (selected) { select.value = selected.sku; document.getElementById('q-recommendation-packs').value = selected.packs; }
      function update() {
        var option = select.options[select.selectedIndex], packs = Number(document.getElementById('q-recommendation-packs').value);
        document.getElementById('q-recommendation-summary').textContent = select.value ? ((Number(option.dataset.pieces) * packs) + ' pieces · optional +' + money(Number(option.dataset.cents) * packs) + ' · not included') : '';
      }
      select.onchange = update; document.getElementById('q-recommendation-packs').oninput = update; update();
    });
  }

  async function beginRevision(q,requestLeadId,draft) {
    if(!await guardEditorSwitch())return;
    if(q.deposit_status==='paid'){document.getElementById('q-create').disabled=true;document.getElementById('q-revision-status').textContent='This quote has a recorded deposit and is read-only here. Review the booked order before making any money changes.';document.getElementById('quote-'+q.id)?.scrollIntoView({behavior:'smooth',block:'center'});Hub.toast('A deposit is recorded. This quote cannot be replaced through the unpaid revision editor.');return Promise.resolve();}
    document.getElementById('q-create').disabled=true;
    document.getElementById('q-revision-status').textContent='Checking the current quote and any saved revision…';
    return Hub.api(ENDPOINT, { method: 'POST', body: { op: 'revision_status', quote_id: q.id } }).then(function (result) {
      if (!result.ok) { Hub.toast(result.error || 'Cannot verify revision status'); return; }
      if (q.deposit_status === 'void' && !result.revision) { Hub.toast('This void quote has no recoverable revision.'); return; }
      resetPreview();editorDirty=false;draftRecord=null;draftPendingId=null;revisionSource=q;document.getElementById('q-editor-title').textContent='Edit existing catering quote';
      document.getElementById('q-existing-choice').innerHTML='';document.getElementById('q-revision-cancel').hidden=false;
      document.getElementById('q-create').disabled=false;document.getElementById('q-sent').innerHTML='';document.getElementById('q-mail').innerHTML='';
      var saved=result.revision&&JSON.parse(result.revision.payload_json),blob={};try{blob=JSON.parse(q.quote_json||'{}');}catch(_error){}
      leadId=q.source_lead_id||blob.lead_id||requestLeadId||null;
      var values=saved||{customerName:q.customer_name,customerEmail:q.customer_email,customerPhone:q.customer_phone,eventDate:q.event_date,guests:q.guests,lang:q.lang,note:q.note,quoteBreakdown:blob};
      var breakdown=values.quoteBreakdown||{};
      if(!saved)breakdown.delivery_fee_cents=quoteDeliveryFee(q);
      if(draft&&!saved){values={customerName:draft.customer_name,customerEmail:draft.customer_email,customerPhone:draft.customer_phone,eventDate:draft.event_date,guests:draft.guests,lang:draft.lang,note:draft.note,quoteBreakdown:{lines:draft.lines,recommendations:draft.recommendations,delivery_fee_cents:draft.delivery_fee_cents}};breakdown=values.quoteBreakdown;}
      [['q-name','customerName'],['q-email','customerEmail'],['q-phone','customerPhone'],['q-date','eventDate'],['q-guests','guests'],['q-lang','lang'],['q-note','note']].forEach(function(pair){document.getElementById(pair[0]).value=values[pair[1]]||'';});
      var fee=breakdown.delivery_fee_cents;document.getElementById('q-delivery-fee').value=Number.isInteger(fee)&&fee>=0?(fee/100).toFixed(2):'';
      if(Number.isInteger(fee)&&fee>0&&!(Array.isArray(breakdown.lines)&&breakdown.lines.length)){
        document.getElementById('q-create').disabled=true;document.getElementById('q-preview').disabled=true;
        document.getElementById('q-revision-status').textContent='The itemized menu is unavailable. Reload the quotes before editing; the confirmed delivery / setup fee has been preserved. No replacement can be saved.';
        document.getElementById('q-lines').innerHTML='';return;
      }
      document.getElementById('q-preview').disabled=false;
      var lines=breakdown.lines||(draft&&!saved?[]:[{name:'Catering package',cents:q.total_cents-(Number.isInteger(fee)?fee:0)}]);
      document.getElementById('q-lines').innerHTML=lines.map(function(line){var metadata=Object.assign({},line);if(!saved&&!draft&&(!metadata.pricing_mode||metadata.pricing_mode==='catalog'))metadata.pricing_mode='quoted';return lineRowHtml({name:line.name,qty:line.qty,price:(line.cents/100).toFixed(2),metadata:metadata});}).join('');
      if(!lines.length)document.getElementById('q-total').value=((draft?.total_cents||q.total_cents)-(Number.isInteger(fee)?fee:0))/100;
      renderLinesSum();
      document.getElementById('q-revision-status').textContent=saved?'Recover the saved revision. Its approved values stay locked while the old checkout is retired and the replacement recovered.':'Editing existing quote '+q.id+'. 1. Make changes. 2. Read the updated email preview. 3. Save changes to replace the old checkout. Sending is a separate step.';
      document.getElementById('q-create').textContent=saved?'Recover saved revision':'Save changes · replace old checkout';
      document.querySelectorAll('#q-name,#q-email,#q-phone,#q-date,#q-guests,#q-lang,#q-note,#q-delivery-fee,#q-lines input,#q-lines button,#q-add-line,#q-recommendation,#q-recommendation-packs').forEach(function(input){input.disabled=Boolean(saved);});
      loadRecommendations(breakdown.recommendations&&breakdown.recommendations[0]);
      document.getElementById('q-editor-title').scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  function wireRevisionEditor(root) {
    root.querySelectorAll('[data-revise]').forEach(function(button){button.addEventListener('click',function(){return beginRevision(JSON.parse(button.getAttribute('data-revise')));});});
  }

  function render() {
    revisionSource = null; revisionPreview = null;editorDirty=false;draftRecord=null;
    Owner.get(ENDPOINT).then(function (d) {
      var root = document.getElementById('owner-root');
      root.className = '';
      if (!d || !d.ok) { root.innerHTML = '<div class="card"><p class="row-sub">Could not load catering quotes.</p></div>'; return; }
      var qs = d.quotes || [];
      quoteCache=qs;
      var rs = d.requests || [];
      var cs = d.changes || [];
      var openChanges = cs.filter(function (c) { return c.status === 'open'; });
      var unpaid = qs.filter(function (q) { return q.deposit_status === 'unpaid'; });
      var owed = qs.reduce(function (n, q) { return n + (q.deposit_status !== 'void' && q.balance_status === 'due' ? Number(q.balance_cents || 0) : 0); }, 0);

      root.innerHTML =
        '<div class="card-grid">' +
          Owner.tile(String(openChanges.length), 'Customer requests', { accent: openChanges.length ? 'accent' : '' }) +
          Owner.tile(String(rs.length), 'Website requests', { accent: rs.length ? 'accent' : '' }) +
          Owner.tile(String(qs.length), 'Quotes') +
          Owner.tile(String(unpaid.length), 'Deposits unpaid', { accent: unpaid.length ? 'accent' : '' }) +
          Owner.tile(money(owed), 'Balances still owed') +
        '</div>' +
        // Ahead of everything else on this page: somebody who has already booked is waiting on an
        // answer, and an unanswered customer phones instead.
        '<div class="hub-section"><h2>Customer requests</h2>' +
        (cs.length ? cs.map(changeCard).join('') : '<div class="hub-empty">No customers have asked for changes.</div>') +
        '</div>' +
        '<div class="hub-section"><p><a class="btn ghost" href="/hub/owner/catering-service.html">Lead follow-up &amp; response status</a></p><h2>Website quote requests</h2><p><a href="/hub/kitchen/catering.html">Open kitchen design-request summary</a></p>' +
        (rs.length ? rs.map(requestCard).join('') : '<div class="hub-empty">No website catering requests yet.</div>') +
        '</div>' +
        formHtml(d) +
        '<div class="hub-section"><h2>Quotes</h2>' +
        (qs.length ? quoteListHtml(qs) : '<div class="hub-empty">No catering quotes yet.</div>') +
        '</div>';

      wireForm();loadCatalog();loadDrafts();
      root.querySelectorAll('[data-review-saved]').forEach(function(button){button.addEventListener('click',function(){reviewSavedQuote(button.getAttribute('data-review-saved'));});});
      wireRevisionEditor(root);
      wireCheckoutStatus(root);
      root.querySelectorAll('[data-retire-duplicate]').forEach(function(button){button.addEventListener('click',function(){var q=quoteCache.find(function(row){return row.id===button.getAttribute('data-retire-duplicate');});if(q)reviewDuplicateRetirement(q);});});
      loadRecommendations();
      wireChanges(root);
      wireRequests(root);
      wireGifts(root);
      var selected = document.getElementById('selected-request');
      if (selected) selected.scrollIntoView({ behavior: 'smooth', block: 'center' });
      root.querySelectorAll('[data-balance-link]').forEach(function(btn){ btn.addEventListener('click',function(){btn.disabled=true;Hub.api(ENDPOINT,{method:'POST',body:{op:'create_balance_link',quote_id:btn.getAttribute('data-balance-link')}}).then(function(r){if(r&&r.ok){Hub.toast('Square balance link ready');render();}else{btn.disabled=false;Hub.toast((r&&r.error)||'Could not create the balance link');}});});});
      root.querySelectorAll('[data-balance]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!window.confirm('Mark this balance paid? This records the money as received — it does not charge anybody.')) return;
          btn.disabled = true;
          Hub.api(ENDPOINT, { method: 'POST', body: { op: 'mark_balance_paid', quote_id: btn.getAttribute('data-balance') } }).then(function (r) {
            if (r && r.ok) { Hub.toast('Balance closed'); render(); }
            else { btn.disabled = false; Hub.toast((r && r.error) || 'Could not close that balance'); }
          });
        });
      });
      if (window.AnejoI18n) window.AnejoI18n.refresh();
    });
  }

  Owner.init('catering', render);
})();
</script>
<script src="assets/operator.js?v=catering-status-8" defer></script>
