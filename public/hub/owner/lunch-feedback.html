<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Lunch feedback · Añejo</title><link rel="stylesheet" href="/assets/lunch-feedback.css"></head><body><main><header><img src="/assets/img/emblem.png" alt="Añejo"><p class="eyebrow">OWNER · SERVICE INTELLIGENCE</p><h1>Listen.<br><em>Improve the next lunch.</em></h1></header><a href="/hub/owner/contracts.html">Back to office accounts</a><label for="period">Review period</label><select id="period"><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select><p class="note">Anonymous staff-recorded responses. Scores average only numerical answers; moods remain separate. Responses are not verified unique patients. No feedback is not a positive rating.</p><div id="results" aria-live="polite"></div><h2>Menu requests</h2><div id="requests"></div></main><script>
const results=document.getElementById('results'),requests=document.getElementById('requests');
function line(parent,text,tag='p'){const e=document.createElement(tag);e.textContent=text;parent.append(e);}
async function load(){results.textContent='Loading…';requests.textContent='';try{const r=await fetch('/api/hub/owner/lunch-feedback?days='+document.getElementById('period').value);const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Owner sign-in required.');results.textContent='';if(!d.rows.length)line(results,'No recorded responses in this period.');for(const x of d.rows){const a=document.createElement('article');line(a,x.item_name,'h2');line(a,x.office+' · '+x.service_date+' · '+x.responses+' responses');line(a,x.scored?x.average_score+'/10 average from '+x.scored+' numerical ratings':'No numerical ratings');line(a,'Mood: '+x.sad+' sad · '+x.neutral+' neutral · '+x.happy+' happy');line(a,'Eat again: '+x.yes+' yes · '+x.no+' no · '+x.unsure+' unsure · '+x.unanswered+' unanswered');results.append(a);}for(const x of d.suggestions)line(requests,x.office+' · '+x.service_date+' · '+x.item_name+': '+x.suggestion);if(!d.suggestions.length)line(requests,'No menu requests recorded.');}catch(e){results.textContent=e.message;}}
document.getElementById('period').addEventListener('change',load);load();
</script></body></html>
