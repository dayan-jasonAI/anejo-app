<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Training Compliance</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .tc-sum { font-size:14px; color:#444; margin:8px 0 14px; }
  .tc-sum b { color:var(--green,#1A3D2E); }
  .tc-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line,#e7e2d6); border-radius:12px; padding:13px 16px; margin:10px 0; }
  .tc-row .tc-name { font-weight:700; color:var(--green,#1A3D2E); }
  .tc-row .tc-role { font-size:12px; color:#6b6b6b; text-transform:uppercase; letter-spacing:1px; }
  .tc-row .tc-spacer { flex:1; }
  .tc-badge { font-size:12px; font-weight:700; border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .tc-badge.ok { background:#eaf3ec; color:#1A3D2E; border:1px solid rgba(26,61,46,.25); }
  .tc-badge.no { background:#fbe9e8; color:#9b2226; border:1px solid #e3b7b7; }
  /* Out of date is its own state, not a shade of "not completed": this person WAS trained, correctly,
     and is now working to a procedure that changed under them. Amber, so it reads as owed-work
     rather than never-taught. */
  .tc-badge.stale { background:#fff3d8; color:#8a6b12; border:1px solid #e4c878; }
  .tc-row.stale { border-color:#e4c878; background:#fffdf6; }
  .tc-why { font-size:12px; color:#6b6b6b; margin-top:3px; max-width:340px; line-height:1.4; }
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · TRAINING</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p>Loading…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }
  var esc = (window.Hub && Hub.esc) ? Hub.esc : function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  function fmtDate(ms) { try { return new Date(Number(ms)).toLocaleDateString(); } catch (e) { return ''; } }

  function render(d) {
    var root = document.getElementById('owner-root');
    root.className = '';
    var items = (d && d.items) || [];
    if (!items.length) { root.innerHTML = '<p style="color:#6b6b6b;padding:18px 0">No active staff yet.</p>'; return; }
    // Three numbers, because "12 of 14 completed" hid the person who trained before the procedure
    // changed. Out of date is listed separately and only mentioned when there actually is someone in
    // it — the owner should not have to read a zero every day.
    var sum = '<div class="tc-sum"><b>' + (d.done || 0) + '</b> of <b>' + (d.total || 0) + '</b> active staff are up to date on their role training.'
      + (d.outdated ? ' <b>' + d.outdated + '</b> owe the new training.' : '')
      + (d.never ? ' <b>' + d.never + '</b> have never been trained.' : '')
      + '</div>';
    root.innerHTML = sum + items.map(function (i) {
      var stale = i.state === 'outdated';
      var why = stale && i.update_headline ? '<div class="tc-why">' + esc(i.update_headline.en || '') + '</div>' : '';
      var badge = i.state === 'current'
        ? '<span class="tc-badge ok">✓ Up to date · ' + fmtDate(i.completed_at) + (i.lang ? ' · ' + esc(i.lang).toUpperCase() : '') + '</span>'
        : stale
          ? '<span class="tc-badge stale">⏳ Out of date · trained ' + fmtDate(i.completed_at) + '</span>'
          : '<span class="tc-badge no">⚠ Never trained</span>';
      return '<div class="tc-row' + (stale ? ' stale' : '') + '">'
        + '<div><div class="tc-name">' + esc(i.name || '—') + '</div><div class="tc-role">' + esc(i.role || '') + (i.team ? ' · ' + esc(i.team) : '') + '</div>' + why + '</div>'
        + '<div class="tc-spacer"></div>'
        + badge
        + '</div>';
    }).join('');
  }

  function load() {
    Hub.api('/api/hub/owner/training-status').then(function (r) { render(r || {}); });
  }
  Owner.init('staff', function () { load(); });
})();
</script>
<script src="assets/operator.js?v=private-strategy-6" defer></script>
</body>
</html>
