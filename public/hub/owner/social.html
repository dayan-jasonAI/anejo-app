<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Social</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  .post { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .post.published { border-left-color:#2c6b3f; background:#f4faf6; }
  .post.scheduled { border-left-color:var(--gold); }
  .post.failed { border-left-color:var(--crit,#b3402f); background:#fdf0ef; }
  .post.publishing { border-left-color:#5b7fa6; }
  .post-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .tag { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:20px; padding:3px 9px; white-space:nowrap; }
  .tag.published { background:#2c6b3f; color:#fff; }
  .tag.scheduled { background:#efe7cf; color:#8a7a2e; }
  .tag.draft { background:#e6e6e3; color:#4a4d49; }
  .tag.failed { background:#b3402f; color:#fff; }
  .tag.publishing { background:#5b7fa6; color:#fff; }
  .cap { font-size:13.5px; line-height:1.5; white-space:pre-wrap; color:var(--ink); }
  .thumb { width:100%; max-width:220px; border-radius:8px; margin-top:8px; display:block; }
  .acts { display:flex; gap:8px; margin-top:10px; }
  .acts button { flex:1; padding:8px 10px; font-size:13px; font-weight:700; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--green); }
  .acts button.go { background:var(--gold); border-color:var(--gold); color:var(--green); }
  .acts button.del { color:#8a2b22; border-color:#e3c9c5; }
  .form-row { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .form-row label { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--green); opacity:.8; }
  .form-row input, .form-row textarea { padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  .form-row textarea { min-height:110px; resize:vertical; line-height:1.5; }
  .hint { font-size:12px; color:var(--green); opacity:.72; line-height:1.5; margin:2px 0 0; }
  .live { border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.5; }
  .live.on { background:#e7f0ea; border:1px solid #2c6b3f; color:#1b4d2b; }
  .live.off { background:#f6f5f1; border:1px solid var(--line); color:var(--green); }
  /* Token-expiry banner. Escalates by COLOR AND WEIGHT with how close the recorded date is —
     'unknown' is deliberately its own quiet, neutral tone: it is a gap to fill, not a fire. */
  .live.expiry-unknown { background:#f6f5f1; border:1px solid var(--line); color:var(--green); }
  .live.expiry-ok { background:#f6f5f1; border:1px solid var(--line); color:var(--green); opacity:.85; }
  .live.expiry-warning { background:#fbf3da; border:1px solid var(--gold-dark); color:var(--gold-dark); }
  .live.expiry-urgent, .live.expiry-expired { background:#fbe3e1; border:1px solid var(--crit); color:var(--crit); font-weight:600; }
  .expiry-set { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .expiry-set input[type="date"] { width:auto; padding:8px 10px; }
  .expiry-set button { white-space:nowrap; }
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · SOCIAL</h1>
  <div class="hub-bar-actions"><button id="lang-toggle" type="button">ES</button></div>
</div>

<div class="hub-wrap">
  <div id="owner-root" class="hub-loading"><p data-i18n>Loading…</p></div>
</div>

<nav id="owner-nav" class="hub-nav"></nav>

<script src="/assets/js/i18n.js"></script>
<script src="/hub/assets/hub.js"></script>
<script src="/hub/owner/assets/owner.js"></script>
<script>
(function () {
  Hub.boot();
  var lt = document.getElementById('lang-toggle');
  if (lt && window.AnejoLang) {
    lt.textContent = window.AnejoLang.get() === 'es' ? 'EN' : 'ES';
    lt.addEventListener('click', function () { var n = window.AnejoLang.get() === 'es' ? 'en' : 'es'; window.AnejoLang.set(n); lt.textContent = n === 'es' ? 'EN' : 'ES'; });
  }
  var esc = Hub.esc;
  var DATA = null;

  var WORD = { draft:'Draft', scheduled:'Scheduled', publishing:'Publishing…', published:'Live on Instagram', failed:'Failed' };

  function when(p) {
    if (p.published_at) return 'Posted ' + new Date(Number(p.published_at)).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    if (p.scheduled_at) return 'Scheduled for ' + new Date(Number(p.scheduled_at)).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    return 'Not scheduled';
  }

  function whenLabel(ms) {
    return new Date(Number(ms)).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

  // datetime-local's local-parts trick (see localValue below), but for a plain date field.
  function dateInputValue(ms) {
    var d = new Date(Number(ms)); function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  }

  // The expiry banner. Escalates quietly→loud as the recorded date approaches, and is HONEST when
  // there is nothing recorded: 'unknown' never renders as "all good" — that is exactly the gap
  // that let a token die silently in the first place.
  var EXPIRY_MSG = {
    unknown: '⏳ <b>Token expiry not recorded.</b> Instagram gives no warning before a long-lived token dies — publishing, the DM inbox, and insights all go dark at once. Record the date Meta showed when this token was generated so the HUB can warn ahead of it.',
    ok: null, // no line needed far out; the record-it control below still shows the date
    warning: '🟡 <b>Instagram token expires in {days} days</b> ({date}). Plan the swap to a Meta System User token (never expires) — see {doc}.',
    urgent: '🔴 <b>Instagram token expires in {days} day{plural} — do this now.</b> When it dies, publishing, the DM inbox, and insights stop working with no warning. See {doc}.',
    expired: '⛔ <b>Instagram token expired {date}.</b> Publishing, the DM inbox, and insights are down until it is replaced. See {doc}.',
  };

  function expiryBanner(d) {
    var te = d.token_expiry || { status: 'unknown', at: null, days_left: null, swap_doc: 'docs/INSTAGRAM_TOKEN_SWAP.md' };
    var docLink = '<a href="https://github.com/dayan-jasonAI/anejo-app/blob/main/' + te.swap_doc + '" target="_blank" rel="noopener">' + esc(te.swap_doc) + '</a>';
    var dateStr = te.at ? new Date(Number(te.at)).toLocaleDateString([], { year:'numeric', month:'long', day:'numeric' }) : '';
    var tpl = EXPIRY_MSG[te.status];
    var body;
    if (tpl == null) {
      // 'ok' — quiet by design (thresholds: warn inside 30 days, urgent inside 7). Still says the
      // date so "quiet" never means "nothing is shown".
      body = te.at ? '🟢 Instagram token recorded — expires ' + esc(dateStr) + ' (' + te.days_left + ' days).' : '';
    } else {
      body = tpl
        .replace('{days}', te.days_left != null ? Math.abs(te.days_left) : '?')
        .replace('{plural}', Math.abs(te.days_left) === 1 ? '' : 's')
        .replace('{date}', esc(dateStr))
        .replace('{doc}', docLink);
    }
    if (!body) return '';
    return '<div class="live expiry-' + esc(te.status) + '">' + body + recordControl(te) + '</div>';
  }

  // Owner-entered only — this NEVER calls Instagram. It just records the date Meta's own
  // dashboard showed at generation time, so the banner above has a fact to measure against.
  function recordControl(te) {
    return '<div class="expiry-set">' +
      '<input type="date" id="te_date" value="' + (te.at ? dateInputValue(te.at) : '') + '">' +
      '<button class="btn ghost" id="te_save" type="button" style="padding:6px 12px;font-size:12px">Record expiry date</button>' +
      (te.at ? '<button class="btn ghost" id="te_clear" type="button" style="padding:6px 12px;font-size:12px">Clear</button>' : '') +
      '</div>';
  }

  // The slide strip: thumbnails in order, each with move/remove until the post is live. The
  // preview uses the HUB-authenticated media route, never the public tokens.
  function slideStrip(p) {
    var media = p.media || [];
    if (!media.length) return '';
    var locked = p.status === 'published' || p.status === 'publishing';
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + media.map(function (m, i) {
      return '<div style="position:relative;width:96px">' +
        '<img src="/api/hub/media/' + esc(m.media_key) + '" alt="" loading="lazy" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">' +
        '<span style="position:absolute;top:3px;left:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px">' + (i + 1) + '</span>' +
        (locked ? '' :
          '<div style="display:flex;justify-content:center;gap:4px;margin-top:2px">' +
            (i > 0 ? '<button data-mvl="' + esc(p.id) + '|' + esc(m.id) + '" style="border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer">◀</button>' : '') +
            (i < media.length - 1 ? '<button data-mvr="' + esc(p.id) + '|' + esc(m.id) + '" style="border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer">▶</button>' : '') +
            '<button data-detach="' + esc(p.id) + '|' + esc(m.id) + '" style="border:1px solid #e3c9c5;background:#fff;color:#8a2b22;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer">✕</button>' +
          '</div>') +
      '</div>';
    }).join('') + '</div>' +
    (media.length > 1 ? '<p class="hint" style="margin-top:4px">Carousel · ' + media.length + ' photos, posted in this order. Instagram crops every slide to the first photo\'s shape.</p>' : '');
  }

  // Swap a slide with its neighbour and send the WHOLE order — the array is the truth, so a
  // stale page cannot half-apply.
  function moveSlide(postId, mediaId, dir) {
    var post = ((DATA && DATA.posts) || []).filter(function (x) { return x.id === postId; })[0];
    if (!post) return;
    var ids = (post.media || []).map(function (m) { return m.id; });
    var i = ids.indexOf(mediaId);
    var j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids[i] = ids[j]; ids[j] = mediaId;
    op({ op: 'reorder', id: postId, media_ids: ids }, 'Order updated');
  }

  function postCard(p) {
    // The image preview uses the HUB-authenticated route, never the public token — the owner is
    // signed in, and printing the public URL here would put it in screenshots.
    return '<div class="post ' + esc(p.status) + '">' +
      '<div class="post-head"><span class="tag ' + esc(p.status) + '">' + (WORD[p.status] || esc(p.status)) + '</span>' +
        '<span class="row-sub" style="font-size:11.5px">' + esc(when(p)) + '</span></div>' +
      (p.source === 'planner' ? '<div class="row-sub" style="font-size:11px;margin-bottom:4px">✍️ Drafted for you — review before it goes anywhere</div>' : '') +
      // The caption is EDITABLE until it is live. This existed as an API op and not as a field —
      // which meant it did not exist. A published caption is shown read-only: our copy changing
      // after the fact would disagree with what people actually read.
      (p.status === 'published'
        ? '<div class="cap">' + esc(p.caption || '(no caption)') + '</div>'
        : '<textarea id="cap_' + esc(p.id) + '" maxlength="2200" style="width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;line-height:1.5;resize:vertical">' + esc(p.caption || '') + '</textarea>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:4px"><button class="btn ghost" data-editcap="' + esc(p.id) + '" style="font-size:12px;padding:6px 12px">Save caption</button></div>') +
      // Slides. One photo is a normal post; 2-10 is a carousel, and the ORDER is editorial — the
      // strip shows it and the arrows change it. All of it locks once the post is live.
      slideStrip(p) +
      (p.status === 'published' ? '' :
        '<div class="card" style="margin-top:8px;background:#fbfaf6">' +
          (!(p.media || []).length && p.image_brief ? '<div class="row-sub" style="margin-bottom:6px"><b>Photo to make:</b> ' + esc(p.image_brief) + '</div>' : '') +
          '<input type="file" id="file_' + esc(p.id) + '" accept="image/jpeg" style="display:none">' +
          ((p.media || []).length < 10
            ? '<button class="btn ' + ((p.media || []).length ? 'ghost' : 'gold') + ' block" data-upload="' + esc(p.id) + '">📷 ' +
              ((p.media || []).length ? 'Add another photo (' + (p.media || []).length + '/10)' : 'Upload a photo') + '</button>'
            : '<p class="hint">10 photos — Instagram\'s limit for one post.</p>') +
          '<details style="margin-top:6px"><summary style="font-size:11.5px;opacity:.6;cursor:pointer">or paste a Studio image key</summary>' +
            '<div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="mk_' + esc(p.id) + '" placeholder="studio/2026-07/xxxx.jpg" ' +
              'style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px">' +
              '<button class="btn ghost" data-attach="' + esc(p.id) + '" style="white-space:nowrap">Attach</button></div></details></div>') +
      (p.error ? '<div class="row-sub" style="color:var(--crit);margin-top:6px">' + esc(p.error) + '</div>' : '') +
      (p.permalink ? '<div style="margin-top:8px"><a href="' + esc(p.permalink) + '" target="_blank" rel="noopener">View on Instagram →</a></div>' : '') +
      (p.metrics
        ? '<div class="row-sub" style="margin-top:6px;font-size:12px">📊 ' +
          [p.metrics.reach != null ? 'reach ' + p.metrics.reach : null,
           p.metrics.likes != null ? p.metrics.likes + ' likes' : null,
           p.metrics.saved != null ? p.metrics.saved + ' saves' : null,
           p.metrics.comments != null ? p.metrics.comments + ' comments' : null
          ].filter(Boolean).join(' · ') + ' <span style="opacity:.6">(' + esc(p.metrics.capture_date) + ')</span></div>'
        : (p.status === 'published' ? '<div class="row-sub" style="margin-top:6px;font-size:12px;opacity:.6">📊 No performance data yet — the daily sweep collects it.</div>' : '')) +
      (p.status === 'published' ? '' :
        // Approving a time is the human gate the planner deliberately stops short of.
        ((p.media || []).length
          ? '<div class="form-row" style="margin-top:10px"><label>Post it at</label>' +
              '<div style="display:flex;gap:8px"><input type="datetime-local" id="wh_' + esc(p.id) + '" style="flex:1" value="' +
                (p.scheduled_at ? localValue(p.scheduled_at) : '') + '">' +
              (p.status === 'scheduled'
                ? '<button class="btn ghost" data-unsched="' + esc(p.id) + '" style="white-space:nowrap">Cancel</button>'
                : '<button class="btn ghost" data-sched="' + esc(p.id) + '" style="white-space:nowrap">Schedule</button>') +
              '</div></div>'
          : '') +
        '<div class="acts">' +
          ((p.media || []).length ? '<button class="go" data-pub="' + esc(p.id) + '">' +
            (p.status === 'failed' ? 'Retry' : ((p.media || []).length > 1 ? 'Publish carousel · ' + (p.media || []).length + ' photos' : 'Publish now')) + '</button>' : '') +
          '<button class="del" data-del="' + esc(p.id) + '">Delete</button>' +
        '</div>') +
      '</div>';
  }

  function render() {
    var d = DATA;
    var root = document.getElementById('owner-root'); root.className = '';
    if (!d || !d.ok) { root.innerHTML = '<div class="hub-empty">Could not load.</div>'; return; }

    // Three states, three different actions: add credentials, fix a broken token, or nothing.
    var status;
    if (!d.configured) {
      status = '<div class="live off"><b>Not set up yet.</b> ' + esc(d.setup || '') + '</div>';
    } else if (d.connected) {
      status = '<div class="live on">🟢 <b>Connected as @' + esc(d.account.username) + '</b> · ' +
        (d.account.followers || 0) + ' followers · ' + (d.account.media_count || 0) + ' posts' +
        '<div class="row-sub" style="margin-top:4px">' + d.remaining_today + ' of ' + d.daily_cap + ' posts left today (Instagram\'s limit).' +
        // Which of Meta's two APIs the token came from — it decides where it gets renewed.
        (d.host === 'instagram_login' ? ' Token renews under Instagram → API setup with Instagram business login.'
          : d.host === 'facebook_login' ? ' Token is a Facebook Page token.' : '') +
        '</div></div>';
    } else {
      status = '<div class="live off">⚠️ <b>Set up, but Instagram refused the token.</b> ' + esc(d.account_error || '') +
        '<div class="row-sub" style="margin-top:4px">Long-lived tokens expire after ~60 days — this usually means it needs renewing.</div></div>';
    }

    root.innerHTML =
      '<div class="hub-section"><h2>Instagram</h2>' + status + expiryBanner(d) +
        '<div class="card">' +
          '<div class="form-row"><label>Photo</label>' +
            '<input type="file" id="mfile" accept="image/jpeg" style="display:none">' +
            '<button class="btn ghost" id="mpick" type="button">📷 ' + ((DATA && DATA._pickedKey) ? 'Change photo' : 'Upload a photo') + '</button>' +
            ((DATA && DATA._pickedKey) ? '<p class="hint">✓ ' + esc(DATA._pickedKey) + '</p>' : '') +
            '<details style="margin-top:4px"><summary style="font-size:11.5px;opacity:.6;cursor:pointer">or paste a Studio image key</summary>' +
              '<input id="mkey" type="text" placeholder="studio/2026-07/xxxx.jpg" style="margin-top:6px" value="' + esc((DATA && DATA._pickedKey) || '') + '"></details>' +
            '<p class="hint">JPEG from your phone or computer. Instagram rejects PNG and WebP; iPhone HEIC needs sharing as JPEG first.</p></div>' +
          '<div class="form-row"><label>Caption</label><textarea id="cap" maxlength="2200" placeholder="Write the caption…"></textarea>' +
            '<p class="hint">Up to 2,200 characters. Hashtags count toward it.</p></div>' +
          '<div class="form-row"><label>Schedule (optional)</label><input id="sched" type="datetime-local">' +
            '<p class="hint">Leave empty to save as a draft you publish by hand.</p></div>' +
          '<button class="btn gold block" id="save">Save post</button>' +
        '</div></div>' +
      '<div class="hub-section"><h2>Posts</h2>' +
        (d.posts.length ? d.posts.map(postCard).join('') : '<div class="card"><p class="row-sub">Nothing yet.</p></div>') +
      '</div>';

    wire();
    if (window.AnejoI18n) window.AnejoI18n.refresh();
  }

  // datetime-local wants LOCAL parts. toISOString() here would shift by the timezone offset and
  // show a post scheduled for 11am as 7am.
  function localValue(ms) {
    var d = new Date(Number(ms)); function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }

  // One file-picker path for phone and desktop: read the file in the browser, ship it as a data
  // URL, get back the R2 key. The server re-checks the magic bytes — this accept filter is a
  // convenience, not the gate.
  function uploadFile(file, cb) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { Hub.toast('Too large — 5MB max. Export a smaller JPEG.'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      Hub.toast('Uploading…');
      Hub.api('/api/hub/owner/social-upload', { method: 'POST', body: { data_url: String(rd.result || '') } })
        .then(function (r) {
          if (r && r.ok && r.media_key) cb(r.media_key);
          else Hub.toast((r && r.error) || 'Upload failed');
        });
    };
    rd.onerror = function () { Hub.toast('Could not read that file.'); };
    rd.readAsDataURL(file);
  }

  function op(body, okMsg) {
    return Hub.api('/api/hub/owner/social', { method:'POST', body: body }).then(function (r) {
      if (r && r.ok) { Hub.toast(okMsg); load(); } else Hub.toast((r && r.error) || 'Could not do that');
      return r;
    });
  }

  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-editcap]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-editcap');
        var el = document.getElementById('cap_' + pid);
        op({ op: 'edit', id: pid, caption: (el && el.value) || '' }, 'Caption saved');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-upload]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-upload');
        var fi = document.getElementById('file_' + pid);
        if (!fi) return;
        fi.onchange = function () {
          uploadFile(fi.files && fi.files[0], function (key) {
            op({ op: 'attach', id: pid, media_key: key }, 'Photo attached');
          });
        };
        fi.click();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-detach]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-detach').split('|');
        op({ op: 'detach', id: parts[0], media_id: parts[1] }, 'Photo removed');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvl]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvl').split('|');
        moveSlide(parts[0], parts[1], -1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mvr]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.getAttribute('data-mvr').split('|');
        moveSlide(parts[0], parts[1], 1);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-attach]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-attach');
        var v = ((document.getElementById('mk_' + pid) || {}).value || '').trim();
        if (!v) { Hub.toast('Paste the image key first.'); return; }
        op({ op:'attach', id:pid, media_key:v }, 'Image attached');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sched]'), function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-sched');
        var raw = ((document.getElementById('wh_' + pid) || {}).value || '');
        var when = raw ? Date.parse(raw) : NaN;
        if (!Number.isFinite(when)) { Hub.toast('Pick a date and time.'); return; }
        if (!window.confirm('Schedule this to post automatically at ' + whenLabel(when) + '?\n\nIt goes on the public profile without asking again.')) return;
        op({ op:'schedule', id:pid, scheduled_at:when }, 'Scheduled');
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-unsched]'), function (b) {
      b.addEventListener('click', function () { op({ op:'unschedule', id:b.getAttribute('data-unsched') }, 'Back to draft'); });
    });
    var teSave = document.getElementById('te_save');
    if (teSave) teSave.addEventListener('click', function () {
      var raw = (document.getElementById('te_date') || {}).value || '';
      if (!raw) { Hub.toast('Pick a date first.'); return; }
      // Parsed as local midnight, same as every other date-only field in the HUB — the exact
      // hour does not matter for a warning measured in days.
      var at = Date.parse(raw + 'T00:00:00');
      if (!Number.isFinite(at)) { Hub.toast('That date did not parse.'); return; }
      op({ op:'set_token_expiry', expires_at: at }, 'Expiry recorded');
    });
    var teClear = document.getElementById('te_clear');
    if (teClear) teClear.addEventListener('click', function () {
      if (!window.confirm('Clear the recorded expiry date? The HUB will show it as unknown until you record it again.')) return;
      op({ op:'set_token_expiry', expires_at: null }, 'Cleared');
    });

    var mpick = document.getElementById('mpick');
    if (mpick) mpick.addEventListener('click', function () {
      var fi = document.getElementById('mfile');
      if (!fi) return;
      fi.onchange = function () {
        uploadFile(fi.files && fi.files[0], function (key) {
          DATA._pickedKey = key;
          var mk = document.getElementById('mkey'); if (mk) mk.value = key;
          Hub.toast('Photo ready');
          render();
        });
      };
      fi.click();
    });

    var save = document.getElementById('save');
    if (save) save.addEventListener('click', function () {
      var key = (document.getElementById('mkey') || {}).value || '';
      var cap = (document.getElementById('cap') || {}).value || '';
      var s = (document.getElementById('sched') || {}).value || '';
      if (!key.trim()) { Hub.toast('Pick an image first.'); return; }
      var when = s ? Date.parse(s) : null;
      save.disabled = true;
      Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'draft', media_key:key.trim(), caption:cap, scheduled_at: Number.isFinite(when) ? when : null } })
        .then(function (r) {
          save.disabled = false;
          if (!r || !r.ok) { Hub.toast((r && r.error) || 'Could not save'); return; }
          Hub.toast(r.status === 'scheduled' ? 'Scheduled' : 'Saved as a draft');
          load();
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-pub]'), function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Publish this to Instagram now? It goes on the public profile.')) return;
        b.disabled = true; b.textContent = 'Publishing…';
        // Deliberately slow: Instagram fetches the image and we poll until it is ready, so this
        // can take ~20 seconds. Better to make them wait than to report success early.
        Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'publish', id:b.getAttribute('data-pub') } })
          .then(function (r) {
            if (r && r.ok) Hub.toast(r.already ? 'That was already live' : 'Posted to Instagram');
            else Hub.toast((r && r.error) || 'Could not publish');
            load();
          });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this post? It has not gone out.')) return;
        Hub.api('/api/hub/owner/social', { method:'POST', body:{ op:'delete', id:b.getAttribute('data-del') } })
          .then(function (r) { if (r && r.ok) { Hub.toast('Deleted'); load(); } else Hub.toast((r && r.error) || 'Could not delete'); });
      });
    });
  }

  function load() { Owner.get('/api/hub/owner/social').then(function (d) { DATA = d; render(); }); }
  Owner.init('social', load);
})();
</script>
<script src="assets/operator.js" defer></script>
</body>
</html>
