<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB · Event production</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b3a2b">
<link rel="manifest" href="/hub/manifest.webmanifest">
<link rel="stylesheet" href="/hub/assets/hub.css">
<style>
  /* Page-local. Read on a phone, in a kitchen, with one hand: one thing per row, big touch targets. */
  .ev-head { background:#1A3D2E; color:#fff; border-radius:12px; padding:14px; margin-bottom:12px; }
  .ev-head h2 { margin:0 0 2px; font-size:19px; color:#fff; }
  .ev-head .sub { font-size:13px; opacity:.85; }
  .countdown { font-size:30px; font-weight:700; line-height:1; margin-top:8px; }
  .countdown small { display:block; font-size:11px; font-weight:400; opacity:.8; text-transform:uppercase; letter-spacing:1px; }
  .money { display:flex; gap:14px; margin-top:10px; font-size:13px; flex-wrap:wrap; }
  .money b { display:block; font-size:16px; }
  .gap { background:#fbf3da; border:1px solid #e7d9a6; border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:8px; }
  .sect { border:1px solid var(--line,#e3e3da); border-radius:12px; padding:12px; margin-bottom:12px; background:#fff; }
  .sect h3 { margin:0 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:1px; opacity:.8; }
  .task { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #f0efe9; }
  .task:last-child { border-bottom:0; }
  .task input[type=checkbox] { width:26px; height:26px; flex:0 0 26px; margin-top:2px; }
  .task .when { font-size:12px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; }
  .task.done label { text-decoration:line-through; opacity:.55; }
  .daybar { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.6; margin:12px 0 2px; }
  .kind { font-size:10px; border:1px solid #cfcfc4; border-radius:4px; padding:1px 5px; text-transform:uppercase; letter-spacing:.5px; opacity:.75; white-space:nowrap; }
  table.grid { width:100%; border-collapse:collapse; font-size:14px; }
  table.grid td { padding:6px 4px; border-bottom:1px solid #f0efe9; vertical-align:top; }
  table.grid td.q { text-align:right; white-space:nowrap; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; font-size:11px; border-radius:20px; padding:2px 8px; background:#f1efe7; }
  .pill.warn { background:#fbf3da; }
  .rx-panel { margin:8px 0 2px; padding:11px; border:1px solid var(--line,#e3e3da); border-radius:10px; background:#fbfaf6; }
  .rx-panel textarea { width:100%; box-sizing:border-box; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
    padding:8px; border:1px solid var(--line,#e3e3da); border-radius:8px; background:#fff; resize:vertical; }
  .rx-panel h4 { margin:10px 0 4px; font-size:12px; letter-spacing:1px; text-transform:uppercase; opacity:.75; }
  .rx-note { font-size:12px; line-height:1.5; background:#fbf3da; border:1px solid #e7d9a6; border-radius:8px; padding:8px 10px; margin:0 0 8px; }
  .rx-hint { font-size:11px; opacity:.7; margin:2px 0 0; }
  .fields { display:grid; gap:8px; }
  .fields label { font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.7; }
  .fields input { width:100%; padding:10px; font-size:16px; }
  details.card { padding:10px 12px; }
  summary { cursor:pointer; font-weight:600; }
  .ev-row { display:block; padding:12px; border:1px solid var(--line,#e3e3da); border-radius:12px; margin-bottom:8px; background:#fff; text-decoration:none; color:inherit; }
</style>
</head>
<body>
<div class="hub-bar">
  <h1>AÑEJO · EVENT</h1>
  <div class="hub-bar-actions"><a id="back" href="/hub/kitchen/event.html" style="color:var(--gold,#C8BC6E);text-decoration:none;font-size:13px;display:none">← <span data-i18n>All events</span></a></div>
</div>

<div class="hub-wrap">
  <div class="hub-section">
    <div id="out"><div class="hub-loading" data-i18n>Loading…</div></div>
  </div>
</div>

<script src="/hub/assets/hub.js"></script>
<script src="/hub/kitchen/kitchen.js"></script>
<script src="/hub/kitchen/catering-driver-assignment.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Kitchen, Hub = window.Hub;
  K.renderNav('events');
  var out = document.getElementById('out');
  var back = document.getElementById('back');
  var quoteId = new URLSearchParams(location.search).get('id');
  var plan = null;
  var executionData = null, executionPending = null, executionBusy = false, executionMessage = '';
  var executionStorageKey = 'anejo:event-execution:' + quoteId;
  try { executionPending = JSON.parse(sessionStorage.getItem(executionStorageKey) || 'null'); } catch (ignore) {}

  var lang = 'en';
  try { lang = (window.AnejoLang ? window.AnejoLang.get() : localStorage.getItem('anejo:lang')) === 'es' ? 'es' : 'en'; } catch (e) { lang = 'en'; }
  var T = lang === 'es' ? {
    none: 'No hay eventos reservados en las próximas tres semanas.', guests: 'invitados', days: 'días',
    today: 'HOY', tomorrow: 'MAÑANA', deposit: 'Depósito', balance: 'Saldo', paid: 'pagado', due: 'pendiente',
    plan: 'Plan de producción', timeline: 'Qué se hace y cuándo', shopping: 'Lista de compra',
    packaging: 'Empaque', hours: 'Horas de cocina', logistics: 'Logística', design: 'Diseño y etiquetas',
    missing: 'Falta', details: 'Hora, dirección y tema', save: 'Guardar', saved: 'Guardado',
    time: 'Hora de servicio (24 h)', addr: 'Dirección', theme: 'Tema', colors: 'Colores', diet: 'Alergias / dieta',
    link: 'Usar esta solicitud', brief: 'Solicitud de diseño que coincide', noRecipe: 'sin receta',
    onHand: 'en inventario', total: 'Total', forDish: 'para', estimate: 'estimado',
    mins: 'min', setTime: '¿Cuánto tarda de verdad? Ponlo en minutos y el plan se reordena solo.'
  } : {
    none: 'No booked events in the next three weeks.', guests: 'guests', days: 'days',
    today: 'TODAY', tomorrow: 'TOMORROW', deposit: 'Deposit', balance: 'Balance', paid: 'paid', due: 'due',
    plan: 'Production plan', timeline: 'What happens, and when', shopping: 'Purchase list',
    packaging: 'Packaging', hours: 'Kitchen hours', logistics: 'Logistics', design: 'Design and labels',
    missing: 'Missing', details: 'Time, address and theme', save: 'Save', saved: 'Saved',
    time: 'Serving time (24h)', addr: 'Address', theme: 'Theme', colors: 'Colours', diet: 'Allergies / dietary',
    link: 'Use this request', brief: 'A design request that matches', noRecipe: 'no recipe',
    onHand: 'on hand', total: 'Total', forDish: 'for', estimate: 'estimated',
    mins: 'min', setTime: 'How long does it really take? Put the minutes in and the plan reorders itself.',
    draftPill: 'DRAFT — not confirmed', okPill: 'confirmed', openRecipe: 'Recipe',
    closeRecipe: 'Close', ingHead: 'Ingredients', stepHead: 'Method',
    baseNote: 'You are editing the MASTER recipe, written for its own batch size. The amounts in the purchase list above are this recipe scaled to THIS event — change those amounts here only if the master itself is wrong.',
    ingHint: 'One per line:  3 cups — garlic, mashed',
    stepHint: 'One step per line.',
    saveRecipe: 'Save changes', confirmRecipe: 'Confirm this recipe', confirming: 'Confirming…',
    confirmed: 'Confirmed — the kitchen can cook from this.', loadingRecipe: 'Opening…'
  };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  var money = function (c) { return '$' + ((c || 0) / 100).toFixed(2); };
  var clock = function (ms) { return new Date(ms).toLocaleTimeString(lang === 'es' ? 'es-US' : 'en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }); };
  var dayName = function (ms) { return new Date(ms).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { timeZone: 'America/New_York', weekday: 'long', month: 'short', day: 'numeric' }); };
  var dayKey = function (ms) { return new Date(ms).toLocaleDateString('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }); };

  // ---- list of events -------------------------------------------------------------------------
  function renderList(d) {
    if (!d.events.length) { out.innerHTML = '<p class="row-sub">' + esc(T.none) + '</p>'; return; }
    out.innerHTML = d.events.map(function (e) {
      var when = e.days_out === 0 ? T.today : e.days_out === 1 ? T.tomorrow : e.days_out + ' ' + T.days;
      return '<a class="ev-row" href="/hub/kitchen/event.html?id=' + encodeURIComponent(e.id) + '">'
        + '<b>' + esc(e.customer_name || '—') + '</b> <span class="pill">' + esc(when) + '</span>'
        + '<div class="row-sub">' + esc(e.event_date) + (e.serving_time ? ' · ' + esc(e.serving_time) : '')
        + ' · ' + esc(e.guests) + ' ' + esc(T.guests) + ' · ' + esc(money(e.total_cents)) + '</div></a>';
    }).join('');
    if (Hub && Hub.i18nRefresh) Hub.i18nRefresh();
  }

  // ---- one event ------------------------------------------------------------------------------
  function render(d, keepExecution) {
    plan = d;
    back.style.display = '';
    var e = d.event;
    var when = e.days_out === 0 ? T.today : e.days_out === 1 ? T.tomorrow : e.days_out;
    var html = '<div class="ev-head"><h2>' + esc(e.customer || '—') + '</h2>'
      + '<div class="sub">' + esc(dayName(Date.parse(e.date + 'T16:00:00Z'))) + (e.serving_time ? ' · ' + esc(e.serving_time) : '')
      + ' · ' + esc(e.guests) + ' ' + esc(T.guests) + '</div>'
      + (e.address ? '<div class="sub">' + esc(e.address) + '</div>' : '')
      + '<div class="countdown">' + esc(when) + '<small>' + esc(e.days_out > 1 ? T.days : '') + '</small></div>'
      + '<div class="money"><span>' + esc(T.deposit) + '<b>' + esc(money(e.deposit_paid_cents)) + ' ' + esc(e.deposit_status === 'paid' ? T.paid : e.deposit_status) + '</b></span>'
      + '<span>' + esc(T.balance) + '<b>' + esc(money(e.balance_cents)) + ' ' + esc(e.balance_status === 'paid' ? T.paid : T.due) + '</b></span>'
      + '<span>' + esc(T.total) + '<b>' + esc(money(e.total_cents)) + '</b></span></div></div>';

    html += '<div id="driver-assignment-panel" class="sect" hidden></div>';
    html += '<div id="execution-panel" class="sect" aria-live="polite">' + esc(lang === 'es' ? 'Cargando progreso del evento…' : 'Loading event progress…') + '</div>';
    html += d.gaps.map(function (g) { return '<div class="gap">' + esc(g) + '</div>'; }).join('');
    html += briefHtml(d) + detailsHtml(e) + timelineHtml(d) + productionHtml(d)
          + shoppingHtml(d) + packagingHtml(d) + hoursHtml(d) + logisticsHtml(d) + designHtml(d);
    out.innerHTML = html;
    wire();
    if (keepExecution) renderExecution(); else loadExecution();
    if (Hub && Hub.i18nRefresh) Hub.i18nRefresh();
  }

  function briefHtml(d) {
    var c = d.brief_candidates || [];
    if (!c.length) return '';
    return '<div class="sect"><h3>' + esc(T.brief) + '</h3>' + c.map(function (b) {
      var bits = [b.serving_time, b.address, b.theme, b.colors].filter(Boolean).map(esc).join(' · ');
      return '<div class="task"><div style="flex:1"><b>' + esc(b.from || b.lead_id) + '</b>'
        + '<div class="row-sub">' + bits + '</div></div>'
        + '<button class="btn link-brief" type="button" data-lead="' + esc(b.lead_id) + '">' + esc(T.link) + '</button></div>';
    }).join('') + '</div>';
  }

  function detailsHtml(e) {
    return '<details class="sect"><summary>' + esc(T.details) + '</summary><div class="fields" style="margin-top:10px">'
      + '<div><label for="f-time">' + esc(T.time) + '</label><input id="f-time" type="text" inputmode="numeric" placeholder="19:00" value="' + esc(e.serving_time || '') + '"></div>'
      + '<div><label for="f-addr">' + esc(T.addr) + '</label><input id="f-addr" type="text" value="' + esc(e.address || '') + '"></div>'
      + '<div><label for="f-theme">' + esc(T.theme) + '</label><input id="f-theme" type="text" value="' + esc(e.theme || '') + '"></div>'
      + '<div><label for="f-colors">' + esc(T.colors) + '</label><input id="f-colors" type="text" value="' + esc(e.colors || '') + '"></div>'
      + '<div><label for="f-diet">' + esc(T.diet) + '</label><input id="f-diet" type="text" value="' + esc(e.dietary_notes || '') + '"></div>'
      + '<button class="btn" id="save-details" type="button">' + esc(T.save) + '</button></div></details>';
  }

  function timelineHtml(d) {
    var lastDay = null;
    var rows = d.tasks.map(function (t) {
      var head = '';
      var k = dayKey(t.at);
      if (k !== lastDay) { lastDay = k; head = '<div class="daybar">' + esc(dayName(t.at)) + '</div>'; }
      return head + '<div class="task' + (t.done ? ' done' : '') + '">'
        + '<input type="checkbox" class="tick" data-key="' + esc(t.key) + '"' + (t.done ? ' checked' : '') + ' aria-label="' + esc(t.label) + '">'
        + '<div style="flex:1"><label>' + esc(t.label) + '</label>'
        + '<div class="when">' + esc(clock(t.at)) + (t.minutes ? ' · ' + t.minutes + ' min' : '') + '</div></div>'
        + '<span class="kind">' + esc(t.kind) + '</span></div>';
    }).join('');
    return '<div class="sect"><h3>' + esc(T.timeline) + '</h3><p class="row-sub">' + esc(lang === 'es' ? 'Lista de planificación · Hora del Este. Marcar una tarea no cambia el progreso de entrega ni envía notificaciones.' : 'Planning checklist · Eastern time. Checking a task does not change delivery progress or send notifications.') + '</p>' + rows + '</div>';
  }

  function productionHtml(d) {
    // The minutes box is the one place the kitchen teaches the HUB. Whatever the cook types here
    // drives this event's schedule and is kept as the starting point for the next one.
    return '<div class="sect"><h3>' + esc(T.plan) + '</h3>'
      + '<p class="row-sub" style="margin:-4px 0 8px">' + esc(T.setTime) + '</p>'
      + '<table class="grid"><tbody>'
      + d.production.map(function (p) {
        var rec = p.recipe;
        return '<tr><td>' + esc(p.name)
          + (p.needs_recipe ? ' <span class="pill warn">' + esc(T.noRecipe) + '</span>' : '')
          + (rec ? ' <span class="pill' + (rec.draft ? ' warn' : '') + '">' + esc(rec.draft ? T.draftPill : T.okPill) + '</span>' : '')
          + '<div class="when" style="font-size:11px;opacity:' + (p.minutes_is_guess ? '.9' : '.65') + '">' + esc(p.minutes_source) + '</div>'
          + (rec ? '<button type="button" class="btn ghost rx-open" data-rx="' + esc(rec.id) + '" data-rxname="' + esc(rec.name) + '"'
              + ' style="margin-top:6px;padding:5px 10px;font-size:12px">📖 ' + esc(T.openRecipe) + '</button>'
              + '<div class="rx-panel" id="rx-' + esc(rec.id) + '" hidden></div>' : '')
          + '</td>'
          + '<td class="q">' + esc(p.portions)
          + '<div style="margin-top:4px;display:flex;gap:4px;align-items:center;justify-content:flex-end">'
          + '<input class="mins" type="number" inputmode="numeric" min="1" max="1440" value="' + esc(p.minutes) + '" data-key="cook:' + esc(p.key) + '" aria-label="' + esc(p.name) + ' ' + esc(T.mins) + '" style="width:64px;padding:6px;text-align:right;font-size:15px">'
          + '<span style="font-weight:400;font-size:11px;opacity:.7">' + esc(T.mins) + '</span></div></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function shoppingHtml(d) {
    if (!d.shopping.length) return '';
    return '<div class="sect"><h3>' + esc(T.shopping) + '</h3><table class="grid"><tbody>'
      + d.shopping.map(function (s) {
        return '<tr><td>' + esc(s.item)
          + '<div class="when" style="font-size:11px;opacity:.65">' + esc(T.forDish) + ' ' + esc(s.for.join(', ')) + '</div>'
          + (s.on_hand ? '<div class="when" style="font-size:11px">' + esc(s.on_hand.amount + ' ' + (s.on_hand.unit || '')) + ' ' + esc(T.onHand) + '</div>' : '')
          + '</td><td class="q">' + esc(s.quantities.join(' + ')) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function packagingHtml(d) {
    return '<div class="sect"><h3>' + esc(T.packaging) + '</h3><table class="grid"><tbody>'
      + d.packaging.map(function (p) {
        return '<tr><td>' + esc(p.item) + '<div class="when" style="font-size:11px;opacity:.65">' + esc(p.why) + '</div></td>'
          + '<td class="q">' + esc(p.qty) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function hoursHtml(d) {
    return '<div class="sect"><h3>' + esc(T.hours) + '</h3><table class="grid"><tbody>'
      + d.labor.days.map(function (x) {
        return '<tr><td>' + esc(dayName(x.from)) + '<div class="when" style="font-size:11px;opacity:.65">' + esc(clock(x.from)) + ' – ' + esc(clock(x.to)) + '</div></td>'
          + '<td class="q">' + esc(x.hours) + ' h</td></tr>';
      }).join('')
      + '<tr><td><b>' + esc(T.total) + '</b></td><td class="q">' + esc(d.labor.total_hours) + ' h</td></tr>'
      + '</tbody></table></div>';
  }

  function logisticsHtml(d) {
    var l = d.logistics;
    return '<div class="sect"><h3>' + esc(T.logistics) + '</h3>'
      + (l.address ? '<p class="row-sub">' + esc(l.address) + '</p>' : '')
      + '<table class="grid"><tbody>' + l.load.map(function (x) {
        return '<tr><td>' + esc(x.what) + '</td><td style="text-align:right;font-size:12px;opacity:.75">' + esc(x.how) + '</td></tr>';
      }).join('') + '</tbody></table>'
      + '<ul style="margin:10px 0 0;padding-left:18px;font-size:13px">' + l.checks.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
  }

  function designHtml(d) {
    if (!d.design) return '';
    return '<div class="sect"><h3>' + esc(T.design) + '</h3>'
      + '<p><b>' + esc(d.design.theme || '') + '</b>' + (d.design.colors ? ' <span class="pill">' + esc(d.design.colors) + '</span>' : '') + '</p>'
      + '<ul style="margin:6px 0 0;padding-left:18px;font-size:13px">' + d.design.needs.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
  }

  // ---- event execution: the server owns progress; uncertain writes retain their request key ----
  function executionLabel(text) {
    if (lang !== 'es' || !text) return text;
    var dictionary = {
  "Reopen preparation": "Reabrir preparación",
  "Reason for reopening": "Motivo para reabrir",
  "Returns to preparation. Confirm handling and packing again; no notifications are sent.": "Vuelve a preparación. Confirma el manejo de alimentos y el empaque de nuevo; no se envían notificaciones.",
  "Explain why this event must be reopened.": "Explica por qué se debe reabrir este evento.",
  "Only an active packed or delivering event can be reopened.": "Solo se puede reabrir un evento activo empacado o en entrega.",
  "Planned": "Planificado",
  "Preparing": "En preparación",
  "Packed and ready": "Empacado y listo",
  "On the way": "En camino",
  "Arrived": "Llegó",
  "Completed": "Completado",
  "Event progress": "Progreso del evento",
  "Owner delivery, staff driver or customer pickup. This flow records progress; no notifications are sent.": "Entrega del propietario, chofer del equipo o recogida del cliente. Este proceso registra el progreso; no se envían avisos.",
  "Reload progress": "Recargar progreso",
  "Owner delivery": "Entrega del propietario",
  "Customer pickup": "Recogida del cliente",
  "Choose fulfillment below": "Elige la entrega o recogida abajo",
  "View only. An owner records fulfillment progress.": "Solo lectura. Un propietario registra el progreso de la entrega.",
  "Execution is read only until the conditions above are resolved. Past events remain archived.": "Solo lectura hasta resolver las condiciones anteriores. Los eventos pasados permanecen archivados.",
  "A previous save has no confirmed outcome. Retry that same request to resolve it before recording another step.": "No se ha confirmado el resultado del guardado anterior. Reintenta esa misma solicitud antes de registrar otro paso.",
  "Resolve previous save": "Resolver guardado anterior",
  "Open Hub sign-in": "Abrir acceso al Hub",
  "Fulfillment": "Entrega o recogida",
  "I am delivering": "Yo hago la entrega",
  "Travel minutes (0 for pickup)": "Minutos de viaje (0 para recogida)",
  "Setup minutes": "Minutos de montaje",
  "I confirmed food handling for every dish and these travel/setup times.": "Confirmé el manejo de cada plato y estos tiempos de viaje y montaje.",
  "Browser storage is unavailable. No change was sent. Enable storage before continuing.": "El almacenamiento del navegador no está disponible. No se envió ningún cambio. Habilítalo antes de continuar.",
  "Staff driver": "Chofer del equipo",
  "Confirm execution plan": "Confirmar plan de ejecución",
  "Food, quantities and all packaging are checked and ready.": "Los alimentos, las cantidades y todos los empaques están revisados y listos.",
  "Start preparation": "Iniciar preparación",
  "Mark packed and ready": "Marcar empacado y listo",
  "Record departure": "Registrar salida",
  "Record arrival": "Registrar llegada",
  "Confirm pickup completed": "Confirmar recogida completada",
  "Complete delivery": "Completar entrega",
  "Refresh saved progress": "Actualizar progreso guardado",
  "Saved history": "Historial guardado",
  "Plan confirmed": "Plan confirmado",
  "No execution steps recorded.": "No hay pasos de ejecución registrados.",
  "Confirm all food and packaging are ready.": "Confirma que todos los alimentos y empaques están listos.",
  "Could not verify saved event progress. Reload to try again.": "No se pudo verificar el progreso guardado. Recarga para reintentar.",
  "Saving…": "Guardando…",
  "Progress saved.": "Progreso guardado.",
  "Progress saved, but the planning timeline could not refresh. Reload this page before relying on its times.": "Progreso guardado, pero no se pudo actualizar el cronograma. Recarga esta página antes de usar sus horarios.",
  "Save rejected. Refresh progress before continuing.": "Guardado rechazado. Actualiza el progreso antes de continuar.",
  "Save outcome is unconfirmed. Resolve the previous save before continuing.": "No se ha confirmado el guardado. Resuelve el guardado anterior antes de continuar.",
  "Connection interrupted. Save outcome is unconfirmed; retry the same request.": "Conexión interrumpida. No se ha confirmado el guardado; reintenta la misma solicitud.",
  "Past or undated events cannot be changed through live execution.": "Los eventos pasados o sin fecha no se pueden modificar desde la ejecución en vivo.",
  "A paid, non-void deposit is required.": "Se requiere un depósito pagado y no anulado.",
  "A complete itemized menu and guest count are required.": "Se requiere un menú detallado completo y el número de invitados.",
  "Confirm the event serving time.": "Confirma la hora de servicio del evento.",
  "Event details changed. Reconfirm the execution plan before continuing.": "Los detalles del evento cambiaron. Vuelve a confirmar el plan antes de continuar.",
  "The recorded balance must be paid or waived before completion.": "El saldo registrado debe estar pagado o exonerado antes de completar.",
  "Owner access required.": "Se requiere acceso de propietario.",
  "Quote, action, version and a unique request key are required.": "Se requieren cotización, acción, versión y una clave de solicitud única.",
  "Request key already belongs to another action.": "La clave de solicitud ya pertenece a otra acción.",
  "Event not found.": "Evento no encontrado.",
  "The event changed. Reload before continuing.": "El evento cambió. Recarga antes de continuar.",
  "The packed execution plan cannot be changed.": "El plan no se puede modificar después de empacar.",
  "Choose owner delivery or customer pickup.": "Elige entrega del propietario o recogida del cliente.",
  "Confirm travel/setup minutes and food handling for every dish.": "Confirma los minutos de viaje y montaje y el manejo de cada plato.",
  "Confirm the delivery address.": "Confirma la dirección de entrega.",
  "That execution transition is not available.": "Ese cambio de estado no está disponible.",
  "Confirm the food and all packages are ready.": "Confirma que los alimentos y todos los paquetes están listos.",
  "Customer pickup requires zero travel minutes.": "La recogida del cliente requiere cero minutos de viaje."
};
    if (dictionary[text]) return dictionary[text];
    // Backend may join several deterministic blockers into one response.
    return Object.keys(dictionary).reduce(function (value, key) { return value.split(key).join(dictionary[key]); }, String(text));
  }
  function executionText(status) {
    return ({ planned: executionLabel("Planned"), preparing: executionLabel("Preparing"), ready: executionLabel("Packed and ready"), en_route: executionLabel("On the way"), arrived: executionLabel("Arrived"), completed: executionLabel("Completed") })[status] || status;
  }
  function renderExecution() {
    var el = document.getElementById('execution-panel');
    if (!el) return;
    var d = executionData, e = d && d.execution;
    var html = '<h3>' + esc(executionLabel("Event progress")) + '</h3><p class="row-sub">' + esc(executionLabel("Owner delivery, staff driver or customer pickup. This flow records progress; no notifications are sent.")) + '</p>';
    if (executionMessage) html += '<p role="status" class="gap">' + esc(executionMessage) + '</p>';
    if (!e) {
      el.innerHTML = html + '<button type="button" class="btn" id="execution-refresh">' + esc(executionLabel("Reload progress")) + '</button>';
    } else {
      html += '<p><b>' + esc(executionText(e.status)) + '</b> · ' + esc(e.delivery_mode === 'owner_self' ? executionLabel("Owner delivery") : e.delivery_mode === 'pickup' ? executionLabel("Customer pickup") : e.delivery_mode === 'staff_driver' ? executionLabel("Staff driver") : executionLabel("Choose fulfillment below")) + '</p>';
      html += (d.blockers || []).map(function (x) { return '<p class="gap">' + esc(executionLabel(x)) + '</p>'; }).join('');
      if (!d.can_write) html += '<p class="row-sub">' + esc(executionLabel("View only. An owner records fulfillment progress.")) + '</p>';
      if (d.read_only) html += '<p class="row-sub">' + esc(executionLabel("Execution is read only until the conditions above are resolved. Past events remain archived.")) + '</p>';
      if (executionPending) {
        html += '<p class="gap">' + esc(executionLabel("A previous save has no confirmed outcome. Retry that same request to resolve it before recording another step.")) + '</p>';
        if (d.can_write) html += '<button type="button" class="btn" id="execution-retry"' + (executionBusy ? ' disabled' : '') + '>' + esc(executionLabel("Resolve previous save")) + '</button><a class="btn ghost" href="/hub/">' + esc(executionLabel("Open Hub sign-in")) + '</a>';
      } else if (d.can_write && !d.read_only) {
        if (d.can_reopen) html += '<form id="execution-reopen" class="fields" style="margin:12px 0"><p class="gap">' + esc(executionLabel('Returns to preparation. Confirm handling and packing again; no notifications are sent.')) + '</p><label for="execution-reason">' + esc(executionLabel('Reason for reopening')) + '</label><textarea id="execution-reason" required maxlength="1000" rows="2"></textarea><button class="btn ghost" type="submit">' + esc(executionLabel('Reopen preparation')) + '</button></form>';
        if (d.configurable) html += '<form id="execution-config" class="fields"><label for="execution-mode">' + esc(executionLabel("Fulfillment")) + '</label><select id="execution-mode"><option value="owner_self"' + (e.delivery_mode === 'owner_self' ? ' selected' : '') + '>' + esc(executionLabel("I am delivering")) + '</option><option value="pickup"' + (e.delivery_mode === 'pickup' ? ' selected' : '') + '>' + esc(executionLabel("Customer pickup")) + '</option><option value="staff_driver"' + (e.delivery_mode === 'staff_driver' ? ' selected' : '') + '>' + esc(executionLabel('Staff driver')) + '</option></select>'
          + '<label for="execution-travel">' + esc(executionLabel("Travel minutes (0 for pickup)")) + '</label><input required id="execution-travel" type="number" min="0" max="720" step="1" value="' + esc(e.travel_minutes == null ? '' : e.travel_minutes) + '">'
          + '<label for="execution-setup">' + esc(executionLabel("Setup minutes")) + '</label><input required id="execution-setup" type="number" min="0" max="720" step="1" value="' + esc(e.setup_minutes == null ? '' : e.setup_minutes) + '">'
          + '<label><input required id="execution-handling" type="checkbox" style="width:auto">' + esc(executionLabel("I confirmed food handling for every dish and these travel/setup times.")) + '</label><button class="btn" type="submit">' + esc(executionLabel("Confirm execution plan")) + '</button></form>';
        if ((d.available_actions || []).includes('ready')) html += '<label style="display:block;margin:12px 0"><input id="execution-packed" type="checkbox">' + esc(executionLabel("Food, quantities and all packaging are checked and ready.")) + '</label>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' + (d.available_actions || []).map(function (action) {
          var label = ({ preparing:executionLabel("Start preparation"), ready:executionLabel("Mark packed and ready"), en_route:executionLabel("Record departure"), arrived:executionLabel("Record arrival"), completed:e.delivery_mode === 'pickup' ? executionLabel("Confirm pickup completed") : executionLabel("Complete delivery") })[action];
          return label ? '<button class="btn execution-action" type="button" data-action="' + esc(action) + '">' + esc(label) + '</button>' : '';
        }).join('') + '</div>';
      }
      html += '<button type="button" class="btn ghost" id="execution-refresh" style="margin-top:10px">' + esc(executionLabel("Refresh saved progress")) + '</button><details style="margin-top:12px"><summary>' + esc(executionLabel("Saved history")) + '</summary>';
      html += (d.transitions || []).length ? '<ol>' + d.transitions.map(function (t) {
        return '<li>' + esc(dayName(t.recorded_at) + ' ' + clock(t.recorded_at)) + ' ET · ' + esc(t.from_status === t.to_status ? executionLabel("Plan confirmed") : executionText(t.to_status)) + ' · ' + esc(t.actor) + (t.note ? '<br>' + esc(t.note) : '') + '</li>';
      }).join('') + '</ol>' : '<p class="row-sub">' + esc(executionLabel("No execution steps recorded.")) + '</p>';
      el.innerHTML = html + '</details>';
    }
    var refresh = document.getElementById('execution-refresh');
    if (refresh) { refresh.disabled = executionBusy; refresh.onclick = loadExecution; }
    var retry = document.getElementById('execution-retry');
    if (retry) retry.onclick = function () { saveExecution(null); };
    var reopen = document.getElementById('execution-reopen');
    if (reopen) reopen.onsubmit = function (event) {
      event.preventDefault();
      var note = document.getElementById('execution-reason').value.trim();
      if (!note) { Hub.toast(executionLabel('Explain why this event must be reopened.')); return Promise.resolve(); }
      return saveExecution({ op:'reopen', note:note });
    };
    var form = document.getElementById('execution-config');
    if (form) form.onsubmit = function (event) {
      event.preventDefault();
      saveExecution({ op:'configure', delivery_mode:document.getElementById('execution-mode').value, travel_minutes:Number(document.getElementById('execution-travel').value), setup_minutes:Number(document.getElementById('execution-setup').value), handling_confirmed:document.getElementById('execution-handling').checked });
    };
    Array.prototype.forEach.call(el.querySelectorAll('.execution-action'), function (btn) {
      btn.onclick = function () {
        var target = btn.dataset.action, packing = document.getElementById('execution-packed');
        if (target === 'ready' && (!packing || !packing.checked)) { Hub.toast(executionLabel("Confirm all food and packaging are ready.")); return; }
        saveExecution({ op:'transition', target_status:target, packing_confirmed:target === 'ready' });
      };
    });
  }
  function storeExecutionPending() {
    try { if (executionPending) sessionStorage.setItem(executionStorageKey, JSON.stringify(executionPending)); else sessionStorage.removeItem(executionStorageKey); return true; } catch (ignore) { return false; }
  }
  function loadExecution() {
    return K.get('/api/hub/kitchen/event-execution?id=' + encodeURIComponent(quoteId)).then(function (d) {
      if (!d || !d.ok || !d.execution) throw new Error('unavailable');
      executionData = d; executionMessage = ''; renderExecution();
      return window.CateringAssignment.load(quoteId, d.can_write, loadExecution);
    }).catch(function () { window.CateringAssignment.load(quoteId, false); executionData = null; executionMessage = executionLabel("Could not verify saved event progress. Reload to try again."); renderExecution(); });
  }
  function saveExecution(action) {
    if (executionBusy || !executionData || !executionData.can_write) return Promise.resolve();
    if (!executionPending) {
      if (!action || executionData.read_only) return Promise.resolve();
      executionPending = Object.assign({}, action, { quote_id:quoteId, expected_version:executionData.execution.version, idempotency_key:crypto.randomUUID() });
      if (!storeExecutionPending()) { executionPending = null; executionMessage = executionLabel("Browser storage is unavailable. No change was sent. Enable storage before continuing."); renderExecution(); return Promise.resolve(); }
    }
    executionBusy = true; executionMessage = executionLabel("Saving\u2026"); renderExecution();
    var savedOperation = executionPending.op;
    return K.post('/api/hub/kitchen/event-execution', executionPending).then(function (r) {
      if (r && r.ok && r.execution) {
        executionPending = null; storeExecutionPending(); executionData = r; executionMessage = executionLabel("Progress saved.");
        if (savedOperation === 'configure' || savedOperation === 'reopen') return K.get('/api/hub/kitchen/event?id=' + encodeURIComponent(quoteId)).then(function (updatedPlan) {
          if (!updatedPlan || !updatedPlan.ok || !updatedPlan.event) throw new Error('plan unavailable');
          render(updatedPlan, true);
        }).catch(function () { executionMessage = executionLabel("Progress saved, but the planning timeline could not refresh. Reload this page before relying on its times."); });
      } else if (r && r.ok === false && (r.status || r._status) >= 400 && (r.status || r._status) < 500) {
        executionPending = null; storeExecutionPending(); executionMessage = executionLabel(r.error) || executionLabel("Save rejected. Refresh progress before continuing.");
      } else { executionMessage = executionLabel("Save outcome is unconfirmed. Resolve the previous save before continuing."); }
    }).catch(function () { executionMessage = executionLabel("Connection interrupted. Save outcome is unconfirmed; retry the same request."); })
      .finally(function () { executionBusy = false; renderExecution(); window.CateringAssignment.load(quoteId, !!(executionData && executionData.can_write), loadExecution); });
  }

  // ---- wiring ---------------------------------------------------------------------------------
  function post(body, after) {
    return K.post('/api/hub/kitchen/event', body).then(function (r) {
      if (r && r.ok) { if (after) after(); } else { Hub.toast((r && r.error) || 'Error'); }
      return r;
    }).catch(function () { Hub.toast('Error'); });
  }

  // ---- the recipe editor ----------------------------------------------------------------------
  //
  // Seven catering recipes sat at status 'draft' on the morning they were being cooked, and there
  // was no screen anywhere that could finish them. This is that screen, and it is deliberately on
  // the production plan rather than in the library: the person who knows the recipe is wrong is
  // the one cooking from it, standing at the bench, today.
  function rxRender(el, r) {
    var ing = (r.ingredients || []).map(function (x) {
      return (x.qty ? x.qty + ' — ' : '') + x.item;
    }).join('\n');
    el.innerHTML = '<div class="rx-note">' + esc(T.baseNote) + (r.portion ? ' <b>' + esc(r.portion) + '</b>.' : '') + '</div>'
      + '<h4>' + esc(T.ingHead) + '</h4>'
      + '<textarea class="rx-ing" rows="9">' + esc(ing) + '</textarea>'
      + '<p class="rx-hint">' + esc(T.ingHint) + '</p>'
      + '<h4>' + esc(T.stepHead) + '</h4>'
      + '<textarea class="rx-steps" rows="11">' + esc((r.steps || []).join('\n')) + '</textarea>'
      + '<p class="rx-hint">' + esc(T.stepHint) + '</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      + '<button type="button" class="btn rx-save">' + esc(T.saveRecipe) + '</button>'
      + (r.draft ? '<button type="button" class="btn gold rx-confirm">✓ ' + esc(T.confirmRecipe) + '</button>' : '')
      + '<button type="button" class="btn ghost rx-close">' + esc(T.closeRecipe) + '</button></div>';

    el.querySelector('.rx-save').addEventListener('click', function () {
      var btn = this; btn.disabled = true;
      K.post('/api/hub/kitchen/recipe/draft', {
        id: r.id,
        ingredients: el.querySelector('.rx-ing').value,
        steps: el.querySelector('.rx-steps').value
      }).then(function (res) {
        btn.disabled = false;
        if (res && res.ok) { Hub.toast(T.saved); load(); } else { Hub.toast((res && res.error) || 'Error'); }
      }, function () { btn.disabled = false; Hub.toast('Error'); });
    });

    var conf = el.querySelector('.rx-confirm');
    // Save first, then confirm: confirming a recipe whose edits are still in the textarea would
    // publish the version the cook has just corrected away from.
    if (conf) conf.addEventListener('click', function () {
      conf.disabled = true; conf.textContent = T.confirming;
      K.post('/api/hub/kitchen/recipe/draft', {
        id: r.id,
        ingredients: el.querySelector('.rx-ing').value,
        steps: el.querySelector('.rx-steps').value
      }).then(function (saved) {
        if (!saved || !saved.ok) { conf.disabled = false; Hub.toast((saved && saved.error) || 'Error'); return; }
        return K.post('/api/hub/kitchen/recipe/publish', { id: r.id }).then(function (res) {
          if (res && res.ok) { Hub.toast(T.confirmed); load(); }
          else { conf.disabled = false; Hub.toast((res && res.error) || 'Error'); }
        });
      }, function () { conf.disabled = false; Hub.toast('Error'); });
    });

    el.querySelector('.rx-close').addEventListener('click', function () { el.hidden = true; el.innerHTML = ''; });
  }

  function wireRecipes() {
    Array.prototype.forEach.call(document.querySelectorAll('.rx-open'), function (btn) {
      btn.addEventListener('click', function () {
        var el = document.getElementById('rx-' + btn.dataset.rx);
        if (!el) return;
        if (!el.hidden) { el.hidden = true; el.innerHTML = ''; return; }
        el.hidden = false;
        el.innerHTML = '<p class="rx-hint">' + esc(T.loadingRecipe) + '</p>';
        K.get('/api/hub/kitchen/recipe/draft?id=' + encodeURIComponent(btn.dataset.rx)).then(function (d) {
          if (d && d.ok) rxRender(el, d.recipe);
          else { el.innerHTML = '<p class="rx-hint">' + esc((d && d.error) || 'Could not open this recipe.') + '</p>'; }
        }, function () { el.innerHTML = '<p class="rx-hint">Could not open this recipe.</p>'; });
      });
    });
  }

  function saveTask(box) {
    var row = box.closest('.task');
    var previous = row.classList.contains('done');
    var requested = box.checked;
    box.disabled = true;
    return post({ op: 'task', quote_id: quoteId, task_key: box.dataset.key, done: requested })
      .then(function (result) {
        box.checked = result && result.ok ? requested : previous;
        row.classList.toggle('done', box.checked);
      }).catch(function () {
        box.checked = previous;
        row.classList.toggle('done', previous);
      }).finally(function () { box.disabled = false; });
  }

  function wire() {
    wireRecipes();
    Array.prototype.forEach.call(document.querySelectorAll('.tick'), function (box) {
      box.addEventListener('change', function () { saveTask(box); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.mins'), function (box) {
      box.addEventListener('change', function () {
        var v = Number(box.value);
        if (!v || v < 1 || v > 1440) { Hub.toast(T.mins + ' 1–1440'); return; }
        box.disabled = true;
        post({ op: 'minutes', quote_id: quoteId, task_key: box.dataset.key, minutes: v }, function () { Hub.toast(T.saved); load(); })
          .then(function () { box.disabled = false; });
      });
    });

    var save = document.getElementById('save-details');
    if (save) save.addEventListener('click', function () {
      save.disabled = true;
      post({
        op: 'details', quote_id: quoteId,
        serving_time: document.getElementById('f-time').value.trim(),
        address: document.getElementById('f-addr').value.trim(),
        theme: document.getElementById('f-theme').value.trim(),
        colors: document.getElementById('f-colors').value.trim(),
        dietary_notes: document.getElementById('f-diet').value.trim()
      }, function () { Hub.toast(T.saved); load(); }).then(function () { save.disabled = false; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.link-brief'), function (btn) {
      btn.addEventListener('click', function () {
        btn.disabled = true;
        post({ op: 'link_brief', quote_id: quoteId, lead_id: btn.dataset.lead }, function () { Hub.toast(T.saved); load(); })
          .then(function () { btn.disabled = false; });
      });
    });
  }

  function load() {
    var url = '/api/hub/kitchen/event' + (quoteId ? '?id=' + encodeURIComponent(quoteId) : '');
    K.get(url).then(function (d) {
      if (!d || !d.ok) { out.innerHTML = '<div class="gap">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
      if (quoteId) render(d); else renderList(d);
    }).catch(function () { out.innerHTML = '<div class="gap">Could not load.</div>'; });
  }
  load();
})();
</script>
</body>
