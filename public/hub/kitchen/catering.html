<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catering production · Añejo Hub</title></head><body>
<style>body{margin:0;background:#f5f2ec;color:#1a3d2e;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}article{background:white;padding:24px;border:1px solid #c6a85b;border-radius:12px;margin:24px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 system-ui,sans-serif}a{color:inherit}</style>
<main><a href="/hub/">Añejo Hub</a><h1>Catering design requests</h1><p>Kitchen review — these are quote requests, not confirmed production orders. Management must approve the final menu, design, quantities and date before preparation. Customer contact details are intentionally omitted.</p><div id="app">Loading…</div></main>
<script>
(async function(){
  var root=document.getElementById('app');
  try {
    var response=await fetch('/api/hub/kitchen/catering'); var data=await response.json();
    if(!response.ok||!data.ok) throw new Error(data.error||'Could not load requests.');
    root.innerHTML=(data.requests||[]).map(function(r){return '<article><h2>'+esc(r.event_date||'Catering request')+'</h2><p>'+esc(r.interest||'')+' · '+esc(r.guests||'')+' guests · serving '+esc(r.serving_time||'not provided')+'</p><p><b>Dietary/allergy notes:</b> '+esc(r.dietary_needs||'None provided')+'</p><p><b>Event details:</b> '+esc(r.event_details||'None provided')+'</p><pre>'+esc(r.cajita_summary||'No Cajita configuration.')+'</pre></article>';}).join('')||'<p>No catering requests.</p>';
  } catch(e){ root.textContent=e.message||'Could not load requests.'; }
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
})();
</script></body></html>
