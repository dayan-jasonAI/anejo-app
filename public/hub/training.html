<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Añejo HUB — Training</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --green:#1A3D2E; --green-700:#15311f; --gold:#C6A85B; --gold-700:#8a7a2e;
    --cream:#F5F2EC; --paper:#fffdf8; --ink:#21302a; --muted:#6f7b74; --line:#e3ddcf;
    --crit:#b3402f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .bar{background:var(--green);color:var(--cream);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .bar h1{font-size:15px;letter-spacing:2px;margin:0;font-weight:700}.bar h1 b{color:var(--gold)}
  .bar .right{display:flex;align-items:center;gap:10px}
  .lang{display:flex;border:1px solid rgba(245,242,236,.4);border-radius:20px;overflow:hidden;font-size:12px;font-weight:700}
  .lang button{background:transparent;color:var(--cream);border:0;padding:5px 11px;cursor:pointer}
  .lang button.on{background:var(--gold);color:var(--green)}
  .home{color:var(--cream);text-decoration:none;font-size:13px;opacity:.85}
  /* landing */
  .land{padding:26px 18px}
  .land h2{font-size:24px;color:var(--green);margin:0 0 6px}
  .land p{color:var(--muted);margin:0 0 20px;font-size:15px;line-height:1.5}
  .pick{display:grid;gap:12px}
  .pick a{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:0 5px 18px rgba(26,61,46,.05)}
  .pick a .ic{font-size:26px}
  .pick a .tt{display:block;font-weight:700;color:var(--green);font-size:17px}
  .pick a .ds{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
  .pick a.full{border-left-color:var(--green);background:#fff8e9}
  /* what's new — the change since this reader last trained, above the module itself */
  .whatsnew{background:#fff8e9;border:1px solid var(--gold);border-left:5px solid var(--gold);border-radius:14px;
    padding:15px 17px;margin-bottom:14px;box-shadow:0 6px 22px rgba(198,168,91,.18)}
  .whatsnew .wn-k{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-700)}
  .whatsnew h3{margin:4px 0 8px;font-size:18px;color:var(--green);line-height:1.3}
  .whatsnew ul{margin:0;padding-left:19px;font-size:14.5px;line-height:1.55}
  .whatsnew li{margin-bottom:6px}
  .whatsnew .wn-done{margin:10px 0 0;font-size:12.5px;font-weight:700;color:var(--green)}
  .owner-guide-callout{background:#eef3ee;border-color:#9db2a5;border-left-color:var(--green)}
  .owner-guide-callout a{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;padding:10px 14px;border-radius:9px;background:var(--green);color:#fffdf8;text-decoration:none;font-size:14px;font-weight:700}
  /* module */
  .stage{flex:1;padding:16px 16px 30px}
  .modhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .modhead .badge{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--green);background:#e7e0cf;border-radius:20px;padding:4px 11px}
  .prog{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .dot{height:5px;border-radius:3px;background:var(--line);flex:1 1 8px;min-width:8px}
  .dot.done{background:var(--gold)}.dot.cur{background:var(--green)}
  .scene{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(26,61,46,.06);animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scene.playing{box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(26,61,46,.12)}
  .kicker{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--gold-700);text-transform:uppercase}
  .scene h3{margin:4px 0 12px;font-size:20px;color:var(--green);line-height:1.2}
  .mock{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  .blk{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin:10px 0;font-size:14px;line-height:1.5}
  .blk .lab{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
  .blk.trig{border-color:var(--gold)} .blk.trig .lab{color:var(--gold-700)}
  .blk.you{border-color:var(--green)} .blk.you .lab{color:var(--green)}
  .blk.then{border-color:#9a8} .blk.then .lab{color:#5c7}
  .blk.then .lab{color:var(--gold-700)}
  .note{font-size:12.5px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
  .nav{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.gold{background:var(--gold);color:var(--green)} .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.play{background:var(--green);color:#fff;width:100%;margin-top:10px}
  .btn:disabled{opacity:.4;cursor:default}
  .scount{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
  .m-nav{display:flex;background:var(--green-700);border-radius:9px;overflow:hidden}
  .m-nav span{flex:1;text-align:center;color:rgba(245,242,236,.7);font-size:10px;padding:7px 2px}
  .m-nav span.on{color:var(--gold)}.m-nav span i{display:block;font-size:15px;font-style:normal}
  .m-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;margin:5px 0}
  .m-t{font-weight:700;color:var(--green);font-size:13px}.m-s{font-size:12px;color:var(--muted)}
  .m-b{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:#eee;color:#555}
  .m-b.sub{background:var(--gold);color:var(--green)}.m-b.ok{background:#dcebe0;color:var(--green)}
  .m-b.win{background:#efe7cf;color:var(--gold-700)}.m-b.crit{background:#f3d9d3;color:var(--crit)}
  .m-btn{display:block;text-align:center;background:var(--green);color:#fff;font-weight:700;border-radius:8px;padding:8px;font-size:12px;margin-top:7px}
  .m-u{display:inline-flex;gap:4px;margin-top:5px}.m-u b{width:24px;height:24px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff}.m-u b.on{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>AÑEJO <b>·</b> TRAINING</h1>
    <div class="right">
      <a class="home" id="cardlink" href="#" style="display:none">🖨 <span data-t="card">Card</span></a>
      <a class="home" id="homelink" href="/hub/training" style="display:none">↩︎ <span data-t="all">All</span></a>
      <div class="lang"><button id="en" class="on" onclick="setLang('en')">EN</button><button id="es" onclick="setLang('es')">ES</button></div>
    </div>
  </div>

  <div class="land" id="land">
    <h2 data-t="choose">Choose your training</h2>
    <p data-t="chooseSub">Pick your role. Tutorials introduce screens and routines. The Owner operations guide links to current Hub workflows; the older narrated tour remains reference material.</p>
    <div class="pick" id="pick"></div>
    <p style="margin-top:20px;text-align:center"><a href="/hub/training-card?role=all" style="color:var(--gold-700);font-size:13.5px;font-weight:700;text-decoration:none">🗂 <span data-t="binder">Print all-roles binder (PDF)</span></a></p>
  </div>

  <div class="stage" id="stage" style="display:none">
    <aside class="whatsnew owner-guide-callout" id="owner-guide-callout" style="display:none"></aside>
    <div class="whatsnew" id="whatsnew" style="display:none"></div>
    <div class="modhead"><span class="badge" id="mod-badge"></span></div>
    <div class="prog" id="prog"></div>
    <div class="scene" id="scene"></div>
    <div class="nav">
      <button class="btn ghost" id="back" onclick="go(-1)">← <span data-t="back">Back</span></button>
      <button class="btn gold" id="next" onclick="nextOrFinish()"><span data-t="next">Next</span> →</button>
    </div>
    <div id="done-msg" style="display:none;text-align:center;margin-top:12px;color:#1A3D2E;font-weight:600;font-size:14px"></div>
    <button class="btn play" id="play" onclick="togglePlay()">▶ <span data-t="play">Play narrated tour</span></button>
    <div class="scount" id="scount"></div>
  </div>
</div>

<script>
/* ============ content ============
   Each step: k kicker, t title, m mock(optional), x TRIGGER, y YOU DO, z THEN(downstream), n note(optional).
   Any displayed field may include a 2-suffixed Spanish companion (k2,t2,m2,x2,y2,z2,n2). The owner operations guide is bilingual; the older owner module remains English reference material. */
var UI = {
  all:{en:'All',es:'Todo'}, card:{en:'Card',es:'Tarjeta'}, binder:{en:'Print all-roles binder (PDF)',es:'Imprimir manual de todos los roles (PDF)'}, back:{en:'Back',es:'Atrás'}, next:{en:'Next',es:'Siguiente'}, finish:{en:'Finish',es:'Terminar'},

  ownerGuideLink:{en:'Open bilingual guide',es:'Abrir guía bilingüe'},

  wnDone:{en:'✓ You are up to date on this training.',es:'✓ Estás al día con esta capacitación.'},
  doneMsg:{en:'Training completed — thank you! Your owner can see this in the compliance view.',es:'Capacitación completada — ¡gracias! Tu dueño puede verlo en el panel de cumplimiento.'}

var ROLES = [
  { key:'owner',   ic:'◎',  full:true, en:'Owner — operations guide + narrated tour', es:'Dueña — guía de operaciones + tour narrado', den:'Start with the current bilingual operations guide. The narrated owner tour below is older reference material; verify actions in the current Hub.', des:'Empieza con la guía bilingüe actual. El recorrido narrado de la dueña es material de referencia anterior; verifica las acciones en el Hub actual.' },
  { key:'kitchen', ic:'🍳', en:'Kitchen', es:'Cocina', den:'Your board, per-bowl prep with PIN, inventory, checklists, Creative Studio, EOD.', des:'Tu tablero, preparación por bowl con PIN, inventario, listas, Creative Studio, EOD.' },
  { key:'driver',  ic:'🚚', en:'Driver', es:'Conductor', den:'Accept a run, confirm pickup, deliver with proof, report problems, expenses, EOD.', des:'Aceptar una ruta, confirmar recogida, entregar con prueba, reportar problemas, gastos, EOD.' },
  { key:'marketing', ic:'📈', en:'Marketing expert', es:'Experta en marketing', den:'The marketing workspace, the daily run, affiliates, the site’s own words, and how you send Dayan what you find.', des:'El espacio de marketing, la ronda diaria, afiliados, los textos del sitio, y cómo le envías a Dayan lo que encuentras.' },
  { key:'vendor',  ic:'📦', en:'Vendor', es:'Proveedor', den:'Receive purchase orders, acknowledge, and confirm what you delivered.', des:'Recibir órdenes de compra, confirmar y marcar lo entregado.' }
];

function S(o){ return o; }
var MOD = {
  owner: [
    S({k:'Welcome',t:'Your owner operations guide',m:'<div class="m-nav"><span class="on"><i>◎</i>Overview</span><span><i>🚚</i>Deliveries</span><span><i>🍳</i>Kitchen</span><span><i>💵</i>Finance</span><span><i>📈</i>Marketing</span></div>',
      x:'You are opening the owner area of Añejo Hub.',
      y:'Use the bilingual guide above to open the current daily routes for requests, kitchen, deliveries, finance, marketing, and end of day.',
      z:'The narrated owner lessons below are older English reference material. Use the guide above for the current daily route.',
      t2:'Tu guía de operaciones para la dueña', x2:'Estás en el área de dueña de Añejo Hub.',
      y2:'Usa la guía bilingüe de arriba para abrir las rutas actuales de solicitudes, cocina, entregas, finanzas, marketing y cierre del día.',
      z2:'Las lecciones narradas de abajo son material bilingüe de referencia anterior. Usa la guía de arriba para la rutina diaria actual.',
      k2:"Bienvenida",
      m2:"<div class=\"m-nav\"><span class=\"on\"><i>◎</i>Resumen</span><span><i>🚚</i>Entregas</span><span><i>🍳</i>Cocina</span><span><i>💵</i>Finanzas</span><span><i>📈</i>Marketing</span></div>"
    }),
    S({k:'The big picture',t:'How one order flows, end to end',
      x:'A customer checks out on the public site (Square handles payment) — or you take a manual order.',
      y:'Nothing — you just watch it move. But know the path so you can spot a stuck order.',
      z:'Square’s webhook marks the order paid → it appears on the Kitchen board → kitchen preps & marks ready → you assign a driver → driver confirms pickup, delivers with a photo → the customer is texted at each step → the order is fulfilled.',
      k2:"Vista general",
      t2:"El recorrido completo de un pedido",
      x2:"Un cliente paga en el sitio público (Square procesa el pago), o tú ingresas un pedido manual.",
      y2:"No tienes que hacer nada: solo observar cómo avanza. Pero aprende el recorrido para detectar si un pedido se atasca.",
      z2:"El webhook de Square marca el pedido como pagado → aparece en el tablero de Cocina → el equipo lo prepara y lo marca listo → asignas un conductor → el conductor confirma la recogida y entrega con una foto → el cliente recibe un mensaje de texto en cada paso → el pedido queda completado."
    }),
    S({k:'Overview',t:'Command Center — your morning glance',m:'<div class="m-card"><div class="m-t">Today</div><div class="m-s">12 orders · 3 routes · 2 open alerts</div></div>',
      x:'Opens the moment you land on /hub/owner.',
      y:'Scan the tiles (orders, deliveries, alerts) and the Activity feed; tap Expand for the full log.',
      z:'Open alerts here are raised automatically by the system (see the Alerts step). The feed is your audit trail of everything happening.',
      k2:"Resumen",
      t2:"Centro de mando: vistazo de la mañana",
      x2:"Se abre al llegar a /hub/owner.",
      y2:"Revisa los mosaicos (pedidos, entregas y alertas) y el registro de Actividad; toca Expandir para ver el historial completo.",

    S({k:'Orders',t:'The order lifecycle',m:'<div class="m-card"><span class="m-b">pending</span> → <span class="m-b">paid</span> → <span class="m-b win">prep</span> → <span class="m-b ok">ready</span> → fulfilled</div>',

      m2:"<div class=\"m-card\"><span class=\"m-b\">pendiente</span> → <span class=\"m-b\">pagado</span> → <span class=\"m-b win\">preparación</span> → <span class=\"m-b ok\">listo</span> → completado</div>"
    }),
    S({k:'Orders — fixing one',t:'Cancel and Refund are two different acts',m:'<div class="m-card"><div class="m-t">Order #1042 <span class="m-b crit">canceled</span></div><div class="m-s">$48.00 still held from the customer</div></div>',
      x:'A customer calls to cancel, or an order has to be undone.',
      y:'Open the order in Orders. “Cancel this order” stops the food. “Refund” gives money back through Square. They are two separate buttons and you usually need BOTH.',
      z:'Cancelling moves no money — the customer stays charged until you refund. The refunded / still-refundable figures are read live from Square, not from our own records, so what you see is what Square is actually holding. A card refund normally reads PENDING and settles over a few days, and it cannot be undone from the HUB.',
      n:'Cancelling does NOT kill the Square payment link. If the customer pays it afterwards, the system reopens the order as PAID and raises a critical alert — at that point you either make the food or refund it. Never treat a cancelled order as closed money.',
      k2:"Pedidos: resolver un caso",
      t2:"Cancelar y reembolsar son dos acciones distintas",
      x2:"Un cliente llama para cancelar o hay que anular un pedido.",
      y2:"Abre el pedido en Pedidos. «Cancelar este pedido» detiene la preparación. «Reembolsar» devuelve el dinero mediante Square. Son dos botones separados y, por lo general, debes usar ambos.",
      z2:"Cancelar no mueve el dinero: al cliente se le sigue cobrando hasta que emitas el reembolso. Las cantidades reembolsadas y aún reembolsables se consultan en vivo en Square, no en nuestros registros; lo que ves es lo que Square realmente retiene. Un reembolso a tarjeta suele aparecer PENDIENTE y liquidarse en unos días; no se puede deshacer desde el HUB.",
      n2:"Cancelar NO anula el enlace de pago de Square. Si el cliente paga después, el sistema vuelve a abrir el pedido como PAGADO y genera una alerta crítica. En ese momento debes preparar la comida o reembolsar el pago. Nunca consideres que un pedido cancelado deja de tener consecuencias financieras.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">Pedido #1042 <span class=\"m-b crit\">cancelado</span></div><div class=\"m-s\">Aún se retienen $48.00 del cliente</div></div>"
    }),
    S({k:'Menu',t:'The menu desk — you change your own prices',m:'<div class="m-card"><div class="m-t">VIDA bowl · $16.00 → $17.00</div><div class="m-s"><span class="m-b ok">the site reads this menu</span></div></div>',
      x:'You want to change a price, hide an item, or add something to the menu.',
      y:'Owner → Menu. Read the banner at the top FIRST. Green “the site reads this menu” = confirmed live end to end. RED means your save changes nothing — fix that before touching a price. AMBER means read it: some ambers say the price IS already live but customers are still shown the old one, and one just means a check could not run. Never assume amber = not applied. Then edit the price and Save.',

      x2:"Quieres cambiar un precio, ocultar un producto o añadir algo al menú.",
      y2:"Propietaria → Menú. PRIMERO lee el aviso superior. El indicador verde «el sitio lee este menú» significa que está confirmado y activo de extremo a extremo. ROJO significa que guardar no cambia nada: resuelve eso antes de tocar un precio. ÁMBAR significa que debes leer el aviso: algunos indican que el precio ya está activo pero los clientes aún ven el anterior; otro solo significa que no se pudo completar una verificación. Nunca supongas que ámbar significa que no se aplicó. Luego edita el precio y guarda.",
      z2:"El siguiente pedido cobra de inmediato un precio guardado: no hace falta publicar ni pedir ayuda a un desarrollador. Los clientes lo ven en aproximadamente un minuto (el menú se almacena en caché en el borde durante 60 segundos). Cada cambio queda registrado en el historial de Cambios con quién lo hizo y cuándo.",

      m2:"<div class=\"m-card\"><div class=\"m-t\">Bowl VIDA · $16.00 → $17.00</div><div class=\"m-s\"><span class=\"m-b ok\">el sitio lee este menú</span></div></div>"
    }),
    S({k:'Customers',t:'Your CRM',m:'<div class="m-card"><div class="m-t">Maria G. <span class="m-b ok">subscribed</span></div><div class="m-s">orders · subscription · daily schedule</div></div>',
      x:'Every checkout (guest or member) creates/updates a customer record automatically.',

    S({k:'B2B accounts',t:'Contract accounts (offices & corporate)',m:'<div class="m-card"><div class="m-t">DGP · Delray <span class="m-b" style="background:#1b3a2b;color:#fff">Contract</span></div><div class="m-s">daily head count → auto order → invoiced</div></div>',
      x:'A business signs up at /business — or you sign one yourself on the phone and enter it with 🏢 Onboard a new account at the top of Customers → 🏢 Contract accounts. Either way it lands PENDING. You set the negotiated price + terms and press Activate: that is the step that turns their ordering link on.',
      y:'Give each office its private link (bilingual EN/ES, branded). Their contact enters their name + a head count and verifies once with a 6-digit code we text them (that device is then trusted for one-tap days after). They also get an SMS receipt with a confirmation number, see allergy notes + a live “this month” tracker, and you can “Generate invoice” at period close (weekly/biweekly/monthly). Opened a second clinic? “➕ Add a location” on the account mints its link and copies the terms you already agreed — it never opens at $0.',
      z:'Every submission is identity-verified and written to an append-only audit trail (who, when, count, conf#) — so nobody can later say “I never ordered that.” Each count auto-creates a Contract kitchen order (count × price + delivery, + rush fee past cut-off) with allergies as a red ⚠ line; the ledger rolls into a branded invoice. Use 📊 Pricing to price on real margins.',
      k2:"Cuentas comerciales",
      t2:"Cuentas por contrato (oficinas y empresas)",
      x2:"Una empresa se registra en /business, o puedes registrarla por teléfono y añadirla con 🏢 Incorporar cuenta nueva al principio de Clientes → 🏢 Cuentas por contrato. En ambos casos queda PENDIENTE. Define el precio y las condiciones negociadas y pulsa Activar: ese paso habilita su enlace de pedidos.",
      y2:"Entrega a cada oficina su enlace privado (bilingüe EN/ES y con la marca). Su contacto ingresa el nombre y el conteo de personas, y verifica una vez con un código de 6 dígitos que enviamos por texto (ese dispositivo queda reconocido para usarlo con un toque durante varios días). También recibe un comprobante por SMS con número de confirmación, ve las notas de alergias y un indicador en vivo de «este mes»; al cierre del período puedes usar «Generar factura» (semanal, quincenal o mensual). ¿Abrieron otra clínica? «➕ Añadir ubicación» en la cuenta crea su enlace y copia las condiciones acordadas: nunca se activa con precio $0.",
      z2:"Cada envío verifica la identidad y se guarda en un registro de auditoría que no se puede modificar (quién, cuándo, conteo y número de confirmación), para evitar disputas sobre si se hizo el pedido. Cada conteo crea automáticamente un pedido contractual para cocina (conteo × precio + entrega, + cargo urgente después de la hora límite) con las alergias destacadas en rojo ⚠; el registro se incorpora a una factura con la marca. Usa 📊 Precios para calcular márgenes reales.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">DGP · Delray <span class=\"m-b\" style=\"background:#1b3a2b;color:#fff\">Contrato</span></div><div class=\"m-s\">conteo diario → pedido automático → facturado</div></div>"
    }),
    S({k:'Changing terms',t:'Every term on an account is yours to change',m:'<div class="m-card"><div class="m-t">✏️ Edit terms — Delray Beach</div><div class="m-s">Mon Tue Wed · 11:30–12:30 · $6.00</div></div>',
      x:'They renegotiate, move to different days, change suites, or want to pause a location for a month.',
      y:'Open ✏️ Edit terms on that location. Everything the card shows is editable: price, delivery fee, rush fee and cut-off, the delivery DAYS (tap the day chips), the delivery time the office sees, lunch-or-dinner, the full address, and an “Accepting head counts” switch that pauses just that clinic. Add a note (“renegotiated on the 7/25 call”) so the history reads like a story later.',
      z:'New terms apply to the NEXT head count only — days already submitted keep the price they were quoted, so nothing is ever re-priced behind the client. Every change is written to Terms history with who changed it and what it was before. Change an address and the router re-locates it automatically. Pause a location and its link stops accepting counts until you switch it back on.',
      k2:"Cambiar condiciones",
      t2:"Tú decides cada condición de una cuenta",
      x2:"El cliente renegocia, cambia los días, se muda de oficina o quiere pausar una ubicación durante un mes.",
      y2:"Abre ✏️ Editar condiciones en esa ubicación. Puedes editar todo lo que muestra la tarjeta: precio, tarifa de entrega, recargo urgente y hora límite; los DÍAS de entrega (toca los días); la hora de entrega que ve la oficina; almuerzo o cena; la dirección completa; y el interruptor «Aceptar conteos», que pausa solo esa clínica. Añade una nota (por ejemplo, «renegociado en la llamada del 25/7») para que el historial cuente lo sucedido.",
      z2:"Las nuevas condiciones se aplican ÚNICAMENTE al SIGUIENTE conteo. Los días ya enviados conservan el precio cotizado, sin cambios retroactivos. Cada cambio queda en el historial de Condiciones con quién lo hizo y el valor anterior. Si cambias una dirección, el sistema actualiza la ruta automáticamente. Si pausas una ubicación, su enlace deja de aceptar conteos hasta que vuelvas a activarlo.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">✏️ Editar condiciones — Delray Beach</div><div class=\"m-s\">Lun Mar Mié · 11:30–12:30 · $6.00</div></div>"
    }),
    S({k:'Weekly menus',t:'The weekly office menu and per-dish prices',m:'<div class="m-card"><div class="m-t">🍽️ Weekly menu <span class="m-b ok">this week · week 1</span></div><div class="m-s">Mon · dish · Spanish name · notes · $ blank = location price</div></div>',
      x:'You have settled what an office account eats each day, how many weeks it rotates, and whether any dish is priced differently from the location’s usual price per lunch.',
      y:'Customers → 🏢 Contract accounts → open 🍽️ Weekly menu & per-dish prices on the account. Choose how many weeks rotate (1–8) and the Monday that is week 1. For each week, fill in the dish for every day the locations receive lunch: the name, a Spanish name if you want one, and notes such as allergens or sides. Leave the $ box blank to charge the location’s price; type a price only for a dish that should cost something different. Save. The panel tells you which week is this week and next week, and the table under it shows the next two weeks for each location — dish, the price per lunch that will be charged, and any day the kitchen is closed.',
      z:'The week changes every Monday. A blank day keeps the old “Lunch — Day” name at the location’s price. The dish name goes on the kitchen order and the office’s count page (in Spanish when they read in Spanish) — offices never see a price. A dish price applies from the next head count on; a day already counted keeps the price it was quoted, and the invoice follows what was charged. Every menu change and every price change is written to Terms history with who and when.',
      k2:"Menús semanales",
      t2:"Menú semanal de oficina y precios por plato",
      x2:"Ya acordaste qué come una cuenta de oficina cada día, cuántas semanas dura la rotación y si algún plato tiene un precio distinto del precio habitual por almuerzo en esa ubicación.",
      y2:"Clientes → 🏢 Cuentas por contrato → abre 🍽️ Menú semanal y precios por plato en la cuenta. Elige cuántas semanas se rotan (1–8) y el lunes que inicia la semana 1. Para cada semana, completa el plato de cada día que las ubicaciones reciben almuerzo: el nombre, un nombre en español si lo deseas y notas como alérgenos o acompañamientos. Deja vacío el campo $ para cobrar el precio de la ubicación; escribe un precio solo si ese plato debe costar algo diferente. Guarda. El panel indica qué semana es esta y cuál es la próxima; la tabla muestra las dos semanas siguientes por ubicación, con plato, precio por almuerzo y días en que cocina estará cerrada.",
      z2:"La semana cambia cada lunes. Si dejas un día vacío, se mantiene el nombre anterior «Almuerzo — Día» y el precio de la ubicación. El plato aparece en el pedido de cocina y en la página de conteo de la oficina (en español si la persona usa español); las oficinas nunca ven el precio. El precio de un plato se aplica desde el siguiente conteo; un día ya contado conserva el precio cotizado y la factura refleja lo cobrado. Cada cambio de menú o precio queda en el historial de Condiciones con quién lo hizo y cuándo.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">🍽️ Menú semanal <span class=\"m-b ok\">esta semana · semana 1</span></div><div class=\"m-s\">Lun · plato · nombre en español · notas · $ vacío = precio de la ubicación</div></div>"
    }),
    S({k:'Deliveries',t:'Build & assign a route',m:'<div class="m-card"><div class="m-t">Route · 4 stops · $26</div><div class="m-s">⚡ Suggest → Assign</div></div>',
      x:'You open Deliveries; ready/paid orders for the date show as unassigned.',
      y:'Hands-off option: turn on 🤖 Automated dispatch and the HUB runs through each window (lunch + dinner, never mixed), batching orders and only sending a route once it hits your “min stops” (protects margin + makes the trip worth the driver’s pay) — or sooner if an order nears “max wait” (freshness) or the window’s closing. It OFFERS each route to a driver itself; or click “⚡ Auto-build now”. Prefer manual? “⚡ Suggest efficient route(s)” previews each route (stops, miles, finish, pay, and an AI-Ops reason) to assign with one tap.',
      z:'Driver pay = base + per-stop + per-mile, floored at a route minimum — set rates under 💵 Driver pay settings. The offer shows pay/miles/ETA up front. On payday, Finance → 💵 Driver payouts shows who’s owed what; one tap marks a driver paid.',
      k2:"Entregas",
      t2:"Crear y asignar una ruta",
      x2:"Abres Entregas; los pedidos pagados y listos para la fecha aparecen sin asignar.",
      y2:"Opción automática: activa 🤖 Despacho automático. El HUB revisa cada horario (almuerzo y cena, nunca mezclados), agrupa pedidos y envía una ruta cuando alcanza el «mínimo de paradas» (protege el margen y hace que el viaje valga la paga del conductor), o antes si un pedido se acerca al «tiempo máximo de espera» (frescura) o se cierra el horario. El HUB OFRECE cada ruta a un conductor, o puedes pulsar «⚡ Crear ruta ahora». ¿Prefieres hacerlo manualmente? «⚡ Sugerir rutas eficientes» muestra las rutas (paradas, millas, hora de llegada, paga y motivo de AI Ops) para que asignes una con un toque.",
      z2:"La paga del conductor = base + tarifa por parada + tarifa por milla, con un mínimo por ruta. Configura las tarifas en 💵 Configuración de paga de conductores. La oferta muestra por adelantado la paga, las millas y la hora estimada. El día de pago, Finanzas → 💵 Pagos a conductores muestra cuánto se debe a cada persona; un toque la marca como pagada.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">Ruta · 4 paradas · $26</div><div class=\"m-s\">⚡ Sugerir → Asignar</div></div>"
    }),

    S({k:'Timesheet',t:'Hours, breaks & pay — the weekly timesheet',m:'<div class="m-card"><div class="m-t">🕒 Mon – Sun · 38h 20m worked</div><div class="m-s"><span class="m-b crit">forgotten clock-out</span> <span class="m-b">edited</span></div></div>',
      x:'Kitchen and drivers clock in, tap Start/End break, and clock out. A pay week runs Monday to Sunday, Eastern time.',
      y:'In Staff, set how each person is paid — Hourly (with their $/hr rate) or Per route — and their employment type. Then open 🕒 Timesheet & hours: check each shift, Fix a wrong time or Close a forgotten clock-out (a reason is required), and Download payroll CSV for the week.',
      z:'Hourly pay is estimated only for hourly staff. A per-route driver shows hours but is paid by their routes, so no one is paid twice — and if you switch a driver to hourly, the timesheet warns you their routes still carry route pay in Payouts. Every rate change and every shift correction is recorded: who, when, why, old and new.',
      k2:"Hoja de horas",
      t2:"Horas, descansos y paga: hoja semanal de horas",
      x2:"El personal de cocina y los conductores marcan entrada, inician/terminan descansos y marcan salida. La semana de paga va de lunes a domingo, hora del Este.",
      y2:"En Personal, define cómo se paga a cada persona: por hora (con tarifa $/hora) o por ruta, y su tipo de empleo. Luego abre 🕒 Hoja de horas: revisa cada turno, corrige una hora errónea o cierra una salida olvidada (se requiere un motivo), y descarga el CSV de nómina semanal.",
      z2:"La paga por hora solo se estima para el personal remunerado por hora. Un conductor que cobra por ruta ve sus horas, pero recibe el pago por sus rutas para evitar pagarle dos veces. Si cambias a un conductor a pago por hora, la hoja de horas te advierte que sus rutas siguen teniendo paga por ruta en Pagos. Todo cambio de tarifa y corrección de turno queda registrado: quién, cuándo, por qué, valor anterior y nuevo.",
      m2:"<div class=\"m-card\"><div class=\"m-t\">🕒 Lun–dom · 38 h 20 min trabajadas</div><div class=\"m-s\"><span class=\"m-b crit\">salida olvidada</span> <span class=\"m-b\">editado</span></div></div>"
    }),

    S({k:'Finance',t:'Sales, tips & payouts',m:'<div class="m-card"><div class="m-t">$1,840 sales today</div><div class="m-s">$72 driver tips · trainer rev-share $46</div></div>',

    S({k:'QuickBooks',t:'Send an invoice to the books',m:'<div class="m-card"><div class="m-t">📗 QuickBooks <span class="m-b" style="background:#2c6b3f;color:#fff">connected</span></div><div class="m-s">invoice DGP-0001 → sent</div></div>',
      x:'You (or your bookkeeper) want contract invoices in QuickBooks instead of re-keyed by hand.',
      y:'Finance → QuickBooks → Connect, and approve it on Intuit’s screen. After that, any contract invoice has a “📗 Send to QuickBooks” button on its page.',
      z:'It creates the customer the first time — or reuses the one your bookkeeper already made, so you never end up with two of the same client. An invoice already sent says so and cannot be sent twice, because a duplicate in their books reads as being billed twice. This is an EXTRA COPY for the books: invoices still generate, email and mark paid here whether or not QuickBooks is ever connected, and the HUB stays the record of what a client owes.',
      k2:"QuickBooks",
      t2:"Enviar una factura a contabilidad",
      x2:"Tú o tu contador quieren que las facturas de contratos lleguen a QuickBooks sin volver a escribirlas manualmente.",
      y2:"Finanzas → QuickBooks → Conectar y autoriza el acceso en la pantalla de Intuit. Después, cada factura contractual tendrá un botón «📗 Enviar a QuickBooks».",
      z2:"La primera vez crea al cliente; luego reutiliza el registro que ya creó tu contador, para evitar duplicados. La factura ya enviada queda marcada y no se puede enviar otra vez, porque un duplicado parecería un segundo cobro. Es una COPIA ADICIONAL para contabilidad: las facturas se siguen generando, enviando por correo y marcando pagadas aquí, tanto si conectas QuickBooks como si no. El HUB sigue siendo el registro de lo que debe cada cliente.",

    S({k:'Deliver',t:'Mark delivered',
      x:'You drop off the goods.',
      y:'Mark the PO delivered (and note any partials).',
      z:'The kitchen receives it against inventory, which clears the low-stock alert and updates on-hand counts.',
      t2:'Entregar: marcar entregado', x2:'Dejas la mercancía.', y2:'Marca la orden entregada (y anota parciales).', z2:'La cocina la recibe contra el inventario, lo que cierra la alerta de bajo stock y actualiza las existencias.'}),
    S({k:'If it looks empty',t:'No orders showing? Check you are still signed in',m:'<div class="m-card"><div class="m-t">You have been signed out</div><div class="m-s">Sign in again</div></div>',
      x:'You open your page and see no purchase orders at all.',
      y:'Look for a “You have been signed out” card. If it is there, press Sign in again.',
      z:'An expired session empties every screen, which looks exactly like having no orders. If that card is NOT showing, there genuinely is nothing waiting on you.',
      t2:'Si se ve vacío: revisa si tu sesión sigue abierta', x2:'Abres tu página y no ves ninguna orden de compra.', y2:'Busca el aviso “Se cerró tu sesión”. Si aparece, vuelve a iniciar sesión.', z2:'Una sesión expirada vacía todas las pantallas, igual que no tener órdenes. Si ese aviso NO aparece, de verdad no hay nada pendiente.'})
  ]
};

/* ============ engine ============ */
var lang='en', role=null, idx=0;
function qRole(){ try{ var m=/[?&]role=([a-z]+)/.exec(location.search); return m && MOD[m[1]] ? m[1] : null; }catch(e){ return null; } }
function L(o,f){ return (lang==='es' && o[f+'2']) ? o[f+'2'] : o[f]; }
function voOf(o){ return L(o,'t')+'. '+UI.trig[lang]+': '+L(o,'x')+' '+UI.you[lang]+': '+L(o,'y')+' '+UI.then[lang]+': '+L(o,'z'); }

/* narrated autoplay */
var playing=false, seq=0;
function tts(){ return 'speechSynthesis' in window; }
function pickVoice(l){ try{ var v=speechSynthesis.getVoices()||[]; var p=l==='es'?'es':'en'; return v.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(p)===0;}).sort(function(a,b){return (b.localService?1:0)-(a.localService?1:0);})[0]||null; }catch(e){ return null; } }
function paintPlay(){ var b=document.getElementById('play'); if(b) b.innerHTML=(playing?'⏸ ':'▶ ')+'<span>'+(playing?UI.pause[lang]:UI.play[lang])+'</span>'; }
function speakCur(){
  if(!playing||!role) return; seq++; var my=seq, adv=false;
  var sc=MOD[role][idx];
  function go2(){ if(adv||!playing||my!==seq) return; adv=true; if(idx<MOD[role].length-1) go(1); else stopPlay(); }
  var txt=voOf(sc); var t=setTimeout(go2, Math.max(5000,txt.length*55)+1600);
  if(tts()){ try{ speechSynthesis.cancel(); }catch(e){}
    var u=new SpeechSynthesisUtterance(txt); u.lang=lang==='es'?'es-ES':'en-US'; var v=pickVoice(lang); if(v)u.voice=v; u.rate=0.98;
    u.onend=function(){ clearTimeout(t); go2(); };
    setTimeout(function(){ if(playing&&my===seq){ try{ speechSynthesis.speak(u);}catch(e){} } },90);
  }
}
function startPlay(){ playing=true; render(); }
function stopPlay(){ playing=false; seq++; try{ if(tts()) speechSynthesis.cancel(); }catch(e){} var s=document.getElementById('scene'); if(s)s.classList.remove('playing'); paintPlay(); }
function togglePlay(){ playing?stopPlay():startPlay(); }
if(tts()){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){} }

function setLang(l){ lang=l; document.getElementById('en').className=l==='en'?'on':''; document.getElementById('es').className=l==='es'?'on':''; document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(UI[k]) el.textContent=UI[k][l]; }); if(role) render(); else renderLand(); }
function go(d){ if(!role) return; var n=MOD[role].length; idx=Math.max(0,Math.min(n-1,idx+d)); render(); }

function renderLand(){
  document.getElementById('pick').innerHTML = ROLES.map(function(r){
    return '<a class="'+(r.full?'full':'')+'" href="?role='+r.key+'"><span class="ic">'+r.ic+'</span><span><span class="tt">'+r[lang]+'</span><span class="ds">'+r['d'+lang]+'</span></span></a>';
  }).join('');
}
/* "What's new" — the change this module's CURRENT version introduced, shown ABOVE the tutorial so a
   staffer sent here by the sign-in gate reads the new procedure before the walkthrough she may have
   already seen. It stays visible after completion: this is where you come back to re-read it.
   The sentences arrive from /api/hub/training/status already written in both languages
   (functions/_lib/training_modules.js) — this page picks the one matching its own EN/ES toggle. */
var _update = null, _upToDate = false;
function wnPick(o){ return (o && (lang==='es' ? o.es : o.en)) || (o && o.en) || ''; }
function renderWhatsNew(){
  var box=document.getElementById('whatsnew'); if(!box) return;
  if(!_update){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = '<div class="wn-k">★ '+UI.whatsnew[lang]+'</div>'+
    '<h3>'+wnPick(_update.headline)+'</h3>'+
    '<p style="margin:0 0 9px;font-size:13px;color:var(--muted)">'+UI.wnRead[lang]+'</p>'+
    '<ul>'+(_update.changes||[]).map(function(c){ return '<li>'+wnPick(c)+'</li>'; }).join('')+'</ul>'+
    (_upToDate ? '<p class="wn-done">'+UI.wnDone[lang]+'</p>' : '');
  box.style.display='block';
}

function render(){
  var scenes=MOD[role], n=scenes.length, sc=scenes[idx];
  renderWhatsNew();
  var ownerGuide=document.getElementById('owner-guide-callout');
  if(ownerGuide){
    if(role==='owner'){
      ownerGuide.innerHTML='<div class="wn-k">'+UI.ownerGuideTitle[lang]+'</div><p style="margin:6px 0 0;font-size:14px;line-height:1.5">'+UI.ownerGuideBody[lang]+'</p><a href="/hub/owner/operations-guide.html">'+UI.ownerGuideLink[lang]+'</a>';
      ownerGuide.style.display='block';
    }else{ownerGuide.style.display='none';ownerGuide.innerHTML='';}
  }
  document.getElementById('mod-badge').textContent = (ROLES.filter(function(r){return r.key===role;})[0]||{})[lang] || role;
  document.getElementById('prog').innerHTML = scenes.map(function(_,i){ return '<div class="dot '+(i<idx?'done':i===idx?'cur':'')+'"></div>'; }).join('');
  document.getElementById('scene').innerHTML =
    '<div class="kicker">'+L(sc,'k')+'</div><h3>'+L(sc,'t')+'</h3>'+
    (L(sc,'m')?'<div class="mock">'+L(sc,'m')+'</div>':'')+
    '<div class="blk trig"><span class="lab">⚡ '+UI.trig[lang]+'</span>'+L(sc,'x')+'</div>'+
    '<div class="blk you"><span class="lab">✋ '+UI.you[lang]+'</span>'+L(sc,'y')+'</div>'+
    '<div class="blk then"><span class="lab">➡ '+UI.then[lang]+'</span>'+L(sc,'z')+'</div>'+
    (sc.n?'<div class="note">'+L(sc,'n')+'</div>':'');
  document.getElementById('back').disabled = idx===0;
  var atEnd = idx===n-1;
  document.getElementById('next').querySelector('[data-t="next"]').textContent = atEnd ? (_done[role]?UI.done[lang]:UI.finish[lang]) : UI.next[lang];
  var dm=document.getElementById('done-msg');
  if(dm){ if(atEnd && _done[role]){ dm.textContent=UI.doneMsg[lang]; dm.style.display='block'; } else { dm.style.display='none'; } }
  document.getElementById('scount').textContent = UI.step[lang]+' '+(idx+1)+' '+UI.of[lang]+' '+n;
  document.getElementById('scene').classList.toggle('playing', playing);
  paintPlay();
  if(playing) speakCur();
}
var _done = {};
function nextOrFinish(){ if(role && idx===MOD[role].length-1) finish(); else go(1); }
function finish(){
  if(!role) return;
  var btn=document.getElementById('next'), sp=btn.querySelector('[data-t="next"]');
  btn.disabled=true; if(sp) sp.textContent=UI.finishing[lang];
  fetch('/api/hub/training/complete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({module:role,lang:lang})})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ btn.disabled=false; if(d&&d.ok){ _done[role]=d.completed_at; _upToDate=true; render(); } else if(sp){ sp.textContent=UI.finish[lang]; } })
    .catch(function(){ btn.disabled=false; if(sp) sp.textContent=UI.finish[lang]; });
}
/* One call answers both questions this page asks: what changed in this module, and whether THIS
   reader is current on it. "Completed" is version-aware now — a completion recorded before the
   process changed is not a tick, because she has not seen the new procedure. */
function loadStatus(){
  if(!role) return;
  fetch('/api/hub/training/status?module='+encodeURIComponent(role),{credentials:'include'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d||!d.ok) return;
      _update = d.module_update || null;
      _upToDate = d.state === 'current';
      if(_upToDate && d.completed_at) _done[role]=d.completed_at; else delete _done[role];
      render();
    }).catch(function(){});
}
function boot(){
  role = qRole();
  if(role){ document.getElementById('land').style.display='none'; document.getElementById('stage').style.display='block'; document.getElementById('homelink').style.display='inline';
    var cl=document.getElementById('cardlink'); cl.href='/hub/training-card?role='+role; cl.style.display='inline'; }
  else { document.getElementById('land').style.display='block'; document.getElementById('stage').style.display='none'; }
  /* Open in the language the reader already set on the HUB (the same anejo:lang the shared i18n
     engine persists). This page kept its own toggle and always opened in English, so the sign-in
     gate would speak to the cook in Spanish and then hand her an English tutorial. setLang paints
     the toggle and renders, so it replaces the explicit first render. */
  var pref='en';
  try { pref = localStorage.getItem('anejo:lang') === 'es' ? 'es' : 'en'; } catch(e){ /* storage off — English */ }
  setLang(pref);
}
boot();
if(role) loadStatus();
</script>
