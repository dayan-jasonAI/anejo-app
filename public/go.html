<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<meta name="theme-color" content="#071207">
<title>Añejo Catering Co. — Links</title>
<meta name="description" content="Order Añejo bowls, build your macro plan, or book catering — Palm Beach County.">
<link rel="canonical" href="https://anejocateringco.com/go">
<!-- The bio page must never rank over the real pages it points at. -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#071207;--bg2:#0a180a;--gold:#C8BC6E;--cream:#F5F2EC;--muted:rgba(245,242,236,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at 50% 18%,var(--bg2) 0%,var(--bg) 70%);color:var(--cream);
  font-family:'Josefin Sans',-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding:48px 24px}
main{width:100%;max-width:420px;text-align:center}
.emblem{height:72px;width:auto;margin:0 auto 14px;display:block}
.wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:8px;font-size:30px;color:var(--gold)}
.tagline{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--muted);margin:8px 0 34px}
.links{display:flex;flex-direction:column;gap:14px}
.btn{display:block;padding:17px 20px;border:1px solid rgba(200,188,110,.45);border-radius:10px;
  color:var(--cream);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
  transition:background .18s,color .18s,border-color .18s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn .sub{display:block;margin-top:4px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;
  font-size:14px;letter-spacing:.5px;text-transform:none;color:var(--muted)}
.btn:hover .sub,.btn:focus-visible .sub{color:rgba(7,18,7,.7)}
footer{margin-top:40px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:center}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<main>
  <img class="emblem" src="/assets/img/emblem.png" alt="Añejo emblem">
  <div class="wordmark">AÑEJO</div>
  <p class="tagline">Cuban soul. Mediterranean discipline.</p>
  <nav class="links" aria-label="Añejo links">
    <a class="btn" href="/l/ig-order">Order Now<span class="sub">Fresh bowls, delivered across Palm Beach County</span></a>
    <a class="btn" href="/l/ig-macro">The Macro Portal<span class="sub">Your free macro plan, built in seconds</span></a>
    <a class="btn" href="/l/ig-catering">Catering &amp; Events<span class="sub">Private events, offices &amp; tastings</span></a>
  </nav>
</main>
<footer>
  <a href="https://anejocateringco.com">anejocateringco.com</a> · Palm Beach County, FL
</footer>
</body>
</html>
