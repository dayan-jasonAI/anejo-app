<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<meta name="theme-color" content="#0D0D0D">
<title>Order Confirmed — Añejo Catering Co.</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--black:#0D0D0D;--green:#1A3D2E;--gold:#C6A85B;--gold-dark:#8B6B3E;--cream:#F5F2EC;--ink:#1A1A1A;--muted:#6b6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Josefin Sans',-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--black);border-bottom:1px solid rgba(198,168,91,.2)}
.nav-inner{max-width:1100px;margin:0 auto;padding:14px 24px}
.logo{display:flex;align-items:center;gap:11px;color:var(--gold);text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:6px;font-size:22px}
.logo-emblem{height:36px;width:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.stack{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.card{max-width:560px;width:100%;text-align:center;background:#fff;border-top:4px solid var(--gold);border:1px solid rgba(26,61,46,.15);border-radius:12px;padding:48px 40px}
.check{width:72px;height:72px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.check svg{width:38px;height:38px;stroke:var(--gold);stroke-width:3;fill:none}
.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:10px}
h1{font-size:32px;font-weight:300;color:var(--green);margin-bottom:14px}
h1 strong{font-weight:600;color:var(--gold-dark)}
p{color:var(--muted);font-size:15px;line-height:1.65;margin-bottom:14px}
.ref{display:inline-block;font-size:12px;letter-spacing:1px;color:var(--green);background:var(--cream);border:1px solid rgba(26,61,46,.15);border-radius:6px;padding:6px 12px;margin:6px 0 18px;font-variant-numeric:tabular-nums}
.btn{display:inline-block;margin-top:8px;padding:13px 28px;border-radius:4px;font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;text-decoration:none;background:var(--gold);color:var(--black)}
.btn:hover{background:var(--green);color:var(--cream)}
/* Push opt-in card — a second, quieter card below the confirmation, never a floating modal.
   Same palette and card shell as the confirmation above; a gold-dark (not gold) top border and
   smaller icon mark it as secondary content, not a second "you're done" moment. */
.push-card{max-width:560px;width:100%;text-align:center;background:#fff;border-top:4px solid var(--gold-dark);border:1px solid rgba(26,61,46,.15);border-radius:12px;padding:32px 34px;min-height:88px}
.push-icon{width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.push-icon svg{width:24px;height:24px;stroke:var(--gold);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.push-eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:8px}
.push-copy{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 6px}
.push-copy--muted{font-size:13px;margin:16px auto 0;padding-top:14px;border-top:1px solid rgba(26,61,46,.1);max-width:400px}
.push-copy a{color:var(--green);font-weight:600;text-decoration:underline}
.push-steps{text-align:left;max-width:360px;margin:14px auto 0;padding-left:22px;color:var(--ink);font-size:14px;line-height:1.7}
.push-steps li{margin-bottom:4px}
.push-btn{display:inline-block;margin-top:14px;padding:13px 26px;border:none;border-radius:4px;font:700 13px/1 'Josefin Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:var(--gold);color:var(--black)}
.push-btn:hover{background:var(--green);color:var(--cream)}
.push-btn:disabled{opacity:.6;cursor:default}
.push-skip{margin-top:8px}
.push-skip-btn{background:none;border:none;color:var(--muted);font:600 11px/1 'Josefin Sans',sans-serif;letter-spacing:1px;text-decoration:underline;cursor:pointer;padding:6px}
</style>
</head>
<body>
<nav><div class="nav-inner"><a href="/" class="logo"><img class="logo-emblem" src="/assets/img/emblem.png" alt="Añejo emblem"><span>AÑEJO</span></a></div></nav>
<main>
  <div class="stack">
    <div class="card">
      <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
      <div class="eyebrow">Thank you</div>
      <h1>Order <strong>received</strong>.</h1>
      <p>We've got it. You'll receive a confirmation by email, and we'll deliver your order in your selected window.</p>
      <div class="ref" id="ref" style="display:none"></div>
      <a href="/" class="btn">Back to home</a>
      <a href="/client/dashboard" class="btn" style="background:transparent;border:1px solid rgba(26,61,46,.25);color:var(--green);margin-left:8px">View my account</a>
    </div>
    <div class="push-card" id="pushCard" aria-live="polite"></div>
  </div>
</main>
<script>
  // Square appends order/transaction params to the redirect; surface a reference if present.
  var qs = new URLSearchParams(location.search);
  var ref = qs.get('orderId') || qs.get('order_id') || qs.get('transactionId') || qs.get('checkoutId');
  if (ref){ var el=document.getElementById('ref'); el.textContent='Reference: '+ref; el.style.display='inline-block'; }
</script>
<script src="/assets/js/consent.js"></script>
<script>
  // GA4 purchase conversion — fires once per order, ONLY after consent (window.gtag exists only
  // post-consent). Value comes from sessionStorage (set on /order before redirect); transaction_id
  // from Square's redirect params. Deduped per transaction so refreshes don't double-count.
  (function(){
    if (!window.gtag) return;
    var qs = new URLSearchParams(location.search);
    var txn = qs.get('orderId')||qs.get('order_id')||qs.get('transactionId')||qs.get('checkoutId')||'';
    var dedup = 'anejo:gaPurchase:'+(txn||'session');
    try { if (localStorage.getItem(dedup)) return; } catch(e){}
    var value, currency='USD';
    try { var po=JSON.parse(sessionStorage.getItem('anejo:pendingOrder')||'null'); if(po){ value=po.value; currency=po.currency||'USD'; } } catch(e){}
    var params = { currency: currency };
    if (txn) params.transaction_id = txn;
    if (typeof value === 'number' && isFinite(value)) params.value = value;
    window.gtag('event','purchase', params);
    try { localStorage.setItem(dedup,'1'); } catch(e){}
    // NOTE: pendingOrder is NOT cleared here (unlike before) — the push opt-in script below reads
    // the same stashed email/sms_consent, and it runs after this block. It clears the key itself
    // once it has read it.
  })();
</script>
<script>
// Order-confirmation push opt-in. Reuses the storefront service worker (public/sw.js), the VAPID
// endpoint (functions/api/push/subscribe.js) and the push-then-SMS pipeline (functions/_lib/
// notify.js, notifications.js) that already exist — this script only wires a button to them.
//
// WHY SESSIONSTORAGE FOR THE EMAIL: Square's hosted checkout redirects back here with only
// order/transaction ids in the query string, never the buyer's contact info. /order stashed it
// (see order.html:checkout()) right before handing off to Square, the same trick already used to
// carry the GA4 purchase value across that redirect. Without it this screen would have no address
// to hand /api/push/subscribe.
(function(){
  var card = document.getElementById('pushCard');
  if (!card) return;

  // Read the persisted choice directly rather than loading the full i18n.js text-node walker on
  // this page: that engine queues any untranslated text node it meets for live translation
  // (functions/api/translate.js), and the "Reference: <order id>" line above is a per-order string
  // containing letters — it would get shipped to the translator fresh on every single order,
  // an unbounded cost for a value that must never actually be translated. Same storage key i18n.js
  // uses ('anejo:lang'), so the language picked at checkout still carries through here.
  function curLang(){ try { return localStorage.getItem('anejo:lang')==='es' ? 'es' : 'en'; } catch(e){ return 'en'; } }
  function L(en, es){ return curLang()==='es' ? es : en; }

  var stash = null;
  try { stash = JSON.parse(sessionStorage.getItem('anejo:pendingOrder') || 'null'); } catch(e){}
  var email = (stash && stash.email) || '';
  var smsConsent = !!(stash && stash.sms_consent);
  try { sessionStorage.removeItem('anejo:pendingOrder'); } catch(e){}

  var ua = navigator.userAgent || '';
  // iOS blocks web push for any browser that is not running as an installed Home Screen app —
  // Apple requires every iOS browser (Chrome, Firefox, Edge included) to run on WebKit and applies
  // this restriction at the OS level, not the "Safari" brand level, so detecting the OS is what
  // actually matters here. iPadOS 13+ reports itself as "Macintosh" but exposes touch points a
  // real Mac never has, which is the only reliable way to tell the two apart.
  var isIOS = /iP(hone|od|ad)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var pushCapable = ('serviceWorker' in navigator) && ('PushManager' in window) && (typeof Notification !== 'undefined');

  var BELL = '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 14.5 18 8z"/><path d="M13.73 20a2 2 0 01-3.46 0"/></svg>';
  var SHARE = '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';

  function urlB64ToUint8(str){
    var pad = '='.repeat((4 - (str.length % 4)) % 4);
    var raw = atob((str + pad).replace(/-/g,'+').replace(/_/g,'/'));
    var out = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // What the customer will actually hear from, whenever push does NOT end up on. This mirrors
  // the real server-side order (functions/_lib/notify.js: consented phone, else email) so the
  // promise made here is never one the backend can't keep.
  function fallbackHtml(){
    if (smsConsent) {
      return L(
        "No problem — we'll text you the same order updates at the number you gave us.",
        'No hay problema — te enviaremos las mismas actualizaciones de tu pedido por mensaje de texto al número que nos diste.'
      );
    }
    return L(
      'No problem — we\'ll email you as your order status changes. Prefer texts? <a href="/sms">Opt in for text updates →</a>',
      'No hay problema — te avisaremos por correo cuando cambie el estado de tu pedido. ¿Prefieres mensajes de texto? <a href="/sms">Actívalos aquí →</a>'
    );
  }

  function showFallback(reason){
    // A failure here must never look like nothing happened — it always lands on a channel the
    // customer can see is still covered.
    if (reason) console.warn('[anejo] push opt-in fell back to SMS/email:', reason);
    card.innerHTML =
      '<p class="push-copy push-copy--muted" style="margin-top:0;padding-top:0;border-top:none">' + fallbackHtml() + '</p>';
  }

  function showSuccess(){
    card.innerHTML =
      '<div class="push-icon">' + CHECK + '</div>' +
      '<p class="push-copy">' + L("You're set — we'll notify you right here the moment your order status changes.", 'Listo — te avisaremos aquí mismo en cuanto cambie el estado de tu pedido.') + '</p>';
  }

  function showIOSInstructions(){
    card.innerHTML =
      '<div class="push-icon">' + SHARE + '</div>' +
      '<div class="push-eyebrow">' + L('Turn on order notifications','Activa las notificaciones de tu pedido') + '</div>' +
      '<p class="push-copy">' + L('iPhone only allows order alerts for sites added to your Home Screen — here\'s how:', 'iPhone solo permite alertas de pedido en sitios agregados a tu pantalla de inicio — así se hace:') + '</p>' +
      '<ol class="push-steps">' +
        '<li>' + L('Tap the <strong>Share</strong> icon in your browser toolbar.', 'Toca el ícono de <strong>Compartir</strong> en la barra de tu navegador.') + '</li>' +
        '<li>' + L('Choose <strong>Add to Home Screen</strong>.', 'Elige <strong>Agregar a pantalla de inicio</strong>.') + '</li>' +
        '<li>' + L('Open Añejo from your Home Screen, then turn notifications on there.', 'Abre Añejo desde tu pantalla de inicio y activa las notificaciones ahí.') + '</li>' +
      '</ol>' +
      '<p class="push-copy push-copy--muted">' + fallbackHtml() + '</p>';
  }

  function showPrompt(){
    card.innerHTML =
      '<div class="push-icon">' + BELL + '</div>' +
      '<div class="push-eyebrow">' + L('Stay in the loop','Mantente al tanto') + '</div>' +
      '<p class="push-copy">' + L("Turn on notifications and we'll let you know the moment your order is on the way and when it's delivered.", 'Activa las notificaciones y te avisaremos en cuanto tu pedido salga y cuando sea entregado.') + '</p>' +
      '<button id="pushBtn" type="button" class="push-btn">' + L('Enable order notifications','Activar notificaciones') + '</button>' +
      '<div class="push-skip"><button id="pushSkip" type="button" class="push-skip-btn">' + L('Not now','Ahora no') + '</button></div>';
    document.getElementById('pushBtn').addEventListener('click', enable);
    document.getElementById('pushSkip').addEventListener('click', function(){ showFallback('customer declined'); });
  }

  function enable(){
    var btn = document.getElementById('pushBtn');
    if (btn) { btn.disabled = true; btn.textContent = L('Enabling…','Activando…'); }
    if (!email) { showFallback('no stashed email — cannot register a subscription without one'); return; }

    // Wrapped because the very first call can throw SYNCHRONOUSLY rather than reject: Safari
    // before 16 implements requestPermission() in its older callback form, which returns undefined,
    // and `.then` on undefined is a TypeError that no .catch below would ever see. The visible
    // symptom is a button stuck on "Enabling…" forever — the one outcome this card must not have.
    try {
    Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') return Promise.reject(new Error('permission ' + perm));
      return fetch('/api/push/subscribe').then(function(r){ return r.json(); }).then(function(cfg){
        if (!cfg || !cfg.configured || !cfg.vapid_public_key) return Promise.reject(new Error('not configured'));
        return navigator.serviceWorker.register('/sw.js').then(function(){
          return navigator.serviceWorker.ready;
        }).then(function(reg){
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8(cfg.vapid_public_key),
          });
        }).then(function(sub){
          return fetch('/api/push/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, subscription: sub.toJSON() }),
          }).then(function(r){ if (!r.ok) return Promise.reject(new Error('save failed')); });
        });
      });
    }).then(function(){
      showSuccess();
    }).catch(function(err){
      // Whatever went wrong — permission denied, unsupported mid-flow, VAPID not configured yet,
      // a network hiccup — the customer still needs an answer, not a stuck "Enabling…" button.
      showFallback((err && err.message) || 'push enable failed');
    });
    } catch (err) {
      showFallback('requestPermission threw synchronously: ' + ((err && err.message) || err));
    }
  }

  if (!email) {
    // Nothing to subscribe (no stashed contact — e.g. this screen was opened directly, or the
    // browser cleared sessionStorage). The order itself still carries the customer's real email
    // server-side, so the fallback message is true even though this specific tab can't push.
    showFallback('no stashed email on this screen');
  } else if (!pushCapable) {
    showFallback('browser lacks Push API / Notifications / service workers');
  } else if (isIOS && !isStandalone) {
    showIOSInstructions();
  } else {
    showPrompt();
  }
})();
</script>
<script src="/assets/js/announce.js" defer></script>
</body>
</html>
